      story:{ru:'Лист изобрёл новый жанр — симфоническую поэму: одночастное оркестровое произведение, основанное на литературной программе. «Прелюды» — самый известный из 13 его опытов в этом жанре.\nОсновой стала поэма французского романтика Ламартина: жизнь человека — лишь прелюдия к таинственной посмертной жизни, прерываемая бурями испытаний.\nСтруктура музыки следует программе: покой — буря — пастораль — военный марш — возврат к покою.\nВ годы Второй мировой войны нацистская пропаганда использовала фрагмент «Прелюдов» как позывной для радиообъявлений о победах на Восточном фронте.',
             en:'Liszt invented the symphonic poem — a single-movement orchestral work based on a literary programme. "Les Préludes" is the most famous of his thirteen essays in the genre.\nThe source is a poem by Lamartine: human life is merely a prelude to the mysterious life beyond death, interrupted by storms of trial.\nThe structure follows this programme: calm — storm — pastoral — military march — return to calm.\nDuring World War II, Nazi propaganda used a passage from Les Préludes as a fanfare for radio announcements of victories on the Eastern Front.'}},
     {name:{ru:'Мефисто-вальс № 1',en:'Mephisto Waltz No. 1'},year:'1859–62',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'Дьявольский вальс: Мефистофель вырывает у скрипача скрипку и устраивает шабаш в деревенском трактире.',en:'A diabolical waltz: Mephistopheles seizes a violin and plays a demonic dance at a village inn.'},
      story:{ru:'Лист написал «Мефисто-вальс» по мотивам «Фауста» венгерского поэта Николауса Ленау.\nВ сцене, которую изображает вальс, Фауст и Мефистофель заходят в деревенский трактир. Мефистофель вырывает у скрипача скрипку и начинает играть — и танец превращается в бешеный вихрь, ночное безумие.\nМузыка начинается с пустых квинт — символ инфернального, — затем взрывается диким вальсом с хроматическими пассажами и нарастающим темпом.\nПроизведение стало главным образом «демонического» у Листа и повлияло на весь жанр диаволического в фортепианной музыке вплоть до Рахманинова и Скрябина.',
             en:'Liszt based the waltz on a scene from the "Faust" poem by Hungarian poet Nikolaus Lenau.\nFaust and Mephistopheles enter a village inn; Mephistopheles snatches a violin and begins to play — the dance becomes a wild whirlwind, nocturnal madness.\nThe music opens with bare fifths (the symbol of the infernal), then explodes into a diabolical waltz with chromatic runs and accelerating frenzy.\nThe work became the defining image of the "demonic" in piano music, influencing Rachmaninoff, Scriabin and beyond.'}},
   ]},
  {id:'verdi',color:'#b45309',ini:'ДВ',era:'romanticism',origin:'foreign',birth:1813,death:1901,
   name:{ru:'Джузеппе Верди',en:'Giuseppe Verdi'},
   country:{ru:'Италия',en:'Italy'},
   bio:{ru:'Величайший итальянский оперный композитор. Его оперы объединяют страстную мелодику, психологическую глубину и народную доступность. В годы борьбы Италии за объединение имя VERDI стало акронимом политического лозунга.',
        en:'The greatest Italian opera composer. His operas fuse passionate melody, psychological depth and popular appeal. During Italy\'s Risorgimento, "VERDI" became an acronym and political rallying cry.'},
   works:[
     {name:{ru:'Опера «Травиата»',en:'"La traviata"'},year:'1853',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'История куртизанки Виолетты, пожертвовавшей любовью ради счастья других. Одна из самых исполняемых опер в мире.',en:'The story of the courtesan Violetta, who sacrifices love for others\' happiness. One of the most performed operas in the world.'},
      story:{ru:'«Травиата» написана в 1852–1853 годах по пьесе Александра Дюма-сына «Дама с камелиями».\nПремьера в Венеции в марте 1853 года провалилась: публика смеялась над полной певицей, изображавшей больную чахоткой.\nОднако уже второй постановкой, с правильным составом, опера имела триумфальный успех. Верди был уверен, что «Травиата» — одна из лучших его работ.\nЗастольная ария «Brindisi» стала одной из самых узнаваемых мелодий в истории оперы.',
             en:'"La traviata" was composed in 1852–53, based on Dumas fils\' play "La Dame aux camélias."\nThe Venice premiere in March 1853 was a failure: the audience laughed at an overweight soprano depicting a dying consumptive.\nBut a second production with the right cast was a triumph. Verdi was sure "La traviata" was one of his best.\nVioletta\'s drinking song "Brindisi" became one of the most recognisable melodies in opera.'}},
     {name:{ru:'Опера «Аида»',en:'"Aida"'},year:'1871',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'Опера о любви египетского полководца и эфиопской принцессы. Написана для открытия оперного театра в Каире.',en:'An opera of love between an Egyptian commander and an Ethiopian princess, written for the opening of the Cairo Opera House.'},
      story:{ru:'«Аида» создана по заказу египетского хедива для нового Каирского оперного театра, открывшегося в честь Суэцкого канала.\nВерди сначала отказался, но когда ему прислали либретто, основанное на сценарии египтолога Огюста Мариэтта, — согласился.\nПремьера в Каире 24 декабря 1871 года прошла с огромным успехом. Верди сам не поехал в Египет — боялся моря.\nМарш из «Аиды» — одна из самых известных оперных мелодий. Сцена «Триумфа» стала символом грандиозного оперного спектакля.',
             en:'"Aida" was commissioned by the Khedive of Egypt for the new Cairo Opera House, built for the Suez Canal opening.\nVerdi initially refused, but when he received the libretto — based on a scenario by the Egyptologist Auguste Mariette — he agreed.\nThe premiere in Cairo on 24 December 1871 was a triumph. Verdi himself did not attend — he was afraid of the sea.\nThe triumphal march is one of the most famous operatic melodies; the "Triumph" scene became the symbol of grand opera.'}},
     {name:{ru:'Реквием',en:'Requiem'},year:'1874',genre:{ru:'Духовная музыка',en:'Sacred choral'},
      desc:{ru:'Написан памяти писателя Мандзони. «Опера в церковном платье» — неукротимые страсти в духовной форме.',en:'"An opera in church dress" — unrestrained passion in sacred form, written in memory of novelist Alessandro Manzoni.'},
      story:{ru:'Верди написал «Реквием» в 1874 году в память об итальянском писателе Алессандро Мандзони, которого глубоко чтил.\nПервоначально он написал лишь одну часть — «Libera me» — для совместного «Реквиема» памяти Россини (1869), но тот проект не состоялся.\nКритик Ганс фон Бюлов назвал «Реквием» «оперой в церковном платье». Это точное описание: «Dies irae» звучит как театральная катастрофа, «Lacrimosa» — как оперная ария.\nСам Верди считал «Реквием» лучшим своим произведением.',
             en:'Verdi wrote the Requiem in 1874 in memory of Alessandro Manzoni, whom he deeply revered.\nHe had originally written just the "Libera me" for a collective Requiem in memory of Rossini (1869), but that project fell apart.\nThe critic Hans von Bülow called it "an opera in church dress": the "Dies irae" sounds like a theatrical catastrophe, the "Lacrimosa" like an operatic aria.\nVerdi considered the Requiem his greatest work.'}},
     {name:{ru:'Опера «Отелло»',en:'"Otello"'},year:'1887',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'Шекспировская трагедия о ревности и предательстве. Написана в 73 года — вершина позднего Верди.',en:'Shakespeare\'s tragedy of jealousy and betrayal, written at age 73 — the summit of Verdi\'s late style.'},
      story:{ru:'После «Аиды» 1871 года прошло 16 лет, прежде чем Верди написал новую оперу — его уговорил либреттист Арриго Бойто.\n«Отелло» создан в 1885–1887 годах по трагедии Шекспира. Верди к тому времени было 73 года.\nОпера стала революцией: речитатив и ария слились в непрерывный музыкальный поток, исчезли традиционные вставные номера. Яго — один из самых сложных злодеев в оперной истории.\nПремьера в Ла Скала в феврале 1887 года вызвала небывалый ажиотаж. Публика шла за каретой Верди по улицам Милана, скандируя его имя.',
             en:'Sixteen years passed after "Aida" before Verdi wrote another opera — coaxed back by librettist Arrigo Boito.\n"Otello" was written in 1885–87 from Shakespeare\'s tragedy. Verdi was 73.\nThe opera was a revolution: recitative and aria merged into a continuous musical flow; the traditional "number" opera vanished. Iago is one of opera\'s most complex villains.\nThe premiere at La Scala in February 1887 caused unprecedented frenzy. Crowds followed Verdi\'s carriage through the streets of Milan, chanting his name.'}},
   ]},
  {id:'brahms',color:'#7c3aed',ini:'JB',era:'romanticism',origin:'foreign',birth:1833,death:1897,
   name:{ru:'Иоганнес Брамс',en:'Johannes Brahms'},
   country:{ru:'Германия',en:'Germany'},
   bio:{ru:'Продолжатель Бетховена в эпоху романтизма. Создавал монументальную музыку в классических формах, избегая программности и внешних эффектов. 4 симфонии, 2 фортепианных концерта, скрипичный концерт — каждое произведение выверено до совершенства.',
        en:'Beethoven\'s heir in the Romantic era. Four symphonies, two piano concertos and a violin concerto of supreme craft.'},
   works:[
     {name:{ru:'Симфония № 1 до минор',en:'Symphony No. 1 in C minor'},year:'1876',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Создавалась 21 год. Дирижёр Ганс фон Бюлов назвал её «Десятой симфонией Бетховена».',en:'21 years in the making. Hans von Bülow called it "Beethoven\'s Tenth Symphony".'},
      story:{ru:'Над первой симфонией Брамс работал с 1855 по 1876 год — 21 год. Он начинал, откладывал, уничтожал написанное и начинал снова.\nТень Бетховена давила на него: «Ты не представляешь, каково это — слышать за спиной поступь великана», — говорил он другу.\nКогда симфония наконец вышла, дирижёр Ганс фон Бюлов назвал её «Десятой симфонией Бетховена» — высшая похвала, но и тяжкое бремя сравнения.\nФинал содержит тему, неуловимо напоминающую «Оду к радости» — некоторые слышат в этом дань уважения, другие — неосознанную цитату.',
             en:'Brahms worked on the First Symphony from 1855 to 1876 — 21 years. He began, abandoned, destroyed drafts and began again.\nThe shadow of Beethoven weighed on him: "You have no idea what it\'s like to hear the footstep of a giant behind you," he told a friend.\nWhen it finally appeared, conductor Hans von Bülow called it "Beethoven\'s Tenth" — the highest praise and the heaviest burden.\nThe finale contains a theme uncannily similar to the "Ode to Joy" — homage or unconscious quotation?'}},
     {name:{ru:'Немецкий реквием',en:'"A German Requiem"'},year:'1869',genre:{ru:'Хоровая музыка',en:'Choral'},
      desc:{ru:'Не церковная месса, а утешение скорбящим — библейские тексты на немецком языке.',en:'Not a church service but a consolation for the bereaved, using German biblical texts.'},
      story:{ru:'Традиционный латинский реквием — молитва об упокоении душ умерших. Брамс написал нечто принципиально иное: утешение живым, оставшимся скорбеть.\nОн сам выбирал тексты из Лютеровской Библии — на немецком языке. Это не литургия, а философское размышление о смертности и надежде.\nИмпульсом послужила смерть матери Брамса в 1865 году: пятую часть реквиема — «Как мать утешает дитя» — он написал уже после первого исполнения, посвятив её ей.\nПремьера в Бремене в 1868 году стала сенсацией. Брамс стал знаменит на всю Европу.',
             en:'Unlike a traditional Latin Requiem — prayers for the dead — Brahms wrote a consolation for the living who grieve.\nHe chose the German biblical texts himself, creating not a liturgy but a philosophical reflection on mortality and hope.\nThe impulse was his mother\'s death in 1865; he added the fifth movement — "As one whom his mother comforteth" — after the first performance, in her memory.\nThe Bremen premiere in 1868 made Brahms famous across Europe.'}},
     {name:{ru:'Концерт для скрипки ре мажор',en:'Violin Concerto in D major'},year:'1878',genre:{ru:'Концерт',en:'Concerto'},
      desc:{ru:'Один из трёх «великих» скрипичных концертов (Бетховен, Мендельсон, Брамс). Написан для Иоахима.',en:'One of the three "great" violin concertos alongside Beethoven\'s and Mendelssohn\'s. Written for Joseph Joachim.'},
      story:{ru:'Концерт написан для скрипача Йозефа Иоахима — лучшего друга Брамса. Иоахим редактировал скрипичную партию в процессе сочинения, помогал сделать её более исполнимой.\nОркестровая фактура так плотна, что критик Ганслик пошутил: «Концерт написан не для скрипки, а против неё».\nПервая часть — одна из самых продолжительных в истории скрипичных концертов. Вторая — Adagio с соло гобоя — одна из самых певучих и трогательных страниц романтической музыки.\nНаряду с концертами Бетховена и Мендельсона он входит в «большую тройку» скрипичных концертов.',
             en:'Written for his closest friend, the violinist Joseph Joachim, who edited the solo part as Brahms composed it.\nThe orchestral writing is so dense that critic Hanslick joked it was "a concerto not for violin but against it."\nThe first movement is one of the longest in the concerto repertoire. The slow movement\'s oboe solo is one of Romanticism\'s most touching pages.\nAlongside Beethoven\'s and Mendelssohn\'s concertos, it forms the "great trinity" of Romantic violin concertos.'}},
     {name:{ru:'Венгерские танцы',en:'Hungarian Dances'},year:'1869',genre:{ru:'Фортепиано / Оркестр',en:'Piano / Orchestra'},
      desc:{ru:'21 танец на основе венгерских народных мелодий. Танец № 5 знают во всём мире.',en:'21 dances based on Hungarian folk tunes. No. 5 is recognised the world over.'},
      story:{ru:'В молодости Брамс путешествовал по Австро-Венгрии с венгерским скрипачом Эдуардом Ременьи и записывал народные мелодии. Из этих записей родились Венгерские танцы.\nПервоначально написаны для фортепиано в четыре руки; впоследствии Брамс и другие оркестровали некоторые из них.\nТолько три танца основаны на оригинальных мелодиях Брамса; остальные — аранжировки народных тем. Это стало поводом для судебного иска от другого музыканта, претендовавшего на авторство мелодий.\nТанец № 5 — самый знаменитый: стремительный, огненный — узнаётся с первых тактов.',
             en:'As a young man Brahms toured Austria-Hungary with violinist Eduard Reményi, collecting folk melodies. The Hungarian Dances grew from those notes.\nOriginally written for piano four-hands; Brahms and others later orchestrated several of them.\nOnly three dances are original Brahms compositions; the rest are arrangements of folk themes — a fact that led to a copyright dispute.\nDance No. 5 is the most famous: fiery and irresistible, it is recognised within the first few bars.'}},
   ]},
  {id:'mussorgsky',color:'#1d4ed8',ini:'ММ',era:'romanticism',origin:'russian',birth:1839,death:1881,
   name:{ru:'Модест Петрович Мусоргский',en:'Modest Mussorgsky'},
   country:{ru:'Россия',en:'Russia'},
   bio:{ru:'Самый самобытный из «Могучей кучки» — кружка русских композиторов-националистов. Искал в музыке прямое следование интонациям живой речи. Его смелые гармонии опережали время на полвека. Многие произведения остались незавершёнными и были оркестрованы другими.',
        en:'The most original of the Mighty Five. He sought in music the direct inflection of living speech. His bold harmonies were half a century ahead of their time. Many works were left unfinished and later orchestrated by others.'},
   works:[
     {name:{ru:'«Картинки с выставки»',en:'"Pictures at an Exhibition"'},year:'1874',genre:{ru:'Фортепиано',en:'Piano suite'},
      desc:{ru:'Цикл из 10 пьес-«картин», навеянных рисунками умершего друга-художника. Связующая тема «Прогулки» ведёт между полотнами.',en:'Ten musical "pictures" inspired by drawings of a deceased friend, with a recurring "Promenade" walking between them.'},
      story:{ru:'В феврале 1874 года умер близкий друг Мусоргского — художник и архитектор Виктор Гартман. Вскоре в Академии художеств открылась посмертная выставка его работ.\nМусоргский был потрясён и за несколько недель написал фортепианный цикл — серию пьес, навеянных конкретными рисунками Гартмана. Связующая тема «Прогулки» — как будто слушатель ходит по залу выставки.\nСреди картин — жуткая «Избушка на курьих ножках», величественные «Богатырские ворота», пугающие «Гном» и «Катакомбы».\nЦикл написан для фортепиано. Широкую известность ему принесла оркестровка Равеля 1922 года.',
             en:'In February 1874, Mussorgsky\'s close friend — the artist and architect Viktor Hartmann — died. A posthumous exhibition of his work opened at the Academy of Arts.\nMussorgsky was devastated and in a few weeks wrote the suite: pieces inspired by specific drawings, linked by a "Promenade" theme as if the listener strolls between exhibits.\nAmong the pictures: the eerie "Baba Yaga\'s Hut," the majestic "Great Gate of Kyiv," the chilling "Gnome" and "Catacombs."\nMussorgsky wrote it for piano; Ravel\'s 1922 orchestration brought it worldwide fame.'}},
     {name:{ru:'Опера «Борис Годунов»',en:'"Boris Godunov"'},year:'1869/1874',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'Опера о царе-детоубийце и его совести. Главный герой — народ. Самая значительная русская историческая опера.',en:'Opera about a Tsar haunted by guilt. The real protagonist is the Russian people. The greatest Russian historical opera.'},
      story:{ru:'Мусоргский написал первую версию «Бориса Годунова» в 1869 году по исторической трагедии Пушкина. Дирекция Императорских театров её отвергла — слишком мрачно, нет главной женской роли.\nВ 1872–1874 годах он создал вторую редакцию: добавил польские сцены с любовной линией и переставил акты.\nЦарь Борис знает, что убил законного наследника — царевича Димитрия. Галлюцинации, голос совести, постепенное безумие — это одна из первых в опере глубоких психологических драм.\nВ опере нет традиционного «героя»: главный герой — русский народ, безмолвный или кричащий, страдающий перед лицом власти.',
             en:'Mussorgsky wrote the first version in 1869, based on Pushkin\'s historical tragedy. The Imperial Theatre directorate rejected it — too grim, no leading female role.\nHe revised it in 1872–74, adding Polish scenes with a love story and rearranging the acts.\nTsar Boris knows he murdered the rightful heir. Hallucinations, a guilty conscience, gradual madness — this is one of opera\'s first deep psychological dramas.\nThere is no conventional "hero": the real protagonist is the Russian people — suffering and mute before power.'}},
     {name:{ru:'«Ночь на Лысой горе»',en:'"Night on the Bare Mountain"'},year:'1867',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'Оркестровая фантазия о шабаше нечистой силы. Мусоргский написал её за 12 дней.',en:'An orchestral fantasy depicting a witches\' sabbath, written in just 12 days.'},
      story:{ru:'«Ночь на Лысой горе» написана в июне 1867 года за 12 дней — Мусоргский работал в состоянии творческого экстаза.\nСюжет: на Лысой горе близ Киева в ночь накануне Иванова дня собирается нечистая сила. Хаос и разгул нарастают — до первого удара колокола на рассвете, разгоняющего бесов.\nПри жизни Мусоргского произведение так и не было исполнено. Римский-Корсаков оркестровал его после смерти друга, значительно переработав и добавив тихое лирическое завершение.\nВ 1940 году Уолт Дисней поместил музыку в финал «Фантазии» — и «Ночь на Лысой горе» стала известна миллионам.',
             en:'"Night on the Bare Mountain" was written in June 1867 in 12 days.\nThe subject: on Bald Mountain near Kyiv, spirits gather on the eve of St John\'s Day. Chaos mounts until the first dawn bell disperses the demons.\nThe work was never performed in Mussorgsky\'s lifetime. Rimsky-Korsakov orchestrated it after his friend\'s death, reworking it substantially and adding a quiet lyrical close.\nIn 1940 Walt Disney placed the music in the climax of "Fantasia," making it known to millions.'}},
     {name:{ru:'«Песни и пляски смерти»',en:'"Songs and Dances of Death"'},year:'1875–77',genre:{ru:'Вокальный цикл',en:'Song cycle'},
      desc:{ru:'Четыре песни: Смерть является к умирающему ребёнку, к крестьянину, к девушке, к павшим воинам. Шедевр вокальной трагедии.',en:'Four songs: Death comes to a dying child, a weary peasant, a young woman, fallen soldiers. A masterpiece of vocal tragedy.'},
      story:{ru:'Цикл написан в 1875–1877 годах на стихи поэта Арсения Голенищева-Кутузова, близкого друга Мусоргского.\nВ каждой из четырёх песен Смерть предстаёт в разном облике: она поёт колыбельную умирающему ребёнку, соблазняет ночью усталого крестьянина, является к умирающей девушке как кавалер на бал, командует мёртвым войском на поле сражения.\nМусоргский не боялся смерти и пел о ней прямо, без романтической патетики. Голосовые партии следуют за каждым словом текста — принцип «мелодии речи».\nСам Мусоргский прожил лишь 42 года. После его смерти Шостакович оркестровал цикл в 1962 году.',
             en:'Written in 1875–77 to poems by Arseny Golenishchev-Kutuzov, a close friend of Mussorgsky\'s.\nIn each song Death appears in a different guise: singing a lullaby to a dying child, seducing a weary peasant, arriving as a ballroom cavalier for a dying girl, commanding the dead on a battlefield.\nMussorgsky confronted death directly, without Romantic sentimentality. The vocal lines follow every word — the principle he called "melody of speech."\nMussorgsky himself lived only 42 years. After his death, Shostakovich orchestrated the cycle in 1962.'}},
   ]},
  {id:'tchaikovsky',color:'#dc2626',ini:'ПЧ',era:'romanticism',origin:'russian',birth:1840,death:1893,
   name:{ru:'Пётр Ильич Чайковский',en:'P. I. Tchaikovsky'},
   country:{ru:'Россия',en:'Russia'},
   bio:{ru:'Величайший русский романтик: его мелодии знают во всём мире. Создал три великих балета, 6 симфоний, 3 фортепианных концерта и множество опер. Музыка пронизана русской лирикой и трагизмом.',
        en:'The greatest Russian Romantic composer. Three iconic ballets, 6 symphonies, 3 piano concertos. His melodies are known worldwide.'},
   works:[
     {name:{ru:'Балет «Лебединое озеро»',en:'"Swan Lake"'},year:'1876',genre:{ru:'Балет',en:'Ballet'},
      desc:{ru:'Принцесса Одетта заколдована злым волшебником в лебедя. Гимн балетного искусства.',en:'Princess Odette is cursed into a swan by the evil sorcerer Rothbart. The quintessential ballet.'},
      story:{ru:'Либретто основано на немецких и русских народных сказках о заколдованной деве-лебеде. Злой волшебник Ротбарт превратил принцессу Одетту в лебедя: только ночью она принимает человеческий облик.\nПервая постановка в Москве в 1877 году провалилась: слабая хореография, небрежное исполнение — и публика не приняла балет. Чайковский умер, не увидев успеха.\nВ 1895 году балетмейстеры Петипа и Иванов создали новую редакцию в Петербурге — и «Лебединое озеро» стало главным балетом мира.\nМузыкальная тема лебедей — одна из самых узнаваемых в истории музыки. «Танец маленьких лебедей» знают даже те, кто никогда не был в балете.',
             en:'The libretto draws on German and Russian folk tales of a maiden enchanted into a swan — human only at night.\nThe Moscow premiere in 1877 was a failure: poor choreography, sloppy execution. Tchaikovsky died without seeing its success.\nIn 1895 Petipa and Ivanov created a new production in St Petersburg — and Swan Lake became the world\'s defining ballet.\nThe "Dance of the Little Swans" is recognisable even to those who have never attended a ballet.'}},
     {name:{ru:'Балет «Щелкунчик»',en:'"The Nutcracker"'},year:'1892',genre:{ru:'Балет',en:'Ballet'},
      desc:{ru:'Рождественская сказка: ожившая кукла-щелкунчик ведёт девочку Машу в страну сладостей.',en:'A Christmas fairy tale in which a Nutcracker doll leads Marie to the Kingdom of Sweets.'},
      story:{ru:'Либретто по сказке Гофмана «Щелкунчик и мышиный король» написал балетмейстер Петипа. Чайковский вначале не хотел браться за этот заказ — сюжет казался ему слишком детским.\nОднако написав партитуру, он признался, что влюбился в неё. Балет наполнен музыкальными портретами: у каждой страны в «Дивертисменте» свой характер — Испания, Китай, Аравия, Россия.\nПремьера прошла в Петербурге в декабре 1892 года. Сегодня «Щелкунчик» — самый кассовый балетный спектакль в мире: в период Рождества его дают почти каждый день в сотнях театров.\n«Танец феи Драже» и «Вальс снежинок» стали рождественскими символами.',
             en:'The libretto was based on Hoffmann\'s tale "The Nutcracker and the Mouse King." Tchaikovsky was reluctant — the plot seemed too childish — but fell in love with the music as he wrote it.\nThe ballet is full of musical portraits: each country in the Grand Divertissement has its own character.\nToday The Nutcracker is the highest-grossing ballet in the world, performed almost daily in hundreds of theatres at Christmas.'}},
     {name:{ru:'Симфония № 6 «Патетическая»',en:'"Pathétique" Symphony No. 6'},year:'1893',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Последняя симфония — прощание с жизнью. Чайковский умер через 9 дней после премьеры.',en:'His last symphony — a farewell to life. Tchaikovsky died just 9 days after conducting the premiere.'},
      story:{ru:'Шестая симфония — последнее крупное произведение Чайковского. Он сам дирижировал на премьере в Петербурге 28 октября 1893 года.\nЧерез девять дней Чайковский умер — официально от холеры. Обстоятельства смерти по сей день вызывают споры: некоторые исследователи считают, что он покончил с собой.\nСимфония заканчивается не торжеством, а угасанием: финальная часть — медленная, pianissimo, тихо уходящая в тишину. Это беспрецедентно для симфонии того времени.\nНазвание «Патетическая» предложил брат Чайковского Модест — на следующий день после премьеры.',
             en:'Tchaikovsky conducted the premiere himself on 28 October 1893. Nine days later he was dead — officially of cholera, though the circumstances remain debated.\nThe symphony ends not in triumph but in extinction: the final movement fades to pianissimo silence — unprecedented for a symphony of its era.\nThe title "Pathétique" was suggested by his brother Modest the day after the premiere.'}},
     {name:{ru:'Опера «Евгений Онегин»',en:'"Eugene Onegin"'},year:'1879',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'По роману Пушкина. Сцена письма Татьяны — вершина лирической оперы.',en:'After Pushkin\'s novel. Tatiana\'s Letter Scene is the pinnacle of lyric opera.'},
      story:{ru:'Чайковский называл «Евгения Онегина» не оперой, а «лирическими сценами» — подчёркивая, что его интересует не внешнее действие, а внутренняя жизнь персонажей.\nСцена письма Татьяны — ариозо, в котором юная девушка ночью пишет любовное послание Онегину — считается одной из самых психологически точных в истории оперы.\nЧайковский сам пережил похожую историю: когда незнакомая женщина написала ему письмо с признанием в любви, он из жалости согласился жениться. Брак оказался катастрофой.\nПремьера состоялась в Московской консерватории силами студентов в 1879 году — Чайковский хотел избежать помпезной постановки.',
             en:'Tchaikovsky called the opera "lyrical scenes" — emphasising that he was interested in inner life, not external action.\nThe Letter Scene, in which young Tatiana writes her love confession at night, is considered one of opera\'s most psychologically truthful moments.\nTchaikovsky had lived a similar experience: when a female admirer confessed her love in a letter, he married her out of pity — a catastrophic mistake.\nThe premiere used student performers at the Moscow Conservatory — Tchaikovsky wanted to avoid a pompous production.'}},
     {name:{ru:'Концерт для ф-но № 1 си♭ минор',en:'Piano Concerto No. 1 in B♭ minor'},year:'1875',genre:{ru:'Концерт',en:'Concerto'},
      desc:{ru:'Четыре грандиозных аккорда во вступлении — самое знаменитое начало в истории концертного жанра.',en:'Four monumental chords open the work — the most famous concerto introduction in history.'},
      story:{ru:'Чайковский сыграл концерт своему наставнику, пианисту Николаю Рубинштейну — и получил сокрушительный разгром. Рубинштейн назвал концерт «банальным, вульгарным, неудобным для исполнения».\nЧайковский был в ярости. Он посвятил концерт немецкому дирижёру Гансу фон Бюлову, который и исполнил мировую премьеру в Бостоне в 1875 году — с триумфом.\nРубинштейн впоследствии изменил мнение и сам блистательно играл этот концерт. Но история его первоначального отзыва вошла в учебники.\nВступление — четыре грандиозных аккорда, а затем широкая тема у солиста — стало одним из самых мгновенно узнаваемых образов в истории классической музыки.',
             en:'Tchaikovsky played the concerto for his mentor Nikolai Rubinstein, who brutally dismissed it as "banal, vulgar and unplayable."\nFurious, Tchaikovsky dedicated it to the German conductor Hans von Bülow instead, who premiered it in Boston in 1875 to enormous success.\nRubinstein later reversed his opinion and performed it brilliantly — but his original verdict is now legendary.\nThe opening four chords followed by the sweeping piano theme is one of the most instantly recognisable images in all classical music.'}},
   ]},
  {id:'rimsky',color:'#0e7490',ini:'НРК',era:'romanticism',origin:'russian',birth:1844,death:1908,
   name:{ru:'Николай Андреевич Римский-Корсаков',en:'Nikolai Rimsky-Korsakov'},
   country:{ru:'Россия',en:'Russia'},
   bio:{ru:'Мастер оркестровой звукописи, сказки и фантастики. Один из «Могучей кучки» и её главный педагог. Редактировал и оркестровал произведения Мусоргского и Бородина, тем самым сохранив их для потомков. Написал 15 опер.',
        en:'Master of orchestral colour, fairy-tale and fantasy. One of the Mighty Five and its principal teacher. He orchestrated works by Mussorgsky and Borodin, preserving them for posterity. Wrote 15 operas.'},
   works:[
     {name:{ru:'«Шехеразада»',en:'"Scheherazade"'},year:'1888',genre:{ru:'Оркестровая сюита',en:'Orchestral suite'},
      desc:{ru:'Оркестровая сюита по мотивам «Тысячи и одной ночи». Соло скрипки — голос Шехеразады, плетущей свои сказки.',en:'An orchestral suite after the Arabian Nights. The solo violin voices Scheherazade weaving her tales.'},
      story:{ru:'«Шехеразада» написана летом 1888 года — за одно лето, с поразительной лёгкостью.\nКаждая из четырёх частей иллюстрирует эпизоды из «Тысячи и одной ночи»: море и корабль Синдбада, календер-принц, молодой принц и принцесса, багдадский праздник и кораблекрушение.\nГлавная тема — соло скрипки — представляет Шехеразаду, рассказывающую свои истории, чтобы избежать казни.\nСюита стала образцом ориентальной звукописи в европейской музыке.',
             en:'"Scheherazade" was written in the summer of 1888 with remarkable ease.\nEach of the four movements illustrates episodes from the Arabian Nights: the sea and Sinbad\'s ship, the Kalendar Prince, a young prince and princess, the Baghdad festival and the shipwreck.\nThe main theme — a solo violin — represents Scheherazade spinning her stories to escape execution.\nThe suite became the model for musical orientalism in European music.'}},
     {name:{ru:'«Испанское каприччио»',en:'"Capriccio Espagnol"'},year:'1887',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'Блестящий оркестровый калейдоскоп испанских красок — при том что Римский-Корсаков в Испании никогда не бывал.',en:'A dazzling orchestral kaleidoscope of Spanish colour — though Rimsky-Korsakov never visited Spain.'},
      story:{ru:'«Испанское каприччио» написано в 1887 году — изначально как серия вариаций для скрипки с оркестром, затем переработанная в самостоятельное оркестровое произведение.\nРимский-Корсаков никогда не бывал в Испании; он создал «испанский» колорит исключительно оркестровыми средствами — кастаньеты, мандолины, гитарные имитации в струнных.\nНа премьере оркестр прервал исполнение на середине второй части аплодисментами — настолько эффектно написана смена тембров. Дирижёр поклонился, и музыку начали заново.\nЧайковский назвал «Каприччио» «феерической оркестровой пьесой».',
             en:'"Capriccio Espagnol" was written in 1887, reworked from a series of violin variations into a self-contained orchestral showpiece.\nRimsky-Korsakov had never visited Spain; he created the "Spanish" colour entirely through orchestral means — castanets, mandolin-like string figures, and guitar imitations.\nAt the premiere, the orchestra itself interrupted the second section with applause — so dazzling was the change of instrumental colour. The conductor bowed and the passage was repeated.\nTchaikovsky called it "a colossal pyrotechnical work."'}},
     {name:{ru:'«Полёт шмеля»',en:'"The Flight of the Bumblebee"'},year:'1900',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'Оркестровый антракт из оперы «Сказка о царе Салтане» — самый быстрый и узнаваемый эпизод в истории музыки.',en:'An orchestral interlude from "The Tale of Tsar Saltan" — the fastest and most recognisable episode in musical history.'},
      story:{ru:'«Полёт шмеля» — оркестровый антракт из третьего акта оперы «Сказка о царе Салтане» (1900), написанной по сказке Пушкина.\nВ этом месте сюжета царевич Гвидон волшебным образом превращается в шмеля, чтобы полететь к своему отцу — царю Салтану.\nМузыка изображает жужжание и стремительный полёт: быстрые хроматические гаммы в деревянных духовых создают ощущение мельтешения крыльев.\nСегодня «Полёт шмеля» — один из главных «тестов» для инструменталистов на скорость исполнения.',
             en:'"The Flight of the Bumblebee" is an orchestral interlude from Act III of "The Tale of Tsar Saltan" (1900), based on Pushkin\'s fairy tale.\nAt this point Prince Gvidon is magically transformed into a bumblebee to fly to his father, Tsar Saltan.\nThe music depicts frantic buzzing and rapid flight through fast chromatic scales in the woodwinds.\nToday it is one of music\'s great speed tests — pianists, violinists and wind players all compete to play it faster than anyone else.'}},
     {name:{ru:'Опера «Снегурочка»',en:'"The Snow Maiden"'},year:'1882',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'«Весенняя сказка» по Островскому — языческие боги, лесной народ и хрупкая дочь Мороза и Весны.',en:'A "spring fairy tale" after Ostrovsky — pagan gods, forest folk, and the fragile Snow Maiden.'},
      story:{ru:'«Снегурочка» написана в 1881–1882 годах за менее чем год. Основой послужила пьеса Александра Островского.\nЛибретто Римский-Корсаков написал сам. Его привлекала языческая, дохристианская Русь: поклонение Яриле-Солнцу, берендеи — лесной народ, живущий в гармонии с природой.\nСнегурочка — дочь Мороза и Весны — тает на рассвете, когда Ярило обращает на неё свои лучи. Это не трагедия, а жертва природному циклу.\nКомпозитор считал «Снегурочку» лучшим своим произведением.',
             en:'"The Snow Maiden" was written in 1881–82 in less than a year, from Ostrovsky\'s play-fantasy.\nRimsky-Korsakov wrote the libretto himself, drawn to pre-Christian Russia: the worship of Yarilo the Sun, the Berendey people living in harmony with nature.\nThe Snow Maiden — daughter of Frost and Spring — melts at dawn when Yarilo turns his rays on her. This is not tragedy but sacrifice to the natural cycle.\nRimsky-Korsakov considered "The Snow Maiden" his finest work.'}},
   ]},
  {id:'mahler',color:'#be185d',ini:'ГМ',era:'romanticism',origin:'foreign',birth:1860,death:1911,
   name:{ru:'Густав Малер',en:'Gustav Mahler'},
   country:{ru:'Австрия',en:'Austria'},
   bio:{ru:'Создатель грандиозных симфоний-вселенных, где банальность сталкивается с трагедией. При жизни был знаменит прежде всего как дирижёр Венской оперы; как композитор получил признание только посмертно. Его 9 завершённых симфоний — вершина позднеромантического оркестра.',
        en:'Creator of vast, cosmos-like symphonies where the banal collides with the tragic. Famous in his lifetime chiefly as conductor of the Vienna Opera; recognised as a composer only after death. His 9 completed symphonies are the summit of late Romantic orchestral writing.'},
   works:[
     {name:{ru:'Симфония № 5 до-диез минор',en:'Symphony No. 5 in C-sharp minor'},year:'1902',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Знаменита прежде всего Адажиетто — медленной частью для струнных и арфы, использованной Висконти в фильме «Смерть в Венеции».',en:'Famous above all for its Adagietto — for strings and harp, used in Visconti\'s "Death in Venice."'},
      story:{ru:'Малер написал Пятую симфонию в 1901–1902 годах, когда влюбился в Альму Шиндлер, ставшей его женой.\nАдажиетто — четвёртая часть, для струнных и арфы — считается «любовным письмом» Малера к Альме. Он послал ей ноты без слов: она поняла, что это признание в любви.\nСимфония огромна — пять частей, около 70 минут. Начинается с траурного марша, проходит через бурные взрывы и лирические интерлюдии.\nВ 1971 году Лукино Висконти использовал Адажиетто в фильме «Смерть в Венеции» — с тех пор эта музыка стала синонимом возвышенного и меланхолического.',
             en:'Mahler wrote the Fifth Symphony in 1901–02, when he fell in love with Alma Schindler, who became his wife.\nThe Adagietto — the fourth movement, for strings and harp — is considered Mahler\'s "love letter" to Alma. He sent her the score without words; she understood it as a declaration.\nThe symphony is vast: five movements, about 70 minutes, starting with a funeral march and passing through tempestuous outbursts and lyric interludes.\nIn 1971 Luchino Visconti used the Adagietto in "Death in Venice" — since then it has been synonymous with the sublime and melancholy.'}},
     {name:{ru:'«Песнь о земле»',en:'"Das Lied von der Erde"'},year:'1908–09',genre:{ru:'Симфония-кантата',en:'Symphonic song cycle'},
      desc:{ru:'Шесть песен для голоса и оркестра на китайские стихи о красоте мира и прощании с жизнью.',en:'Six songs for voice and orchestra on Chinese poems — about the beauty of the world and the farewell to life.'},
      story:{ru:'В 1907 году Малер пережил катастрофический год: умерла его старшая дочь, у него самого обнаружили порок сердца, его вынудили покинуть Венскую оперу.\nКак будто в ответ, он написал «Песнь о земле» на немецкие переводы китайской поэзии VIII–IX веков. Темы — хрупкость красоты, быстротечность жизни, вечность природы.\nПоследняя часть «Прощание» — одна из длиннейших медленных частей в симфонической музыке (около 30 минут). Она заканчивается еле слышным «ewig» (вечность), уходящим в тишину.\nМалер не услышал произведение при жизни — оно было исполнено уже после его смерти.',
             en:'In 1907 Mahler suffered a catastrophic year: his elder daughter died; he was diagnosed with a heart defect; he was forced out of the Vienna Opera.\nIn response, he wrote "Das Lied von der Erde" on German translations of 8th–9th-century Chinese poetry. The themes: the fragility of beauty, the fleetingness of life, the eternity of nature.\nThe final movement "Der Abschied" (The Farewell) is about 30 minutes long. It ends with a barely audible "ewig" (forever), fading into silence.\nMahler never heard it performed — it was premiered after his death.'}},
     {name:{ru:'Симфония № 9 ре мажор',en:'Symphony No. 9 in D major'},year:'1909–10',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Последняя завершённая симфония — прощание с миром, растворение в вечности, написанное за год до смерти.',en:'The last completed symphony — a farewell to the world, a dissolution into eternity, written a year before his death.'},
      story:{ru:'Девятая симфония написана в 1909–1910 годах, когда Малер знал, что его сердечный порок неизлечим. Он умер в 1911 году, не услышав её исполнения.\nОткрывающий ритм первой части — неровный, прерывистый — сравнивают с нерегулярным сердцебиением: Малер осознавал свою смертность.\nПоследняя часть — Адажио — буквально растворяется: тема истончается до отдельных нот, потом — тишина.\nДирижёр Бруно Вальтер, ученик Малера, дал мировую премьеру в Вене в 1912 году. Он вспоминал: «Я дирижировал, но не мог видеть нот сквозь слёзы».',
             en:'The Ninth Symphony was written in 1909–10, when Mahler knew his heart condition was incurable. He died in 1911 without hearing it performed.\nThe opening rhythm — halting and irregular — is compared to an irregular heartbeat: Mahler was staring at his own mortality.\nThe final movement, an Adagio, literally dissolves: the theme thins to individual notes, then — silence.\nConductor Bruno Walter, Mahler\'s pupil, gave the world premiere in Vienna in 1912. He recalled: "I conducted but could not see the score through my tears."'}},
     {name:{ru:'Симфония № 2 «Воскресение»',en:'"Resurrection" Symphony No. 2'},year:'1894',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Пятичастная симфония с хором и солистами. Финал — грандиозная оратория о воскресении человека из мёртвых.',en:'Five-movement symphony with chorus and soloists. The finale is a grand oratorio on the resurrection of the dead.'},
      story:{ru:'«Воскресение» создавалась с 1888 по 1894 год. Малер долго не мог найти финальный смысловой ключ.\nТолчком стала поминальная служба по Гансу фон Бюлову в Гамбурге в 1894 году: хор пел гимн Клопштока «Воскресение». Малер был потрясён: «Это то, что я искал».\nСимфония ставит главный вопрос: почему мы живём, если умрём? Финал даёт ответ — хор и солисты поют о победе над смертью.\nМалер сам дирижировал берлинской премьерой 1895 года. Зал встал — это был главный успех его жизни как композитора.',
             en:'"Resurrection" was composed over six years, from 1888 to 1894. Mahler long searched for the finale\'s key.\nThe catalyst came at Hans von Bülow\'s memorial service in Hamburg in 1894, where a choir sang Klopstock\'s hymn "Resurrection." Mahler was struck: "This is what I was looking for."\nThe symphony poses Mahler\'s central question: why do we live if we must die? The finale answers through the triumph of resurrection.\nMahler conducted the Berlin premiere in 1895. The audience rose — the greatest success of his life as a composer.'}},
   ]},
  {id:'debussy',color:'#d97706',ini:'CD',era:'romanticism',origin:'foreign',birth:1862,death:1918,
   name:{ru:'Клод Дебюсси',en:'Claude Debussy'},
   country:{ru:'Франция',en:'France'},
   bio:{ru:'Основатель музыкального импрессионизма — направления, где цвет, свет и атмосфера важнее сюжета. Разрушил привычную тональную систему, открыв новые звуковые миры. Его влияние на музыку XX века огромно.',
        en:'Founder of musical Impressionism. Shattered conventional tonality to open new sound worlds. His influence on 20th-century music is immeasurable.'},
   works:[
     {name:{ru:'Прелюдия к послеполудню фавна',en:'"Prélude à l\'après-midi d\'un faune"'},year:'1894',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'Произведение, открывшее эпоху музыкального импрессионизма. Флейта рисует грёзы лесного фавна.',en:'The work that launched musical Impressionism. A flute portrays the lazy daydreams of a woodland faun.'},
      story:{ru:'Прелюдия написана как музыкальное воплощение одноимённой поэмы Стефана Малларме — символистского стихотворения о полудрёме лесного фавна, которому снятся нимфы.\nПрестарелый Малларме, услышав произведение, был растроган: «Я не ожидал ничего подобного. Ваша музыка продлевает звучание моей поэмы».\nСолирующая флейта открывает произведение хроматической мелодией — вялой, обволакивающей, словно дрожащей на летней жаре.\nДирижёр Пьер Булез назвал «Прелюдию» моментом, с которого началась современная музыка — новый язык звука, не скованный привычной тональностью.',
             en:'The prelude was inspired by Mallarmé\'s symbolist poem about a faun half-dozing in the summer heat, dreaming of nymphs.\nThe elderly Mallarmé was moved: "I did not expect anything like this. Your music prolongs the emotion of my poem."\nThe solo flute\'s sinuous, chromatic opening melody seems to shimmer in the heat.\nConductor Pierre Boulez called this piece the moment modern music began — a new sound world free of conventional tonality.'}},
     {name:{ru:'«Море»',en:'"La mer"'},year:'1905',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'Три оркестровые картины: игра волн, игра волн и ветра, диалог ветра и моря.',en:'Three orchestral sketches: play of waves, wind and waves, dialogue of wind and sea.'},
      story:{ru:'Дебюсси никогда не жил у моря долго, но был им одержим. «Море безгранично и прекрасно, оно никогда не бывает дважды одинаковым», — писал он другу.\nПроизведение написано в Бургундии — вдали от побережья. Критики шутили, что настоящее море меньше напоминает себя, чем эта музыка.\nТри части рисуют не пейзаж, а ощущение: рябь рассвета на воде, игру волн в полдень, штормовой диалог ветра и моря.\nПремьера в 1905 году прошла холодно: критики не поняли новаторского оркестрового языка. Сегодня «Море» считается вершиной оркестрового импрессионизма.',
             en:'Debussy was obsessed with the sea despite rarely living near it. "The sea is limitless and beautiful, never twice the same," he wrote.\nThe work was composed in Burgundy, far from any coast — critics joked that the real sea resembled itself less than this music did.\nThe three movements paint not scenery but sensation: the shimmer of dawn on the water, waves at noon, the stormy dialogue of wind and sea.\nThe premiere in 1905 was cool; today La mer is considered the pinnacle of orchestral Impressionism.'}},
     {name:{ru:'«Лунный свет»',en:'"Clair de lune"'},year:'1905',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'Третья часть «Бергамасской сюиты» — тихий переливчатый свет луны над водой. Самая популярная пьеса Дебюсси.',en:'From the Suite bergamasque — shimmering moonlight over water. His most beloved piano piece.'},
      story:{ru:'«Бергамасская сюита» написана ещё в 1890 году, но Дебюсси не спешил публиковать её — и «Лунный свет» вышел только в 1905-м.\nНазвание навеяно строкой из стихотворения Поля Верлена: «Ваша душа — пейзаж, где лунный свет льётся на фонтаны».\nМузыка имитирует переливы лунного отражения на воде: арпеджио медленно поднимаются и опускаются, создавая ощущение мерного колыхания.\nСегодня «Лунный свет» — самая узнаваемая фортепианная пьеса Дебюсси. Её используют в рекламе, кино, аниме — образ ночной тишины и красоты.',
             en:'The Suite bergamasque was written around 1890 but Debussy delayed publication until 1905.\nThe title comes from a line of Verlaine: "Your soul is a landscape where moonlight plays on fountains."\nThe music mimics the shimmer of moonlight on water: arpeggios rise and fall gently like slow waves.\nToday Clair de lune is Debussy\'s most recognisable piece, used in commercials, films and anime as the universal image of nocturnal beauty.'}},
     {name:{ru:'«Девушка с волосами цвета льна»',en:'"The Girl with the Flaxen Hair"'},year:'1910',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'Прелюдия из первой книги — невесомая светлая пьеса-портрет, написанная за несколько минут.',en:'Prelude from Book I — weightless and luminous. Reputedly written in a matter of minutes.'},
      story:{ru:'Прелюдия входит в первую книгу из 24 прелюдий (1910). Названия прелюдий Дебюсси помещал в конце нотного текста — в скобках, намекая, что это лишь ассоциация, а не программа.\nНазвание отсылает к стихотворению шотландского поэта Леконта де Лиля об юной белокурой девушке.\nМузыка необычайно проста на вид: неторопливая пентатонная мелодия на тихом аккомпанементе. Но именно эта простота и создаёт особое очарование — воздушность и свет.\nДебюсси написал её по воспоминаниям, словно запечатлевая мимолётный образ.',
             en:'Prelude from Book I of Debussy\'s 24 Preludes (1910). He placed his titles in brackets at the end of each piece — a hint that they are associations, not programmes.\nThe title alludes to a poem by Leconte de Lisle about a young fair-haired girl.\nThe music seems deceptively simple: a unhurried pentatonic melody over soft accompaniment. That simplicity is precisely the magic — weightless, luminous, like catching a fleeting memory.'}},
   ]},
  {id:'rachmaninoff',color:'#0891b2',ini:'СР',era:'modern',origin:'russian',birth:1873,death:1943,
   name:{ru:'Сергей Рахманинов',en:'Sergei Rachmaninoff'},
   country:{ru:'Россия',en:'Russia'},
   bio:{ru:'Великий русский пианист и композитор, эмигрировавший после революции. Сочетал широкую певучую русскую мелодику с виртуозным пианистическим письмом. После провала Первой симфонии несколько лет не мог сочинять — выход помог гипнотерапевт.',
        en:'Great Russian pianist-composer who emigrated after the Revolution. Combined soaring Russian lyricism with supreme piano virtuosity.'},
   works:[
     {name:{ru:'Концерт для ф-но № 2 до минор',en:'Piano Concerto No. 2 in C minor'},year:'1901',genre:{ru:'Концерт',en:'Concerto'},
      desc:{ru:'Написан после выхода из творческого кризиса с помощью гипноза. Один из самых исполняемых концертов в мире.',en:'Written after overcoming a creative crisis through hypnotherapy. One of the most performed concertos worldwide.'},
      story:{ru:'После провальной премьеры Первой симфонии в 1897 году Рахманинов впал в трёхлетний творческий кризис: он почти не писал и страдал от депрессии.\nВрач Николай Даль применил курс гипнотерапии. На каждом сеансе он повторял: «Вы будете сочинять… Вы будете работать с большой лёгкостью». Это помогло.\nВторой концерт Рахманинов посвятил доктору Далю. Сразу после премьеры он получил Глинкинскую премию — главную русскую музыкальную награду.\nСегодня это один из трёх самых исполняемых фортепианных концертов в мире. Его слышали все — в кино, сериалах, рекламе.',
             en:'After the disastrous premiere of his First Symphony in 1897, Rachmaninoff fell into a three-year creative paralysis.\nDoctor Nikolai Dahl treated him with hypnotherapy, repeating at each session: "You will compose with great ease." It worked.\nRachmaninoff dedicated the concerto to Dr Dahl. It won the Glinka Prize at its premiere.\nToday it is one of the three most performed piano concertos in the world, familiar from countless films, series and advertisements.'}},
     {name:{ru:'Рапсодия на тему Паганини',en:'"Rhapsody on a Theme of Paganini"'},year:'1934',genre:{ru:'Концерт',en:'Concerto'},
      desc:{ru:'24 вариации на каприс Паганини. 18-я вариация — одна из самых известных романтических мелодий XX века.',en:'24 variations on Paganini\'s Caprice No. 24. The 18th variation is one of the most famous melodies of the 20th century.'},
      story:{ru:'Рахманинов написал «Рапсодию» за шесть недель летом 1934 года в Швейцарии — уже в эмиграции, в зрелом возрасте.\nОсновой стал Каприс № 24 Паганини — тема, которую использовали Лист, Брамс и другие. Рахманинов создал 24 вариации, каждая со своим характером.\n18-я вариация — простая инверсия темы Паганини (мелодия «вверх ногами»). Удивительно, что такой простой приём дал такую глубокую, романтическую тему.\nРахманинов пошутил: «Эта восемнадцатая вариация — для моего импрессарио». Действительно, именно она сделала произведение кассовым.',
             en:'Rachmaninoff wrote the Rhapsody in six weeks in the summer of 1934, in Switzerland.\nHe based it on Paganini\'s Caprice No. 24 — a theme also used by Liszt and Brahms. His 24 variations each have a distinct character.\nThe 18th variation is simply the Paganini theme played upside-down (inverted). That such a simple trick yielded so deeply romantic a melody is astonishing.\n"That variation is for my impresario," Rachmaninoff joked — and indeed it made the work a box-office hit.'}},
     {name:{ru:'Симфония № 2 ми минор',en:'Symphony No. 2 in E minor'},year:'1907',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Певучая лирическая симфония — торжество русской романтической традиции. Адажио — одна из лучших медленных частей в музыке.',en:'Lyrical and songful — a triumph of Russian Romanticism. The Adagio is among music\'s finest slow movements.'},
      story:{ru:'После успеха Второго концерта Рахманинов написал Вторую симфонию в 1906–1907 годах, уже живя за границей — в Дрездене.\nСимфония стала его ответом на западную музыку: певучая, широкая, глубоко русская — полная тягучих мелодий в духе народной песни.\nАдажио — третья часть симфонии — одна из самых долгих и певучих медленных частей в истории симфонизма. Тема солирующего кларнета напоминает романс.\nСимфония получила Глинкинскую премию. Рахманинов дирижировал её сам на московской премьере в 1908 году.',
             en:'Written in Dresden in 1906–07, after Rachmaninoff had moved abroad following the Russian Revolution of 1905.\nThe symphony is his answer to Western music: lyrical, spacious, deeply Russian, full of long-breathed melodies in the spirit of folk song.\nThe Adagio — with its singing clarinet melody — is one of the longest and most heart-felt slow movements in the symphonic repertoire.\nIt won the Glinka Prize; Rachmaninoff conducted the Moscow premiere himself in 1908.'}},
     {name:{ru:'Прелюдия до♯ минор',en:'Prelude in C♯ minor'},year:'1892',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'Написана в 19 лет — первое всемирно известное произведение Рахманинова. Публика требовала её на каждом концерте.',en:'Written at age 19 — his first world-famous piece. Concert audiences demanded it as an encore every time.'},
      story:{ru:'Прелюдия написана в 1892 году, когда Рахманинову было 19 лет и он ещё учился в Московской консерватории. Она сразу стала хитом.\nПродав её московскому издателю за жалкие гроши, Рахманинов впоследствии не получал ни рубля с этого произведения — как с самого популярного своего сочинения.\nНа каждом концерте публика требовала её на бис — в любой точке мира. Рахманинов уставал от этого требования, но вынужден был играть.\nОн называл её «своим музыкальным проклятием» — невозможно представить, сколько раз ему пришлось исполнить эти три страницы за жизнь.',
             en:'Written in 1892 when Rachmaninoff was 19 and still a student at the Moscow Conservatory. It was an immediate hit.\nHe sold it to a Moscow publisher for a trivial sum and never received a kopek in royalties — from his most popular work.\nAt every concert, audiences around the world demanded it as an encore. Rachmaninoff grew weary of the demand but was obliged to play it.\nHe called it "my musical curse" — one can only imagine how many times he was forced to perform those three pages across his lifetime.'}},
   ]},
  {id:'ravel',color:'#0f766e',ini:'МР',era:'modern',origin:'foreign',birth:1875,death:1937,
   name:{ru:'Морис Равель',en:'Maurice Ravel'},
   country:{ru:'Франция',en:'France'},
   bio:{ru:'Французский мастер оркестрового совершенства и тончайших звуковых нюансов. Испытал влияние импрессионизма Дебюсси, но создал собственный более ясный и жёсткий стиль. «Болеро» — одно из самых исполняемых классических произведений XX века.',
        en:'French master of orchestral perfection and the finest sonic nuance. Influenced by Debussy\'s impressionism, he forged a cleaner, more precise style. "Bolero" is one of the most performed classical works of the 20th century.'},
   works:[
     {name:{ru:'«Болеро»',en:'"Bolero"'},year:'1928',genre:{ru:'Балет / Оркестр',en:'Ballet / Orchestral'},
      desc:{ru:'Одна тема, повторённая 18 раз с нарастающей громкостью и разными тембрами. Эксперимент, ставший мировым хитом.',en:'One theme repeated 18 times with growing volume and shifting colour. An experiment that became a worldwide hit.'},
      story:{ru:'«Болеро» написано в 1928 году по заказу балерины Иды Рубинштейн. Равель задумал его как чистый эксперимент с оркестровкой — «одна длинная crescendo».\nОдна и та же тема повторяется 18 раз без единого изменения — меняются лишь инструменты. Начинает одна флейта в тишине, заканчивает весь оркестр фортиссимо.\nРавель предупреждал, что произведение «лишено музыки» — только ритм и инструментовка. Сам считал его «курьёзом».\nНа премьере одна дама кричала «Безумец!». Равель ответил: «Эта дама правильно меня поняла». «Болеро» стало самым исполняемым французским музыкальным произведением в мире.',
             en:'"Bolero" was written in 1928 for the dancer Ida Rubinstein. Ravel conceived it as a pure orchestration experiment — "one long crescendo."\nThe same theme is repeated 18 times without change — only the instruments shift. It begins with a single flute and ends with the full orchestra at fortissimo.\nRavel warned that the work contained "no music" — only rhythm and orchestration. He called it a "curiosity."\nAt the premiere a woman shouted "Madman!" Ravel replied: "That woman understood me perfectly." "Bolero" became the most performed French musical work in the world.'}},
     {name:{ru:'«Павана на смерть инфанты»',en:'"Pavane pour une infante défunte"'},year:'1899',genre:{ru:'Фортепиано / Оркестр',en:'Piano / Orchestral'},
      desc:{ru:'Медленный, меланхоличный танец-эпитафия. Равель позже оркестровал пьесу, и это стало его первым мировым хитом.',en:'A slow, melancholy dance-epitaph. Ravel later orchestrated it, and it became his first worldwide hit.'},
      story:{ru:'«Павана» написана в 1899 году, когда Равель учился в Парижской консерватории у Форе. Студенческое сочинение — но оно сразу стало знаменитым.\nНазвание можно перевести как «Павана по умершей инфанте». Равель говорил, что образ навеян испанскими придворными портретами Веласкеса.\nПозже он оркестровал пьесу (1910) — и в этой версии она стала ещё известнее.\nКогда поклонники спрашивали, кто эта инфанта, Равель отвечал: «Никакой конкретной инфанты не существует. Меня просто привлёк звук этих слов».',
             en:'"Pavane" was written in 1899 while Ravel was a student at the Paris Conservatoire under Fauré. It was an immediate success.\nThe title means roughly "Pavane for a dead Infanta." Ravel said the image came from Spanish court portraits by Velázquez.\nHe later orchestrated it (1910), making it even more famous.\nWhen admirers asked which Infanta he meant, Ravel replied: "There is no specific Infanta. I was simply attracted to the sound of the words."'}},
     {name:{ru:'«Дафнис и Хлоя»',en:'"Daphnis et Chloé"'},year:'1912',genre:{ru:'Балет',en:'Ballet'},
      desc:{ru:'Балет для Дягилева — вершина оркестрового импрессионизма. Финальная «Общая пляска» — один из самых грандиозных финалов в истории музыки.',en:'A ballet for Diaghilev — one of the summits of orchestral impressionism, with one of the most overwhelming orchestral finales ever written.'},
      story:{ru:'«Дафнис и Хлоя» написан для «Русских сезонов» Дягилева и поставлен в Париже в 1912 году с хореографией Фокина.\nРавель работал над балетом три года; Дягилев нервничал и торопил — он даже начал репетировать без завершённой партитуры.\nБалет изображает греческую пастораль: пастух Дафнис и пастушка Хлоя, похищение пиратами и спасение. Равель написал хор без слов — только гласные звуки, как часть оркестровой ткани.\nФинальная «Общая пляска» — крещендо огромной силы, с нарастающими ритмами и триумфальным оркестровым взрывом. Многие считают её одним из самых великолепных финалов в истории оркестровой музыки.',
             en:'"Daphnis et Chloé" was written for Diaghilev\'s Ballets Russes and premiered in Paris in 1912, choreographed by Fokine.\nRavel worked on it for three years; Diaghilev grew impatient — he even began rehearsals without the completed score.\nThe ballet depicts a Greek pastoral: Daphnis and Chloé, pirate abduction and rescue. Ravel scored a wordless chorus — pure vowels — as part of the orchestral texture.\nThe final "Danse Générale" is a crescendo of tremendous power. Many consider it one of the most magnificent finales in orchestral history.'}},
     {name:{ru:'Фортепианный концерт соль мажор',en:'Piano Concerto in G major'},year:'1932',genre:{ru:'Концерт',en:'Concerto'},
      desc:{ru:'Блестящий, джазовый, парижский: Равель вернулся из Америки влюблённым в Гершвина. Финал — вихрь.',en:'Dazzling, jazzy and Parisian: Ravel returned from America in love with Gershwin. The finale is a whirlwind.'},
      story:{ru:'Концерт написан в 1929–1931 годах после большого американского тура Равеля (1928), где он познакомился с джазом и лично встретился с Джорджем Гершвином.\nГершвин хотел брать у него уроки; Равель отказал: «Зачем становиться второсортным Равелем, если вы можете быть первосортным Гершвином?»\nКонцерт насыщен джазовыми ритмами, синкопами и блюзовыми интонациями. Медленная часть — одна из длиннейших ненарушаемых мелодий Равеля.\nРавель не исполнял его сам: у него уже начиналось неврологическое заболевание, лишившее его возможности играть. Премьеру исполнила его коллега по консерватории Маргерит Лонг.',
             en:'The concerto was written in 1929–31, after Ravel\'s American tour (1928) where he encountered jazz and met Gershwin.\nGershwin wanted lessons from Ravel; Ravel declined: "Why become a second-rate Ravel when you can be a first-rate Gershwin?"\nThe concerto is saturated with jazz rhythms, syncopation and bluesy inflections. The slow movement carries one of Ravel\'s longest unbroken melodies.\nRavel did not play the premiere himself; neurological illness had begun to rob him of his ability to perform. His conservatoire colleague Marguerite Long gave the premiere.'}},
   ]},
  {id:'stravinsky',color:'#dc2626',ini:'ИС',era:'modern',origin:'russian',birth:1882,death:1971,
   name:{ru:'Игорь Стравинский',en:'Igor Stravinsky'},
   country:{ru:'Россия / США',en:'Russia / USA'},
   bio:{ru:'Революционер музыки XX века: каждое крупное произведение было стилистическим переворотом. Прошёл путь от неорусского стиля к неоклассицизму и серийной технике. Прожил 89 лет и работал до последних дней.',
        en:'Musical revolutionary of the 20th century. Moved from neo-Russian style to neo-classicism to serialism. Active until age 89.'},
   works:[
     {name:{ru:'Балет «Весна священная»',en:'"The Rite of Spring"'},year:'1913',genre:{ru:'Балет',en:'Ballet'},
      desc:{ru:'Языческий обряд жертвоприношения. Премьера вызвала скандал и потасовку в зале. Сегодня — эталон музыки XX века.',en:'A pagan sacrifice ritual. The premiere caused a riot. Today it is the defining masterpiece of 20th-century music.'},
      story:{ru:'Идея пришла Стравинскому во сне: он увидел языческий обряд, в котором девушка танцует до смерти, принося себя в жертву богу весны.\nПремьера 29 мая 1913 года в Париже стала одним из самых знаменитых скандалов в истории музыки. Ещё на увертюре в зале начался шум, крики, свист. Дирижёр Монтё не слышал оркестра; хореограф Нижинский кричал счёт ногами за кулисами.\nВ антракте в фойе подрались сторонники и противники. Полиция вызвала сорок человек. Дебюсси просил тишины. Стравинский убежал из зала.\nСегодня «Весна священная» — канонический шедевр XX века. То, что казалось невыносимым в 1913-м, сейчас воспринимается как захватывающая музыка.',
             en:'The idea came to Stravinsky in a dream: a pagan ritual in which a girl dances herself to death as a sacrifice to the god of spring.\nThe premiere on 29 May 1913 in Paris became one of music\'s most famous scandals. The uproar began during the introduction: booing, whistling, catcalls. Conductor Monteux could not hear the orchestra.\nIn the interval, fistfights broke out in the foyer. Forty people were removed by police. Stravinsky fled the hall.\nToday The Rite of Spring is a canonical 20th-century masterpiece; what seemed unbearable in 1913 is now electrifying.'}},
     {name:{ru:'Балет «Жар-птица»',en:'"The Firebird"'},year:'1910',genre:{ru:'Балет',en:'Ballet'},
      desc:{ru:'Сказка о волшебной птице, помогающей Ивану-царевичу победить Кощея. Сделала Стравинского знаменитым.',en:'The magic bird helps Ivan Tsarevich defeat the Immortal Koschei. Made Stravinsky famous overnight.'},
      story:{ru:'В 1909 году Дягилев искал композитора для нового балета «Русских сезонов». Первый кандидат — Лядов — откладывал работу, и Дягилев обратился к молодому Стравинскому, которому было 27 лет.\nСюжет взят из русских народных сказок: Иван-царевич попадает в сад Кощея, ловит Жар-птицу и с её помощью побеждает бессмертного злодея.\nПремьера в Париже в 1910 году принесла Стравинскому мировую славу в одну ночь. Сен-Санс, Дебюсси, Равель — все отмечали феноменальный талант.\nМузыка «Жар-птицы» сочетает русскую народную интонацию с изощрённым оркестровым письмом — настоящий фейерверк красок.',
             en:'In 1909 Diaghilev needed a composer for a new Ballets Russes production. His first choice, Lyadov, kept delaying, so Diaghilev turned to the unknown 27-year-old Stravinsky.\nThe story draws on Russian folk tales: Ivan Tsarevich captures the Firebird and uses its magic to defeat the immortal Koschei.\nThe Paris premiere in 1910 made Stravinsky world-famous overnight. Saint-Saëns, Debussy and Ravel all praised the phenomenal new talent.\nThe Firebird combines Russian folk melody with dazzling orchestral virtuosity — a firework display of colour.'}},
     {name:{ru:'Балет «Петрушка»',en:'"Petrushka"'},year:'1911',genre:{ru:'Балет',en:'Ballet'},
      desc:{ru:'Трагедия ожившей куклы-Петрушки на петербургской масленичной ярмарке — история любви и смерти.',en:'The tragedy of a living Petrushka puppet at a St. Petersburg fair — a story of love and death.'},
      story:{ru:'Стравинский сочинял «Петрушку» почти случайно: сначала написал фортепианный концертштюк с «дерзким арпеджио», напоминавшим ему куклу, дёргающую публику за нос.\nДягилев убедил его развернуть пьесу в балет. Действие перенесли на петербургскую масленичную ярмарку — шумную, пёструю, с балаганными куклами.\nТри куклы оживают: Петрушка любит Балерину, Балерина предпочитает Арапа, Арап убивает Петрушку. Финал — призрак Петрушки грозит кулаком с крыши балагана.\nДвухтональный аккорд «Петрушки» (до мажор + фа-диез мажор одновременно) вошёл в историю как «аккорд Петрушки» — символ раздвоенной, страдающей души.',
             en:'Stravinsky began Petrushka almost by accident, writing a piano piece with a "defiant arpeggio" suggesting a puppet taunting the audience.\nDiaghilev persuaded him to expand it into a ballet set at a St. Petersburg Maslenitsa fair.\nThree puppets come to life: Petrushka loves the Ballerina, the Ballerina prefers the Moor, the Moor kills Petrushka. The finale — Petrushka\'s ghost shaking its fist from the rooftop — is one of ballet\'s most haunting images.\nThe bitonal "Petrushka chord" (C major and F-sharp major simultaneously) became a musical symbol of a tortured, divided soul.'}},
     {name:{ru:'«Симфония псалмов»',en:'"Symphony of Psalms"'},year:'1930',genre:{ru:'Хоровая музыка',en:'Choral'},
      desc:{ru:'Для хора и оркестра без скрипок. Суровая архаичная красота. Посвящена «Богу и Бостонскому оркестру».',en:'For chorus and orchestra without violins. Austere and archaic. Dedicated "to the glory of God and the Boston Symphony".'},
      story:{ru:'«Симфония псалмов» написана в 1930 году по заказу Бостонского симфонического оркестра к 50-летию коллектива.\nСтравинский выбрал тексты из латинской Псалтири — трёх псалмов. Он специально убрал скрипки и альты из оркестра: хотел тёплый, матовый, «нечеловеческий» звук.\nТри части следуют схеме: молитва — мольба — хвала. Последняя часть — «Алилуйя» с огромным хором — одно из самых грандиозных хоровых сочинений XX века.\nСтравинский посвятил произведение «во славу Богу» и Бостонскому оркестру — именно в таком порядке.',
             en:'Commissioned for the Boston Symphony Orchestra\'s 50th anniversary in 1930.\nStravinsky chose texts from three Latin Psalms. He deliberately excluded violins and violas — wanting a warm, matte, "unhuman" sound.\nThe three movements follow a scheme: prayer, supplication, praise. The final "Alleluia" with massed choir is one of the grandest choral movements of the 20th century.\nStravinsky dedicated it "to the glory of God" and to the Boston Symphony — in that order.'}},
   ]},
  {id:'prokofiev',color:'#059669',ini:'СП',era:'modern',origin:'russian',birth:1891,death:1953,
   name:{ru:'Сергей Прокофьев',en:'Sergei Prokofiev'},
   country:{ru:'Россия',en:'Russia'},
   bio:{ru:'Острый, дерзкий, остроумный — Прокофьев обновил музыкальный язык XX века. Вернулся в СССР в 1936 году, пережил репрессии и написал в этой борьбе лучшие произведения. Автор 7 симфоний, 5 фортепианных концертов, 9 сонат.',
        en:'Sharp-witted and daring, Prokofiev renewed the musical language of the 20th century. 7 symphonies, 5 piano concertos, 9 sonatas.'},
   works:[
     {name:{ru:'Симфоническая сказка «Петя и Волк»',en:'"Peter and the Wolf"'},year:'1936',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'Каждый персонаж — свой инструмент: флейта — птица, гобой — утка, фагот — дедушка. Написано за 4 дня.',en:'Each character has its own instrument: flute = bird, oboe = duck, bassoon = grandfather. Written in 4 days.'},
      story:{ru:'«Петя и Волк» написана по просьбе Центрального детского театра в Москве — за четыре дня в 1936 году.\nЦель произведения — познакомить детей с инструментами оркестра. Каждому персонажу соответствует свой инструмент и лейтмотив: Петя — струнные, птица — флейта, утка — гобой, кошка — кларнет, дедушка — фагот, волк — три валторны.\nТекст-пояснение читает рассказчик, а оркестр «разыгрывает» сцены.\nСказка переведена на 40 языков и записана с сотнями дирижёров и рассказчиков — от Дэвида Боуи до Михаила Горбачёва. Это самое исполняемое детское произведение в истории классической музыки.',
             en:'"Peter and the Wolf" was written in four days in 1936 at the request of the Central Children\'s Theatre in Moscow.\nIts purpose was to introduce children to orchestral instruments. Each character has its own instrument and leitmotif: Peter = strings, Bird = flute, Duck = oboe, Cat = clarinet, Grandfather = bassoon, Wolf = three French horns.\nThe work has been recorded with hundreds of conductors and narrators — from David Bowie to Mikhail Gorbachev — and is the most performed children\'s piece in classical music history.'}},
     {name:{ru:'Балет «Ромео и Джульетта»',en:'"Romeo and Juliet"'},year:'1935',genre:{ru:'Балет',en:'Ballet'},
      desc:{ru:'Трагедия Шекспира в музыке. «Танец рыцарей» — одна из самых мощных оркестровых тем XX века.',en:'Shakespeare\'s tragedy in music. The "Dance of the Knights" is one of the most powerful orchestral themes ever written.'},
      story:{ru:'Прокофьев написал балет в 1935 году, вернувшись в СССР. Первоначально он планировал счастливый финал — Джульетта просыпается до того, как Ромео принимает яд.\nЭта идея вызвала скандал; Прокофьев всё же вернулся к трагедии Шекспира.\n«Монтекки и Капулетти» («Танец рыцарей») — суровая, железная тема противостояния кланов. Нежная тема Джульетты контрастирует с ней с первых же минут балета.\nПремьера в Кировском театре в 1940 году прошла с триумфом. С тех пор это один из самых популярных балетов XX века.',
             en:'Prokofiev wrote the ballet in 1935 after returning to the USSR. He initially planned a happy ending — Juliet waking before Romeo drinks the poison — which caused a scandal.\nHe restored Shakespeare\'s tragedy.\n"Montagues and Capulets" (the Dance of the Knights) is a merciless, iron-clad theme of clan conflict; Juliet\'s tender melody provides an immediate contrast.\nThe Kirov Theatre premiere in 1940 was a triumph; it is now one of the most popular ballets of the 20th century.'}},
     {name:{ru:'Симфония № 1 «Классическая»',en:'"Classical" Symphony No. 1'},year:'1917',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Написана «так, как сочинил бы Гайдн сегодня». Блестящая неоклассическая стилизация.',en:'Written "as Haydn might have composed if he were alive today". A brilliant neo-classical stylisation.'},
      story:{ru:'Симфонию Прокофьев написал в 1917 году — в год двух русских революций. Он работал на даче без рояля — полагаясь только на слух и воображение.\nЦель была парадоксальной: написать произведение «в стиле Гайдна, но от двадцатого века» — простое по форме, но острое, современное по языку.\nПремьера состоялась в Петрограде 21 апреля 1918 года — Прокофьев сам дирижировал. Это была и его дирижёрская дебютная.\nСимфония стала первым неоклассическим сочинением в русской музыке и оказала огромное влияние на Шостаковича, Стравинского и других.',
             en:'Written in 1917 — the year of two Russian revolutions — at a country dacha, without a piano, relying purely on Prokofiev\'s inner ear.\nThe aim was paradoxical: write a work "in Haydn\'s style but from the twentieth century" — classical in form, but sharp and modern in language.\nThe premiere on 21 April 1918 in Petrograd was Prokofiev\'s conducting debut.\nIt became the first neo-classical work in Russian music, influencing Shostakovich, Stravinsky and others.'}},
     {name:{ru:'Концерт для ф-но № 3 до мажор',en:'Piano Concerto No. 3 in C major'},year:'1921',genre:{ru:'Концерт',en:'Concerto'},
      desc:{ru:'Самый исполняемый концерт Прокофьева — искромётный, виртуозный, с бьющей через край энергией.',en:'His most performed concerto — sparkling, virtuosic, and bursting with irrepressible energy.'},
      story:{ru:'Прокофьев работал над концертом с перерывами с 1913 по 1921 год; закончил в Бретани летом 1921-го.\nПервая тема — сухая, отрывистая, почти механическая — типична для молодого Прокофьева: никакой сентиментальности. Вторая часть — тема с вариациями — демонстрирует другую сторону: лирику и остроумие.\nКонцерт виртуозен до крайности; но Прокофьев в отличие от Рахманинова избегает пышности — здесь сухой блеск, а не золочёная роскошь.\nПремьера в Чикаго в 1921 году прошла при дирижёре Стоковском. Сам Прокофьев играл партию солиста.',
             en:'Prokofiev assembled the concerto over years from 1913 to 1921, finishing it in Brittany in the summer of 1921.\nThe opening theme — dry, clipped, almost mechanical — is quintessential young Prokofiev: no sentimentality. The slow movement shows his other side: lyrical wit.\nThe concerto is supremely virtuosic, but unlike Rachmaninoff, Prokofiev avoids lushness — this is dry brilliance, not golden opulence.\nProkofiev gave the premiere in Chicago in 1921, playing the solo part himself.'}},
   ]},
  {id:'shostakovich',color:'#d97706',ini:'ДШ',era:'modern',origin:'russian',birth:1906,death:1975,
   name:{ru:'Дмитрий Шостакович',en:'Dmitri Shostakovich'},
   country:{ru:'Россия',en:'Russia'},
   bio:{ru:'Летописец трагической эпохи: его музыка — свидетельство репрессий, войны, страха и человеческого достоинства. Был под угрозой ареста, писал «в стол». 15 симфоний, 15 квартетов — каждое произведение несёт личную исповедь.',
        en:'Chronicle of a tragic era. His music witnesses repression, war and fear. 15 symphonies, 15 quartets — each a personal confession.'},
   works:[
     {name:{ru:'Симфония № 5 ре минор',en:'Symphony No. 5 in D minor'},year:'1937',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'«Творческий ответ советского художника на справедливую критику». Финал — торжество или горькая ирония?',en:'"A Soviet artist\'s reply to just criticism." The triumphant finale: sincere celebration or bitter irony?'},
      story:{ru:'В январе 1936 года газета «Правда» опубликовала разгромную статью «Сумбур вместо музыки», направленную против оперы Шостаковича «Леди Макбет Мценского уезда». Для композитора это был сигнал смертельной опасности — в сталинском СССР критика в «Правде» означала возможный арест.\nШостакович срочно снял с исполнения свою Четвёртую симфонию, уже репетировавшуюся оркестром. Несколько месяцев он работал над Пятой в состоянии постоянного страха, понимая, что произведение должно понравиться властям.\nПремьера состоялась в Ленинграде 21 ноября 1937 года. Зал встал ещё во время медленной третьей части и не покидал концертный зал после окончания — овации длились более получаса. Официальная пресса объявила симфонию «творческим ответом советского художника на справедливую критику».\nОднако вопрос о смысле финала остаётся открытым по сей день. Является ли торжественный финал искренним торжеством или вынужденной маской? Многие музыковеды убеждены: Шостакович намеренно сделал финал чрезмерно громким и механистичным — это не триумф, а насилие, торжество палача.',
              en:'In January 1936, Pravda published a devastating article "Muddle Instead of Music" targeting Shostakovich\'s opera Lady Macbeth of the Mtsensk District. For the composer, this was a signal of mortal danger — in Stalin\'s USSR, Pravda criticism meant possible arrest.\nShostakovich quickly withdrew his Fourth Symphony, already in rehearsal. He spent months composing the Fifth in a state of constant fear, knowing the work had to satisfy the authorities.\nThe premiere took place in Leningrad on November 21, 1937. The audience rose during the slow third movement and refused to leave after the finale — the ovation lasted over half an hour. The official press declared it "a Soviet artist\'s creative reply to just criticism."\nYet the meaning of the finale remains debated to this day. Is the triumphant ending sincere — or a forced mask? Many musicologists believe Shostakovich made the finale deliberately brutal and mechanical: not a triumph, but an act of coercion, the celebration of an executioner.'}},
     {name:{ru:'Симфония № 7 «Ленинградская»',en:'"Leningrad" Symphony No. 7'},year:'1941',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Написана в блокадном Ленинграде. В 1942 году исполнена там же и транслировалась по радио на весь СССР.',en:'Written during the Siege of Leningrad. Performed there in 1942 and broadcast across the USSR as a symbol of resistance.'},
      story:{ru:'Шостакович начал сочинять симфонию в первые дни блокады Ленинграда в сентябре 1941 года. Он работал добровольным пожарным и дежурил на крыше консерватории во время бомбардировок. Эвакуирован из города только в октябре.\nПервая часть содержит знаменитую «тему нашествия» — монотонный нарастающий марш, который повторяется одиннадцать раз. Шостакович впоследствии говорил, что тема изображает не только немецких захватчиков, но и «всё зло, всё насилие».\nМировая премьера прошла в Куйбышеве в марте 1942 года. Партитуру на микрофильме переправили через линию фронта, а затем самолётом доставили в США — там симфония была исполнена в августе 1942 года под управлением Тосканини.\nСамое легендарное исполнение состоялось 9 августа 1942 года в блокадном Ленинграде. Оркестранты были истощены голодом, некоторых доставили на концерт прямо из госпиталей. Трансляция по радио и громкоговорителям была специально направлена в сторону немецких позиций.',
              en:'Shostakovich began composing the symphony in the first days of the Siege of Leningrad in September 1941. He served as a volunteer firefighter and kept watch on the Conservatory roof during bombing raids, before being evacuated in October.\nThe first movement contains the famous "invasion theme" — a monotonous, gradually escalating march repeated eleven times. Shostakovich later said the theme depicted not only the German invaders, but "all evil, all violence."\nThe world premiere took place in Kuibyshev in March 1942. The score was microfilmed and flown across the front lines, then transported to the United States, where Toscanini conducted it in August 1942.\nThe most legendary performance was on August 9, 1942, in besieged Leningrad. The musicians were weakened by starvation; some were brought from hospitals. The broadcast over radio and loudspeakers was deliberately aimed toward the German lines.'}},
     {name:{ru:'Квартет № 8 до минор',en:'String Quartet No. 8 in C minor'},year:'1960',genre:{ru:'Квартет',en:'String Quartet'},
      desc:{ru:'Автобиографическое произведение с монограммой DSCH — полно цитат из собственных сочинений.',en:'An autobiographical work built on the DSCH musical monogram — full of self-quotations and personal shadows.'},
