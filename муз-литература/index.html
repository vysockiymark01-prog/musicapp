     {name:{ru:'Ordo Virtutum',en:'Ordo Virtutum'},year:'~1151',genre:{ru:'Литургическая драма',en:'Liturgical drama'},
      desc:{ru:'Музыкальная драма о битве добродетелей с дьяволом за душу — древнейший из сохранившихся образцов музыкального театра.',en:'A musical drama of virtues battling the Devil for a soul — the oldest surviving morality play set to music.'},
      story:{ru:'«Ordo Virtutum» («Действо добродетелей») написан около 1151 года и является старейшим из известных музыкально-театральных произведений, где сохранились и текст, и музыка.\nВ нём 82 персонажа — 16 добродетелей и Дьявол. Примечательно, что партия Дьявола не имеет мелодии: он кричит прозой, ибо, по замыслу Хильдегарды, зло не способно петь.\nПроизведение исполнялось монахинями обители Рупертсберг. Музыка написана одноголосно — в традиции григорианского хорала, но с неожиданно широким диапазоном и свободным ритмом.',
             en:'"Ordo Virtutum" (c.1151) is the oldest known musical drama where both text and music survive.\nNotably, the Devil\'s role has no melody — he shouts in prose, because in Hildegard\'s conception, evil is incapable of song.\nThe work was performed by the nuns of Rupertsberg. The music is monophonic — in the Gregorian tradition — but with an unusually wide melodic range and free rhythm.'}},
     {name:{ru:'O viridissima virga',en:'O viridissima virga'},year:'~1150',genre:{ru:'Антифон',en:'Antiphon'},
      desc:{ru:'«О зеленейшая ветвь» — гимн Деве Марии, полный образов природы. Мелодия охватывает почти две октавы.',en:'"O greenest branch" — a hymn to the Virgin Mary full of nature imagery, spanning nearly two octaves.'},
      story:{ru:'Хильдегарда постоянно обращалась к образам природы — растениям, свету, влаге. «O viridissima virga» — олицетворение Девы Марии как ветви, от которой произрастает «цветок» — Христос.\nМелодия охватывает почти две октавы, что необычно для средневековой монодии. Современники обвиняли её мелодии в «неслыханной дерзости».\nСегодня произведение входит в репертуар многих ансамблей старинной музыки по всему миру.',
             en:'Hildegard constantly drew on nature imagery. "O viridissima virga" personifies the Virgin Mary as a branch from which the "flower" of Christ springs.\nThe melody spans nearly two octaves, unusual for medieval monody. Contemporaries criticized her melodies for "unheard-of boldness."\nToday it is a staple of early music ensembles worldwide.'}}
   ]},
  {id:'machaut',color:'#1e3a5f',ini:'ГМ',era:'medieval',origin:'foreign',birth:1300,death:1377,
   name:{ru:'Гильом де Машо',en:'Guillaume de Machaut'},
   country:{ru:'Франция',en:'France'},
   bio:{ru:'Крупнейший французский поэт и композитор XIV века, ведущая фигура стиля Ars Nova. Служил секретарём при нескольких европейских монархах. Создал первую полную полифоническую мессу одного автора и определил облик французской куртуазной лирики.',
        en:'The greatest French poet-composer of the 14th century and the leading figure of Ars Nova. He served as secretary to European monarchs and composed the first complete polyphonic Mass by a single composer.'},
   works:[
     {name:{ru:'Месса Нотр-Дам',en:'Messe de Nostre Dame'},year:'~1364',genre:{ru:'Месса',en:'Mass'},
      desc:{ru:'Первая полная полифоническая месса одного автора в истории — монументальный шедевр Ars Nova.',en:'The first complete polyphonic Mass by a single composer — a landmark of Ars Nova.'},
      story:{ru:'«Месса Нотр-Дам» стала первым в истории полным полифоническим ординарием мессы одного автора.\nМашо сочинил её для Реймсского собора, где служил каноником. По его завещанию мессу пели ежегодно за упокой его души ещё более века после смерти.\nМузыка написана в технике изоритмии: мотив в тенорах повторяется в разных ритмических соотношениях, создавая сложную математическую структуру — главную черту Ars Nova.',
             en:'"Messe de Nostre Dame" (c.1364) is the first complete polyphonic Ordinary of the Mass by a single composer.\nMachaut wrote it for Reims Cathedral, where he served as a canon. His will stipulated that the Mass be sung annually for his soul — honored for over a century after his death.\nThe music uses isorhythm: the tenor melody repeats in varied rhythmic proportions — the hallmark of Ars Nova.'}},
     {name:{ru:'Ma fin est mon commencement',en:'Ma fin est mon commencement'},year:'~1360',genre:{ru:'Рондо',en:'Rondeau'},
      desc:{ru:'«Конец мой есть начало» — палиндромная пьеса, где контратенор исполняет партию тенора в обратном порядке.',en:'"My end is my beginning" — a palindrome piece where the contratenor sings the tenor part in reverse.'},
      story:{ru:'Это рондо — музыкальная загадка: контратенор поёт ту же мелодию, что и тенор, но в обратном порядке — от конца к началу.\nМашо сам пояснил: «Моё трёхголосное рондо трёхголосно исполняется само собой». Один из ранних примеров музыкальной инверсии.\nПьеса совмещает поэтическую игру слов, математическую структуру и мелодическую красоту — квинтэссенция средневекового идеала учёного искусства.',
             en:'This rondeau is a musical puzzle: the contratenor sings the tenor melody in reverse — from end to beginning.\nMachaut wrote: "My three-voiced rondeau is performed as three voices by itself." One of the earliest examples of melodic inversion.\nThe piece combines wordplay, mathematical structure, and genuine melodic beauty — the quintessence of the medieval ideal of learned art.'}}
   ]},
  /* ── ВОЗРОЖДЕНИЕ ────────────────────────────── */
  {id:'palestrina',color:'#14532d',ini:'ПП',era:'renaissance',origin:'foreign',birth:1525,death:1594,
   name:{ru:'Джованни Палестрина',en:'Giovanni Palestrina'},
   country:{ru:'Италия',en:'Italy'},
   bio:{ru:'Итальянский мастер полифонии и крупнейший католический церковный композитор эпохи Возрождения. Служил капельмейстером в соборе Святого Петра в Риме. Его строгий полифонический стиль стал образцом «идеальной» церковной музыки.',
        en:'Italian master of polyphony and the greatest Catholic church composer of the Renaissance. He served as choirmaster at St. Peter\'s Basilica in Rome. His strict polyphonic style became the model of "ideal" sacred music.'},
   works:[
     {name:{ru:'Месса Папы Марцелла',en:'Missa Papae Marcelli'},year:'1562',genre:{ru:'Месса',en:'Mass'},
      desc:{ru:'Месса, легенда о которой гласит, что она спасла полифонию от запрета на Тридентском соборе.',en:'The Mass whose legend holds that it saved polyphony from being banned at the Council of Trent.'},
      story:{ru:'Тридентский собор (1545–1563) обсуждал запрет полифонии в церкви: критики утверждали, что сложное переплетение голосов делает слова неразборчивыми.\nПо легенде, Палестрина написал эту мессу, чтобы доказать: полифония может быть одновременно сложной и ясной. Текст прекрасно слышен, голоса движутся плавно, диссонансы разрешены строго.\nПалестрина навсегда остался в истории как «спаситель церковной музыки». Его стиль настолько совершенен, что ренессансный контрапункт до сих пор преподают по его правилам.',
             en:'The Council of Trent (1545–1563) debated banning polyphony from the Church — critics claimed complex voice-weaving made the words unintelligible.\nLegend holds that Palestrina wrote this Mass to prove polyphony could be both complex and clear. Palestrina was forever enshrined as the "savior of church music."\nHis style is so refined that Renaissance counterpoint is still taught by his rules.'}},
     {name:{ru:'Stabat Mater',en:'Stabat Mater'},year:'~1590',genre:{ru:'Мотет',en:'Motet'},
      desc:{ru:'Восьмиголосный гимн скорбящей Матери у Креста — вершина полифонической выразительности.',en:'An eight-voice setting of the grieving Mother at the Cross — a pinnacle of polyphonic expressiveness.'},
      story:{ru:'«Stabat Mater» написана для двух хоров по четыре голоса. Голоса движутся с такой плавностью, что современники сравнивали эффект с «течением реки».\nВ XVIII веке Моцарт добавил к «Stabat Mater» Палестрины инструментальное сопровождение — настолько чтил это произведение.\nСочинение создано в зрелые годы для Папской капеллы и считается образцом позднего стиля Палестрины.',
             en:'"Stabat Mater" is written for two four-voice choirs. The voices move with such smoothness that contemporaries compared the effect to "a river flowing."\nIn the 18th century Mozart added instrumental accompaniment — a mark of how deeply he revered the work.\nWritten for the Papal Chapel, it is considered the model of Palestrina\'s late style.'}},
     {name:{ru:'Sicut cervus',en:'Sicut cervus'},year:'~1584',genre:{ru:'Мотет',en:'Motet'},
      desc:{ru:'«Как лань желает воды» — четырёхголосный мотет, хрестоматийный пример строгого ренессансного стиля.',en:'"As the deer pants for water" — a four-voice motet and the textbook example of strict Renaissance polyphony.'},
      story:{ru:'Слова взяты из 41-го псалма («Как лань желает к потокам воды»). Тема — жажда приближения к Богу.\nПалестрина открывает произведение широкой восходящей мелодией в теноре, которую поочерёдно подхватывают остальные голоса. Эта техника имитации — основа полифонического мышления эпохи.\n«Sicut cervus» — обязательная пьеса в учебниках контрапункта во всём мире как идеальный образец четырёхголосной имитационной полифонии.',
             en:'The text comes from Psalm 42 ("As the deer longs for streams of water").\nPalestrina opens with a broad ascending melody in the tenor, then each voice enters in imitation. This technique is the foundation of Renaissance polyphonic thinking.\n"Sicut cervus" is required in counterpoint textbooks worldwide as the ideal model of four-voice imitative polyphony.'}}
   ]},
  {id:'lasso',color:'#b45309',ini:'ОЛ',era:'renaissance',origin:'foreign',birth:1532,death:1594,
   name:{ru:'Орландо ди Лассо',en:'Orlando di Lasso'},
   country:{ru:'Нидерланды / Германия',en:'Flanders / Germany'},
   bio:{ru:'Один из наиболее плодовитых и универсальных композиторов XVI века. Фламандец по происхождению, провёл большую часть жизни на баварском дворе в Мюнхене. Написал более 2000 произведений во всех жанрах.',
        en:'One of the most prolific and versatile composers of the 16th century. Flemish by birth, he spent most of his career at the Bavarian court in Munich. He wrote over 2,000 works in all genres.'},
   works:[
     {name:{ru:'Покаянные псалмы',en:'Penitential Psalms'},year:'1563',genre:{ru:'Псалмы',en:'Psalms'},
      desc:{ru:'Семь покаянных псалмов Давида — вершина ренессансной духовной музыки, хранившаяся как личная реликвия баварского двора.',en:'Seven Penitential Psalms of David — a pinnacle of Renaissance sacred music, treasured as a private relic of the Bavarian court.'},
      story:{ru:'Цикл написан около 1563 года по заказу герцога Баварского Альбрехта V. Рукопись была иллюминирована художником Гансом Миллихом и хранилась в герцогской библиотеке как сокровище — не для публичного исполнения, а для личного благочестия двора.\nПсалмы написаны для 4–6 голосов. Лассо мастерски передаёт покаянное настроение через неожиданные гармонии, хроматические ходы и внезапные паузы.\nРукопись была напечатана только в XIX веке и признана одним из шедевров западной полифонии.',
             en:'Written c.1563 on commission from Duke Albrecht V of Bavaria. The manuscript was illuminated by Hans Mielich and stored in the ducal library as a treasure — for the private devotion of the court, not public performance.\nThe psalms are for 4–6 voices. Lasso conveys penitential emotion through unexpected harmonies, chromatic moves, and sudden silences.\nThe manuscript was only printed in the 19th century, when it was recognized as a masterwork of Western polyphony.'}},
     {name:{ru:'Матона, моя дорогая',en:'Matona mia cara'},year:'1581',genre:{ru:'Мадригал',en:'Madrigal'},
      desc:{ru:'Комическая серенада немецкого ландскнехта на ломаном итальянском — один из самых знаменитых ренессансных мадригалов.',en:'A comic serenade by a German soldier in mangled Italian — one of the most famous Renaissance madrigals.'},
      story:{ru:'Шуточная серенада от лица немецкого наёмника, ухаживающего за итальянкой на ломаном итальянском языке. Ошибки в тексте намеренны — это лингвистический юмор.\nПесня стала сенсацией ещё при жизни Лассо и многократно переиздавалась. Музыка проста, запоминаема и заразительно ритмична.\nЭто произведение показывает другую грань Лассо: в отличие от строгого церковного стиля Палестрины, он умел создавать лёгкую, юмористическую и доступную музыку.',
             en:'"Matona mia cara" is a mock serenade by a German mercenary courting an Italian woman in broken Italian — the grammatical errors are deliberate humor.\nThe song became a sensation in Lasso\'s lifetime and was reprinted many times. The music is simple, catchy, and irresistibly rhythmic.\nThis shows another side of Lasso: unlike the strict sacred style of Palestrina, he could also create light, humorous, accessible music.'}}
   ]},
  {id:'monteverdi',color:'#7e22ce',ini:'КМ',era:'renaissance',origin:'foreign',birth:1567,death:1643,
   name:{ru:'Клаудио Монтеверди',en:'Claudio Monteverdi'},
   country:{ru:'Италия',en:'Italy'},
   bio:{ru:'Итальянский композитор на рубеже эпох: мастер мадригала позднего Возрождения и создатель первых великих опер. Его карьера охватила полвека — от мантуанского двора до венецианского собора Святого Марка. Монтеверди превратил оперу из экспериментального жанра в живое искусство.',
        en:'Italian composer at the turn of eras: a master of late Renaissance madrigal and creator of the first great operas. His career spanned half a century, from the Mantuan court to St Mark\'s Basilica in Venice. Monteverdi transformed opera from an experiment into a living art form.'},
   works:[
     {name:{ru:'«Орфей»',en:'"L\'Orfeo"'},year:'1607',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'Первая великая опера в истории — история певца Орфея, спустившегося в подземный мир за Эвридикой.',en:'The first great opera in history — the story of Orpheus descending to the underworld for Eurydice.'},
      story:{ru:'«Орфей» поставлен в феврале 1607 года в Мантуе при дворе Гонзаги.\nОпера сочетает речитатив (изобретение Флорентийской камераты), хоровые мадригалы и виртуозные арии. Оркестр насчитывал около 40 инструментов — для эпохи это была фантастическая роскошь.\nКульминация — ария Орфея «Possente spirto», в которой певец умоляет Харона перевезти его через реку Стикс. Монтеверди написал её в двух вариантах: простом и богато орнаментированном.\n«Орфей» превратил оперу из камерного эксперимента в мощный жанр, завоевавший всю Европу.',
             en:'"L\'Orfeo" was staged in February 1607 at the Gonzaga court in Mantua.\nThe opera combines recitative, choral madrigals, and virtuoso arias. The orchestra numbered around 40 instruments — almost fantastic luxury for the period.\nThe emotional climax is Orpheus\'s aria "Possente spirto," pleading with Charon to ferry him across the Styx. Monteverdi wrote it in two versions: plain and richly ornamented.\n"L\'Orfeo" transformed opera from a private experiment into a genre that would conquer all of Europe.'}},
     {name:{ru:'Мадригалы. Книга VIII',en:'Madrigals, Book VIII'},year:'1638',genre:{ru:'Мадригал',en:'Madrigal'},
      desc:{ru:'«Мадригалы войны и любви» — вершина жанра. Включает «Плач нимфы» и первый пример stile concitato (взволнованного стиля).',en:'"Madrigals of War and Love" — the pinnacle of the genre, with the "Lament of the Nymph" and the first stile concitato (agitated style).'},
      story:{ru:'Восьмая книга вышла, когда Монтеверди было уже 71 год — и это его самое амбициозное сочинение.\nОн изобрёл «stile concitato» («взволнованный стиль»): быстрое повторение одной ноты у струнных, имитирующее взволнованность и боевой ритм. Сегодня мы называем это «тремоло».\n«Lamento della ninfa» — трёхголосная ария над неподвижным нисходящим басом (passacaglia), повторяющим четыре ноты, пока нимфа оплакивает потерянную любовь.\nКнига VIII вышла в год, когда Монтеверди принял сан священника, — лебединая песня светского творчества.',
             en:'The Eighth Book appeared when Monteverdi was 71 — and it is his most ambitious work.\nHe invented "stile concitato" (agitated style): rapid note repetition in strings imitating battle rhythm. We call this technique tremolo today.\n"Lamento della ninfa" is a three-voice aria over a repeating descending bass (passacaglia), looping while the nymph mourns lost love.\nBook VIII appeared the year Monteverdi took holy orders — the swan song of his secular output.'}}
   ]},
  /* ── БАРОККО ────────────────────────────────── */
  {id:'vivaldi',color:'#e11d48',ini:'AV',era:'baroque',origin:'foreign',birth:1678,death:1741,
   name:{ru:'Антонио Вивальди',en:'Antonio Vivaldi'},
   country:{ru:'Италия',en:'Italy'},
   bio:{ru:'Итальянский скрипач и священник-виртуоз, прозванный «Рыжим попом». Более 30 лет работал в венецианском приюте для девочек-сирот Оспедале делла Пьета, создавая для них концерты. Написал более 500 концертов и около 50 опер.',
        en:'Italian virtuoso violinist and priest, nicknamed "The Red Priest". Worked over 30 years at a Venetian girls\' orphanage, writing over 500 concertos and about 50 operas.'},
   works:[
     {name:{ru:'Четыре сезона',en:'The Four Seasons'},year:'1725',genre:{ru:'Концерт',en:'Concerto'},
      desc:{ru:'Четыре скрипичных концерта — каждый рисует одно время года. К каждому приложен сонет с описанием картины природы.',en:'Four violin concertos each depicting a season, each with a sonnet describing the scene.'},
      story:{ru:'«Четыре сезона» написаны около 1718–1720 годов и опубликованы в 1725 году как часть сборника «Испытание гармонии и вымысла».\nВивальди приложил к каждому концерту сонет — предположительно написанный им самим. Текст напечатан в нотах с пометками, указывающими, какой именно стих изображает данный музыкальный фрагмент.\n«Весна» начинается с пения птиц, «Лето» изображает грозу, «Осень» — охоту и крестьянский праздник, «Зима» — мороз и обледеневшую дорогу.\nЭто первый в истории сознательный программный инструментальный цикл такого масштаба. Сегодня «Четыре сезона» — одно из наиболее часто исполняемых классических произведений в мире.',
             en:'The Four Seasons were written around 1718–20 and published in 1725 as part of "The Contest Between Harmony and Invention".\nVivaldi attached a sonnet to each concerto with annotations linking verses to specific passages.\n"Spring" opens with birdsong; "Summer" depicts a thunderstorm; "Autumn" a harvest hunt; "Winter" an icy road.\nThis is the first large-scale programmatic instrumental cycle in history. Today the Four Seasons are among the most-performed works in the classical repertoire.'}},
     {name:{ru:'Глория ре мажор',en:'Gloria in D major'},year:'~1715',genre:{ru:'Духовная музыка',en:'Sacred choral'},
      desc:{ru:'Торжественная хоровая Глория — гимн радости и света, одно из главных духовных сочинений барокко.',en:'A joyful choral Gloria — one of the great sacred works of the Baroque era.'},
      story:{ru:'Вивальди написал две версии «Глории» ре мажор; чаще исполняется более поздняя, RV 589, датируемая около 1715 года.\nМузыка предназначалась для воспитанниц Оспедале делла Пьета — состоятельные венецианцы приходили на эти концерты как на светские события.\nОткрывающий хор «Gloria in excelsis Deo» — один из самых ликующих у Вивальди: мощные трубы, острые пунктирные ритмы, ощущение триумфа.\nПосле смерти Вивальди «Глория» была забыта на два с половиной века и заново открыта только в 1939 году итальянским музыковедом.',
             en:'The later D major Gloria (RV 589, c.1715) is the more familiar of two versions Vivaldi wrote.\nIt was written for the girls of the Ospedale della Pietà, whose concerts attracted wealthy Venetians as fashionable social events.\nThe opening "Gloria in excelsis Deo" is among Vivaldi\'s most jubilant pages, with blazing trumpets and triumphant rhythms.\nForgotten after Vivaldi\'s death, it was rediscovered in 1939 and has since become a staple of the choral repertoire.'}},
     {name:{ru:'Концерт для двух скрипок ля минор',en:'Concerto for Two Violins in A minor'},year:'~1720',genre:{ru:'Концерт',en:'Concerto'},
      desc:{ru:'Два солиста ведут неотрывный диалог — то соревнуясь, то сливаясь воедино. Один из самых совершенных дуэтных концертов барокко.',en:'Two soloists in constant dialogue — competing, then merging. A gem of Baroque concerto form.'},
      story:{ru:'Вивальди написал десятки концертов для двух и более солистов — жанр, который он поднял на небывалую высоту.\nВ концерте ля минор (RV 522) два скрипача ведут бесконечный диалог: иногда имитируют друг друга, иногда движутся параллельно, иногда вступают в контрапункт.\nЮный Иоганн Себастьян Бах переложил этот концерт для клавира, изучая форму итальянского concerto grosso. Именно через Вивальди барочный концерт приобрёл трёхчастную структуру «быстро–медленно–быстро», которая сохранилась до наших дней.',
             en:'Vivaldi wrote dozens of concertos for two or more soloists, a genre he elevated to new heights.\nIn the A minor concerto (RV 522) two violinists engage in endless dialogue — imitating, paralleling, and answering each other.\nThe young J. S. Bach transcribed this concerto for keyboard while studying Italian concerto form. It was largely through Vivaldi that the three-movement fast–slow–fast concerto structure came to define the genre.'}},
     {name:{ru:'Опера «Неистовый Роланд»',en:'"Orlando furioso"'},year:'1727',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'Грандиозная опера-сериа по поэме Ариосто: рыцарство, колдовство и безумие рыцаря Роланда.',en:'Grand opera seria based on Ariosto\'s epic: chivalry, sorcery, and the madness of the knight Orlando.'},
      story:{ru:'«Неистовый Роланд» написан для Театра Сант-Анджело в Венеции в 1727 году и имел огромный успех.\nСюжет взят из эпической поэмы Ариосто XVI века: рыцарь Роланд узнаёт, что его возлюбленная Анджелика любит другого, и теряет рассудок.\nАрия безумия Роланда написана так, что мелодия буквально «разрывается» — фразы обрываются, тональность блуждает. Это один из первых в истории музыки психологически точных портретов помешательства.\nВивальди написал около 50 опер, но большинство забыты: в его эпоху оперы ставились один-два сезона и уходили в архив.',
             en:'"Orlando furioso" was written for the Teatro Sant\'Angelo in Venice in 1727 and was a great success.\nThe plot comes from Ariosto\'s epic: the knight Orlando discovers his beloved Angelica loves another, and loses his mind.\nOrlando\'s mad scene is musically fractured — phrases break off, tonality wanders. It is one of the earliest musically precise portraits of mental collapse.\nVivaldi wrote about 50 operas, but most fell into oblivion — in his era, operas typically ran one or two seasons before being shelved.'}},
   ]},
  {id:'bach',color:'#7c3aed',ini:'JSB',era:'baroque',origin:'foreign',birth:1685,death:1750,
   name:{ru:'Иоганн Себастьян Бах',en:'J. S. Bach'},
   country:{ru:'Германия',en:'Germany'},
   bio:{ru:'Величайший композитор эпохи барокко, непревзойдённый мастер полифонии. Работал органистом и капельмейстером при дворах. За жизнь написал более 1000 произведений: мессы, кантаты, оркестровые сюиты, органные шедевры — во всех жанрах своего времени.',
        en:'The greatest Baroque composer, supreme master of polyphony. Wrote over 1000 works across all genres.'},
   works:[
     {name:{ru:'Хорошо темперированный клавир',en:'The Well-Tempered Clavier'},year:'1722–42',genre:{ru:'Клавирная музыка',en:'Keyboard'},
      desc:{ru:'48 прелюдий и фуг во всех 24 тональностях — энциклопедия полифонии и доказательство преимуществ равномерной темперации.',en:'48 preludes and fugues in all 24 keys — an encyclopaedia of polyphony.'},
      story:{ru:'Первый том Бах написал в 1722 году в Кётене как учебное пособие для своих учеников, второй том — двадцать лет спустя, в 1742-м.\nНазвание «Хорошо темперированный» — не просто описание строя, а художественный манифест: Бах доказывал, что при равномерной темперации можно сочинять во всех 24 тональностях без фальши.\nКаждая пара прелюдия — фуга уникальна по характеру: одни торжественны, другие трагичны, третьи игривы или медитативны.\nМоцарт, Бетховен и Шопен выросли на этих пьесах. Его называют «Ветхим заветом» фортепианной музыки — обязательным фундаментом для любого музыканта.',
             en:'Bach wrote Book I in 1722 in Cöthen as a teaching tool; Book II followed twenty years later.\nEach prelude-and-fugue pair is unique in character, ranging from solemn to tragic, playful to meditative.\nMozart, Beethoven and Chopin all grew up with these pieces, which are rightly called the "Old Testament" of piano music.'}},
     {name:{ru:'Месса си минор',en:'Mass in B minor'},year:'1749',genre:{ru:'Духовная музыка',en:'Sacred music'},
      desc:{ru:'Монументальная хоровая месса — грандиозное итоговое сочинение, обобщающее всё духовное творчество Баха.',en:'A monumental choral mass — the crowning summary of Bach\'s sacred output.'},
      story:{ru:'Бах собирал это произведение на протяжении десятилетий: первые части написаны ещё в 1724 году, последние — незадолго до смерти в 1750-м.\nПри жизни месса так и не была исполнена целиком — слишком монументальна и продолжительна для обычной церковной службы.\nНаписана для двух хоров, солистов и оркестра; охватывает все части католической мессы, хотя Бах был протестантом.\nСовременные исследователи называют её «величайшим музыкальным произведением всех времён».',
             en:'Bach assembled the mass over decades, with the earliest movements dating from 1724 and the last pages written shortly before his death in 1750.\nIt was never performed complete in his lifetime — too vast for any normal church service.\nScholars today call it the greatest choral work ever written.'}},
     {name:{ru:'Бранденбургские концерты',en:'Brandenburg Concertos'},year:'1721',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'6 концертов для разных составов солистов и оркестра — вершина инструментальной музыки барокко.',en:'Six concertos for varied combinations of soloists and orchestra — the peak of Baroque instrumental music.'},
      story:{ru:'В 1721 году Бах отправил шесть концертов маркграфу Бранденбургскому Кристиану Людвигу в надежде получить место при его дворе.\nМаркграф концерты не оценил — они пылились в архиве почти 150 лет, пока их не обнаружили в 1849 году.\nКаждый концерт написан для совершенно разного состава: один — для клавесина соло, другой — для трубы, флейты и гобоя, третий — для девяти струнных.\nОткрытые в XIX веке, концерты стали главным свидетельством совершенства барочного оркестрового стиля.',
             en:'In 1721 Bach sent six concertos to Margrave Christian Ludwig of Brandenburg, hoping for court employment.\nThe Margrave was unimpressed, and they gathered dust for 150 years until rediscovered in 1849.\nEach concerto uses a completely different instrumental combination — a dazzling showcase of Baroque variety.'}},
     {name:{ru:'Страсти по Матфею',en:'St Matthew Passion'},year:'1727',genre:{ru:'Оратория',en:'Oratorio'},
      desc:{ru:'Монументальная оратория о страданиях Христа для двух хоров и двух оркестров одновременно.',en:'A monumental oratorio about Christ\'s Passion for double choir and double orchestra.'},
      story:{ru:'Написана для исполнения в Страстную пятницу в лейпцигской церкви Святого Фомы, где Бах работал кантором.\nЛибретто, составленное по Евангелию от Матфея, рассказывает о последних часах жизни Христа — от ареста до погребения.\nДва хора и два оркестра создают объёмный звуковой мир: иногда они спорят, иногда сливаются в одно целое.\nПри жизни Баха произведение исполнялось лишь дважды; в 1829 году двадцатилетний Феликс Мендельсон возродил «Страсти» после ста лет забвения — и это стало сенсацией эпохи.',
             en:'Written for Good Friday services at St Thomas\'s Church in Leipzig, where Bach served as cantor.\nThe libretto follows the Gospel of Matthew from the arrest of Christ to his burial, with two choruses and two orchestras creating a vast, almost cinematic sound world.\nForgotten for a century, it was revived by the twenty-year-old Mendelssohn in 1829 — a sensation that sparked the Bach revival.'}},
     {name:{ru:'Токката и фуга ре минор',en:'Toccata and Fugue in D minor'},year:'~1704',genre:{ru:'Органная музыка',en:'Organ'},
      desc:{ru:'Самое узнаваемое органное произведение в истории — четыре первые ноты знает весь мир.',en:'The most recognisable organ work in history — the opening four notes are known the world over.'},
      story:{ru:'По наиболее распространённой версии, произведение написано Бахом ещё в молодости — около 1704–1708 годов, в период работы в Арнштадте.\nДолгое время авторство ставилось под сомнение: некоторые исследователи считали её написанной для скрипки и лишь позднее переложенной на орган. Большинство современных учёных всё же признают авторство Баха.\nТокката (свободная, импровизационная часть) переходит в строгую многоголосную фугу.\nВ XX веке произведение стало универсальным символом грозного и торжественного в кино, театре и массовой культуре.',
             en:'Most likely written during Bach\'s youth around 1704–1708, though its authorship has been debated.\nThe free, improvisatory toccata gives way to a strict multi-voice fugue.\nIn the 20th century it became the universal symbol of the grand and ominous in film, theatre and popular culture.'}},
   ]},
  {id:'handel',color:'#0891b2',ini:'GFH',era:'baroque',origin:'foreign',birth:1685,death:1759,
   name:{ru:'Георг Фридрих Гендель',en:'G. F. Handel'},
   country:{ru:'Германия / Англия',en:'Germany / England'},
   bio:{ru:'Мастер грандиозных ораторий и итальянских опер. Большую часть жизни провёл в Лондоне, где стал культовой фигурой английской музыкальной жизни. Написал более 40 опер и 20 ораторий.',
        en:'Master of grand oratorios and Italian operas. Spent most of his life in London. Wrote 40+ operas and 20 oratorios.'},
   works:[
     {name:{ru:'Мессия',en:'Messiah'},year:'1741',genre:{ru:'Оратория',en:'Oratorio'},
      desc:{ru:'Грандиозная оратория с хором «Аллилуйя», при звуках которого публика встаёт. Написана всего за 24 дня.',en:'Grand oratorio with the famous "Hallelujah" chorus, at which audiences traditionally stand. Written in just 24 days.'},
      story:{ru:'Гендель написал «Мессию» в августе–сентябре 1741 года за фантастически короткий срок — 24 дня, почти не отрываясь от работы.\nПо легенде, закончив хор «Аллилуйя», он сказал слуге: «Я думал, что вижу перед собой Самого Бога со всеми ангелами Его».\nНа лондонской премьере 1743 года король Георг II при первых звуках «Аллилуйя» встал с места — и вся публика поднялась следом. С тех пор эта традиция сохраняется по всему миру.\nОратория состоит из трёх частей: Воплощение и Рождество, Страсти и Искупление, Воскресение и Торжество. Каждый год в рождественский сезон она звучит в тысячах концертных залов.',
             en:'Handel wrote the Messiah in August–September 1741 in just 24 days, barely leaving his desk.\nAt the London premiere in 1743, King George II stood during the "Hallelujah" chorus — and the entire audience rose with him. The tradition endures worldwide.\nThe oratorio covers the Nativity, the Passion, and the Resurrection, and is performed every Christmas season around the world.'}},
     {name:{ru:'Музыка на воде',en:'Water Music'},year:'1717',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'Три оркестровые сюиты, исполнявшиеся на барже во время прогулки короля Георга I по Темзе.',en:'Three orchestral suites performed on a barge for King George I\'s river procession.'},
      story:{ru:'В июле 1717 года король Георг I устроил грандиозную ночную прогулку по Темзе на барже.\nПо соседней барже плыл оркестр из 50 музыкантов, который три часа подряд исполнял сюиты Генделя.\nКороль пришёл в такой восторг, что трижды велел повторить музыку с начала — по три часа каждый раз, если верить газете «Дейли купрант».\nСейчас в концертах чаще всего звучит оркестровая версия в редакции Харти — три сюиты объединены в один праздничный цикл.',
             en:'In July 1717 King George I held a grand night-time river procession on the Thames, with an orchestra of 50 playing Handel\'s suites on an accompanying barge for three hours.\nThe King was so delighted he reportedly ordered the music repeated three times.\nToday it is usually heard in Sir Hamilton Harty\'s orchestral arrangement.'}},
     {name:{ru:'Музыка фейерверка',en:'Music for the Royal Fireworks'},year:'1749',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'Написана для торжественного фейерверка в Гайд-парке в честь Аахенского мира. Праздничное оркестровое шествие.',en:'Written for a grand fireworks display in Hyde Park celebrating the Peace of Aix-la-Chapelle.'},
      story:{ru:'В 1748 году завершилась война за австрийское наследство, и в Лондоне решили отметить победу грандиозным фейерверком в Зелёном парке.\nКороль Георг II заказал Генделю торжественную музыку специально для открытого воздуха — только духовые и ударные, никаких скрипок.\nНа репетицию пришли 12 000 слушателей; в результате пробка на Лондонском мосту длилась три часа.\nВ день самого праздника фейерверк частично не удался — загорелась деревянная галерея, — но музыка звучала великолепно.',
             en:'Written to celebrate the end of the War of the Austrian Succession, for a grand outdoor fireworks display in London\'s Green Park.\nThe King demanded wind and percussion only — no strings. At the rehearsal, 12,000 people came and caused a three-hour traffic jam on London Bridge.\nOn the night itself, part of the pavilion caught fire — but the music was a triumph.'}},
     {name:{ru:'Опера «Юлий Цезарь»',en:'"Giulio Cesare"'},year:'1724',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'Шедевр барочной оперы-сериа: история любви Цезаря и Клеопатры с ариями виртуозной красоты.',en:'Masterpiece of Baroque opera seria: the love story of Caesar and Cleopatra.'},
      story:{ru:'«Giulio Cesare» поставлен в лондонском Королевском театре в 1724 году и сразу стал хитом сезона.\nСюжет — реальные исторические события: прибытие Цезаря в Египет, его встреча с Клеопатрой, борьба с Птолемеем.\nВ оригинальном составе — восемь певцов, среди которых были звёзды итальянской оперы; роль Цезаря писалась для знаменитого кастрата Сенезино.\nАрия Клеопатры «V\'adoro, pupille» с сурдиной на струнных считается одной из красивейших во всей истории барочной оперы.',
             en:'Giulio Cesare premiered at the King\'s Theatre in London in 1724 and was an instant hit.\nThe libretto dramatises Caesar\'s arrival in Egypt, his meeting with Cleopatra, and his struggle against Ptolemy.\nThe title role was written for the celebrated castrato Senesino; Cleopatra\'s aria "V\'adoro, pupille" is one of the most beautiful in all Baroque opera.'}},
   ]},
  {id:'haydn',color:'#059669',ini:'JH',era:'classicism',origin:'foreign',birth:1732,death:1809,
   name:{ru:'Йозеф Гайдн',en:'Joseph Haydn'},
   country:{ru:'Австрия',en:'Austria'},
   bio:{ru:'«Отец симфонии и квартета» — Гайдн создал эти жанры в их классической форме. Более 30 лет служил придворным капельмейстером у венгерских аристократов Эстерхази. Написал 104 симфонии, 68 квартетов и 14 опер.',
        en:'Father of the symphony and string quartet. Served 30+ years as Kapellmeister to the Esterházy family.'},
   works:[
     {name:{ru:'Симфония № 94 «Сюрприз»',en:'Symphony No. 94 "Surprise"'},year:'1791',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Во второй части вдруг звучит оглушительный удар литавр — «чтобы разбудить засыпающих дам», шутил Гайдн.',en:'A sudden fortissimo chord in the slow movement — designed to startle drowsy audience members.'},
      story:{ru:'Симфония написана в 1791 году во время первых лондонских гастролей Гайдна — он был уже знаменит, и публика ждала чего-то особенного.\nВторая часть начинается тихой и нежной темой в духе детской песенки. На середине — вдруг оглушительный удар всего оркестра fortissimo, от которого подпрыгивали слушатели.\n«Это разбудит дам!» — якобы сказал Гайдн. Сам он позднее признавался, что просто хотел «произвести впечатление» и выделиться среди других симфонистов.\nСимфония мгновенно стала хитом лондонского сезона.',
             en:'Written for Haydn\'s first London visit in 1791, when audiences expected a sensation.\nThe slow movement opens with a gentle, song-like theme — then a sudden fortissimo blast from the full orchestra startles the audience.\n"That will make the ladies jump," Haydn reportedly said. The symphony became the hit of the London season.'}},
     {name:{ru:'Оратория «Сотворение мира»',en:'The Creation'},year:'1798',genre:{ru:'Оратория',en:'Oratorio'},
      desc:{ru:'Монументальная картина сотворения мира по Библии и Мильтону, вдохновлённая «Мессией» Генделя.',en:'A monumental depiction of Creation from Genesis and Milton, inspired by Handel\'s Messiah.'},
      story:{ru:'Идея написать ораторию возникла у Гайдна после лондонских гастролей — под сильным влиянием «Мессии» Генделя.\nТекст составлен по Книге Бытия и «Потерянному раю» Мильтона: шесть дней сотворения мира описываются в музыке с поразительной изобразительностью.\nРабота заняла два года; Гайдн признавался, что никогда прежде не молился так искренне, как во время сочинения.\nВступительный хор «Да будет свет!» — один из самых поразительных моментов в истории музыки: оркестр и хор взрываются в до мажоре после долгого таинственного вступления.',
             en:'The idea came to Haydn after his London visits, under the strong influence of Handel\'s Messiah.\nThe text, drawn from Genesis and Milton\'s Paradise Lost, describes the six days of Creation with remarkable pictorial vividness.\nHaydn worked on it for two years, saying he had never prayed so sincerely as while composing it. The moment "Let there be Light!" erupts is one of music\'s most breathtaking surprises.'}},
     {name:{ru:'Квартет «Жаворонок»',en:'"Lark" Quartet'},year:'1790',genre:{ru:'Квартет',en:'String Quartet'},
      desc:{ru:'Первая скрипка взлетает к высоким нотам, подражая парящему жаворонку. Один из 68 квартетов Гайдна.',en:'The first violin soars skyward imitating a lark — one of Haydn\'s 68 string quartets.'},
      story:{ru:'Квартет ре мажор op. 64 № 5 написан в 1790 году — в год смерти покровителя Гайдна, князя Николауса Эстерхази, когда композитор наконец получил свободу.\nНазвание «Жаворонок» появилось не сразу: первая скрипка взлетает к высоким нотам на фоне тихого аккомпанемента остальных инструментов, имитируя парящую в небе птицу.\nГайдн написал 68 струнных квартетов и фактически создал этот жанр — разработал принципы равного партнёрства четырёх инструментов.\n«Жаворонок» считается одним из самых светлых и совершенных квартетов в истории.',
             en:'Written in 1790, the year Haydn was finally freed from his long service at Esterházy.\nThe first violin soars to high notes above hushed accompaniment from the others — like a lark hovering in the sky.\nHaydn wrote 68 string quartets and essentially invented the genre; the Lark is among the sunniest and most perfect of them all.'}},
     {name:{ru:'Симфония № 45 «Прощальная»',en:'"Farewell" Symphony No. 45'},year:'1772',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'В финале музыканты один за другим гасят свечи и уходят — намёк хозяину, что оркестру пора в отпуск.',en:'Musicians leave the stage one by one, snuffing candles — a hint to the Prince to give the orchestra a holiday.'},
      story:{ru:'В 1772 году оркестр Эстерхази несколько месяцев провёл в загородном поместье вместо Вены: музыканты тосковали по семьям, но прямо попросить отпуск не осмеливались.\nГайдн нашёл хитрый выход: в финале симфонии, по знаку дирижёра, каждый оркестрант заканчивал свою партию, гасил свечу и уходил за кулисы.\nНа сцене оставались лишь двое скрипачей, доигрывавших финал в тишине почти тёмного зала.\nКнязь Эстерхази понял намёк: на следующий день оркестру было велено возвращаться в город.',
             en:'In 1772 Haydn\'s orchestra had been stuck at the country estate for months, unable to return to their families.\nIn the finale of the symphony, each player finishes his part, snuffs his candle and quietly walks off stage until only two muted violins remain in near-darkness.\nPrince Esterházy took the hint: the next day the orchestra was given leave to go home.'}},
   ]},
  {id:'mozart',color:'#d97706',ini:'WAM',era:'classicism',origin:'foreign',birth:1756,death:1791,
   name:{ru:'Вольфганг Амадей Моцарт',en:'W. A. Mozart'},
   country:{ru:'Австрия',en:'Austria'},
   bio:{ru:'Гений-вундеркинд: в 5 лет сочинял менуэты, в 12 — оперы. За 35 лет жизни написал 626 произведений во всех жанрах. Его музыка сочетает изящество, глубину и полную естественность — как будто она существовала всегда.',
        en:'Child prodigy composing minuets at 5 and operas at 12. In 35 years wrote 626 works of timeless naturalness.'},
   works:[
     {name:{ru:'Симфония № 40 соль минор',en:'Symphony No. 40 in G minor'},year:'1788',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Одна из немногих симфоний Моцарта в миноре — пронизана тревогой, страстью и неотвратимостью.',en:'One of Mozart\'s rare minor-key symphonies — suffused with urgency, passion and inevitability.'},
      story:{ru:'Симфония написана летом 1788 года — за три года до смерти Моцарта. Он находился в тяжёлых финансовых затруднениях: долги росли, оперы шли с переменным успехом, жена болела.\nМинорная тональность — редкость для Моцарта. Большинство его симфоний светлые; здесь же с первых тактов — беспокойная, вопрошающая тема.\nТем не менее музыка никогда не впадает в отчаяние: это Моцарт, у него всегда есть внутренний свет и изящество, даже в тёмные часы.\nДля какого концерта написана симфония — неизвестно, и неизвестно, слышал ли её Моцарт при жизни.',
             en:'Written in the summer of 1788, when Mozart was deep in debt and his wife was ill.\nThe minor key is unusual for Mozart; the opening theme is anxious and questioning.\nYet the music never surrenders to despair — even at his darkest, Mozart\'s inner light and elegance never leave him.\nWhether it was ever performed in Mozart\'s lifetime is unknown.'}},
     {name:{ru:'Реквием ре минор',en:'Requiem in D minor'},year:'1791',genre:{ru:'Духовная музыка',en:'Sacred'},
      desc:{ru:'Незавершённый — Моцарт умер, не дописав его. Тайный заказчик и легенда о «мессе смерти» окружают это произведение.',en:'Left unfinished at Mozart\'s death. The mysterious patron and legend of a "death mass" make it uniquely haunting.'},
      story:{ru:'Летом 1791 года к Моцарту явился таинственный посланник в сером плаще и заказал реквием — анонимно. Заказчиком оказался граф Вальзегг, который любил копировать чужие произведения и выдавать их за свои.\nМоцарт был болен и суеверно воспринимал работу как предчувствие собственной смерти. Он говорил жене: «Я пишу реквием для себя».\nОн умер в декабре 1791 года, завершив лишь часть произведения. Его жена наняла ученика Зюсмайра, который дописал реквием по черновикам Моцарта.\nРеквием был исполнен на поминальной службе по Моцарту — произведение, написанное для умершего, прозвучало в память о своём авторе.',
             en:'In the summer of 1791 a mysterious grey-clad messenger commissioned a Requiem anonymously. The patron was Count Walsegg, who collected works and passed them off as his own.\nMozart was ill and superstitiously felt he was writing the Requiem for himself.\nHe died in December 1791, leaving it unfinished; his widow hired his pupil Süssmayr to complete it from Mozart\'s sketches.\nThe Requiem was performed at Mozart\'s own memorial service — a work written for the dead, performed in memory of its composer.'}},
     {name:{ru:'Опера «Дон Жуан»',en:'"Don Giovanni"'},year:'1787',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'История обольстителя и его гибели. Сам Моцарт считал эту оперу своей лучшей.',en:'The story of a seducer and his damnation. Mozart himself considered it his greatest opera.'},
      story:{ru:'Опера написана по заказу пражской оперы в 1787 году. По легенде, увертюру Моцарт написал накануне премьеры ночью — жена поила его пуншем, чтобы не заснул.\nСюжет взят из испанской легенды о дворянине Дон Жуане, совратителе и убийце, которого в финале уносит в ад статуя убитого им Командора.\nГёте называл «Дон Жуана» единственной оперой, достойной называться великой. Сам Моцарт считал её своей лучшей работой.\nОсобую силу имеет финальная сцена: каменная статуя является на пир, Дон Жуан отказывается раскаяться — и проваливается в преисподнюю.',
             en:'Written for the Prague opera in 1787. According to legend, Mozart wrote the overture the night before the premiere while his wife kept him awake with glasses of punch.\nThe story is the Spanish legend of Don Juan, a seducer and murderer dragged to hell in the finale by the stone statue of the man he killed.\nGoethe called Don Giovanni the only opera worthy of greatness; Mozart himself considered it his finest work.'}},
     {name:{ru:'Опера «Волшебная флейта»',en:'"The Magic Flute"'},year:'1791',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'Сказочная масонская притча о победе добра над злом, с ариями от простых до головокружительно виртуозных.',en:'A Masonic fairy-tale about the triumph of light over darkness, with arias from simple to supremely virtuosic.'},
      story:{ru:'«Волшебная флейта» написана по либретто Эмануэля Шиканедера — хозяина пригородного венского театра, с которым Моцарт дружил.\nСюжет — сказочная притча: принц Тамино ищет принцессу Памину, получает волшебную флейту и проходит серию испытаний. В опере зашифрована масонская символика — оба автора были масонами.\nЦарица ночи исполняет одну из самых сложных арий в истории — с нотами фа третьей октавы, требующими феноменального голоса.\nМоцарт умер через два месяца после премьеры. За эти два месяца «Волшебная флейта» прошла более двадцати раз при полном зале.',
             en:'Written with librettist Emanuel Schikaneder, a theatre owner and fellow Freemason.\nPrince Tamino seeks Princess Pamina and must pass a series of ordeals to win her — the opera is rich in Masonic symbolism.\nThe Queen of the Night\'s aria is one of the most technically demanding in history, requiring a soprano\'s highest range.\nMozart died two months after the premiere; in that time the opera had played over twenty sold-out performances.'}},
     {name:{ru:'«Маленькая ночная серенада»',en:'"Eine kleine Nachtmusik"'},year:'1787',genre:{ru:'Серенада',en:'Serenade'},
      desc:{ru:'Пять частей лёгкой, изящной музыки — самое популярное инструментальное произведение Моцарта.',en:'Five movements of effortlessly elegant music — Mozart\'s most beloved instrumental work.'},
      story:{ru:'Написана 10 августа 1787 года — в тот же день, что и ряд других произведений: Моцарт работал с поразительной скоростью.\nПервоначально состояла из пяти частей, но одна (менуэт) была утеряна; сейчас исполняют четыре.\nПредназначалась для домашних вечерних концертов: короткая, изящная, без единой тёмной ноты — «музыкальный подарок» слушателям.\nСейчас это самое цитируемое классическое произведение в мире: реклама, кино, рингтоны — везде звучат эти четыре ноты.',
             en:'Written on 10 August 1787 — one of several works composed the same day by the astonishingly prolific Mozart.\nOriginally in five movements, but one minuet was lost; four movements survive.\nDesigned for elegant private evening concerts — short, cheerful, without a shadow in sight.\nToday it is the most quoted classical piece in the world, heard in commercials, films and ringtones everywhere.'}},
   ]},
  {id:'beethoven',color:'#dc2626',ini:'LvB',era:'classicism',origin:'foreign',birth:1770,death:1827,
   name:{ru:'Людвиг ван Бетховен',en:'Ludwig van Beethoven'},
   country:{ru:'Германия',en:'Germany'},
   bio:{ru:'Потеряв слух, написал свои величайшие сочинения. Преодоление трагедии стало художественным завещанием. Связал классицизм и романтизм, расширив возможности каждого жанра. 9 симфоний, 32 сонаты, 5 фортепианных концертов.',
        en:'Wrote his greatest works after going deaf. Bridged Classicism and Romanticism. 9 symphonies, 32 sonatas, 5 piano concertos.'},
   works:[
     {name:{ru:'Симфония № 5 до минор',en:'Symphony No. 5 in C minor'},year:'1808',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Четыре ноты — «судьба стучится в дверь». Самое узнаваемое начало в истории музыки.',en:'Four notes — "fate knocking at the door". The most famous opening in all of music history.'},
      story:{ru:'Бетховен работал над симфонией с 1804 по 1808 год — параллельно с «Аппассионатой», Четвёртой симфонией и скрипичным концертом.\nЗнаменитый мотив из четырёх нот секретарь Шиндлер записал со слов Бетховена как «Так судьба стучится в дверь» — правда, достоверность этой истории ставится под сомнение.\nСимфония движется от тьмы к свету: первые три части в минорном духе, финал — торжество до мажора. Это «идея преодоления», ставшая символом самого Бетховена.\nВ финале впервые в истории симфонии появились тромбоны, контрафагот и флейта-пикколо. Во Второй мировой войне Би-би-си использовала первые четыре ноты в сводках: по азбуке Морзе они совпадают с «V» (Victory — победа).',
             en:'Beethoven worked on this symphony from 1804 to 1808, alongside the Appassionata, his Fourth Symphony and Violin Concerto.\nThe famous four-note motto was described (perhaps apocryphally) as "fate knocking at the door."\nThe symphony moves from darkness to light — minor key struggling to C major triumph — making it the supreme symbol of Beethoven\'s spirit of overcoming.\nIn World War II, the BBC used its opening in broadcasts to occupied Europe: the morse code for "V" (Victory) matches those four notes.'}},
     {name:{ru:'Симфония № 9 «Хоральная»',en:'Symphony No. 9 "Choral"'},year:'1824',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Написана в полной глухоте. Финал с хором «Ода к радости» стал гимном Евросоюза.',en:'Written in total deafness. The choral finale "Ode to Joy" became the anthem of the European Union.'},
      story:{ru:'К моменту создания Девятой симфонии Бетховен уже много лет был полностью глухим — он никогда не слышал её вживую.\nНа премьере в Вене в 1824 году он стоял рядом с дирижёром и «дирижировал» по памяти, но фактически не слышал ни звука. Когда музыка закончилась, певица повернула его к залу — и он увидел бурю аплодисментов.\nФинал с хором на текст оды Шиллера «К радости» стал революцией: до этого ни один симфонист не включал певцов в симфонию.\nВ 1985 году «Ода к радости» официально стала гимном Европейского союза.',
             en:'By the time he wrote the Ninth, Beethoven had been completely deaf for years and never heard it performed.\nAt the Vienna premiere in 1824 he stood near the conductor, moving as if conducting from memory. When the music ended, a singer turned him to face the audience — and he saw the thunderous ovation.\nThe choral finale was a revolution: no symphony had ever included singers before.\nIn 1985 the "Ode to Joy" became the official anthem of the European Union.'}},
     {name:{ru:'Соната № 14 «Лунная»',en:'"Moonlight" Sonata No. 14'},year:'1801',genre:{ru:'Соната',en:'Sonata'},
      desc:{ru:'Посвящена Джульетте Гвиччарди. Название «Лунная» дал критик: первая часть напоминает лунный свет на воде.',en:'Dedicated to Giulietta Guicciardi. The "moonlight" nickname was coined by a critic after Beethoven\'s death.'},
      story:{ru:'Написана в 1801 году и посвящена Джульетте Гвиччарди — молодой аристократке, которую Бетховен страстно любил и на которой хотел жениться. Она выбрала другого.\nСам Бетховен называл сонату «Соната-фантазия». Название «Лунная» появилось лишь в 1832 году — поэт Людвиг Рельштаб написал, что первая часть напоминает ему лунный свет над Люцернским озером.\nТри части контрастируют: ночная медитация первой сменяется нежным менуэтом второй — и бурной, необузданной третьей.\nЭта соната совершила переворот в фортепианной музыке: до Бетховена ни одна соната не начиналась с медленной части такой глубины.',
             en:'Written in 1801 and dedicated to Giulietta Guicciardi, whom Beethoven passionately loved and wished to marry. She chose another.\nBeethoven called it simply "Quasi una fantasia." The "Moonlight" nickname was given by poet Rellstab in 1832, who compared the first movement to moonlight over Lake Lucerne.\nThe three movements contrast strikingly: nocturnal meditation, a gentle minuet, then a furious, storming finale.'}},
     {name:{ru:'Соната № 23 «Аппассионата»',en:'"Appassionata" Sonata No. 23'},year:'1807',genre:{ru:'Соната',en:'Sonata'},
      desc:{ru:'Вихрь страстей, буря и натиск. Бетховен называл её своей любимой фортепианной сонатой.',en:'A whirlwind of passion and storm. Beethoven called it his favourite piano sonata.'},
      story:{ru:'Написана в 1804–1806 годах, опубликована в 1807-м. Название «Аппассионата» («страстная») придумал не Бетховен, а издатель Кранц — уже после смерти композитора.\nПо рассказу ученика Шиндлера, однажды Бетховен шёл по полю, неся рукопись сонаты, и перевернул лодку через реку — и весь день провёл мокрый, отказываясь вернуться за шляпой, потому что в голове звучала музыка.\nБетховен называл «Аппассионату» своей любимой сонатой — до тех пор, пока не написал «Хаммерклавир» (№ 29).\nПроизведение отражает переломный момент в творчестве: это уже не классицизм, это чистый романтизм с бетховенским знаком.',
             en:'Written 1804–1806, published 1807. The name "Appassionata" was given by the publisher Cranz after Beethoven\'s death.\nAccording to his pupil Schindler, Beethoven once walked through fields with the manuscript in a rainstorm, soaked but refusing to go back for his hat because music was ringing in his head.\nBeethoven called it his favourite sonata — until he wrote the Hammerklavier (No. 29).'}},
     {name:{ru:'Концерт для ф-но № 5 «Императорский»',en:'Piano Concerto No. 5 "Emperor"'},year:'1811',genre:{ru:'Концерт',en:'Concerto'},
      desc:{ru:'Грандиозный и торжественный — самый монументальный из всех пяти концертов Бетховена.',en:'Grand and ceremonial — the most monumental of Beethoven\'s five piano concertos.'},
      story:{ru:'Написан в 1809 году, когда Наполеон второй раз осаждал Вену. Бетховен прятался в подвале у своего брата, закрыв голову подушками — не от страха, а потому что пушечные залпы причиняли боль его больным ушам.\nНазвание «Императорский» придумал лондонский издатель — сам Бетховен его никогда не использовал. Вероятно, оно появилось из-за грандиозного, торжественного характера музыки.\nЭто последний из пяти фортепианных концертов Бетховена: из-за глухоты он больше не мог выступать как солист.\nКонцерт открывается революционно: вместо обычного оркестрового вступления — три грандиозных аккорда солиста, и только потом вступает оркестр.',
             en:'Written in 1809 while Napoleon besieged Vienna. Beethoven hid in his brother\'s cellar with pillows over his ears — not from fear, but because cannon fire hurt his diseased hearing.\nThe "Emperor" nickname was the London publisher\'s invention — Beethoven never used it.\nThis was his last piano concerto: his deafness meant he could no longer perform as a soloist.\nIt opens with a revolutionary gesture — three grand solo chords before the orchestra plays a single note.'}},
   ]},
  {id:'schubert',color:'#7c3aed',ini:'FS',era:'romanticism',origin:'foreign',birth:1797,death:1828,
   name:{ru:'Франц Шуберт',en:'Franz Schubert'},
   country:{ru:'Австрия',en:'Austria'},
   bio:{ru:'Прожил всего 31 год, но оставил 10 симфоний, более 600 песен, квинтеты и квартеты. Изобрёл и поднял до высоты искусства немецкую песню (Lied) — стихотворение с фортепианным сопровождением.',
        en:'Lived only 31 years but left 10 symphonies, 600+ songs, and chamber masterworks. He elevated the German Lied to art.'},
   works:[
     {name:{ru:'Симфония № 8 «Неоконченная»',en:'"Unfinished" Symphony No. 8'},year:'1822',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Написаны лишь две из задуманных четырёх частей. Почему Шуберт бросил работу — загадка истории музыки.',en:'Only two of four planned movements were written. Why Schubert stopped remains one of music\'s great mysteries.'},
      story:{ru:'В октябре 1822 года Шуберт написал две части симфонии и набросок третьей — и более к ней не возвращался.\nПочему? Версий много: тяжёлая болезнь (в том же году он заразился сифилисом), творческий кризис, потеря интереса. По одной из версий, он передал ноты другу в качестве благодарности — и просто забыл.\nСимфония пролежала в архиве 43 года. Обнаружена в 1865 году — через 37 лет после смерти Шуберта; тогда же исполнена впервые.\nПотомки решили не дописывать её: два первых движения настолько самодостаточны и гениальны, что любое продолжение казалось бы лишним.',
             en:'In October 1822 Schubert wrote two movements and a sketch of a third — and never returned to the work.\nWhy? Perhaps illness (he contracted syphilis that year), perhaps he lost interest, perhaps he sent it to a friend as a gift and forgot about it.\nThe symphony lay undiscovered for 43 years, premiering in 1865 — 37 years after Schubert\'s death.\nNo one has ever successfully completed it: the two movements that exist feel so whole that any continuation seems superfluous.'}},
     {name:{ru:'«Зимний путь»',en:'"Winterreise"'},year:'1827',genre:{ru:'Вокальный цикл',en:'Song cycle'},
      desc:{ru:'24 песни об одиночестве, отчаянии и потере любви — самый пронзительный вокальный цикл в истории.',en:'24 songs of loneliness, despair and lost love — perhaps the most profound song cycle ever written.'},
      story:{ru:'В январе 1827 года Шуберт случайно нашёл в журнале 12 стихотворений Вильгельма Мюллера — и не мог оторваться. Через несколько недель первая половина цикла была готова; вторую он написал позже в том же году.\nЦикл рассказывает от лица молодого человека, который после отвергнутой любви покидает город и бредёт в зимнюю стужу без цели.\nДрузья были шокированы мрачностью музыки. Шуберт ответил: «Послушайте сами — и потом скажете мне».\nПоследняя песня «Шарманщик» — старик крутит ручку, никто не слушает, никто не платит — считается самым пронзительным финалом в истории вокальной музыки.',
             en:'In January 1827 Schubert stumbled on poems by Wilhelm Müller in a journal and could not put them down. He set the first 12 in weeks; the remaining 12 followed later that year.\nThe cycle follows a young man who leaves after rejected love and wanders aimlessly through winter.\nFriends were shocked by the darkness of the music. "Come and listen," Schubert replied, "then judge."\nThe final song, "The Hurdy-Gurdy Man" — an old man turning a barrel organ that no one stops to hear — is considered the most desolate ending in all vocal music.'}},
     {name:{ru:'Фортепианный квинтет «Форель»',en:'"Trout" Quintet'},year:'1819',genre:{ru:'Камерная музыка',en:'Chamber'},
      desc:{ru:'Четвёртая часть — вариации на тему его же песни «Форель». Солнечная, жизнерадостная музыка.',en:'The fourth movement is a set of variations on his song "The Trout". Sunny and joyful.'},
      story:{ru:'Летом 1817 года Шуберт написал песню «Форель» на стихи Кристиана Шубарта: рыбка резвится в прозрачном ручье, пока хитрый рыбак не мутит воду и не ловит её.\nДва года спустя австрийский меценат Сильвестр Паумгартнер, страстный любитель музыки, попросил Шуберта написать камерное произведение — обязательно с вариациями на тему «Форели».\nВ результате появился квинтет для необычного состава: скрипка, альт, виолончель, контрабас и фортепиано.\nЧетвёртая часть — шесть вариаций на тему «Форели» — переходит от светлой и игривой темы через неожиданные превращения к торжеству.',
             en:'In 1817 Schubert wrote the song "The Trout" — a fish darting in clear water until a cunning angler muddies the stream and catches it.\nTwo years later, patron Sylvester Paumgartner commissioned a chamber work, specifying that it must include variations on the Trout song.\nThe result was a quintet for the unusual combination of violin, viola, cello, double bass and piano.\nThe fourth movement — six variations on the Trout melody — is the sunny, joyful heart of the work.'}},
     {name:{ru:'«Аве Мария»',en:'"Ave Maria"'},year:'1825',genre:{ru:'Вокальная пьеса',en:'Song'},
      desc:{ru:'Первоначально романс на слова Вальтера Скотта. Стала одним из самых известных духовных произведений мира.',en:'Originally a setting of Sir Walter Scott. Now one of the world\'s most beloved sacred melodies.'},
      story:{ru:'В 1825 году Шуберт писал цикл романсов на тексты из романа Вальтера Скотта «Дева озера» — в немецком переводе.\n«Аве Мария» — это «Гимн к Деве» Эллен, дочери вождя клана, молящейся о защите своего отца. Шуберт писал её как романс, а не церковное произведение.\nЛатинский текст молитвы «Ave Maria» подложили к этой мелодии позже — само стихотворение Скотта по-немецки начинается «Ellens dritter Gesang».\nСегодня она исполняется в церквях, на свадьбах и похоронах по всему миру, и мало кто знает, что это изначально была театральная баллада.',
             en:'In 1825 Schubert set poems from Sir Walter Scott\'s "The Lady of the Lake" in German translation.\n"Ave Maria" is Ellen\'s hymn to the Virgin as she prays for her father\'s safety — Schubert wrote it as a romantic ballad, not a sacred work.\nThe Latin prayer text was fitted to the melody later by someone else; the original German begins "Ellens dritter Gesang."\nToday it is heard at weddings, funerals and in churches worldwide, few listeners aware of its origins as a theatrical ballad.'}},
   ]},
  {id:'glinka',color:'#15803d',ini:'МГ',era:'romanticism',origin:'russian',birth:1804,death:1857,
   name:{ru:'Михаил Иванович Глинка',en:'Mikhail Glinka'},
   country:{ru:'Россия',en:'Russia'},
   bio:{ru:'Основоположник русской классической музыки. Учился в Италии и Германии, но главной задачей считал создание самобытного русского стиля. Его оперы стали фундаментом для всей последующей русской традиции — от Чайковского до «Могучей кучки».',
        en:'Founder of Russian classical music. Studied in Italy and Germany but devoted himself to creating an authentic Russian style. His operas became the foundation for all subsequent Russian composers, from Tchaikovsky to the Mighty Five.'},
   works:[
     {name:{ru:'Опера «Иван Сусанин»',en:'"A Life for the Tsar"'},year:'1836',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'Первая великая русская опера. Героический сюжет о крестьянине, пожертвовавшем жизнью ради царя и России.',en:'The first great Russian opera — a heroic tale of a peasant who gives his life for the Tsar and Russia.'},
      story:{ru:'Опера создавалась с 1834 по 1836 год на либретто барона Розена. Идею крестьянина Ивана Сусанина, заведшего польский отряд в непроходимые леса и погибшего при этом, предложил сам Глинка.\nПремьера в Большом театре Санкт-Петербурга 9 декабря 1836 года стала событием национального масштаба. Николай I лично посетил её и был растроган. После премьеры опере дали название «Жизнь за царя».\nГлинка впервые в русской музыке органично соединил итальянскую оперную форму с подлинно русским мелодизмом — народными попевками, церковным пением.\nПосле 1917 года опера была переименована в «Иван Сусанин» с новым, революционным либретто. Сегодня исполняется в обеих редакциях.',
             en:'Composed 1834–1836 on a libretto by Baron Rozen. Glinka himself chose the subject: the peasant Ivan Susanin who led a Polish detachment into impassable forests and was killed.\nThe St Petersburg premiere on 9 December 1836 was a national event. Tsar Nicholas I attended and was moved; the opera was immediately renamed "A Life for the Tsar."\nGlinka was the first Russian composer to organically fuse Italian opera form with genuine Russian melodic style — folk intonation and church chant.\nAfter 1917 it was renamed "Ivan Susanin" with a revolutionary libretto. Today both versions are performed.'}},
     {name:{ru:'Опера «Руслан и Людмила»',en:'"Ruslan and Lyudmila"'},year:'1842',genre:{ru:'Опера',en:'Opera'},
      desc:{ru:'Сказочная опера по Пушкину. Богатырь Руслан спасает невесту из плена злого волшебника. Увертюра — одна из самых виртуозных в мире.',en:'A fairy-tale opera based on Pushkin. Hero Ruslan rescues his bride from an evil sorcerer. The overture is one of the most dazzling in existence.'},
      story:{ru:'Опера писалась шесть лет — слишком долго, часть соавторов успела умереть. Поэт Пушкин был убит на дуэли в 1837 году, не успев дописать либретто.\nГлинка задумал произведение грандиозное: пять актов, богатыри и волшебники, восточные краски и колдовские превращения.\nПремьера 9 декабря 1842 года провалилась — критики нашли оперу «странной». Царь Николай I демонстративно ушёл до конца.\nНо именно «Руслан» стал главным источником вдохновения для «Могучей кучки»: Балакирев, Мусоргский, Бородин, Римский-Корсаков и Кюи учились у неё ориентализму, сказочности и смелой гармонии.',
             en:'The opera took six years to write; Pushkin, who was to write the libretto, was killed in a duel in 1837 before completing it.\nGlinka envisioned something vast: five acts, knights and sorcerers, oriental colours and magical transformations.\nThe premiere on 9 December 1842 was a failure — critics found it "strange," and Tsar Nicholas I pointedly left before the end.\nYet "Ruslan" became the key source for the Mighty Five: Balakirev, Mussorgsky, Borodin, Rimsky-Korsakov and Cui all learned their orientalism, fairy-tale atmosphere and bold harmony from it.'}},
     {name:{ru:'«Камаринская»',en:'"Kamarinskaya"'},year:'1848',genre:{ru:'Оркестровая музыка',en:'Orchestral fantasy'},
      desc:{ru:'Оркестровая фантазия на две русские народные темы. Чайковский называл её «желудём, из которого вырос дуб русской симфонической музыки».',en:'Orchestral fantasy on two Russian folk themes. Tchaikovsky called it "the acorn from which the oak of Russian symphonic music grew."'},
      story:{ru:'«Камаринскую» Глинка написал в 1848 году в Варшаве — быстро, почти экспромтом. В основе — свадебная песня «Из-за гор, гор высоких» и плясовая «Камаринская».\nВпервые в русской музыке народные темы разработаны с применением приёмов европейской симфонической формы — вариаций, полифонии, оркестровых контрастов.\nЧайковский написал в дневнике: «Вся русская симфоническая школа содержится в «Камаринской», как дуб в желуде».\nИменно здесь Глинка впервые показал, что русский фольклор может быть материалом для серьёзной оркестровой разработки.',
             en:'Glinka wrote "Kamarinskaya" in 1848 in Warsaw — quickly, almost on a whim. It is built on a wedding song and a dance tune.\nFor the first time in Russian music, folk themes were developed using the techniques of European symphonic form — variation, counterpoint, orchestral contrast.\nTchaikovsky wrote in his diary: "The whole Russian symphonic school is contained in Kamarinskaya, as the oak is in the acorn."\nHere Glinka first showed that Russian folklore could be the material for serious symphonic development.'}},
     {name:{ru:'«Вальс-фантазия»',en:'"Waltz-Fantasy"'},year:'1856',genre:{ru:'Оркестровая музыка',en:'Orchestral'},
      desc:{ru:'Лёгкий, светящийся вальс — одна из вершин русской романтической оркестровой лирики.',en:'A luminous, graceful waltz — one of the peaks of Russian Romantic orchestral lyricism.'},
      story:{ru:'«Вальс-фантазия» имеет длинную историю: Глинка написал первый вариант в 1839 году для фортепиано, посвятив его своей возлюбленной Екатерине Керн, дочери той самой Анны Керн, которой Пушкин посвятил «Я помню чудное мгновенье».\nВ 1845 году Глинка создал оркестровую версию для концерта в Париже. Последняя, расширенная редакция появилась в 1856 году.\nМузыка лёгкая, «танцующая», но с оттенком меланхолии: в ней слышна и радость, и прощание. Это сочетание чувств сделало «Вальс-фантазию» образцом для Чайковского при создании балетных вальсов.',
             en:'"Waltz-Fantasy" has a long history: Glinka first wrote it for piano in 1839, dedicating it to Ekaterina Kern — daughter of the very Anna Kern whom Pushkin immortalised in his famous lyric poem.\nGlinka orchestrated it in 1845 for a Paris concert. The final expanded version appeared in 1856.\nThe music is light and dance-like, tinged with melancholy — joy and farewell at once. This mixture became a direct model for Tchaikovsky\'s ballet waltzes.'}},
   ]},
  {id:'chopin',color:'#0891b2',ini:'FŠ',era:'romanticism',origin:'foreign',birth:1810,death:1849,
   name:{ru:'Фридерик Шопен',en:'Frédéric Chopin'},
   country:{ru:'Польша / Франция',en:'Poland / France'},
   bio:{ru:'Поляк, живший в Париже, писал почти исключительно для фортепиано — и в этом не знал равных. Вложил в музыку тоску по родине. Страдая туберкулёзом, создавал лирику хрупкой, нездешней красоты.',
        en:'A Pole living in Paris who wrote almost exclusively for piano. His music embodies homesickness and otherworldly beauty.'},
   works:[
     {name:{ru:'Баллада № 1 соль минор',en:'Ballade No. 1 in G minor'},year:'1835',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'Первая романтическая инструментальная баллада в истории — поэма трагической любви.',en:'The first Romantic instrumental ballade in history — a poem of tragic love.'},
      story:{ru:'До Шопена слово «баллада» обозначало только вокальный жанр. Шопен первым написал «балладу» для инструмента соло — тем самым изобрёл новый жанр.\nВдохновением считаются поэмы Адама Мицкевича — польского поэта-романтика, с которым Шопен был лично знаком в Париже.\nМузыка начинается почти незаметно — вопросительная, одинокая тема. Постепенно нагнетается напряжение, и произведение обрушивается в финале бурным потоком.\nКода — внезапная, почти жестокая — ставит точку без предупреждения. Один из самых захватывающих финалов в фортепианной литературе.',
             en:'Before Chopin the word "ballade" meant only a vocal genre. He invented the instrumental ballade — creating an entirely new form.\nThe inspiration is thought to be the poems of Adam Mickiewicz, the Polish Romantic poet Chopin knew personally in Paris.\nThe music begins quietly, almost tentatively, then builds relentlessly to a coda of terrifying, sudden finality.'}},
     {name:{ru:'24 прелюдии',en:'24 Preludes'},year:'1839',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'Цикл миниатюр — музыкальная исповедь, написанная на Майорке в ненастную зиму.',en:'A cycle of miniatures — a musical confessional written during a stormy Majorcan winter.'},
      story:{ru:'В 1838–1839 годах Шопен жил на Майорке вместе с писательницей Жорж Санд. Зима оказалась сырой и холодной; монастырь Вальдемосса, где они обосновались, продувался насквозь.\nШопен кашлял, задыхался, но писал. По одной легенде, однажды Жорж Санд вернулась с прогулки в грозу и нашла его в трансе: он уверял, что видел, как капли дождя падают на крышку его гроба. Так родилась «Дождевая» прелюдия.\nКаждая из 24 миниатюр — в своей тональности и своём настроении: от торжественного до трагического, от детски-простого до виртуозно сложного.\nБаховский «Хорошо темперированный клавир» с его 24 прелюдиями, очевидно, вдохновил замысел Шопена.',
             en:'In 1838–39 Chopin lived on Majorca with the writer George Sand in a cold, damp monastery.\nAccording to legend, one night Sand returned from a walk in a thunderstorm to find him in a trance, convinced he had seen raindrops falling on his coffin — inspiring the "Raindrop" prelude.\nEach of the 24 miniatures occupies its own key and mood, from solemn to tragic, childlike to fiendishly difficult.\nBach\'s Well-Tempered Clavier — also 24 preludes in all keys — clearly inspired the concept.'}},
     {name:{ru:'Полонез ля♭ мажор «Героический»',en:'"Heroic" Polonaise'},year:'1842',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'Величественный гимн польскому духу и мужеству. Один из самых исполняемых полонезов.',en:'A majestic hymn to Polish spirit and courage. One of the most performed polonaises.'},
      story:{ru:'Полонез — торжественный польский танец, который Шопен превратил в символ национальной идентичности. Написан в 1842 году — когда Польша была под властью России и Австрии.\nМузыка открывается могучими аккордами, напоминающими конный строй рыцарей. Это звуковой образ Польши — непокорной, гордой.\nСредняя часть контрастирует: тихий «ноктюрн» внутри полонеза — голос нежности и тоски посреди битвы.\nФранц Лист говорил, что, играя этот полонез, чувствует себя польским рыцарём. Название «Героический» придумал не Шопен, а издатель — но оно прижилось.',
             en:'The polonaise — a ceremonial Polish dance — became in Chopin\'s hands a symbol of national identity. Written in 1842 when Poland was under foreign rule.\nThe opening chords suggest a cavalry of knights; the middle section is a quiet nocturne of tenderness and longing within the battle.\nFranz Liszt said that playing this polonaise made him feel like a Polish knight. "Heroic" was the publisher\'s label, not Chopin\'s — but it fits perfectly.'}},
     {name:{ru:'Ноктюрн до♯ минор',en:'Nocturne in C♯ minor'},year:'~1830',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'Посмертно опубликованный ноктюрн — хрустально-прозрачная лирика ночи.',en:'Published posthumously — a crystal-clear nocturnal lyric of quiet intimacy.'},
      story:{ru:'Этот ноктюрн не публиковался при жизни Шопена. Рукопись обнаружена в архивах после его смерти и впервые издана в 1938 году.\nСчитается, что написан около 1829–1830 годов — Шопену было около двадцати лет. Музыка проста и прозрачна, без «взрослой» глубины зрелых ноктюрнов, но с неповторимой хрупкой красотой.\nВ 2002 году режиссёр Роман Поланский включил этот ноктюрн в фильм «Пианист». Сцена, где главный герой играет его немецкому офицеру в разбомблённом Варшавском гетто, стала одной из самых знаменитых в истории кино.\nПосле выхода фильма популярность произведения выросла многократно.',
             en:'Never published in Chopin\'s lifetime, the manuscript was discovered after his death and first printed in 1938.\nProbably written around 1829–30, when Chopin was about twenty. The music is simple and transparent, with a fragile beauty that differs from the depth of the mature nocturnes.\nIn 2002 Roman Polanski used it in "The Pianist" — the scene where the hero plays it for a German officer in the ruins of the Warsaw Ghetto became one of cinema\'s most famous moments.'}},
     {name:{ru:'Вальс ре♭ мажор «Минутный»',en:'"Minute" Waltz in D♭ major'},year:'1847',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'«Минутный» значит «крохотный, изящный» — не за минуту написан и не за минуту играется.',en:'"Minute" means "tiny and delicate" — not written or played in sixty seconds.'},
      story:{ru:'Написан в 1847 году — за два года до смерти Шопена. Одно из последних его произведений, полное лёгкости и изящества.\nПо одной версии, вдохновением послужила собачка Жорж Санд: та гонялась за собственным хвостом, кружась на месте — и мелодия вальса тоже кружится, не может остановиться.\nНазвание «Минутный» на немецком и английском языках означает «крохотный», «изящный» — не «длящийся одну минуту». Сыграть его правильно занимает около двух минут.\nПроведение этого вальса за одну минуту стало негласным «тестом на скорость» для пианистов — но при этом теряется вся музыкальность.',
             en:'Written in 1847 — one of Chopin\'s last works, full of lightness despite his failing health.\nAccording to legend, it was inspired by George Sand\'s little dog chasing its own tail — which explains the melody\'s spinning, circular character.\n"Minute" means "tiny and delicate" in French, not "lasting sixty seconds." A proper performance takes about two minutes.\nPlaying it in sixty seconds became an unofficial "speed test" for pianists — but at that pace all musicality is lost.'}},
   ]},
  {id:'liszt',color:'#9333ea',ini:'ФЛ',era:'romanticism',origin:'foreign',birth:1811,death:1886,
   name:{ru:'Ференц Лист',en:'Franz Liszt'},
   country:{ru:'Венгрия',en:'Hungary'},
   bio:{ru:'Величайший пианист-виртуоз XIX века и первый музыкальный суперзвёзда. Изобрёл жанр симфонической поэмы и форму сольного фортепианного концерта в современном смысле. Поздние сочинения предвосхищают атональность XX века.',
        en:'The greatest piano virtuoso of the 19th century and music\'s first superstar. He invented the symphonic poem and the modern solo recital. His late works anticipate 20th-century atonality.'},
   works:[
     {name:{ru:'Венгерские рапсодии',en:'Hungarian Rhapsodies'},year:'1846–53',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'19 пьес, вдохновлённых венгерской народной и цыганской музыкой — от мечтательных до головокружительно виртуозных.',en:'19 pieces inspired by Hungarian folk and Roma music — from dreamy to dazzlingly virtuosic.'},
      story:{ru:'Лист вырос в Венгрии, но провёл большую часть жизни в Германии и Франции. Венгерские рапсодии — его способ сохранить связь с родиной.\nОснова рапсодий — венгерская народная и цыганская музыка, которую Лист слышал с детства. Он записывал народные мелодии и перекладывал их в своём фирменном виртуозном стиле.\nРапсодия № 2 стала настолько популярной, что в XX веке её использовали в мультфильмах про Тома и Джерри — это сделало её одним из самых узнаваемых произведений классики.\nКогда Лист исполнял рапсодии на концертах, публика рыдала и впадала в экстаз — явление, которое назвали «листоманией».',
             en:'Liszt grew up in Hungary but spent most of his life in Germany and France. The Hungarian Rhapsodies were his way of staying connected to his homeland.\nThe pieces are based on Hungarian folk and Roma music he had known since childhood, transformed into his signature virtuosic idiom.\nRhapsody No. 2 became so famous it was used in Tom and Jerry cartoons, making it one of the most recognisable pieces in the classical repertoire.\nWhen Liszt performed them, audiences wept and swooned — a phenomenon called "Lisztomania."'}},
     {name:{ru:'Соната си минор',en:'Piano Sonata in B minor'},year:'1853',genre:{ru:'Фортепиано',en:'Piano'},
      desc:{ru:'Монументальная одночастная соната — вершина романтической фортепианной литературы. Длится 30 минут без перерыва.',en:'A monumental single-movement sonata — the summit of Romantic piano writing, 30 minutes without pause.'},
      story:{ru:'Лист написал Сонату си минор в 1852–1853 годах и посвятил её Роберту Шуману — как ответ на посвящение шумановской «Фантазии» до мажор.\nОднако Шуман к тому времени был уже тяжело болен, а его жена Клара исполнила сонату лишь в закрытом кругу и нашла её «просто шумом». Брамс заснул во время исполнения.\nСоната состоит из одной непрерывной части, но в ней угадываются все четыре традиционные части классической сонаты — они переплетены между собой.\nСейчас Соната си минор считается одним из труднейших и глубочайших произведений фортепианного репертуара.',
             en:'Liszt wrote the sonata in 1852–53 and dedicated it to Robert Schumann — reciprocating Schumann\'s dedication of the Fantasie in C major.\nBy then Schumann was gravely ill. Clara Schumann, who played it in private, found it "merely noise"; Brahms fell asleep.\nThe sonata is a single movement of about 30 minutes in which the four traditional sonata movements are embedded and interwoven.\nToday it is regarded as one of the most demanding and profound works in the piano repertoire.'}},
     {name:{ru:'Симфоническая поэма «Прелюды»',en:'"Les Préludes"'},year:'1848–54',genre:{ru:'Симфоническая поэма',en:'Symphonic poem'},
      desc:{ru:'Первая и самая исполняемая симфоническая поэма в истории. Жизнь как «прелюдия к смерти» — по Ламартину.',en:'The most performed symphonic poem ever written. Life as "a prelude to death" — after Lamartine.'},
