      story:{ru:'Летом 1960 года советские власти давили на Шостаковича с требованием вступить в Коммунистическую партию. Он поддался давлению и подписал заявление — это стало для него источником глубочайшего стыда.\nСразу после этого он уехал в Дрезден работать над музыкой к фильму. Именно там за три дня был написан Восьмой квартет. Шостакович утверждал, что написал его «как будущий памятник себе».\nЧерез всё произведение проходит монограмма DSCH — ноты D, E♭, C, H (ре, ми-бемоль, до, си), соответствующие немецкому написанию его инициалов. Квартет полон цитат из его собственных симфоний, романсов и оперы — как автобиография в звуке.\nПосвящение «памяти жертв фашизма и войны» было отчасти маскировкой: в письме другу Шостакович признавался, что квартет посвящён ему самому. Произведение написано человеком, который чувствовал себя духовно уничтоженным.',
              en:'In the summer of 1960, Soviet authorities pressured Shostakovich into joining the Communist Party. He yielded and signed the application — an act that became a source of profound shame.\nImmediately after, he traveled to Dresden to work on a film score. There, in just three days, he wrote the Eighth Quartet. Shostakovich described it as writing "a kind of monument to myself."\nRunning throughout the work is the DSCH monogram — the notes D, E♭, C, B, corresponding to the German transliteration of his initials. The quartet is filled with self-quotations from his symphonies, songs, and opera — an autobiography in sound.\nThe dedication "to the memory of the victims of fascism and war" was partly a cover: in a letter to a friend, Shostakovich confessed the quartet was dedicated to himself. It was written by a man who felt spiritually destroyed.'}},
     {name:{ru:'Симфония № 10 ми минор',en:'Symphony No. 10 in E minor'},year:'1953',genre:{ru:'Симфония',en:'Symphony'},
      desc:{ru:'Написана сразу после смерти Сталина — освобождение от страха, исповедь и самоутверждение.',en:'Written just after Stalin\'s death — a release from fear, a confession, and a triumphant act of self-assertion.'},
      story:{ru:'Сталин умер в марте 1953 года. Той же весной Шостакович начал сочинять Десятую симфонию — первую крупную оркестровую работу за восемь лет. Всё это время он избегал «опасных» жанров после разгромного постановления 1948 года.\nВторая часть симфонии — жёсткое, почти механическое скерцо длительностью менее пяти минут. Шостакович лично подтвердил: это музыкальный портрет Сталина. Часть звучит как стремительный, безжалостный вихрь.\nВ третьей и четвёртой частях появляется монограмма DSCH. Впервые в своей музыке Шостакович открыто поставил свою «подпись» — как знак того, что он жив и снова говорит собственным голосом.\nПремьера в Ленинграде прошла в декабре 1953 года под управлением Мравинского. Симфония вызвала острую дискуссию среди советских музыкантов: одни считали её упадочной, другие — шедевром. В итоге победили те, кто видел в ней обретение свободы.',
              en:'Stalin died in March 1953. That same spring, Shostakovich began composing the Tenth Symphony — his first major orchestral work in eight years, having avoided "dangerous" genres since the devastating 1948 decree.\nThe second movement is a brutal, almost mechanical scherzo lasting less than five minutes. Shostakovich personally confirmed it was a musical portrait of Stalin — a rapid, merciless whirlwind.\nIn the third and fourth movements, the DSCH monogram appears. For the first time, Shostakovich openly placed his own "signature" in the music — a sign that he was alive and speaking in his own voice again.\nThe premiere in Leningrad in December 1953, conducted by Mravinsky, sparked fierce debate among Soviet musicians: some called it decadent, others a masterpiece. Ultimately, those who heard in it a reclaiming of freedom prevailed.'}},

let lang=localStorage.getItem('musicapp_lang')||'ru', eraFilter='all', originFilter='all', searchQ='', expandedId=null, quizScore={c:0,w:0}, quizCorrect=null, quizCurrentComposer=null;
let favComposers=[], favWorks=[], favOnly=false;
function loadFavorites(){
  try{
    const raw=JSON.parse(localStorage.getItem('musicapp_ml_favorites')||'{}');
    favComposers=Array.isArray(raw.composers)?raw.composers:[];
    favWorks=Array.isArray(raw.works)?raw.works:[];
  }catch(e){favComposers=[];favWorks=[];}
}
function saveFavorites(){
  localStorage.setItem('musicapp_ml_favorites',JSON.stringify({composers:favComposers,works:favWorks}));
}
function favIndexSet(module,type,id,data){
  try{
    const idx=JSON.parse(localStorage.getItem('musicapp_fav_index')||'{}');
    idx[module+':'+type+':'+id]=Object.assign({module,type,id,ts:Date.now()},data);
    localStorage.setItem('musicapp_fav_index',JSON.stringify(idx));
  }catch(e){}
}
function favIndexRemove(module,type,id){
  try{
    const idx=JSON.parse(localStorage.getItem('musicapp_fav_index')||'{}');
    delete idx[module+':'+type+':'+id];
    localStorage.setItem('musicapp_fav_index',JSON.stringify(idx));
  }catch(e){}
}
function isFavComposer(id){return favComposers.indexOf(id)!==-1;}
function toggleFavComposer(id){
  const i=favComposers.indexOf(id);
  if(i===-1){
    favComposers.push(id);
    const c=COMPOSERS.find(x=>x.id===id);
    if(c)favIndexSet('ml','composer',id,{labelRu:c.name.ru,labelEn:c.name.en,subRu:c.country.ru,subEn:c.country.en,icon:'🎭',link:'муз-литература/index.html#composer-'+id});
  }else{
    favComposers.splice(i,1);
    favIndexRemove('ml','composer',id);
  }
  saveFavorites();
  renderCards();
}
function workKey(cid,wi){return cid+'::'+wi;}
function isFavWork(cid,wi){return favWorks.indexOf(workKey(cid,wi))!==-1;}
function toggleFavWork(cid,wi){
  const k=workKey(cid,wi);
  const i=favWorks.indexOf(k);
  if(i===-1){
    favWorks.push(k);
    const c=COMPOSERS.find(x=>x.id===cid), w=c&&c.works[wi];
    if(c&&w)favIndexSet('ml','work',k,{labelRu:w.name.ru,labelEn:w.name.en,subRu:c.name.ru,subEn:c.name.en,icon:'🎼',link:'муз-литература/index.html#composer-'+cid});
  }else{
    favWorks.splice(i,1);
    favIndexRemove('ml','work',k);
  }
  saveFavorites();
  renderCards();
}
function toggleFavOnly(){
  favOnly=!favOnly;
  renderFavFilter();
  renderCards();
}
function renderFavFilter(){
  document.getElementById('favFilterBar').innerHTML=
    `<button class="chip${favOnly?' active':''}" onclick="toggleFavOnly()">⭐ ${lang==='ru'?'Избранное':'Favorites'}</button>`;
}
loadFavorites();

/* ─── MODAL ─────────────────────────────────── */
function showWorkModal(composerId, workIdx, e) {
  e.stopPropagation();
  const c = COMPOSERS.find(x => x.id === composerId);
  const w = c.works[workIdx];
  const av = document.getElementById('mAvatar');
  av.textContent = c.ini;
  av.style.background = c.color;
  document.getElementById('mCompName').textContent = c.name[lang]||c.name.ru;
  document.getElementById('mEra').textContent = (ERA_LABELS[c.era]||{})[lang] + ' · ' + (c.country[lang]||c.country.ru);
  document.getElementById('mTitle').textContent = w.name[lang]||w.name.ru;
  document.getElementById('mMeta').textContent = w.year + ' · ' + (w.genre[lang]||w.genre.ru);
  const desc = w.desc ? (w.desc[lang]||w.desc.ru) : '';
  document.getElementById('mDescBlock').style.display = desc ? '' : 'none';
  document.getElementById('mDesc').textContent = desc;
  document.getElementById('mStoryTitle').textContent = lang==='ru' ? 'История создания' : 'About this work';
  const story = w.story ? (w.story[lang]||w.story.ru) : (lang==='ru'?'Подробное описание будет добавлено.':'Details coming soon.');
  document.getElementById('mStory').innerHTML = story.split('\n').filter(Boolean).map(p=>`<p>${p}</p>`).join('');
  document.getElementById('workModal').classList.add('show');
  document.body.style.overflow = 'hidden';
}
function hideModal() {
  document.getElementById('workModal').classList.remove('show');
  document.body.style.overflow = '';
}
function closeModalOv(e) {
  if (e.target === document.getElementById('workModal')) hideModal();
}
document.addEventListener('keydown', e => { if(e.key==='Escape') hideModal(); });

/* ─── CARDS ─────────────────────────────────── */
function getFiltered(){
  let list=COMPOSERS;
  if(eraFilter!=='all') list=list.filter(c=>c.era===eraFilter);
  if(originFilter!=='all') list=list.filter(c=>c.origin===originFilter);
  if(favOnly) list=list.filter(c=>isFavComposer(c.id)||c.works.some((w,wi)=>isFavWork(c.id,wi)));
  if(searchQ){
    const q=searchQ.toLowerCase();
    list=list.filter(c=>
      (c.name.ru||'').toLowerCase().includes(q)||
      (c.name.en||'').toLowerCase().includes(q)||
      c.works.some(w=>(w.name.ru||'').toLowerCase().includes(q)||(w.name.en||'').toLowerCase().includes(q))
    );
  }
  return list;
}

function renderCards(){
  const list=getFiltered();
  const grid=document.getElementById('compCards');
  if(!list.length){
    grid.innerHTML=`<div class="no-results">${lang==='ru'?'Ничего не найдено':'No results found'}</div>`;
    return;
  }
  grid.innerHTML=list.map(c=>{
    const eraLabel=(ERA_LABELS[c.era]||{})[lang];
    const isExp=expandedId===c.id;
    const worksHtml=c.works.map((w,wi)=>{
      const ymUrl=YM[w.name.en]||'';
      const vkUrl=VK[w.name.en]||'';
      const mrUrl=`https://my.mail.ru/music/search/${encodeURIComponent(w.name.en)}`;
      const vkBtn=vkUrl?`<a href="${vkUrl}" target="_blank" rel="noopener" class="vk-link-sm" onclick="event.stopPropagation()">♪ ВК Музыка</a>`:'';
      const mrBtn=`<a href="${mrUrl}" target="_blank" rel="noopener" class="mr-link-sm" onclick="event.stopPropagation()">🎵 Mail.ru</a>`;
      const ymBtn=ymUrl?`<a href="${ymUrl}" target="_blank" rel="noopener" class="ym-link" onclick="event.stopPropagation()">🎵 ${lang==='ru'?'Яндекс Музыка':'Yandex Music'}</a>`:'';
      const isFavW=isFavWork(c.id,wi);
      const favWorkBtn=`<button class="fav-star-work${isFavW?' active':''}" onclick="event.stopPropagation();toggleFavWork('${c.id}',${wi})" title="${lang==='ru'?'В избранное':'Add to favorites'}">${isFavW?'★':'☆'}</button>`;
      const links=`<div class="work-links">${vkBtn}${mrBtn}${ymBtn}${favWorkBtn}</div>`;
      return `<div class="work" onclick="showWorkModal('${c.id}',${wi},event)">
        <div class="work-name">${w.name[lang]||w.name.ru}</div>
        <div class="work-meta">${w.year} · ${w.genre[lang]||w.genre.ru}</div>
        ${w.desc?`<div class="work-desc">${w.desc[lang]||w.desc.ru}</div>`:''}
        ${links}
        <div class="work-hint">${lang==='ru'?'Подробнее →':'Details →'}</div>
      </div>`;
    }).join('');
    const isFavC=isFavComposer(c.id);
    return `<div class="ccard era-${c.era}${isExp?' expanded':''}" id="ccard-${c.id}" onclick="toggleCard('${c.id}')">
      <div class="comp-row">
        <div class="avatar" style="background:${c.color}">${c.ini}</div>
        <div>
          <div class="comp-name">${c.name[lang]||c.name.ru}</div>
          <div class="comp-meta">${c.birth}–${c.death} · ${c.country[lang]||c.country.ru}</div>
        </div>
        <button class="fav-star${isFavC?' active':''}" onclick="event.stopPropagation();toggleFavComposer('${c.id}')" title="${lang==='ru'?'В избранное':'Add to favorites'}">${isFavC?'★':'☆'}</button>
      </div>
      <span class="era-badge">${eraLabel}</span>
      <div class="bio">${c.bio[lang]||c.bio.ru}</div>
      <div class="works-section${isExp?' open':''}">
        <div class="works-title">${lang==='ru'?'Основные произведения':'Key Works'}</div>
        ${worksHtml}
      </div>
      <div class="expand-btn">${isExp?(lang==='ru'?'▲ Скрыть':'▲ Hide'):(lang==='ru'?'▼ Произведения':'▼ Works')}</div>
    </div>`;
  }).join('');
}

function recordRecent(module,type,id,data){
  try{
    let arr=JSON.parse(localStorage.getItem('musicapp_recent')||'[]');
    if(!Array.isArray(arr))arr=[];
    arr=arr.filter(e=>!(e.module===module&&e.type===type&&e.id===id));
    arr.unshift(Object.assign({module,type,id,ts:Date.now()},data));
    if(arr.length>20)arr=arr.slice(0,20);
    localStorage.setItem('musicapp_recent',JSON.stringify(arr));
  }catch(e){}
}
function toggleCard(id){
  expandedId=expandedId===id?null:id;
  if(expandedId===id){
    const c=COMPOSERS.find(x=>x.id===id);
    if(c)recordRecent('ml','composer',id,{labelRu:c.name.ru,labelEn:c.name.en,subRu:c.country.ru,subEn:c.country.en,icon:'🎭',link:'муз-литература/index.html#composer-'+id});
  }
  renderCards();
}

/* ─── TIMELINE ──────────────────────────────── */
const ERA_ORDER=['medieval','renaissance','baroque','classicism','romanticism','modern'];
const ERA_DESC={
  medieval:{ru:'Одноголосное церковное пение постепенно уступает место первым опытам многоголосия.',
    en:'Monophonic chant gradually gives way to the earliest experiments in polyphony.'},
  renaissance:{ru:'Расцвет многоголосия a cappella и имитационной полифонии — выросло из средневекового church-письма.',
    en:'The flowering of a cappella polyphony and imitative counterpoint — grown out of medieval church music.'},
  baroque:{ru:'Контраст, орнаментика и basso continuo пришли как реакция на строгую полифонию Возрождения.',
    en:'Contrast, ornamentation and basso continuo emerged as a reaction to Renaissance polyphonic strictness.'},
  classicism:{ru:'Ясность, симметрия и сонатная форма сложились как противовес пышной сложности барокко.',
    en:'Clarity, symmetry and sonata form emerged as a counterweight to Baroque complexity.'},
  romanticism:{ru:'Личное чувство, расширенная гармония и масштаб — романтики довели классические формы до эмоциональной крайности.',
    en:'Personal feeling, expanded harmony and scale — Romantics pushed Classical forms to emotional extremes.'},
  modern:{ru:'Поиск новых языков — от импрессионизма до додекафонии — стал ответом на исчерпание романтической гармонии.',
    en:'A search for new musical languages — from impressionism to serialism — answered the exhaustion of Romantic harmony.'},
};
function eraRange(era){
  const list=COMPOSERS.filter(c=>c.era===era);
  if(!list.length)return '';
  return Math.min(...list.map(c=>c.birth))+'–'+Math.max(...list.map(c=>c.death));
}
function jumpToComposerCard(id){
  showTab(0);
  expandedId=id;
  renderCards();
  setTimeout(()=>{
    const el=document.getElementById('ccard-'+id);
    if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'center'});
  },60);
}
function scrollToEra(era){
  const el=document.getElementById('era-'+era);
  if(el&&el.scrollIntoView)el.scrollIntoView({behavior:'smooth',block:'start'});
}
function renderTimeline(){
  const strip=ERA_ORDER.map(era=>
    `<button class="era-chip" style="border-color:${ERA_COLORS[era]}" onclick="scrollToEra('${era}')">
      ${(ERA_LABELS[era]||{})[lang]}<span class="ec-range">${eraRange(era)}</span>
    </button>`
  ).join('');

  const sections=ERA_ORDER.map(era=>{
    const list=COMPOSERS.filter(c=>c.era===era).sort((a,b)=>a.birth-b.birth);
    if(!list.length)return '';
    const desc=(ERA_DESC[era]||{})[lang]||'';
    const items=list.map(c=>
      `<div class="tl-item" onclick="jumpToComposerCard('${c.id}')">
        <div class="tl-dot" style="background:${ERA_COLORS[c.era]}"></div>
        <div class="tl-year">${c.birth}–${c.death}</div>
        <div class="tl-name">${c.name[lang]||c.name.ru}<span class="tl-arrow">${lang==='ru'?'Подробнее →':'Details →'}</span></div>
        <div class="tl-info">${c.country[lang]||c.country.ru} · ${(ERA_LABELS[c.era]||{})[lang]}</div>
      </div>`
    ).join('');
    return `<div class="era-section" id="era-${era}">
      <div class="era-head">
        <span class="era-head-dot" style="background:${ERA_COLORS[era]}"></span>
        <span class="era-head-title">${(ERA_LABELS[era]||{})[lang]}</span>
        <span class="era-head-range">${eraRange(era)}</span>
      </div>
      <div class="era-desc">${desc}</div>
      <div class="tl-track"><div class="tl-line"></div>${items}</div>
    </div>`;
  }).join('');

  const tl=document.getElementById('timeline');
  tl.innerHTML=`<div class="era-strip">${strip}</div>${sections}`;
}

/* ─── QUIZ (adaptive: composers missed more often come up more often) ─── */
const QSTATS_KEY='musicapp_ml_quiz_stats';
let qStats={};
try{qStats=JSON.parse(localStorage.getItem(QSTATS_KEY)||'{}');}catch(e){qStats={};}
function saveQStats(){localStorage.setItem(QSTATS_KEY,JSON.stringify(qStats));}
function pickWeightedComposer(){
  const weights=COMPOSERS.map(c=>{
    const s=qStats[c.id]||{wrong:0,right:0};
    return 1+s.wrong*2; // missed composers are up to several times more likely
  });
  const total=weights.reduce((a,b)=>a+b,0);
  let r=Math.random()*total;
  for(let i=0;i<COMPOSERS.length;i++){
    r-=weights[i];
    if(r<=0)return COMPOSERS[i];
  }
  return COMPOSERS[COMPOSERS.length-1];
}
function nextQuiz(){
  document.getElementById('quizNext').classList.remove('show');
  const types=['work_to_comp','comp_to_work','birth_year'];
  const type=types[Math.floor(Math.random()*types.length)];
  const c=pickWeightedComposer();
  quizCorrect=null;
  quizCurrentComposer=c.id;
  let qText='',qSub='',correct='',wrongPool=[];

  if(type==='work_to_comp'){
    const wi=Math.floor(Math.random()*c.works.length);
    const work=c.works[wi];
    qText=lang==='ru'?'Чьё это произведение?':'Who composed this work?';
    qSub=work.name[lang]||work.name.ru;
    correct=c.name[lang]||c.name.ru;
    wrongPool=COMPOSERS.filter(x=>x.id!==c.id).map(x=>x.name[lang]||x.name.ru);
  } else if(type==='comp_to_work'){
    qText=(lang==='ru'?'Какое произведение написал ':'Which work was composed by ')
      +(c.name[lang]||c.name.ru)+'?';
    qSub='';
    const wi=Math.floor(Math.random()*c.works.length);
    correct=c.works[wi].name[lang]||c.works[wi].name.ru;
    wrongPool=COMPOSERS.filter(x=>x.id!==c.id).flatMap(x=>
      x.works.map(w=>w.name[lang]||w.name.ru)
    ).filter(n=>n!==correct);
  } else {
    qText=(lang==='ru'?'Год рождения ':'Birth year of ')
      +(c.name[lang]||c.name.ru)+'?';
    qSub='';
    correct=String(c.birth);
    wrongPool=COMPOSERS.filter(x=>x.id!==c.id).map(x=>String(x.birth));
  }

  quizCorrect=correct;
  document.getElementById('quizQ').textContent=qText;
  document.getElementById('quizSub').textContent=qSub;

  const wrongs=[...new Set(wrongPool)].sort(()=>Math.random()-.5).slice(0,3);
  const choices=[correct,...wrongs].sort(()=>Math.random()-.5);
  document.getElementById('quizChoices').innerHTML=choices.map(ch=>
    `<button class="qc" onclick="answerQuiz(this,'${esc(ch)}','${esc(correct)}')">${ch}</button>`
  ).join('');
}

function esc(s){return s.replace(/'/g,"\\'").replace(/"/g,'&quot;')}

function answerQuiz(btn,chosen,correct){
  document.querySelectorAll('#quizChoices .qc').forEach(b=>{
    b.disabled=true;
    if(b.textContent===correct)b.classList.add('correct');
    else if(b===btn&&chosen!==correct)b.classList.add('wrong');
  });
  if(chosen===correct){quizScore.c++;}else{quizScore.w++;}
  if(quizCurrentComposer){
    const s=qStats[quizCurrentComposer]||{wrong:0,right:0};
    if(chosen===correct){s.right++;s.wrong=Math.max(0,s.wrong-1);}
    else{s.wrong++;}
    qStats[quizCurrentComposer]=s;
    saveQStats();
  }
  document.getElementById('qsc').textContent=quizScore.c;
  document.getElementById('qsw').textContent=quizScore.w;
  document.getElementById('quizNext').classList.add('show');
  if(chosen===correct)setTimeout(nextQuiz,1500);
}

</script><script>
/* Клавиатурная доступность: элементы с onclick (не <button>/<a>/полям форм)
   становятся фокусируемыми и активируются Enter/Space — включая те,
   что добавляются в DOM динамически (пианино, варианты викторин и т.п.). */
(function(){
  function tagEl(el){
    if(!el || !el.hasAttribute || !el.hasAttribute('onclick')) return;
    var tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL') return;
    if(el.hasAttribute('data-a11y-kb')) return;
    el.setAttribute('data-a11y-kb','1');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  }
  function scan(root){
    if(!root||!root.querySelectorAll) return;
    tagEl(root);
    root.querySelectorAll('[onclick]').forEach(tagEl);
  }
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
    var el=document.activeElement;
    if(el && el.getAttribute && el.hasAttribute('onclick') && el.getAttribute('role')==='button'){
      e.preventDefault();
      el.click();
    }
  });
  if(document.body) scan(document.body);
  else document.addEventListener('DOMContentLoaded', function(){ scan(document.body); });
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){ if(n.nodeType===1) scan(n); });
    });
  });
  if(document.body) mo.observe(document.body,{childList:true,subtree:true});
  else document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); });
})();
</script>
