<title>Группировка длительностей</title>
<meta name="theme-color" content="#1c3a8e">
<script>(function(){var t=localStorage.getItem('musicapp_theme');var dark=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',dark?'dark':'light');})()</script>
<style>
/* Отключаем системный жест pull-to-refresh (стрелка/спиннер при потягивании вниз) — приложение уже показывает свой интерфейс, обновление страницы через этот жест не нужно и мешает свайпам внутри модулей. */
html,body{overscroll-behavior-y:contain;}

  :root {
    --color-bg-primary:#f8fafc; --color-bg-secondary:#ffffff; --color-bg-card:#ffffff;
    --color-bg-dark-element:#0f172a;
    --color-text-primary:#0f172a; --color-text-secondary:#475569; --color-text-muted:#94a3b8;
    --color-border:#e2e8f0; --color-border-light:#f1f5f9;
    --color-blue-600:#2563eb; --color-blue-700:#1d4ed8;
    --color-slate-50:#f8fafc; --color-slate-100:#f1f5f9; --color-slate-200:#e2e8f0;
    --color-slate-300:#cbd5e1; --color-slate-400:#94a3b8; --color-slate-500:#64748b;
    --color-slate-600:#475569; --color-slate-700:#334155; --color-slate-800:#1e293b; --color-slate-900:#0f172a;
    --color-red-500:#ef4444; --color-emerald-500:#10b981; --color-amber-500:#f59e0b;
    --shadow-sm:0 1px 3px rgba(0,0,0,.04); --shadow-md:0 10px 15px rgba(0,0,0,.05); --shadow-lg:0 20px 25px rgba(0,0,0,.15);
  }
  [data-theme="dark"] {
    --color-bg-primary:#0f172a; --color-bg-secondary:#1e293b; --color-bg-card:#1e293b;
    --color-bg-dark-element:#000000;
    --color-text-primary:#f1f5f9; --color-text-secondary:#94a3b8; --color-text-muted:#64748b;
    --color-border:#334155; --color-border-light:#1e293b;
    --color-blue-600:#3b82f6; --color-blue-700:#2563eb;
    --color-slate-50:#1e293b; --color-slate-100:#334155; --color-slate-200:#334155;
    --color-slate-300:#475569; --color-slate-400:#64748b; --color-slate-500:#94a3b8;
    --color-slate-600:#cbd5e1; --color-slate-700:#e2e8f0; --color-slate-800:#475569; --color-slate-900:#f1f5f9;
    --shadow-sm:0 1px 3px rgba(0,0,0,.3); --shadow-md:0 10px 15px rgba(0,0,0,.3); --shadow-lg:0 20px 25px rgba(0,0,0,.4);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--color-bg-primary);color:var(--color-text-primary);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;transition:background .3s,color .3s;user-select:none;}
  .container{max-width:800px;margin:0 auto;padding:12px;}

  /* HEADER */
  .header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:16px;margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .header-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:-.5px;}
  .header-actions{display:flex;gap:8px;}
  .icon-btn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:var(--color-slate-100);border:none;border-radius:12px;font-weight:700;font-size:10px;text-transform:uppercase;cursor:pointer;color:var(--color-text-primary);transition:background .2s;}
  .icon-btn:hover{background:var(--color-slate-200);}

  /* TABS */
  .tabs{display:flex;background:var(--color-bg-card);padding:4px;border-radius:12px;border:1px solid var(--color-border);margin-bottom:16px;box-shadow:var(--shadow-sm);}
  .tab{flex:1;padding:12px;border:none;background:none;border-radius:8px;font-size:10px;font-weight:900;text-transform:uppercase;color:var(--color-text-muted);cursor:pointer;transition:all .2s;}
  .tab.active{background:var(--color-blue-600);color:white;box-shadow:0 4px 6px rgba(37,99,235,.2);}

  /* SELECTORS */
  .selector-row{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin-bottom:16px;}
  .sel-btn{padding:6px 20px;border:1px solid var(--color-border-light);border-radius:8px;background:var(--color-bg-card);color:var(--color-text-muted);font-size:10px;font-weight:900;text-transform:uppercase;cursor:pointer;transition:all .2s;}
  .sel-btn.active{background:var(--color-slate-900);color:var(--color-bg-primary);box-shadow:0 2px 4px rgba(0,0,0,.1);}
  [data-theme="dark"] .sel-btn.active{background:var(--color-blue-600);color:white;}

  /* RULE CARD */
  .rule-card{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:16px;padding:14px 18px;margin-bottom:16px;box-shadow:var(--shadow-sm);display:flex;gap:12px;align-items:flex-start;}
  .rule-icon{font-size:20px;flex-shrink:0;margin-top:1px;}
  .rule-title{font-size:9px;font-weight:900;text-transform:uppercase;color:var(--color-blue-600);letter-spacing:.5px;margin-bottom:4px;}
  .rule-text{font-size:13px;color:var(--color-text-secondary);line-height:1.5;}
  .rule-text b{color:var(--color-text-primary);}

  /* MAIN EXERCISE BOX */
  .ex-box{background:var(--color-bg-card);border-radius:32px;border:1px solid var(--color-border);padding:24px;box-shadow:var(--shadow-sm);margin-bottom:16px;}

  /* DARK DISPLAY */
  .note-display{background:var(--color-bg-dark-element);border-radius:24px;padding:32px 24px;min-height:140px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;margin-bottom:20px;position:relative;overflow:hidden;}

  /* NOTE ROW */
  .note-row{display:flex;align-items:flex-end;gap:0;position:relative;}
  .note-cell{display:flex;flex-direction:column;align-items:center;position:relative;cursor:default;}
  .note-svg-wrap{position:relative;width:48px;height:90px;flex-shrink:0;}

  /* DIVIDER (clickable beam toggle) */
  .divider{width:24px;height:90px;display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;flex-shrink:0;z-index:10;}
  .divider-line{width:3px;height:50px;background:rgba(255,255,255,.15);border-radius:2px;transition:all .2s;}
  .divider:hover .divider-line{background:rgba(255,255,255,.4);}
  .divider.beamed .divider-line{background:transparent;}

  /* BEAT RULER */
  .beat-ruler{display:flex;width:100%;justify-content:center;gap:0;margin-top:-4px;}
  .beat-cell{display:flex;align-items:center;justify-content:center;font-size:10px;font-weight:900;color:rgba(255,255,255,.35);text-transform:uppercase;letter-spacing:.5px;transition:color .2s;}
  .beat-cell.active-beat{color:var(--color-blue-600);}

  /* FEEDBACK OVERLAY */
  .note-cell .check-ok{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--color-emerald-500);display:none;}
  .note-cell .check-err{position:absolute;bottom:-6px;left:50%;transform:translateX(-50%);width:8px;height:8px;border-radius:50%;background:var(--color-red-500);display:none;}

  /* BEAM VISUAL - drawn as SVG overlay */
  .beam-canvas{position:absolute;top:0;left:0;width:100%;height:90px;pointer-events:none;}

  /* ACTIONS */
  .actions{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;}
  .action-btn{padding:16px;border:none;border-radius:12px;font-size:10px;font-weight:900;text-transform:uppercase;display:flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;transition:all .2s;box-shadow:0 4px 6px rgba(0,0,0,.1);}
  .action-btn:active{transform:scale(.95);}
  .action-btn.primary{background:var(--color-blue-600);color:white;}
  .action-btn.primary:hover{background:var(--color-blue-700);}
  .action-btn.secondary{background:var(--color-bg-card);color:var(--color-text-secondary);border:1px solid var(--color-border);}
  .action-btn.secondary:hover{background:var(--color-slate-50);}
  .action-btn.success{background:var(--color-emerald-500);color:white;}
  .action-btn.danger{background:var(--color-red-500);color:white;}
  .action-btn.dark{background:#1e293b;color:white;}
  [data-theme="dark"] .action-btn.dark{background:#334155;}
  .action-btn:disabled{opacity:.4;cursor:not-allowed;transform:none;}

  /* ERROR EXPLANATION */
  .error-box{background:rgba(239,68,68,.08);border:1px solid rgba(239,68,68,.3);border-radius:16px;padding:14px 18px;margin-bottom:16px;display:none;}
  .error-box.show{display:block;}
  .error-title{font-size:9px;font-weight:900;text-transform:uppercase;color:var(--color-red-500);letter-spacing:.5px;margin-bottom:4px;}
  .error-text{font-size:13px;color:var(--color-text-secondary);line-height:1.5;}
  .success-box{background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3);border-radius:16px;padding:14px 18px;margin-bottom:16px;display:none;}
  .success-box.show{display:block;}
  .success-title{font-size:9px;font-weight:900;text-transform:uppercase;color:var(--color-emerald-500);letter-spacing:.5px;margin-bottom:4px;}
  .success-text{font-size:13px;color:var(--color-text-secondary);}

  /* SCORE */
  .score-row{display:flex;gap:12px;margin-bottom:16px;}
  .score-pill{flex:1;background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:12px;padding:12px;text-align:center;box-shadow:var(--shadow-sm);}
  .score-val{font-size:24px;font-weight:900;line-height:1;}
  .score-val.green{color:var(--color-emerald-500);}
  .score-val.red{color:var(--color-red-500);}
  .score-label{font-size:9px;font-weight:900;text-transform:uppercase;color:var(--color-text-muted);margin-top:2px;}

  /* RULES TAB */
  .rules-grid{display:flex;flex-direction:column;gap:12px;}
  .rule-big-card{background:var(--color-bg-card);border:1px solid var(--color-border);border-radius:16px;padding:18px;box-shadow:var(--shadow-sm);}
  .rule-big-title{font-size:13px;font-weight:900;text-transform:uppercase;color:var(--color-text-primary);margin-bottom:8px;display:flex;align-items:center;gap:8px;}
  .rule-sig{display:inline-block;background:var(--color-blue-600);color:white;border-radius:6px;padding:2px 8px;font-size:11px;font-weight:900;}
  .rule-big-text{font-size:13px;color:var(--color-text-secondary);line-height:1.6;}
  .rule-big-text code{background:var(--color-slate-100);color:var(--color-blue-600);padding:1px 5px;border-radius:4px;font-size:12px;font-weight:700;}
  [data-theme="dark"] .rule-big-text code{background:var(--color-slate-700);}
  .rule-example{background:var(--color-bg-dark-element);border-radius:12px;padding:16px;margin-top:12px;overflow-x:auto;-webkit-overflow-scrolling:touch;}

  /* FIND ERROR MODE */
  .find-tag{display:inline-block;background:rgba(245,158,11,.15);color:var(--color-amber-500);border-radius:6px;padding:2px 8px;font-size:10px;font-weight:900;text-transform:uppercase;margin-bottom:12px;}

  .hidden{display:none;}

  /* Progress bar */
  .ex-progress{display:flex;gap:4px;margin-bottom:16px;}
  .ex-dot{flex:1;height:4px;border-radius:2px;background:var(--color-border);transition:background .3s;}
  .ex-dot.done{background:var(--color-emerald-500);}
  .ex-dot.wrong{background:var(--color-red-500);}
  .ex-dot.current{background:var(--color-blue-600);}

  /* NOTE DISPLAY scroll wrapper */
  .note-outer{width:100%;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:6px;}
  .note-outer::-webkit-scrollbar{height:4px;}
  .note-outer::-webkit-scrollbar-thumb{background:rgba(255,255,255,.2);border-radius:2px;}

  @media(max-width:640px){
    .header{flex-wrap:wrap;gap:8px;padding:10px 12px;}
    .header-actions{gap:4px;}
    .icon-btn{padding:7px 9px;font-size:9px;}
    .container{padding:8px;}
    .sel-row{flex-wrap:wrap;gap:4px;}
    .sel-btn{padding:6px 12px;font-size:9px;}
    .ex-box{padding:16px 12px;border-radius:20px;}
    .note-display{padding:20px 12px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;justify-content:flex-start;align-items:flex-start;}
    .actions{grid-template-columns:1fr 1fr;gap:8px;}
    .actions .action-btn:last-child:nth-child(3){grid-column:1/-1;}
    .action-btn{padding:12px;font-size:9px;}
    .score-row{flex-wrap:wrap;}
    .score-pill{min-width:calc(50% - 6px);}
  }
  /* Ритм хлопками */
  .clap-tempo{display:flex;align-items:center;gap:10px;margin:0 0 14px;font-size:10px;font-weight:900;text-transform:uppercase;color:var(--color-text-muted);}
  .clap-tempo input{flex:1;}
  #clapTempoVal{min-width:34px;text-align:right;color:var(--color-text-primary);}
  .clap-pad{width:100%;min-height:130px;border-radius:24px;border:2px dashed var(--color-border);background:var(--color-bg-primary);color:var(--color-text-muted);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:800;cursor:pointer;margin-bottom:12px;
    touch-action:manipulation;user-select:none;-webkit-user-select:none;transition:transform .06s,background .1s;}
  .clap-pad .clap-ico{font-size:40px;line-height:1;}
  .clap-pad.hit{transform:scale(.97);background:rgba(37,99,235,.12);border-color:var(--color-blue-600);}
  .clap-pad.live{border-style:solid;border-color:var(--color-blue-600);}
  .clap-status{text-align:center;font-size:13px;font-weight:800;min-height:20px;margin-bottom:12px;color:var(--color-text-secondary);}
  .clap-status.ok{color:#10b981;} .clap-status.err{color:#ef4444;}
  .clap-mic{display:flex;align-items:center;justify-content:center;gap:8px;margin-top:12px;font-size:11px;font-weight:700;color:var(--color-text-muted);cursor:pointer;}
  #clapDisplay .divider{pointer-events:none;}
  @keyframes musicappShake{
    10%,90%{transform:translateX(-1px);}
    20%,80%{transform:translateX(2px);}
    30%,50%,70%{transform:translateX(-4px);}
    40%,60%{transform:translateX(4px);}
  }
  .musicapp-shake{animation:musicappShake .4s;}

@keyframes musicappStreakIn{from{transform:translate(-50%,20px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
@keyframes musicappStreakOut{from{opacity:1;}to{opacity:0;}}
.musicapp-streak-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:#111827;color:#fff;padding:10px 18px;border-radius:14px;
  font-size:13px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);
  z-index:9999;animation:musicappStreakIn .25s ease-out;pointer-events:none;white-space:nowrap;}
[data-theme="dark"] .musicapp-streak-toast{background:#f1f5f9;color:#0f172a;}

  @media(max-width:400px){
    .header-title{font-size:12px;}
    .score-val{font-size:20px;}
    .rule-card{padding:12px;}
    .rule-text{font-size:12px;}
  }
</style>
<script src="../hw.js"></script>
<script src="../audio-in.js"></script>
</head>

<div class="container">
<a href="../index.html" id="backHomeLink" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;text-decoration:none;opacity:.65;padding:5px 11px;border:1px solid rgba(128,128,128,.25);border-radius:10px;margin-bottom:8px;color:inherit;">← Главная</a>

  <div class="header">
    <div class="header-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
        <path d="M9 18V5l12-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="18" cy="16" r="3"/>
      </svg>
      <span id="appTitle">Группировка длительностей</span>
    </div>
    <div class="header-actions">
      <button class="icon-btn" id="soundBtn" title="Звук"><span id="soundIco">🔊</span></button>
      <button class="icon-btn" onclick="toggleTheme()">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" id="themeIcon">

          <path d="m5 8 6 6"/><path d="m4 14 6-6 2-3"/><path d="M2 5h12"/><path d="M7 2h1"/>
          <path d="m22 22-5-10-5 10"/><path d="M14 18h6"/>
        </svg>
        <span id="langText">RU</span>
      </button>

  </div>

  <div class="tabs">

  <!-- TIME SIG + DIFFICULTY -->

    <button class="sel-btn active" data-diff="1" onclick="setDiff(1)">Лёгкий</button>

  <!-- MAIN CONTENT -->
  <div id="mainContent"></div>

  <!-- CLAP TAB CONTENT (ритм хлопками: микрофон или касания экрана) -->
  <div id="clapContent" class="hidden">
    <div class="rule-card">
      <div class="rule-icon">👏</div>
      <div>
        <div class="rule-title" id="clapTitle">Прохлопай ритм</div>
        <div class="rule-text" id="clapInfo"></div>
      </div>
    </div>
    <div class="ex-box">
      <div class="note-display" id="clapDisplay"></div>
      <div class="clap-tempo">
        <span id="clapTempoLbl">Темп</span>
        <input type="range" id="clapTempo" min="40" max="120" step="5" value="70">
        <span id="clapTempoVal">70</span>
      </div>
      <button class="clap-pad" id="clapPad" type="button"><span class="clap-ico">👏</span><span id="clapPadTxt">Хлопай здесь или в ладоши</span></button>
      <div class="clap-status" id="clapStatus"></div>
      <div class="actions">
        <button class="action-btn secondary" id="clapListenBtn" onclick="clapListen()">🔊 <span id="clapListenTxt">Прослушать</span></button>
        <button class="action-btn primary" id="clapStartBtn" onclick="clapStart()">▶ <span id="clapStartTxt">Старт</span></button>

function playAnswerSound(ok){
  if(!musicappSoundOn())return;
  const ctx=_fbAudioCtx();
  if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume();
  const now=ctx.currentTime;
  if(ok){
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      const t=now+i*0.07;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.18,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      o.start(t);o.stop(t+0.36);
    });
  }else{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(220,now);o.frequency.exponentialRampToValueAtTime(140,now+0.18);

  }
}

// Remove the bad exercise (index 4 replacement)
// Let me filter valid exercises only
function validateExercise(ex) {
  const total = ex.notes.reduce((s, n) => s + DUR_VAL[n], 0);
  const expected = beatsPerBar(ex.ts) * beatLen(ex.ts);
  return Math.abs(total - expected) < 0.001;
}

const VALID_EXERCISES = EXERCISES_DATA.filter(validateExercise);

// ── COMPUTE CORRECT GROUPING ───────────────────────────────────
// Returns array of booleans: correctBeam[i] = should notes[i] and [i+1] be beamed?
function computeCorrectBeams(notes, ts) {
  const bl = beatLen(ts);
  const result = [];
  let pos = 0;
  for (let i = 0; i < notes.length - 1; i++) {
    const durA = notes[i], durB = notes[i + 1];
    const valA = DUR_VAL[durA];
    const beatOfA = pos / bl;
    const beatOfB = (pos + valA) / bl;
    // Both must be beamable, and they must be in the same beat
    const sameBeam = DUR_BEAM.includes(durA) && DUR_BEAM.includes(durB) &&
                     Math.floor(beatOfA + 0.001) === Math.floor(beatOfB + 0.001);
    result.push(sameBeam);
    pos += valA;
  }
  return result;
}

// ── NOTE SVG ──────────────────────────────────────────────────
// Draws a single note as SVG (48×90px)
// beamedLeft, beamedRight: whether this note is connected to prev/next
function noteSVG(dur, color, beamedLeft, beamedRight, state) {
  // state: '' | 'correct' | 'wrong' | 'missing'
  let fill, stroke;
  if (state === 'correct') { fill = '#10b981'; stroke = '#10b981'; }
  else if (state === 'wrong') { fill = '#ef4444'; stroke = '#ef4444'; }
  else if (state === 'missing') { fill = '#f59e0b'; stroke = '#f59e0b'; }
  else { fill = color; stroke = color; }

  const cx = 24, cy = 68, rx = 9, ry = 6.5;
  const stemX = cx + 8, stemTop = 25, stemBot = cy;

  let s = `<svg viewBox="0 0 48 90" xmlns="http://www.w3.org/2000/svg">`;
  // Note head
  if (dur === 'h' || dur === 'w') {
    s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="none" stroke="${fill}" stroke-width="2" transform="rotate(-18,${cx},${cy})"/>`;
  } else {
    s += `<ellipse cx="${cx}" cy="${cy}" rx="${rx}" ry="${ry}" fill="${fill}" stroke="${fill}" stroke-width="1" transform="rotate(-18,${cx},${cy})"/>`;
  }
  // Stem (not for whole)
  if (dur !== 'w') {
    s += `<line x1="${stemX}" y1="${cy-2}" x2="${stemX}" y2="${stemTop}" stroke="${fill}" stroke-width="2"/>`;
  }
  // Flag (only if not beamed on right side, and eighth or sixteenth)
  if (dur === 'e' && !beamedRight && !beamedLeft) {
    s += `<path d="M${stemX} ${stemTop} Q${stemX+14} ${stemTop+10} ${stemX+10} ${stemTop+22}" fill="none" stroke="${fill}" stroke-width="2"/>`;
  }
  if (dur === 's' && !beamedRight && !beamedLeft) {
    s += `<path d="M${stemX} ${stemTop} Q${stemX+14} ${stemTop+8} ${stemX+10} ${stemTop+18}" fill="none" stroke="${fill}" stroke-width="2"/>`;
    s += `<path d="M${stemX} ${stemTop+10} Q${stemX+14} ${stemTop+18} ${stemX+10} ${stemTop+28}" fill="none" stroke="${fill}" stroke-width="2"/>`;
  }
  if (dur === 's' && (beamedRight || beamedLeft)) {
    // Second beam line handled by beam drawing
  }
  s += `</svg>`;
  return s;
}

// Notes are always on a dark background, so always use a light color
function noteColor() { return '#e2e8f0'; }

// ── RENDER EXERCISE ────────────────────────────────────────────
function getExercises() {
  return VALID_EXERCISES.filter(e => e.ts === timeSig && e.diff === difficulty);
}

let exIdx = 0;
function renderExercise() {
  const pool = getExercises();
  if (!pool.length) {
    document.getElementById('mainContent').innerHTML = `
      <div style="text-align:center;padding:60px 0;color:var(--color-text-muted);font-size:13px;font-weight:700;text-transform:uppercase;">
        Нет упражнений для выбранных параметров
      </div>`;
    return;
  }
  exIdx = exIdx % pool.length;
  currentEx = pool[exIdx];
  const correctBeams = computeCorrectBeams(currentEx.notes, currentEx.ts);

  if (currentTab === 'find') {
    // Pre-fill beams with one intentional error for Find Error mode
    beamState = introduceError(correctBeams, currentEx.notes, currentEx.ts);
  } else {
    beamState = correctBeams.map(() => false); // start: nothing beamed
  }

  checked = false;
  hintShown = false;

  renderExerciseUI(currentEx, beamState, null);
  setTimeout(drawBeams, 0);
}

function nextExercise() {
  const pool = getExercises();
  exIdx = (exIdx + 1) % pool.length;
  renderExercise();
}

function renderExerciseUI(ex, bState, checkResult) {
  const isFind = currentTab === 'find';
  const notes = ex.notes;
  const correctBeams = computeCorrectBeams(notes, ex.ts);

  // Use beamState as-is (error was already introduced in renderExercise)
  let displayBeams = [...bState];

  const nc = noteColor();
  const bl = beatLen(ex.ts);
  const bpb = beatsPerBar(ex.ts);

  // Build the beat positions for ruler
  // Compute which inter-note positions are beat boundaries
  let pos = 0;
  const beatBoundaries = new Set();
  for (let i = 0; i < notes.length - 1; i++) {
    pos += DUR_VAL[notes[i]];
    if (Math.abs(pos % bl) < 0.001 || Math.abs(pos % bl - bl) < 0.001) {
      beatBoundaries.add(i);
    }
  }

  // Build HTML
  let html = '';

  // Instruction card (replaces rule card)
  html += `<div class="rule-card">
    <div class="rule-icon">💡</div>
    <div>
      <div class="rule-title">${T('rule')} · ${ex.ts}</div>
      <div class="rule-text">${T('instruction', ex.ts)}</div>
      <div class="rule-text" style="margin-top:6px;color:var(--color-text-muted);font-size:12px;">${getShortRule(ex.ts)}</div>
    </div>
  </div>`;

  if (isFind) {
    html += `<div style="margin-bottom:12px"><span class="find-tag">${T('findTag')}</span></div>`;
  }

  // Error / success boxes
  html += `<div class="error-box" id="errorBox"><div class="error-title">${T('errTitle')}</div><div class="error-text" id="errorText"></div></div>`;
  html += `<div class="success-box" id="successBox"><div class="success-title">${T('okTitle')}</div><div class="success-text" id="successText"></div></div>`;

  // Main exercise box
  html += `<div class="ex-box">`;
  const beamsToShow = hintShown ? computeCorrectBeams(notes, ex.ts) : displayBeams;
  html += `<div class="note-display" id="noteDisplay">`;
  html += buildNoteRow(notes, beamsToShow, correctBeams, checkResult, nc, beatBoundaries, isFind);
  html += `</div>`;

  // Actions (same for both Group and Find Error tabs)
  html += `<div class="actions">
    <button class="action-btn dark" onclick="resetBeams()">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
      ${T('reset')}
    </button>
    <button class="action-btn primary" id="checkBtn" onclick="checkAnswer()" ${checked?'disabled':''}>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg>
      ${T('check')}
    </button>
    <button class="action-btn secondary" onclick="nextExercise()">
      ${T('next')}
    </button>
  </div>`;
  if (!checked && !hintShown) {
    html += `<div style="text-align:center;margin-top:10px;">
      <button class="action-btn secondary" style="margin:auto" onclick="showHintBeams()">
        ${T('hint')}
      </button>
    </div>`;
  }
  if (hintShown && !checked) {
    html += `<div style="text-align:center;margin-top:10px;font-size:12px;color:var(--color-text-muted);">${T('hintMsg')}</div>`;
  }

  html += `</div>`; // ex-box

  document.getElementById('mainContent').innerHTML = html;
}

function getShortRule(ts) {
  const map = {
    '2/4': 'Восьмые группируются <b>по 2</b> — по одной доле.',
    '3/4': 'Восьмые группируются <b>по 2</b> в пределах каждой из 3 долей.',
    '4/4': 'Восьмые группируются <b>по 2</b> на долю. <b>Нельзя ставить ребро через середину такта</b> (между 2-й и 3-й долями).',
    '6/8': 'Восьмые группируются <b>по 3</b> — по одной доле (1 доля = 3 восьмых).',
  };
  return map[ts] || '';
}

// ── BUILD NOTE ROW HTML ────────────────────────────────────────
function buildNoteRow(notes, beams, correctBeams, checkResult, nc, beatBoundaries, isFind, ts) {
  ts = ts || timeSig; // use explicit ts or fall back to global
  let html = `<div style="position:relative;display:flex;align-items:flex-end;" id="noteRowWrap">`;

  for (let i = 0; i < notes.length; i++) {
    const beamedLeft  = i > 0 && beams[i-1];
    const beamedRight = i < notes.length - 1 && beams[i];

    let state = '';
    if (checkResult) {
      state = checkResult[i] || '';
    }

    html += `<div class="note-cell" data-idx="${i}">`;
    html += `<div class="note-svg-wrap" style="width:${noteCellWidth(notes[i])}px">`;
    html += noteSVG(notes[i], nc, beamedLeft, beamedRight, state);
    html += `</div>`;
    html += `</div>`;

    if (i < notes.length - 1) {
      const isBeatBound = beatBoundaries.has(i);
      const isBeamed = beams[i];
      const divClass = isBeamed ? 'divider beamed' : 'divider';
      const canBeam = DUR_BEAM.includes(notes[i]) && DUR_BEAM.includes(notes[i+1]);
      const tooltip = isBeamed ? 'Убрать ребро' : 'Поставить ребро';
      const onclickFn = isFind ? `findErrorClick(${i})` : `toggleBeam(${i})`;
      html += `<div class="${divClass}" data-divider="${i}" title="${tooltip}" onclick="${canBeam ? onclickFn : ''}">
        <div class="divider-line"></div>
      </div>`;
    }
  }

  html += `</div>`;

  // Beam overlay: draw beams as horizontal bars above stems
  html += buildBeamOverlay(notes, beams, nc);

  // Beat ruler
  html += buildBeatRuler(notes, ts, nc);

  return html;
}

function noteCellWidth(dur) {
  if (dur === 'w') return 56;
  if (dur === 'h') return 52;
  return 48;
}

// ── BEAM OVERLAY ───────────────────────────────────────────────
function buildBeamOverlay(notes, beams, nc) {
  // Find consecutive beam groups
  let groups = [];
  let groupStart = -1;

  for (let i = 0; i < beams.length; i++) {
    if (beams[i]) {
      if (groupStart === -1) groupStart = i;
    } else {
      if (groupStart !== -1) {
        groups.push([groupStart, i]); // notes groupStart..i are in one group
        groupStart = -1;
      }
    }
  }
  if (groupStart !== -1) groups.push([groupStart, beams.length]);

  if (!groups.length) return '';

  // We need to draw beams, but since we don't know exact pixel positions yet,
  // we'll use a CSS trick: a gradient line overlaid on the note row
  // Actually we'll use absolute positioned divs using flex offsets

  // Better: draw using a canvas-like SVG after DOM loads
  // For now, use CSS flexbox — beam shown as a CSS border-top on a flex container spanning the notes

  // Alternative approach: use JS to draw after render
  // We'll use an innerHTML injection via setTimeout
  return `<div id="beamOverlayPlaceholder" data-groups='${JSON.stringify(groups)}' data-notes='${JSON.stringify(notes)}'></div>`;
}

// Called after DOM update to draw beam lines
function drawBeams() {
  const placeholder = document.getElementById('beamOverlayPlaceholder');
  if (!placeholder) return;
  const groups = JSON.parse(placeholder.dataset.groups || '[]');
  const wrap = document.getElementById('noteRowWrap');
  if (!wrap || !groups.length) return;

  const wrapRect = wrap.getBoundingClientRect();
  const nc = noteColor();

  groups.forEach(([start, end]) => {
    // Find x positions of note cells
    const cells = wrap.querySelectorAll('.note-cell');
    if (!cells[start] || !cells[end]) return;

    const r1 = cells[start].getBoundingClientRect();
    const r2 = cells[end].getBoundingClientRect();

    const stemOffset = 32; // stemX = cx+8 = 24+8 = 32 in 48px viewBox
    const x1 = r1.left - wrapRect.left + stemOffset;
    const x2 = r2.left - wrapRect.left + stemOffset;
    const y = 27; // stem top position

    const beam = document.createElement('div');
    beam.style.cssText = `
      position:absolute;
      left:${x1}px; top:${y}px;
      width:${x2-x1}px; height:6px;
      background:${nc};
      border-radius:2px;
      pointer-events:none;
    `;
    wrap.style.position = 'relative';
    wrap.appendChild(beam);

    // Second beam: draw only over consecutive sixteenth sub-spans within the group
    const groupNotes = JSON.parse(placeholder.dataset.notes || '[]');
    let sCur = -1;
    for (let k = start; k <= end; k++) {
      const isS = groupNotes[k] === 's';
      if (isS) {
        if (sCur === -1) sCur = k;
      } else {
        if (sCur !== -1 && sCur < k - 1) {
          const rs = cells[sCur].getBoundingClientRect();
          const re = cells[k - 1].getBoundingClientRect();
          const b2 = document.createElement('div');
          b2.style.cssText = `position:absolute;left:${rs.left-wrapRect.left+stemOffset}px;top:${y+8}px;width:${re.left-wrapRect.left+stemOffset-(rs.left-wrapRect.left+stemOffset)}px;height:6px;background:${nc};border-radius:2px;pointer-events:none;`;
          wrap.appendChild(b2);
        }
        sCur = -1;
      }
    }
    if (sCur !== -1 && sCur < end) {
      const rs = cells[sCur].getBoundingClientRect();
      const re = cells[end].getBoundingClientRect();
      const b2 = document.createElement('div');
      b2.style.cssText = `position:absolute;left:${rs.left-wrapRect.left+stemOffset}px;top:${y+8}px;width:${re.left-wrapRect.left+stemOffset-(rs.left-wrapRect.left+stemOffset)}px;height:6px;background:${nc};border-radius:2px;pointer-events:none;`;
      wrap.appendChild(b2);
    }
  });
}

// ── BEAT RULER ─────────────────────────────────────────────────
function buildBeatRuler(notes, ts, nc) {
  const bl = beatLen(ts);
  const is68 = ts === '6/8';

  let html = `<div style="display:flex;align-items:center;margin-top:8px;">`;
  let pos = 0;
  let beatNum = 1;

  for (let i = 0; i < notes.length; i++) {
    const w = noteCellWidth(notes[i]);
    let label = '';

    if (is68) {
      // In 6/8 label at eighth-note positions only (multiples of 0.5), not at sixteenth positions
      if (Math.abs(pos % 0.5) < 0.001) {
        label = (Math.round(pos / 0.5) + 1).toString();
      }
    } else {
      // For x/4 time sigs, label at beat starts only
      if (Math.abs(pos % bl) < 0.001) {
        const beatsSpanned = Math.round(DUR_VAL[notes[i]] / bl);
        if (beatsSpanned > 1) {
          const parts = [];
          for (let b = 0; b < beatsSpanned; b++) parts.push((beatNum + b).toString());
          label = parts.join('·');
          beatNum += beatsSpanned;
        } else {
          label = (beatNum++).toString();
        }
      }
    }

    html += `<div style="width:${w}px;text-align:center;font-size:11px;font-weight:900;` +
      `color:${label ? 'rgba(255,255,255,.7)' : 'transparent'};letter-spacing:.5px;">${label || '·'}</div>`;

    if (i < notes.length - 1) html += `<div style="width:24px;"></div>`;
    pos += DUR_VAL[notes[i]];
  }

  html += `</div>`;
  return html;
}

// ── TOGGLE BEAM ───────────────────────────────────────────────
function toggleBeam(idx) {
  if (checked) return;

  const durA = currentEx.notes[idx];
  const durB = currentEx.notes[idx + 1];
  if (!DUR_BEAM.includes(durA) || !DUR_BEAM.includes(durB)) return;

  beamState[idx] = !beamState[idx];
  renderExerciseUI(currentEx, beamState, null);
  setTimeout(drawBeams, 0);
}

// ── HINT ──────────────────────────────────────────────────────
function showHintBeams() {
  hintShown = true;
  // Update beamState to correct values so clicking Check after hint passes
  beamState = computeCorrectBeams(currentEx.notes, currentEx.ts);
  renderExerciseUI(currentEx, beamState, null);
  setTimeout(drawBeams, 0);
}

// ── RESET ─────────────────────────────────────────────────────
function resetBeams() {
  const correctBeams = computeCorrectBeams(currentEx.notes, currentEx.ts);
  if (currentTab === 'find') {
    beamState = introduceError(correctBeams, currentEx.notes, currentEx.ts);
  } else {
    beamState = correctBeams.map(() => false);
  }
  checked = false;
  hintShown = false;
  renderExerciseUI(currentEx, beamState, null);
  setTimeout(drawBeams, 0);
  document.getElementById('errorBox').classList.remove('show');
  document.getElementById('successBox').classList.remove('show');
}

// ── CHECK ANSWER ──────────────────────────────────────────────
function checkAnswer() {
  if (checked) return;
  checked = true;

  const correctBeams = computeCorrectBeams(currentEx.notes, currentEx.ts);
  scoreTot++;

  // Compare beamState vs correctBeams
  const errors = [];
  const missing = [];

  for (let i = 0; i < correctBeams.length; i++) {
    if (correctBeams[i] && !beamState[i]) missing.push(i);
    if (!correctBeams[i] && beamState[i]) errors.push(i);
  }

  const isCorrect = errors.length === 0 && missing.length === 0;
  answerFeedback(isCorrect, document.getElementById('noteDisplay'));

  if (isCorrect) {
    if (!hintShown) scoreOk++;
    document.getElementById('successBox').classList.add('show');
    document.getElementById('successText').innerHTML = buildSuccessText(currentEx.ts);
    setTimeout(() => nextExercise(), 900);
  } else {
    scoreErr++;
    document.getElementById('errorBox').classList.add('show');
    document.getElementById('errorText').innerHTML = buildErrorText(errors, missing, currentEx.notes, currentEx.ts);
  }

  updateScore();

  // Re-render with color feedback
  const checkResult = buildCheckResult(correctBeams, errors, missing);
  renderExerciseUI(currentEx, beamState, checkResult);
  setTimeout(drawBeams, 0);
}

function buildCheckResult(correctBeams, errors, missing) {
  // Returns per-note state array
  const notes = currentEx.notes;
  const result = {};

  // For each error (wrong beam): mark both notes as wrong
  errors.forEach(i => {
    result[i] = 'wrong';
    result[i+1] = 'wrong';
  });
  missing.forEach(i => {
    if (!result[i]) result[i] = 'missing';
    if (!result[i+1]) result[i+1] = 'missing';
  });

  return result;
}

function buildErrorText(errors, missing, notes, ts) {
  let parts = [];
  const rule = getViolationRule(errors, missing, notes, ts);
  if (errors.length) {
    const names = errors.map(i => `${DUR_NAME[notes[i]]} + ${DUR_NAME[notes[i+1]]}`);
    parts.push(`<b>Лишнее ребро:</b> ${names.join(', ')}`);
  }
  if (missing.length) {
    const names = missing.map(i => `${DUR_NAME[notes[i]]} + ${DUR_NAME[notes[i+1]]}`);
    parts.push(`<b>Пропущено ребро:</b> ${names.join(', ')}`);
  }
  if (rule) parts.push(`<br><i>${rule}</i>`);
  return parts.join('<br>');
}

function getViolationRule(errors, missing, notes, ts) {
  if (!errors.length && !missing.length) return '';

  const bl = beatLen(ts);
  // Check if any error is a cross-beat beam
  for (const i of errors) {
    let pos = 0;
    for (let j = 0; j < i; j++) pos += DUR_VAL[notes[j]];
    const beatA = Math.floor(pos / bl + 0.001);
    const beatB = Math.floor((pos + DUR_VAL[notes[i]]) / bl + 0.001);
    if (beatA !== beatB) {
      if (ts === '4/4' && beatA === 1 && beatB === 2) {
        return 'В 4/4 нельзя перебрасывать ребро через середину такта — между 2-й и 3-й долями.';
      }
      return `Нельзя ставить ребро через границу доли. ${DUR_NAME[notes[i]]} принадлежит ${beatA+1}-й доле, следующая — ${beatB+1}-й.`;
    }
  }
  if (missing.length) {
    return `В размере ${ts} восьмые внутри одной доли должны быть объединены ребром.`;
  }
  return '';
}

function buildSuccessText(ts) {
  const map = {
    '2/4': 'Отлично! Каждая пара восьмых сгруппирована по своей доле.',
    '3/4': 'Верно! Три доли — три группы.',
    '4/4': 'Правильно! Доли не перемешаны, середина такта соблюдена.',
    '6/8': 'Верно! Три восьмых на каждую составную долю.',
  };
  return map[ts] || 'Верно!';
}

// ── FIND ERROR MODE ────────────────────────────────────────────
function introduceError(correctBeams, notes, ts) {
  const result = [...correctBeams];
  const bl = beatLen(ts);

  // Find candidates: positions where we can flip
  // Option A: remove a correct beam (missing beam)
  // Option B: add a wrong beam across a beat boundary

  // Find all beam boundaries (where we COULD wrongly add a beam)
  let pos = 0;
  const beatBoundaries = [];
  for (let i = 0; i < notes.length - 1; i++) {
    pos += DUR_VAL[notes[i]];
    if (Math.abs(pos % bl) < 0.001) {
      if (DUR_BEAM.includes(notes[i]) && DUR_BEAM.includes(notes[i+1])) {
        beatBoundaries.push(i);
      }
    }
  }

  const correctOnes = correctBeams.map((b,i)=>b?i:-1).filter(i=>i>=0);

  // Prefer adding a wrong beam across beat boundary (more instructive)
  if (beatBoundaries.length > 0) {
    const errIdx = beatBoundaries[Math.floor(Math.random() * beatBoundaries.length)];
    result[errIdx] = true; // add wrong beam at boundary
    window._findErrorCorrect = errIdx;
    window._findErrorType = 'extra';
    return result;
  }

  // Fallback: remove a correct beam
  if (correctOnes.length > 0) {
    const errIdx = correctOnes[Math.floor(Math.random() * correctOnes.length)];
    result[errIdx] = false;
    window._findErrorCorrect = errIdx;
    window._findErrorType = 'missing';
    return result;
  }

  return result;
}

function findErrorClick(divIdx) {
  if (checked) return;
  checked = true;
  scoreTot++;

  const isCorrectClick = (divIdx === window._findErrorCorrect);
  answerFeedback(isCorrectClick, document.getElementById('noteDisplay'));

  if (isCorrectClick) {
    scoreOk++;
    document.getElementById('successBox').classList.add('show');
    document.getElementById('successText').textContent = 'Правильно! Именно это ребро нарушает правило.';
  } else {
    scoreErr++;
    document.getElementById('errorBox').classList.add('show');
    document.getElementById('errorText').textContent = 'Нет, ошибка в другом месте. Ищи ребро, которое перебрасывает через границу доли.';
  }

  updateScore();

  // After a moment, show next
  setTimeout(() => {
    if (isCorrectClick) nextExercise();
  }, 1500);
}

// ── SCORE UI ──────────────────────────────────────────────────
function updateScore() {
  document.getElementById('scoreOk').textContent = scoreOk;
  document.getElementById('scoreErr').textContent = scoreErr;
  document.getElementById('scoreTot').textContent = scoreTot;
}

// ── RULES TAB ─────────────────────────────────────────────────
function renderRules() {
  const html = RULES.map(r => {
    // Draw example beaming groups
    const exNotes = r.example.flat();
    const beams = computeCorrectBeams(exNotes, r.ts);
    const nc = '#e2e8f0'; // always light — dark background
    const beatBoundaries = new Set();
    let pos = 0;
    exNotes.forEach((d, i) => {
      if (i < exNotes.length-1) {
        pos += DUR_VAL[d];
        if (Math.abs(pos % beatLen(r.ts)) < 0.001) beatBoundaries.add(i);
      }
    });

    return `<div class="rule-big-card">
      <div class="rule-big-title">
        <span class="rule-sig">${r.ts}</span>
        ${r.title}
      </div>
      <div class="rule-big-text">${r.text}</div>
      ${r.specialRule ? `<div style="margin-top:10px;padding:10px 14px;background:rgba(239,68,68,.08);border-radius:10px;font-size:12px;color:#ef4444;font-weight:700;">⚠️ ${r.specialRule}</div>` : ''}
      <div class="rule-example">
        <div style="display:inline-block;">${buildNoteRow(exNotes, beams, beams, null, nc, beatBoundaries, false, r.ts)}</div>
      </div>
    </div>`;
  }).join('');

  document.getElementById('rulesContent').innerHTML = html;
  setTimeout(()=>{
    // Draw beams in rule examples
    document.querySelectorAll('#rulesContent #beamOverlayPlaceholder').forEach(placeholder => {
      const groups = JSON.parse(placeholder.dataset.groups || '[]');
      const wrap = placeholder.previousSibling;
      if (!wrap) return;
      const nc2 = '#e2e8f0';
      const cells = wrap.querySelectorAll('.note-cell');
      const wrapRect = wrap.getBoundingClientRect();
      groups.forEach(([start,end]) => {
        if (!cells[start] || !cells[end]) return;
        const r1 = cells[start].getBoundingClientRect();
        const r2 = cells[end].getBoundingClientRect();
        const x1 = r1.left - wrapRect.left + 32;
        const x2 = r2.left - wrapRect.left + 32;
        const beam = document.createElement('div');
        beam.style.cssText = `position:absolute;left:${x1}px;top:27px;width:${x2-x1}px;height:6px;background:${nc2};border-radius:2px;pointer-events:none;`;
        wrap.style.position = 'relative';
        wrap.appendChild(beam);
      });
    });
  }, 50);
}

// ── INIT ──────────────────────────────────────────────────────
applyStaticLabels();
renderExercise();
setTimeout(drawBeams, 0);
</script>
<script>
// ── 👏 Прохлопай: ритм хлопками ───────────────────────────────
// Показываем ритм из тех же упражнений (размер и сложность — сверху), звучит отсчёт в один
// такт, потом ученик хлопает в ладоши (микрофон, ../audio-in.js) или стучит по кругу.
// Каждый хлопок сравнивается со временем ноты. Задержку звука/микрофона на конкретном
// телефоне не угадать, поэтому общий сдвиг всех хлопков вычитаем (медиана отклонений) —
// проверяется ровность ритма, а не миллисекунды реакции.
const CLAP_L = {
  ru: { title:'Прохлопай ритм', info:'Нажми «Старт»: прозвучит отсчёт в один такт, затем хлопай ритм в ладоши или стучи по кругу — в темпе отсчёта. Длинная нота — один хлопок.',
        tempo:'Темп', pad:'Хлопай здесь или в ладоши', listen:'Прослушать', start:'Старт', again:'Ещё раз', next:'Далее →',
        mic:'Слушать хлопки через микрофон', count:n=>'Отсчёт… '+n, go:'Хлопай!', ok:'✅ Ровно! Все доли на месте.',
        res:(m,n,x)=>'Попал: '+m+' из '+n+(x?' · лишних хлопков: '+x:''), noMic:'Микрофон недоступен — стучи по кругу.', empty:'Нет упражнений для выбранных параметров' },
  en: { title:'Clap the rhythm', info:'Press Start: you will hear a one-bar count-in, then clap the rhythm (or tap the circle) in that tempo. A long note is one clap.',
        tempo:'Tempo', pad:'Tap here or clap your hands', listen:'Listen', start:'Start', again:'Again', next:'Next →',
        mic:'Listen to claps with the microphone', count:n=>'Count-in… '+n, go:'Clap!', ok:'✅ Steady! Every beat in place.',
        res:(m,n,x)=>'Hit: '+m+' of '+n+(x?' · extra claps: '+x:''), noMic:'Microphone unavailable — tap the circle.', empty:'No exercises for these settings' }
};
const CL = k => CLAP_L[lang==='en'?'en':'ru'][k];
let clapEx = null, clapIdx = 0, clapInst = 0, clapRunning = false, clapTimers = [], clapTimes = [], clapT0 = 0, clapResult = null, clapCtx = null;

function clapLabels(){
  const set = (id, v) => { const el = document.getElementById(id); if(el) el.textContent = v; };
  set('clapTitle', CL('title')); set('clapInfo', CL('info')); set('clapTempoLbl', CL('tempo')); set('clapPadTxt', CL('pad'));
  set('clapListenTxt', CL('listen')); set('clapStartTxt', clapResult ? CL('again') : CL('start')); set('clapNextTxt', CL('next')); set('clapMicTxt', CL('mic'));
}
function clapPool(){ return VALID_EXERCISES.filter(e => e.ts === timeSig && e.diff === difficulty); }
function renderClap(newEx){
  const pool = clapPool();
  const disp = document.getElementById('clapDisplay');
  if(!pool.length){ disp.innerHTML = `<div style="color:rgba(255,255,255,.6);font-size:12px;font-weight:800;">${CL('empty')}</div>`; clapEx = null; return; }
  if(newEx || !clapEx || !pool.includes(clapEx)){ clapIdx = clapIdx % pool.length; clapEx = pool[clapIdx]; clapResult = null; clapInst++; }
  clapLabels();
  clapDraw();
  if(!clapRunning) clapStatus('', '');
}
// Нотная строка: та же отрисовка, что в «Сгруппируй», с правильными рёбрами и цветом попаданий.
function clapDraw(){
  if(!clapEx) return;
  const notes = clapEx.notes, beams = computeCorrectBeams(notes, clapEx.ts), bl = beatLen(clapEx.ts);
  const bb = new Set(); let pos = 0;
  for(let i=0;i<notes.length-1;i++){ pos += DUR_VAL[notes[i]]; if(Math.abs(pos % bl) < 0.001 || Math.abs(pos % bl - bl) < 0.001) bb.add(i); }
  const res = clapResult ? clapResult.states : null;
  const html = buildNoteRow(notes, beams, beams, res, noteColor(), bb, false, clapEx.ts)
    .replace('id="noteRowWrap"', 'class="clap-row"').replace('id="beamOverlayPlaceholder"', 'class="clap-beams"');
  const disp = document.getElementById('clapDisplay');
  disp.innerHTML = `<div class="note-outer"><div style="display:inline-block;">${html}</div></div>`;
  setTimeout(() => clapDrawBeams(disp), 0);
}
function clapDrawBeams(root){
  const ph = root.querySelector('.clap-beams'), wrap = root.querySelector('.clap-row');
  if(!ph || !wrap) return;
  const groups = JSON.parse(ph.dataset.groups || '[]'), notes = JSON.parse(ph.dataset.notes || '[]');
  const cells = wrap.querySelectorAll('.note-cell'), wr = wrap.getBoundingClientRect(), nc = noteColor();
  wrap.style.position = 'relative';
  const bar = (a, b, y) => {
    if(!cells[a] || !cells[b]) return;
    const x1 = cells[a].getBoundingClientRect().left - wr.left + 32, x2 = cells[b].getBoundingClientRect().left - wr.left + 32;
    const d = document.createElement('div');
    d.style.cssText = `position:absolute;left:${x1}px;top:${y}px;width:${x2-x1}px;height:6px;background:${nc};border-radius:2px;pointer-events:none;`;
    wrap.appendChild(d);
  };
  groups.forEach(([st, en]) => {
    bar(st, en, 27);
    let sc = -1;
    for(let k = st; k <= en + 1; k++){
      const isS = k <= en && notes[k] === 's';
      if(isS){ if(sc === -1) sc = k; } else { if(sc !== -1 && sc < k - 1) bar(sc, k - 1, 35); sc = -1; }
    }
  });
}
function clapStatus(text, cls){ const el = document.getElementById('clapStatus'); el.textContent = text; el.className = 'clap-status' + (cls ? ' ' + cls : ''); }
function clapAudio(){
  if(!clapCtx){ try{ clapCtx = new (window.AudioContext || window.webkitAudioContext)(); }catch(e){ return null; } }
  if(clapCtx.state === 'suspended' && clapCtx.resume) clapCtx.resume();
  return clapCtx;
}
function clapBeep(at, strong, freq){
  const ctx = clapAudio(); if(!ctx) return;
  const t = ctx.currentTime + Math.max(0, at) / 1000;
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = 'square'; o.frequency.value = freq || (strong ? 1320 : 880);
  o.connect(g); g.connect(ctx.destination);
  g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(strong ? 0.25 : 0.15, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + 0.06);
  o.start(t); o.stop(t + 0.08);
}
const clapBeatMs = () => 60000 / (+document.getElementById('clapTempo').value || 70); // четверть
function clapOnsetsMs(){ let pos = 0; return clapEx.notes.map(d => { const t = pos; pos += DUR_VAL[d]; return t * clapBeatMs(); }); }
function clapClear(){ clapTimers.forEach(clearTimeout); clapTimers = []; }
function clapStop(){
  clapClear();
  clapRunning = false;
  if(window.AIN) AIN.mic.stop();
  const pad = document.getElementById('clapPad'); if(pad) pad.classList.remove('live');
}
function clapListen(){
  if(!clapEx || clapRunning) return;
  clapOnsetsMs().forEach((t, i) => clapBeep(t + 150, i === 0, 660));
}
function clapHit(t){
  if(!clapRunning) return;
  if(t < clapT0 - 150) return; // щелчки отсчёта и эхо до начала ритма не считаем
  clapTimes.push(t);
  const pad = document.getElementById('clapPad'); pad.classList.add('hit'); setTimeout(() => pad.classList.remove('hit'), 90);
}
function clapStart(){
  if(!clapEx) return;
  clapStop();
  clapResult = null; clapDraw(); clapLabels();
  const beat = clapBeatMs(), bl = beatLen(clapEx.ts), bpb = beatsPerBar(clapEx.ts);
  const countStep = beat * bl, lead = 300;
  const expected = clapOnsetsMs();
  const total = clapEx.notes.reduce((a, d) => a + DUR_VAL[d], 0) * beat;
  clapTimes = []; clapRunning = true;
  const now = performance.now();
  clapT0 = now + lead + bpb * countStep;
  for(let i = 0; i < bpb; i++){
    clapBeep(lead + i * countStep, i === 0);
    clapTimers.push(setTimeout(() => clapStatus(CL('count')(bpb - i), ''), lead + i * countStep));
  }
  clapTimers.push(setTimeout(() => { clapStatus(CL('go'), ''); document.getElementById('clapPad').classList.add('live'); }, clapT0 - now));
  const useMic = document.getElementById('clapMicChk').checked && window.AIN;
  if(useMic) AIN.mic.start({ onOnset: t => clapHit(t) }).then(ok => { if(!ok && clapRunning) clapStatus(CL('noMic'), ''); });
  const shortest = Math.min.apply(null, clapEx.notes.map(d => DUR_VAL[d])) * beat;
  clapTimers.push(setTimeout(() => clapFinish(expected, shortest), clapT0 - now + total + Math.max(400, beat * 0.6)));
}
function clapFinish(expected, shortest){
  const hits = clapTimes.map(t => t - clapT0);
  clapStop();
  // Общий сдвиг (задержка динамика/микрофона/реакции): медиана отклонений до ближайшего хлопка.
  const devs = expected.map(e => { let best = null; hits.forEach(h => { if(Math.abs(h - e) < 300 && (best === null || Math.abs(h - e) < Math.abs(best))) best = h - e; }); return best; }).filter(x => x !== null).sort((a, b) => a - b);
  const offset = devs.length ? Math.max(-200, Math.min(250, devs[Math.floor(devs.length / 2)])) : 0;
  const tol = Math.max(70, Math.min(140, shortest * 0.4));
  const used = new Array(hits.length).fill(false);
  const states = {}; let matched = 0;
  expected.forEach((e, i) => {
    let bi = -1, bd = Infinity;
    hits.forEach((h, j) => { if(used[j]) return; const d = Math.abs(h - offset - e); if(d <= tol && d < bd){ bd = d; bi = j; } });
    if(bi >= 0){ used[bi] = true; matched++; states[i] = 'correct'; } else states[i] = 'wrong';
  });
  const extra = used.filter(u => !u).length;
  const ok = matched === expected.length && extra === 0;
  clapResult = { states, ok, matched, total: expected.length, extra, pct: Math.round(matched / (expected.length + extra) * 100) };
  clapDraw(); clapLabels();
  if(ok) clapStatus(CL('ok'), 'ok'); else clapStatus(CL('res')(matched, expected.length, extra), 'err');
  if(typeof answerFeedback === 'function') answerFeedback(ok, document.getElementById('clapDisplay'));
  clapReport(clapResult, clapEx, clapInst);
}
// Точка для статистики и заданий (см. блок «Домашнее задание и статистика» ниже).
function clapReport(result, ex, inst){}
function clapNext(){ clapStop(); clapIdx++; renderClap(true); }
(function(){
  const pad = document.getElementById('clapPad');
  pad.addEventListener('pointerdown', e => { e.preventDefault(); clapHit(performance.now()); });
  const tempo = document.getElementById('clapTempo');
  try { const saved = +localStorage.getItem('musicapp_clap_tempo'); if(saved >= 40 && saved <= 120) tempo.value = saved; } catch(e) {}
  document.getElementById('clapTempoVal').textContent = tempo.value;
  tempo.addEventListener('input', () => { document.getElementById('clapTempoVal').textContent = tempo.value; try{ localStorage.setItem('musicapp_clap_tempo', tempo.value); }catch(e){} });
  clapLabels();
})();
</script>
<script>
// ── Домашнее задание и статистика (см. ../hw.js) ─────────────
// Каждый ответ пишется в общую статистику («Мои слабые места» на главной).
// Учитель: «➕ В задание» сохраняет режим (Сгруппируй / Найди ошибку), размер и сложность.
// Ученик (?hwx=N или тренировка ?px=…): настройки из задания, переключатели и подсказка
// скрыты; засчитывается каждое решённое упражнение, «верно» — если с первой попытки.
(function(){
  if(!window.MHW) return;
  const MOD = 'rhythm';
  const en = () => lang === 'en';
  const modName = () => MHW.MODULES[MOD][en() ? 'en' : 'ru'];
  const curTab = () => currentTab === 'rules' ? 'group' : currentTab;
  const TAB_BTN = { group:'tab0', find:'tab1', clap:'tab3' };
  const cfg = () => {
    const tab = curTab();
    const tabBtn = document.getElementById(TAB_BTN[tab] || 'tab0');
    const diffBtn = document.querySelector('.sel-btn[data-diff="'+difficulty+'"]');
    const tempo = +document.getElementById('clapTempo').value;
    const n = [modName(), tabBtn.textContent.replace(/^\S+\s/,'').trim(), timeSig, diffBtn ? diffBtn.textContent.trim() : '',
      tab === 'clap' ? tempo + ' BPM' : ''].filter(Boolean).join(' · ');
    const p = { ts: timeSig, df: difficulty };
    if(tab === 'clap') p.tp = tempo;
    return { k: tab, u: 'ex', n, p };
  };
  // Подпись для статистики — что именно тренируется: группировка/поиск ошибки/хлопки в размере.
  const statLabel = (ex) => ({ find: en() ? 'Find the error ' : 'Найди ошибку ', clap: en() ? 'Clapping ' : 'Хлопки ' }[curTab()] || (en() ? 'Beaming ' : 'Группировка ')) + ex.ts;

  let inst = 0; // номер показанного упражнения (одно и то же упражнение может выпасть снова)
  const origRender = window.renderExercise;
  window.renderExercise = function(){ inst++; return origRender.apply(this, arguments); };

  const add = MHW.addButton(document.querySelector('.container'), document.getElementById('mainContent'), async () => {
    const g = await MHW.askGoal({
      title: en() ? 'How many exercises to solve?' : 'Сколько упражнений решить?',
      text: en() ? 'The exercise keeps the mode, time signature and difficulty.' : 'Упражнение запомнит режим, размер и сложность.',
      options: [5, 10, 15, 20]
    });
    if(!g) return;
    MHW.addFromModule(Object.assign({ m: MOD, g }, cfg()), '../index.html');
  });
  const origSwitch = window.switchTab;
  window.switchTab = function(tab){ const r = origSwitch.apply(this, arguments); add.row.style.display = tab==='rules' ? 'none' : ''; return r; };
  const origLang = window.toggleLang;
  window.toggleLang = function(){ const r = origLang.apply(this, arguments); add.relabel(); return r; };

  // Перехват ответов — всегда (статистика); в задании ещё и прогресс.
  const tr = MHW.tracker(MOD, cfg);
  const origCheck = window.checkAnswer;
  window.checkAnswer = function(){
    if(checked || !currentEx) return origCheck.apply(this, arguments);
    const ex = currentEx, key = inst;
    const correct = computeCorrectBeams(ex.notes, ex.ts);
    const extra = beamState.some((b,i)=>b && !correct[i]);
    const err0 = scoreErr;
    const r = origCheck.apply(this, arguments);
    if(scoreErr > err0) tr.wrong(key, statLabel(ex), null, ex.ts + ': ' + (en() ? (extra ? 'extra beam' : 'missing beam') : (extra ? 'лишнее ребро' : 'пропущено ребро')));
    else tr.right(key, statLabel(ex));
    return r;
  };
  const origFind = window.findErrorClick;
  window.findErrorClick = function(){
    if(checked || !currentEx) return origFind.apply(this, arguments);
    const ex = currentEx, key = inst, err0 = scoreErr;
    const r = origFind.apply(this, arguments);
    if(scoreErr > err0) tr.wrong(key, statLabel(ex), null, ex.ts + ': ' + (en() ? 'error not found' : 'не нашёл ошибку'));
    else tr.right(key, statLabel(ex));
    return r;
  };

  const origClap = window.clapReport;
  window.clapReport = function(res, ex, cinst){
    const r = origClap.apply(this, arguments);
    const key = 'clap' + cinst;
    if(res.ok) tr.right(key, statLabel(ex));
    else tr.wrong(key, statLabel(ex), null, ex.ts + ': ' + (en() ? 'hit ' : 'попал ') + res.matched + '/' + res.total + (res.extra ? (en() ? ', extra ' : ', лишних ') + res.extra : ''));
    return r;
  };

  const tk = MHW.task(MOD);
  if(!tk) return;
  add.row.style.display = 'none';
  const p = tk.item.p || {};
  const tab = ['find','clap'].includes(tk.item.k) ? tk.item.k : 'group';
  if(tab === 'clap' && p.tp >= 40 && p.tp <= 120){
    const tEl = document.getElementById('clapTempo'); tEl.value = p.tp; document.getElementById('clapTempoVal').textContent = p.tp;
  }
  const ts = ['2/4','3/4','4/4','6/8'].includes(p.ts) ? p.ts : '2/4';
  const df = [1,2,3].includes(p.df) ? p.df : 1;
  timeSig = ts; difficulty = df;
  document.querySelectorAll('.sel-btn[data-ts]').forEach(b=>b.classList.toggle('active',b.dataset.ts===ts));
  document.querySelectorAll('.sel-btn[data-diff]').forEach(b=>b.classList.toggle('active',+b.dataset.diff===df));
  switchTab(tab);
  MHW.lock(['.tabs', '#timeSigRow', '#diffRow', '[onclick="showHintBeams()"]', '.clap-tempo', '.mhw-addrow']);
  MHW.mountBar(document.querySelector('.container'), '../index.html');
})();
</script><script>
/* Клавиатурная доступность: элементы с onclick (не <button>/<a>/полям форм)
   становятся фокусируемыми и активируются Enter/Space — включая те,
   что добавляются в DOM динамически (пианино, варианты викторин и т.п.). */
(function(){
  function tagEl(el){
    if(!el || !el.hasAttribute || !el.hasAttribute('onclick')) return;
    var tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL') return;
    if(el.hasAttribute('data-a11y-kb')) return;
    el.setAttribute('data-a11y-kb','1');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  }
  function scan(root){
    if(!root||!root.querySelectorAll) return;
    tagEl(root);
    root.querySelectorAll('[onclick]').forEach(tagEl);
  }
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
    var el=document.activeElement;
    if(el && el.getAttribute && el.hasAttribute('onclick') && el.getAttribute('role')==='button'){
      e.preventDefault();
      el.click();
    }
  });
  if(document.body) scan(document.body);
  else document.addEventListener('DOMContentLoaded', function(){ scan(document.body); });
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){ if(n.nodeType===1) scan(n); });
    });
  });
  if(document.body) mo.observe(document.body,{childList:true,subtree:true});
  else document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); });
})();
</script>
