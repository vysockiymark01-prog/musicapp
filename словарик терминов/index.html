<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Музыкальный словарик</title>
<meta name="theme-color" content="#1c3a8e">
<script>(function(){var t=localStorage.getItem('musicapp_theme');var dark=t==='dark';document.documentElement.setAttribute('data-theme',dark?'dark':'light');})()</script>
<style>
  :root {
    --bg:#f8fafc; --bg2:#ffffff; --card:#ffffff;
    --border:#e2e8f0; --border-light:#f1f5f9;
    --text:#0f172a; --text2:#475569; --muted:#94a3b8;
    --accent:#2563eb; --accent-hover:#1d4ed8;
    --green:#10b981; --red:#ef4444;
    --shadow-sm:0 1px 3px rgba(0,0,0,.04);
    --shadow-md:0 10px 15px rgba(0,0,0,.05);
    --radius:16px; --radius-lg:24px;
  }
  [data-theme="dark"] {
    --bg:#0f172a; --bg2:#1e293b; --card:#1e293b;
    --border:#334155; --border-light:#1e293b;
    --text:#f1f5f9; --text2:#94a3b8; --muted:#64748b;
    --accent:#3b82f6; --accent-hover:#2563eb;
    --shadow-sm:0 1px 3px rgba(0,0,0,.3);
    --shadow-md:0 10px 15px rgba(0,0,0,.3);
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;min-height:100vh;transition:background .3s,color .3s;}
  .container{max-width:700px;margin:0 auto;padding:12px;}

  /* HEADER */
  .header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .header-title{display:flex;align-items:center;gap:8px;font-weight:900;font-size:14px;text-transform:uppercase;letter-spacing:-.5px;}
  .header-actions{display:flex;gap:8px;}
  .hbtn{display:flex;align-items:center;gap:6px;padding:6px 12px;background:#f1f5f9;border:none;border-radius:10px;font-weight:700;font-size:10px;text-transform:uppercase;cursor:pointer;color:var(--text);transition:background .2s;}
  [data-theme="dark"] .hbtn{background:#334155;}
  .hbtn:hover{background:#e2e8f0;}
  [data-theme="dark"] .hbtn:hover{background:#475569;}

  /* TABS */
  .tabs{display:flex;background:var(--card);padding:4px;border-radius:12px;border:1px solid var(--border);margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .tab{flex:1;padding:11px;border:none;background:none;border-radius:8px;font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);cursor:pointer;transition:all .2s;}
  .tab.active{background:var(--accent);color:#fff;box-shadow:0 4px 6px rgba(37,99,235,.2);}

  /* FILTER PANELS */
  .filter-panel{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:10px 16px;margin-bottom:8px;box-shadow:var(--shadow-sm);}
  .filter-row{display:flex;gap:6px;flex-wrap:wrap;align-items:center;}
  .filter-label{font-size:9px;font-weight:900;text-transform:uppercase;color:var(--muted);margin-right:2px;letter-spacing:.5px;white-space:nowrap;}
  .fbtn{padding:5px 11px;border-radius:20px;border:1px solid var(--border);background:transparent;color:var(--muted);cursor:pointer;font-size:10px;font-weight:700;text-transform:uppercase;transition:all .2s;}
  .fbtn:hover{border-color:var(--accent);color:var(--text);}
  .fbtn.active{color:#fff;border-color:transparent;}
  .fbtn[data-topic="all"].active,.fbtn[data-cls="all"].active{background:var(--accent);}
  .fbtn[data-topic="темп"].active{background:#7c3aed;}
  .fbtn[data-topic="динамика"].active{background:#dc2626;}
  .fbtn[data-topic="характер"].active{background:#d97706;}
  .fbtn[data-topic="форма"].active{background:#059669;}
  .fbtn[data-topic="нотация"].active{background:#0284c7;}
  .fbtn[data-cls="1-2"].active{background:#0284c7;}
  .fbtn[data-cls="3-4"].active{background:#7c3aed;}
  .fbtn[data-cls="5-6"].active{background:#d97706;}
  .fbtn[data-cls="7-8"].active{background:#059669;}

  /* PROGRESS */
  .progress-section{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;margin-bottom:12px;box-shadow:var(--shadow-sm);}
  .progress-title{font-size:9px;font-weight:900;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;margin-bottom:8px;}
  .progress-row{display:flex;gap:10px;flex-wrap:wrap;}
  .prog-item{flex:1;min-width:70px;}
  .prog-label{font-size:9px;font-weight:900;text-transform:uppercase;color:var(--text2);display:flex;justify-content:space-between;margin-bottom:4px;}
  .prog-bar{height:4px;background:var(--border);border-radius:2px;overflow:hidden;}
  .prog-fill{height:100%;border-radius:2px;transition:width .4s;}
  .pf-темп{background:#7c3aed;} .pf-динамика{background:#dc2626;} .pf-характер{background:#d97706;} .pf-форма{background:#059669;} .pf-нотация{background:#0284c7;}

  /* BADGE */
  .badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:9px;font-weight:900;text-transform:uppercase;letter-spacing:.5px;color:#fff;}
  .b-темп{background:#7c3aed;} .b-динамика{background:#dc2626;} .b-характер{background:#d97706;} .b-форма{background:#059669;} .b-нотация{background:#0284c7;}
  .b-cls{background:#475569;}

  /* BUTTONS */
  .btn{padding:12px 22px;border-radius:12px;border:none;font-size:11px;font-weight:900;text-transform:uppercase;cursor:pointer;display:inline-flex;align-items:center;gap:6px;transition:all .2s;box-shadow:0 4px 6px rgba(0,0,0,.1);font-family:inherit;}
  .btn:active{transform:scale(.96);}
  .btn-primary{background:var(--accent);color:#fff;} .btn-primary:hover{background:var(--accent-hover);}
  .btn-green{background:var(--green);color:#fff;} .btn-green:hover{opacity:.9;}
  .btn-red{background:var(--red);color:#fff;} .btn-red:hover{opacity:.9;}
  .btn-sec{background:var(--card);color:var(--text2);border:1px solid var(--border);box-shadow:var(--shadow-sm);} .btn-sec:hover{background:var(--bg);}

  /* CARDS */
  .cards-wrap{display:flex;flex-direction:column;align-items:center;gap:14px;}
  .card-counter{font-size:11px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;}
  .card-scene{width:100%;max-width:540px;perspective:1000px;cursor:pointer;user-select:none;}
  .card-inner{position:relative;width:100%;min-height:220px;transform-style:preserve-3d;transition:transform .45s cubic-bezier(.4,0,.2,1);}
  .card-scene.flipped .card-inner{transform:rotateY(180deg);}
  .card-face{position:absolute;width:100%;min-height:220px;backface-visibility:hidden;border-radius:var(--radius-lg);padding:28px 24px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;gap:10px;}
  .card-fav{position:absolute;top:12px;right:14px;background:none;border:none;cursor:pointer;font-size:22px;line-height:1;color:var(--muted);padding:2px;transition:transform .12s,color .12s;}
  .card-fav:hover{transform:scale(1.15);}
  .card-fav.active{color:#f59e0b;}
  .hbtn.fav-toggle.active{background:#f59e0b;color:#fff;}
  .card-front{background:var(--card);border:1px solid var(--border);box-shadow:var(--shadow-md);}
  .card-back{background:var(--card);border:2px solid var(--accent);box-shadow:var(--shadow-md);transform:rotateY(180deg);}
  .card-term{font-size:34px;font-weight:900;color:var(--text);}
  .card-hint{font-size:10px;font-weight:700;text-transform:uppercase;color:var(--muted);letter-spacing:1px;}
  .card-def{font-size:16px;color:var(--text);line-height:1.5;}
  .card-example{font-size:13px;color:var(--text2);font-style:italic;}
  .card-actions{display:flex;gap:10px;margin-top:4px;}
  .done-box{text-align:center;padding:40px 0;}
  .done-box h2{font-size:22px;font-weight:900;margin-bottom:10px;}
  .done-box p{color:var(--text2);margin-bottom:20px;font-size:14px;}
  .empty-state{text-align:center;padding:60px 0;color:var(--muted);font-size:13px;font-weight:700;text-transform:uppercase;}

  /* QUIZ */
  .quiz-wrap{display:flex;flex-direction:column;gap:14px;}
  .quiz-meta{display:flex;justify-content:space-between;align-items:center;}
  .quiz-counter{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted);}
  .quiz-score-badge{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--green);}
  .quiz-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 22px;box-shadow:var(--shadow-md);}
  .quiz-q{font-size:28px;font-weight:900;margin-bottom:6px;}
  .quiz-topic-row{margin-bottom:18px;display:flex;gap:6px;}
  .quiz-options{display:flex;flex-direction:column;gap:8px;}
  .quiz-opt{padding:13px 16px;border-radius:12px;border:1px solid var(--border);background:var(--bg);color:var(--text);font-size:14px;cursor:pointer;text-align:left;transition:all .2s;line-height:1.4;font-family:inherit;}
  .quiz-opt:hover:not(:disabled){border-color:var(--accent);background:var(--card);}
  .quiz-opt.correct{border-color:var(--green);background:rgba(16,185,129,.08);color:var(--green);font-weight:700;}
  .quiz-opt.wrong{border-color:var(--red);background:rgba(239,68,68,.08);color:var(--red);}
  .quiz-opt:disabled{cursor:default;}
  .quiz-next-bar{position:fixed;left:0;right:0;bottom:0;display:none;justify-content:center;
    padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:var(--bg);
    border-top:1px solid var(--border);z-index:50;}
  .quiz-next-bar.show{display:flex;}
  .quiz-next-bar .btn{width:100%;max-width:700px;justify-content:center;}
  .quiz-result-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:48px 24px;text-align:center;box-shadow:var(--shadow-md);}
  .score-big{font-size:64px;font-weight:900;color:var(--accent);line-height:1;}
  .score-sub{color:var(--text2);margin:8px 0 28px;font-size:15px;}

  /* MATCH */
  .match-wrap{display:flex;flex-direction:column;gap:12px;}
  .match-info{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted);letter-spacing:.5px;}
  .match-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
  .match-col{display:flex;flex-direction:column;gap:8px;}
  .match-item{padding:11px 13px;border-radius:12px;border:2px solid var(--border);background:var(--card);font-size:13px;cursor:pointer;transition:all .2s;line-height:1.4;min-height:50px;display:flex;align-items:center;box-shadow:var(--shadow-sm);}
  .match-item:hover:not(.matched):not(.wrong-flash){border-color:var(--accent);}
  .match-item.selected{border-color:var(--accent);background:rgba(37,99,235,.06);color:var(--accent);font-weight:700;}
  .match-item.matched{border-color:var(--green);background:rgba(16,185,129,.06);color:var(--green);cursor:default;opacity:.75;}
  .match-item.wrong-flash{border-color:var(--red);background:rgba(239,68,68,.08);}
  .match-term-text{font-weight:900;font-size:15px;}
  .match-status{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--muted);text-align:center;}
  .match-done-box{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-lg);padding:40px 24px;text-align:center;box-shadow:var(--shadow-md);}
  .match-done-box h2{font-size:22px;font-weight:900;margin-bottom:8px;}
  .match-done-box p{color:var(--text2);font-size:14px;margin-bottom:24px;}

  /* FEEDBACK */
  .feedback-modal{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.2);backdrop-filter:blur(4px);z-index:9999;}
  .feedback-modal.hidden{display:none;}
  .feedback-content{background:var(--card);padding:40px 48px;border-radius:32px;box-shadow:0 25px 50px rgba(0,0,0,.2);}
  .feedback-text{font-size:26px;font-weight:900;text-align:center;}
  .feedback-text.correct{color:var(--green);} .feedback-text.wrong{color:var(--red);}

  @media(max-width:600px){
    .header{flex-wrap:wrap;gap:8px;padding:10px 12px;}
    .header-actions{gap:4px;}
    .hbtn{padding:7px 9px;font-size:9px;}
    .container{padding:8px;}
    .card-term{font-size:22px;}
    .card-def{font-size:14px;}
    .card-actions{flex-wrap:wrap;justify-content:center;}
    .match-grid{grid-template-columns:1fr;}
    .quiz-q{font-size:20px;}
    .feedback-content{padding:28px 24px;border-radius:24px;}
    .feedback-text{font-size:20px;}
    .score-big{font-size:48px;}
    .btn{padding:11px 14px;font-size:9px;}
  }
  @media(max-width:400px){
    .header-title{font-size:12px;}
    .card-term{font-size:18px;}
    .tabs .tab{padding:9px 6px;font-size:9px;}
  }

  /* ── TEACHER/STUDENT ASSIGNMENT SHARING ───────────────── */
  .assign-banner{background:rgba(37,99,235,.08);border:1.5px solid var(--accent);border-radius:14px;
    padding:10px 14px;margin-bottom:12px;display:none;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;color:var(--text);}
  .assign-banner.show{display:flex;}
  .assign-banner button{background:none;border:none;color:var(--accent);font-weight:900;font-size:11px;cursor:pointer;text-transform:uppercase;flex-shrink:0;}
  .modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:999;padding:16px;}
  .modal-ov.show{display:flex;}
  .modal-bx{background:var(--card);border-radius:20px;padding:22px;max-width:380px;width:100%;max-height:88vh;overflow-y:auto;}
  .modal-bx h3{font-size:14px;font-weight:900;margin-bottom:14px;}
  .modal-row{margin-bottom:12px;}
  .modal-row label{font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px;}
  .modal-row select{width:100%;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:700;}
  .modal-link-box{display:flex;gap:6px;margin-bottom:12px;}
  .modal-link-box input{flex:1;min-width:0;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:11px;}
  .modal-link-box button{padding:9px 12px;border-radius:10px;border:none;background:var(--accent);color:#fff;font-weight:900;font-size:10px;cursor:pointer;white-space:nowrap;}
  .modal-qr-wrap{display:flex;justify-content:center;margin-bottom:14px;}
  .modal-qr-wrap canvas{border-radius:10px;background:#fff;padding:8px;max-width:100%;}
  .modal-close{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:none;color:var(--text);font-weight:800;font-size:11px;cursor:pointer;text-transform:uppercase;}
  .modal-gen-btn{width:100%;justify-content:center;margin-bottom:14px;background:var(--accent) !important;color:#fff !important;}
  .result-view{background:var(--card);border:2px solid var(--accent);border-radius:20px;padding:28px 20px;text-align:center;margin-bottom:16px;}
  .result-view .rv-title{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--accent);margin-bottom:10px;letter-spacing:.4px;}
  .result-view .rv-score{font-size:42px;font-weight:900;margin-bottom:6px;}
  .result-view .rv-sub{font-size:12px;color:var(--muted);}
</style>
</head>

  <div class="filter-panel">

      <span class="filter-label" id="fl2"></span>
      <button class="fbtn active" data-cls="all" onclick="setCls('all')" id="fc_all"></button>

      <button class="fbtn" data-cls="3-4" onclick="setCls('3-4')" id="fc_34"></button>
      <button class="fbtn" data-cls="5-6" onclick="setCls('5-6')" id="fc_56"></button>
      <button class="fbtn" data-cls="7-8" onclick="setCls('7-8')" id="fc_78"></button>
    </div>
  </div>

let progress = JSON.parse(localStorage.getItem('mvpro3') || '{}');
let favOnly = false;
let favTerms = [];
function loadFavTerms(){
  try{
    const raw = JSON.parse(localStorage.getItem('musicapp_glossary_favorites') || '[]');
    favTerms = Array.isArray(raw) ? raw : [];
  }catch(e){ favTerms = []; }
}
function saveFavTerms(){
  localStorage.setItem('musicapp_glossary_favorites', JSON.stringify(favTerms));
}
function isFavTerm(term){ return favTerms.indexOf(term) !== -1; }
function favIndexSet(module,type,id,data){
  try{
    const idx = JSON.parse(localStorage.getItem('musicapp_fav_index') || '{}');
    idx[module+':'+type+':'+id] = Object.assign({module,type,id,ts:Date.now()},data);
    localStorage.setItem('musicapp_fav_index', JSON.stringify(idx));
  }catch(e){}
}
function favIndexRemove(module,type,id){
  try{
    const idx = JSON.parse(localStorage.getItem('musicapp_fav_index') || '{}');
    delete idx[module+':'+type+':'+id];
    localStorage.setItem('musicapp_fav_index', JSON.stringify(idx));
  }catch(e){}
}
function toggleFavTerm(term){
  const i = favTerms.indexOf(term);
  if(i===-1){
    favTerms.push(term);
    const x = TERMS.find(t=>t.term===term);
    if(x)favIndexSet('glossary','term',term,{labelRu:x.term,labelEn:x.term,subRu:x.topic,subEn:x.topic,icon:'📖',link:'словарик терминов/index.html'});
  }else{
    favTerms.splice(i,1);
    favIndexRemove('glossary','term',term);
  }
  saveFavTerms();
  const isFav = isFavTerm(term);
  document.querySelectorAll('.card-fav').forEach(btn=>{
    btn.classList.toggle('active', isFav);
    btn.textContent = isFav ? '★' : '☆';
  });
}
function toggleFavOnly(){
  favOnly = !favOnly;
  updateFavToggleBtn();
  renderAll();
}
function updateFavToggleBtn(){
  const btn = document.getElementById('favToggleBtn');
  if(!btn) return;
  btn.classList.toggle('active', favOnly);
  btn.textContent = favOnly ? (lang==='ru'?'⭐ ИЗБРАННОЕ':'⭐ FAVORITES') : '⭐';
}
loadFavTerms();

function t(key) { return UI[lang][key]; }
function save() { localStorage.setItem('mvpro3', JSON.stringify(progress)); }

function filtered() {
  return TERMS.filter(x =>
    (filterTopic === 'all' || x.topic === filterTopic) &&
    (filterCls === 'all' || x.cls === filterCls) &&
    (!favOnly || isFavTerm(x.term))
  );
}
function shuffle(a) {
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function def(card) { return lang==='ru' ? card.defRu : card.defEn; }
function ex(card)  { return lang==='ru' ? card.exRu  : card.exEn; }
function topicLabel(tp) { return UI[lang].topics[tp] || tp; }
function clsLabel(cls)  { return UI[lang].classes[cls] || cls; }

function switchMode(m) {

  ['cards','quiz','match','review'].forEach((x,i)=>document.getElementById('tab'+i).classList.toggle('active',x===m));
  renderAll();

// ── SPACED REPETITION (Leitner-style adaptive difficulty) ──────
const SRS_KEY = 'musicapp_glossary_srs';
const SRS_INTERVALS = [0,1,3,7,16]; // days until due, indexed by box (0-4)
let srs = {};
try { srs = JSON.parse(localStorage.getItem(SRS_KEY) || '{}'); } catch(e) { srs = {}; }
function saveSrs() { localStorage.setItem(SRS_KEY, JSON.stringify(srs)); }
function todayStr() { const d=new Date(); return d.getFullYear()+'-'+(d.getMonth()+1)+'-'+d.getDate(); }
function daysBetween(a,b) {
  const pa=a.split('-').map(Number), pb=b.split('-').map(Number);
  const da=new Date(pa[0],pa[1]-1,pa[2]), db=new Date(pb[0],pb[1]-1,pb[2]);
  return Math.round((db-da)/86400000);
}
function srsBox(term) { return srs[term] ? srs[term].box : 0; }
function srsIsDue(term) {
  const e = srs[term];
  if (!e) return true; // never studied — always due
  return daysBetween(e.due, todayStr()) >= 0;
}
function srsUpdate(term, correct) {
  const cur = srs[term] || {box:0, due:todayStr()};
  const box = correct ? Math.min(4, cur.box+1) : 0;
  const due = new Date();
  due.setDate(due.getDate() + SRS_INTERVALS[box]);
  srs[term] = {box, due: due.getFullYear()+'-'+(due.getMonth()+1)+'-'+due.getDate()};
  saveSrs();
}

function setTopic(tp) {
  filterTopic = tp;
  document.querySelectorAll('.fbtn[data-topic]').forEach(b=>b.classList.toggle('active',b.dataset.topic===tp));
  renderAll();
}

function setCls(cls) {
  filterCls = cls;
  document.querySelectorAll('.fbtn[data-cls]').forEach(b=>b.classList.toggle('active',b.dataset.cls===cls));
  renderAll();
}

// ── RENDER ALL ────────────────────────────────────────────────
function renderAll() { renderProgress(); if(mode==='cards')initCards(); else if(mode==='quiz')initQuiz(); else if(mode==='review')initReview(); else initMatch(); }

function initReview() {
  deck = filtered().filter(x=>srsIsDue(x.term));
  deck.sort((a,b)=>srsBox(a.term)-srsBox(b.term));
  cardIdx=0; flipped=false; showCard();
}

function renderProgress() {
  const topics = ['темп','динамика','характер','форма','нотация'];
  document.getElementById('progressRow').innerHTML = topics.map(tp => {
    const all = TERMS.filter(x=>x.topic===tp);
    const known = all.filter(x=>progress[x.term]==='known').length;
    const pct = Math.round(known/all.length*100);
    return `<div class="prog-item">
      <div class="prog-label"><span>${topicLabel(tp)}</span><span>${known}/${all.length}</span></div>
      <div class="prog-bar"><div class="prog-fill pf-${tp}" style="width:${pct}%"></div></div>
    </div>`;
  }).join('');
}

function showFeedback(text, ok) {
  const m=document.getElementById('feedbackModal'), ft=document.getElementById('feedbackText');
  ft.textContent=text; ft.className='feedback-text '+(ok?'correct':'wrong');
  m.classList.remove('hidden');
  setTimeout(()=>m.classList.add('hidden'), ok?700:900);
}

// ── FLASHCARDS ────────────────────────────────────────────────
let deck=[], cardIdx=0, flipped=false;

function initCards() {
  deck=shuffle(filtered()); cardIdx=0; flipped=false; showCard();
}

function showCard() {
  const mc=document.getElementById('mainContent');
  const restartFn = mode==='review' ? 'initReview' : 'initCards';
  if(!deck.length){
    if(mode==='review'){
      mc.innerHTML=`<div class="empty-state"><div>${t('emptyReview')}</div><p style="font-size:11px;font-weight:500;margin-top:8px;opacity:.8">${t('emptyReviewMsg')}</p></div>`;
    } else {
      mc.innerHTML=`<div class="empty-state">${t('emptyCards')}</div>`;
    }
    return;
  }
  if(cardIdx>=deck.length){
    mc.innerHTML=`<div class="cards-wrap"><div class="done-box">
      <h2>${t('deckDone')}</h2><p>${t('deckDoneMsg')}</p>
      <button class="btn btn-primary" onclick="${restartFn}()">${t('restart')}</button>
    </div></div>`;return;
  }
  const c=deck[cardIdx];
  const isFav=isFavTerm(c.term);
  const favBtnHtml=`<button class="card-fav${isFav?' active':''}" onclick="event.stopPropagation();toggleFavTerm('${c.term.replace(/'/g,"\\'")}')" title="${lang==='ru'?'В избранное':'Add to favorites'}">${isFav?'★':'☆'}</button>`;
  const boxBadge = mode==='review' ? `<span class="badge b-cls">${t('boxLabel')(srsBox(c.term))}</span>` : '';
  const reviewInfo = mode==='review' ? `<div class="card-counter">${t('reviewInfo')(deck.length)}</div>` : '';
  mc.innerHTML=`<div class="cards-wrap">
    ${reviewInfo}
    <div class="card-counter">${cardIdx+1} ${t('cardOf')} ${deck.length}</div>
    <div class="card-scene" id="cs" onclick="flipCard()">
      <div class="card-inner" id="ci">
        <div class="card-face card-front">
          ${favBtnHtml}
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
            <span class="badge b-${c.topic}">${topicLabel(c.topic)}</span>
            <span class="badge b-cls">${clsLabel(c.cls)}</span>
            ${boxBadge}
          </div>
          <div class="card-term">${c.term}</div>
          <div class="card-hint">${t('flipHint')}</div>
        </div>
        <div class="card-face card-back">
          ${favBtnHtml}
          <div style="display:flex;gap:6px;flex-wrap:wrap;justify-content:center">
            <span class="badge b-${c.topic}">${topicLabel(c.topic)}</span>
            <span class="badge b-cls">${clsLabel(c.cls)}</span>
          </div>
          <div class="card-def">${def(c)}</div>
          <div class="card-example">"${ex(c)}"</div>
        </div>
      </div>
    </div>
    <div class="card-actions" id="ca" style="display:none">
      <button class="btn btn-red" onclick="cardAns(false)">${t('unknown')}</button>
      <button class="btn btn-green" onclick="cardAns(true)">${t('knew')}</button>
    </div>
    <button class="btn btn-sec" onclick="flipCard()">↩</button>
  </div>`;
}

function recordRecent(module,type,id,data){
  try{
    let arr = JSON.parse(localStorage.getItem('musicapp_recent') || '[]');
    if(!Array.isArray(arr))arr=[];
    arr = arr.filter(e=>!(e.module===module && e.type===type && e.id===id));
    arr.unshift(Object.assign({module,type,id,ts:Date.now()},data));
    if(arr.length>20)arr=arr.slice(0,20);
    localStorage.setItem('musicapp_recent', JSON.stringify(arr));
  }catch(e){}
}
function flipCard() {
  const s=document.getElementById('cs'), a=document.getElementById('ca');
  if(!s)return; flipped=!flipped; s.classList.toggle('flipped',flipped);
  if(flipped&&a)a.style.display='flex';
  if(flipped&&deck[cardIdx]){
    const c=deck[cardIdx];
    recordRecent('glossary','term',c.term,{labelRu:c.term,labelEn:c.term,subRu:c.topic,subEn:c.topic,icon:'📖',link:'словарик терминов/index.html'});
  }
}

function cardAns(knew) {
  const c=deck[cardIdx];
  srsUpdate(c.term, knew);
  if(knew){progress[c.term]='known';cardIdx++;}
  else{
    progress[c.term]=progress[c.term]==='known'?'known':'unknown';
    deck.push(deck.splice(cardIdx,1)[0]);
    if(deck.slice(cardIdx).every(x=>progress[x.term]==='known')) cardIdx=deck.length;
  }
  save(); flipped=false; showCard();
}

// ── QUIZ ─────────────────────────────────────────────────────
let qDeck=[], qIdx=0, qScore=0, qAnswered=false;

function initQuiz() {
  const f=filtered();
  if(f.length<4){document.getElementById('mainContent').innerHTML=`<div class="empty-state">${t('emptyQuiz')}</div>`;return;}
  qDeck=shuffle(f); qIdx=0; qScore=0; showQ();
}

function showQ() {
  const mc=document.getElementById('mainContent');
  if(qIdx>=qDeck.length){
    const pct=Math.round(qScore/qDeck.length*100);
    mc.innerHTML=`<div class="quiz-wrap"><div class="quiz-result-box">
      <div class="score-big">${pct}%</div>
      <div class="score-sub">${t('quizResult')} ${qScore} / ${qDeck.length}</div>
      <button class="btn btn-primary" onclick="initQuiz()">${t('restart')}</button>
    </div></div>`;return;
  }
  const q=qDeck[qIdx];
  // Wrong options from ALL terms (same language)
  const wrong=shuffle(TERMS.filter(x=>x.term!==q.term)).slice(0,3);
  const opts=shuffle([q,...wrong]);
  qAnswered=false;
  mc.innerHTML=`<div class="quiz-wrap">
    <div class="quiz-meta">
      <span class="quiz-counter">${qIdx+1} / ${qDeck.length}</span>
      <span class="quiz-score-badge">✓ ${qScore}</span>
    </div>
    <div class="quiz-card">
      <div class="quiz-q">${q.term}</div>
      <div class="quiz-topic-row">
        <span class="badge b-${q.topic}">${topicLabel(q.topic)}</span>
        <span class="badge b-cls">${clsLabel(q.cls)}</span>
      </div>
      <div class="quiz-options">
        ${opts.map(o=>`<button class="quiz-opt" onclick="qAns(this,'${o.term}','${q.term}')">${def(o)}</button>`).join('')}
      </div>
    </div>
  </div>
  <div class="quiz-next-bar" id="qnextBar">
    <button class="btn btn-primary" id="qnext" onclick="nextQ()">${t('nextQ')}</button>
  </div>`;
}

function qAns(btn,chosen,correct) {
  if(qAnswered)return; qAnswered=true;
  document.querySelectorAll('.quiz-opt').forEach(b=>b.disabled=true);
  if(chosen===correct){
    btn.classList.add('correct'); qScore++; progress[correct]='known';
    save();
    setTimeout(nextQ,900);
  } else {
    btn.classList.add('wrong');
    // highlight correct
    const correctCard = TERMS.find(x=>x.term===correct);
    const correctDef = def(correctCard);
    document.querySelectorAll('.quiz-opt').forEach(b=>{if(b.textContent===correctDef)b.classList.add('correct');});
    save();
    const bar=document.getElementById('qnextBar');
    if(bar)bar.classList.add('show');
  }
}

function nextQ(){qIdx++;showQ();}

// ── MATCH ─────────────────────────────────────────────────────
let mPairs=[], mSel=null, mMatched=[], mErrors=0, mStart=0;

function initMatch() {
  const f=filtered();
  if(f.length<2){document.getElementById('mainContent').innerHTML=`<div class="empty-state">${t('emptyMatch')}</div>`;return;}
  mPairs=shuffle(f).slice(0,6);
  window._mT=shuffle(mPairs.map((p,i)=>({text:p.term,id:i})));
  window._mD=shuffle(mPairs.map((p,i)=>({text:def(p),id:i})));
  mSel=null; mMatched=[]; mErrors=0; mStart=Date.now();
  renderMatch();
}

function renderMatch() {
  const mc=document.getElementById('mainContent');
  mc.innerHTML=`<div class="match-wrap">
    <div class="match-info">${t('matchInfo')} · ${mPairs.length} ${t('matchOf')}</div>
    <div class="match-grid">
      <div class="match-col">
        ${window._mT.map((x,i)=>`<div class="match-item" data-side="term" data-id="${x.id}" onclick="mClick(this)"><span class="match-term-text">${x.text}</span></div>`).join('')}
      </div>
      <div class="match-col">
        ${window._mD.map((x,i)=>`<div class="match-item" data-side="def" data-id="${x.id}" onclick="mClick(this)">${x.text}</div>`).join('')}
      </div>
    </div>
    <div class="match-status" id="mst">${t('matchStatus')(0,mPairs.length)}</div>
  </div>`;
}

function mClick(el) {
  if(el.classList.contains('matched'))return;
  const side=el.dataset.side, id=parseInt(el.dataset.id);
  if(!mSel){mSel={el,side,id};el.classList.add('selected');return;}
  if(mSel.el===el){el.classList.remove('selected');mSel=null;return;}
  if(mSel.side===side){mSel.el.classList.remove('selected');mSel={el,side,id};el.classList.add('selected');return;}
  const prev=mSel; mSel=null;
  if(prev.id===id){
    prev.el.classList.remove('selected'); prev.el.classList.add('matched'); el.classList.add('matched');
    mMatched.push(id);
    document.getElementById('mst').textContent=t('matchStatus')(mMatched.length,mPairs.length);
    if(mMatched.length===mPairs.length){
      const sec=Math.round((Date.now()-mStart)/1000);
      setTimeout(()=>{
        document.getElementById('mainContent').innerHTML=`<div class="match-wrap"><div class="match-done-box">
          <h2>${t('matchDone')}</h2>
          <p>${t('matchDoneStats')(mErrors,sec)}</p>
          <button class="btn btn-primary" onclick="initMatch()">${t('playAgain')}</button>
        </div></div>`;
      },350);
    }
  } else {
    mErrors++;
    prev.el.classList.remove('selected'); prev.el.classList.add('wrong-flash'); el.classList.add('wrong-flash');
    setTimeout(()=>{prev.el.classList.remove('wrong-flash');el.classList.remove('wrong-flash');},550);
  }
}

// ── INIT ──────────────────────────────────────────────────────
applyUI();
renderAll();
</script>

(function(){

for(var i=0;i<8;i++)EXP_TABLE[i]=1<<i;
for(var i=8;i<256;i++)EXP_TABLE[i]=EXP_TABLE[i-4]^EXP_TABLE[i-5]^EXP_TABLE[i-6]^EXP_TABLE[i-8];
for(var i=0;i<255;i++)LOG_TABLE[EXP_TABLE[i]]=i;
function glog(n){if(n<1)throw new Error("glog");return LOG_TABLE[n];}
function gexp(n){while(n<0)n+=255;while(n>=256)n-=255;return EXP_TABLE[n];}
function QRPolynomial(num,shift){
  var offset=0;while(offset<num.length&&num[offset]===0)offset++;
  this.num=new Array(num.length-offset+shift);
  for(var i=0;i<num.length-offset;i++)this.num[i]=num[i+offset];

QRPolynomial.prototype.get=function(i){return this.num[i];};
QRPolynomial.prototype.getLength=function(){return this.num.length;};
QRPolynomial.prototype.multiply=function(e){
  var num=new Array(this.getLength()+e.getLength()-1);

  4:{L:[[1,100,80]],M:[[2,50,32]],Q:[[2,50,24]],H:[[4,25,9]]},
  5:{L:[[1,134,108]],M:[[2,67,43]],Q:[[2,33,15],[2,34,16]],H:[[2,33,11],[2,34,12]]},
  6:{L:[[2,86,68]],M:[[4,43,27]],Q:[[4,43,19]],H:[[4,43,15]]},
  7:{L:[[2,98,78]],M:[[4,49,31]],Q:[[2,32,14],[4,33,15]],H:[[4,39,13],[1,40,14]]},
  8:{L:[[2,121,97]],M:[[2,60,38],[2,61,39]],Q:[[4,40,18],[2,41,19]],H:[[4,40,14],[2,41,15]]},
  9:{L:[[2,146,116]],M:[[3,58,36],[2,59,37]],Q:[[4,36,16],[4,37,17]],H:[[4,36,12],[4,37,13]]},
  10:{L:[[2,86,68],[2,87,69]],M:[[4,69,43],[1,70,44]],Q:[[6,43,19],[2,44,20]],H:[[6,43,15],[2,44,16]]}
};
function getRSBlocks(typeNumber,ecName){
  var rows=RS_BLOCK_TABLE[typeNumber][ecName],list=[];
  for(var r=0;r<rows.length;r++){var row=rows[r];for(var i=0;i<row[0];i++)list.push({totalCount:row[1],dataCount:row[2]});}
  return list;
}
var PATTERN_POSITION_TABLE={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
var G15=(1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0);
var G15_MASK=(1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1);
function getBCHDigit(data){var d=0;while(data!==0){d++;data>>>=1;}return d;}
function getBCHTypeInfo(data){
  var d=data<<10;
  while(getBCHDigit(d)-getBCHDigit(G15)>=0)d^=(G15<<(getBCHDigit(d)-getBCHDigit(G15)));
  return((data<<10)|d)^G15_MASK;
}
function totalDataBits(typeNumber,ecName){var b=getRSBlocks(typeNumber,ecName),t=0;for(var i=0;i<b.length;i++)t+=b[i].dataCount;return t*8;}
function QRBitBuffer(){this.buffer=[];this.length=0;}
QRBitBuffer.prototype.put=function(num,length){for(var i=0;i<length;i++)this.putBit(((num>>>(length-i-1))&1)===1);};
QRBitBuffer.prototype.putBit=function(bit){
  var bufIndex=Math.floor(this.length/8);
  if(this.buffer.length<=bufIndex)this.buffer.push(0);
  if(bit)this.buffer[bufIndex]|=(0x80>>>(this.length%8));
  this.length++;
};
function stringToUtf8Bytes(str){
  var bytes=[];
  for(var i=0;i<str.length;i++){
    var c=str.codePointAt(i);
    if(c>0xFFFF)i++;
    if(c<0x80)bytes.push(c);
    else if(c<0x800){bytes.push(0xC0|(c>>6),0x80|(c&0x3F));}
    else if(c<0x10000){bytes.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F));}
    else{bytes.push(0xF0|(c>>18),0x80|((c>>12)&0x3F),0x80|((c>>6)&0x3F),0x80|(c&0x3F));}
  }
  return bytes;
}
function createData(typeNumber,ecName,dataBytes){
  var buffer=new QRBitBuffer();
  buffer.put(QRMode.MODE_8BIT_BYTE,4);
  var lenBits=(typeNumber<=9)?8:16;
  buffer.put(dataBytes.length,lenBits);
  for(var i=0;i<dataBytes.length;i++)buffer.put(dataBytes[i],8);
  var rsBlocks=getRSBlocks(typeNumber,ecName);
  var totalDataCount=0;for(var i=0;i<rsBlocks.length;i++)totalDataCount+=rsBlocks[i].dataCount;
  if(buffer.length+4<=totalDataCount*8)buffer.put(0,4);
  while(buffer.length%8!==0)buffer.putBit(false);
  var PAD0=0xEC,PAD1=0x11;
  while(true){
    if(buffer.length>=totalDataCount*8)break;
    buffer.put(PAD0,8);
    if(buffer.length>=totalDataCount*8)break;
    buffer.put(PAD1,8);
  }
  return createBytes(buffer,rsBlocks);
}
function createBytes(buffer,rsBlocks){
  var offset=0,maxDcCount=0,maxEcCount=0;
  var dcdata=new Array(rsBlocks.length),ecdata=new Array(rsBlocks.length);
  for(var r=0;r<rsBlocks.length;r++){
    var dcCount=rsBlocks[r].dataCount,ecCount=rsBlocks[r].totalCount-dcCount;
    maxDcCount=Math.max(maxDcCount,dcCount);maxEcCount=Math.max(maxEcCount,ecCount);
    dcdata[r]=new Array(dcCount);
    for(var i=0;i<dcdata[r].length;i++)dcdata[r][i]=0xff&buffer.buffer[i+offset];
    offset+=dcCount;
    var rsPoly=getErrorCorrectPolynomial(ecCount);
    var rawPoly=new QRPolynomial(dcdata[r],rsPoly.getLength()-1);
    var modPoly=rawPoly.mod(rsPoly);
    ecdata[r]=new Array(rsPoly.getLength()-1);
    for(var i=0;i<ecdata[r].length;i++){var mi=i+modPoly.getLength()-ecdata[r].length;ecdata[r][i]=(mi>=0)?modPoly.get(mi):0;}
  }
  var totalCodeCount=0;for(var i=0;i<rsBlocks.length;i++)totalCodeCount+=rsBlocks[i].totalCount;
  var data=new Array(totalCodeCount),index=0;
  for(var i=0;i<maxDcCount;i++)for(var r=0;r<rsBlocks.length;r++)if(i<dcdata[r].length)data[index++]=dcdata[r][i];
  for(var i=0;i<maxEcCount;i++)for(var r=0;r<rsBlocks.length;r++)if(i<ecdata[r].length)data[index++]=ecdata[r][i];
  return data;
}
function QRCodeModel(typeNumber,ecName){this.typeNumber=typeNumber;this.ecLevelName=ecName;this.modules=null;this.moduleCount=0;this.dataCache=null;}
QRCodeModel.prototype.isDark=function(row,col){return this.modules[row][col];};
QRCodeModel.prototype.setupPositionProbePattern=function(row,col){
  for(var r=-1;r<=7;r++){
    if(row+r<=-1||this.moduleCount<=row+r)continue;
    for(var c=-1;c<=7;c++){
      if(col+c<=-1||this.moduleCount<=col+c)continue;
      if((0<=r&&r<=6&&(c===0||c===6))||(0<=c&&c<=6&&(r===0||r===6))||(2<=r&&r<=4&&2<=c&&c<=4))this.modules[row+r][col+c]=true;
      else this.modules[row+r][col+c]=false;
    }
  }
};
QRCodeModel.prototype.getBestMaskPattern=function(){
  var minLostPoint=0,pattern=0;
  for(var i=0;i<8;i++){
    this.makeImpl(true,i);
    var lp=getLostPoint(this);
    if(i===0||minLostPoint>lp){minLostPoint=lp;pattern=i;}
  }
  return pattern;
};
QRCodeModel.prototype.setupTimingPattern=function(){
  for(var r=8;r<this.moduleCount-8;r++){if(this.modules[r][6]!=null)continue;this.modules[r][6]=(r%2===0);}
  for(var c=8;c<this.moduleCount-8;c++){if(this.modules[6][c]!=null)continue;this.modules[6][c]=(c%2===0);}
};
QRCodeModel.prototype.setupPositionAdjustPattern=function(){
  var pos=PATTERN_POSITION_TABLE[this.typeNumber]||[];
  for(var i=0;i<pos.length;i++)for(var j=0;j<pos.length;j++){
    var row=pos[i],col=pos[j];
    if(this.modules[row][col]!=null)continue;
    for(var r=-2;r<=2;r++)for(var c=-2;c<=2;c++){
      if(r===-2||r===2||c===-2||c===2||(r===0&&c===0))this.modules[row+r][col+c]=true;
      else this.modules[row+r][col+c]=false;
    }
  }
};
QRCodeModel.prototype.setupTypeNumber=function(test){
  if(this.typeNumber<7)return;
  var G=(1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0);
  function digit(x){var n=0;while(x!==0){n++;x>>>=1;}return n;}
  function bch(data){var d=data<<12;while(digit(d)-digit(G)>=0)d^=(G<<(digit(d)-digit(G)));return(data<<12)|d;}
  var bits=bch(this.typeNumber);
  for(var i=0;i<18;i++){var mod=(!test&&((bits>>i)&1)===1);this.modules[Math.floor(i/3)][i%3+this.moduleCount-8-3]=mod;}
  for(var i=0;i<18;i++){var mod=(!test&&((bits>>i)&1)===1);this.modules[i%3+this.moduleCount-8-3][Math.floor(i/3)]=mod;}
};
QRCodeModel.prototype.setupTypeInfo=function(test,maskPattern){
  var data=(QRErrorCorrectLevel[this.ecLevelName]<<3)|maskPattern;
  var bits=getBCHTypeInfo(data);
  for(var i=0;i<15;i++){
    var mod=(!test&&((bits>>i)&1)===1);
    if(i<6)this.modules[i][8]=mod;else if(i<8)this.modules[i+1][8]=mod;else this.modules[this.moduleCount-15+i][8]=mod;
  }
  for(var i=0;i<15;i++){
    var mod=(!test&&((bits>>i)&1)===1);
    if(i<8)this.modules[8][this.moduleCount-i-1]=mod;else if(i<9)this.modules[8][15-i-1+1]=mod;else this.modules[8][15-i-1]=mod;
  }
  this.modules[this.moduleCount-8][8]=!test;
};
function maskFunc(p,i,j){
  switch(p){
    case 0:return(i+j)%2===0; case 1:return i%2===0; case 2:return j%3===0; case 3:return(i+j)%3===0;
    case 4:return(Math.floor(i/2)+Math.floor(j/3))%2===0; case 5:return(i*j)%2+(i*j)%3===0;
    case 6:return((i*j)%2+(i*j)%3)%2===0; case 7:return((i*j)%3+(i+j)%2)%2===0;
  }
}
QRCodeModel.prototype.mapData=function(data,maskPattern){
  var inc=-1,row=this.moduleCount-1,bitIndex=7,byteIndex=0;
  for(var col=this.moduleCount-1;col>0;col-=2){
    if(col===6)col--;
    while(true){
      for(var c=0;c<2;c++){
        if(this.modules[row][col-c]==null){
          var dark=false;
          if(byteIndex<data.length)dark=(((data[byteIndex]>>>bitIndex)&1)===1);
          var mask=maskFunc(maskPattern,row,col-c);
          if(mask)dark=!dark;
          this.modules[row][col-c]=dark;
          bitIndex--;
          if(bitIndex===-1){byteIndex++;bitIndex=7;}
        }
      }
      row+=inc;
      if(row<0||this.moduleCount<=row){row-=inc;inc=-inc;break;}
    }
  }
};
QRCodeModel.prototype.makeImpl=function(test,maskPattern){
  this.moduleCount=this.typeNumber*4+17;
  this.modules=new Array(this.moduleCount);
  for(var row=0;row<this.moduleCount;row++){this.modules[row]=new Array(this.moduleCount);for(var col=0;col<this.moduleCount;col++)this.modules[row][col]=null;}
  this.setupPositionProbePattern(0,0);
  this.setupPositionProbePattern(this.moduleCount-7,0);
  this.setupPositionProbePattern(0,this.moduleCount-7);
  this.setupPositionAdjustPattern();
  this.setupTimingPattern();
  this.setupTypeInfo(test,maskPattern);
  this.setupTypeNumber(test);
  if(this.dataCache==null)this.dataCache=createData(this.typeNumber,this.ecLevelName,this.dataBytes);
  this.mapData(this.dataCache,maskPattern);
};
QRCodeModel.prototype.make=function(dataBytes){this.dataBytes=dataBytes;var mp=this.getBestMaskPattern();this.makeImpl(false,mp);};
function getLostPoint(qr){
  var n=qr.moduleCount,lp=0;
  for(var row=0;row<n;row++)for(var col=0;col<n;col++){
    var sameCount=0,dark=qr.isDark(row,col);
    for(var r=-1;r<=1;r++){
      if(row+r<0||n<=row+r)continue;
      for(var c=-1;c<=1;c++){
        if(col+c<0||n<=col+c)continue; if(r===0&&c===0)continue;
        if(dark===qr.isDark(row+r,col+c))sameCount++;
      }
    }
    if(sameCount>5)lp+=(3+sameCount-5);
  }
  for(var row=0;row<n-1;row++)for(var col=0;col<n-1;col++){
    var cnt=0;
    if(qr.isDark(row,col))cnt++; if(qr.isDark(row+1,col))cnt++; if(qr.isDark(row,col+1))cnt++; if(qr.isDark(row+1,col+1))cnt++;
    if(cnt===0||cnt===4)lp+=3;
  }
  for(var row=0;row<n;row++)for(var col=0;col<n-6;col++){
    if(qr.isDark(row,col)&&!qr.isDark(row,col+1)&&qr.isDark(row,col+2)&&qr.isDark(row,col+3)&&qr.isDark(row,col+4)&&!qr.isDark(row,col+5)&&qr.isDark(row,col+6))lp+=40;
  }
  for(var col=0;col<n;col++)for(var row=0;row<n-6;row++){
    if(qr.isDark(row,col)&&!qr.isDark(row+1,col)&&qr.isDark(row+2,col)&&qr.isDark(row+3,col)&&qr.isDark(row+4,col)&&!qr.isDark(row+5,col)&&qr.isDark(row+6,col))lp+=40;
  }
  var darkCount=0;
  for(var col=0;col<n;col++)for(var row=0;row<n;row++)if(qr.isDark(row,col))darkCount++;
  lp+=Math.abs(100*darkCount/n/n-50)/5*10;
  return lp;
}
function generateQRMatrix(text,ecName){
  ecName=ecName||'M';
  var bytes=stringToUtf8Bytes(text);
  for(var tn=1;tn<=10;tn++){
    var lenBits=(tn<=9)?8:16;
    var capacityBits=totalDataBits(tn,ecName);
    var neededBits=4+lenBits+bytes.length*8;
    if(neededBits<=capacityBits){
      var model=new QRCodeModel(tn,ecName);
      model.make(bytes);
      return{moduleCount:model.moduleCount,modules:model.modules,version:tn};
    }
  }
  throw new Error("QR: data too long");
}
window.renderQR=function(text,canvas){
  var res=generateQRMatrix(text,'M');
  var n=res.moduleCount,quiet=3,scale=Math.max(3,Math.floor(240/(n+quiet*2)));
  var size=(n+quiet*2)*scale;
  canvas.width=size;canvas.height=size;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#000';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(res.modules[r][c])ctx.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale);
};
})();

// ── Assignment helpers ──────────────────────────────────────────
const TOPIC_LIST=['all','темп','динамика','характер','форма','нотация'];
const CLS_LIST=['all','1-2','3-4','5-6','7-8'];
let activeAssignment=null;
let teacherResultInfo=null;

function topicDisplay(tp){ return tp==='all' ? t('topicAll') : topicLabel(tp); }
function clsDisplay(cls){ return cls==='all' ? t('clsAll') : clsLabel(cls); }
function buildAssignLink(tp,cls){ return location.origin+location.pathname+'?a='+encodeURIComponent('A1|'+tp+'|'+cls); }
function buildResultLink(tp,cls,correct,total){
  const now=new Date();
  const ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return location.origin+location.pathname+'?r='+encodeURIComponent('R1|'+tp+'|'+cls+'|'+correct+'|'+total+'|'+ts);
}
function parseAssignCode(code){
  const p=code.split('|');
  if(p[0]!=='A1'||p.length<3||TOPIC_LIST.indexOf(p[1])===-1||CLS_LIST.indexOf(p[2])===-1)return null;
  return {topic:p[1],cls:p[2]};
}
function parseResultCode(code){
  const p=code.split('|');
  if(p[0]!=='R1'||p.length<6)return null;
  return {topic:p[1],cls:p[2],correct:Number(p[3])||0,total:Number(p[4])||0,ts:p.slice(5).join('|')};
}
function openAssignModal(){
  document.getElementById('amTopic').value=filterTopic;
  document.getElementById('amCls').value=filterCls;
  document.getElementById('amResultBlock').style.display='none';
  document.getElementById('assignModalOv').classList.add('show');
}
function closeAssignModal(){ document.getElementById('assignModalOv').classList.remove('show'); }
function renderQRSafe(link, canvasEl, errEl){

    canvasEl.style.display='';

    errEl.style.display='none';

}
function generateAssignLink(){
  const tp=document.getElementById('amTopic').value, cls=document.getElementById('amCls').value;
  const link=buildAssignLink(tp,cls);
  document.getElementById('amLinkInput').value=link;
  document.getElementById('amResultBlock').style.display='block';
  renderQRSafe(link, document.getElementById('amQrCanvas'), document.getElementById('amQrError'));
}
function copyAssignLink(){

function dismissAssignBanner(){ const b=document.getElementById('assignBanner'); if(b)b.classList.remove('show'); }
function showAssignBanner(info){
  const el=document.getElementById('assignBannerText');
  if(el) el.textContent=t('assignBannerPrefix')+topicDisplay(info.topic)+', '+clsDisplay(info.cls);
  const banner=document.getElementById('assignBanner');

function openShareResultModal(){
  if(!activeAssignment)return;
  const total=qDeck.length||0, correct=qScore||0;

function showTeacherResultView(res){
  teacherResultInfo=res;
  document.getElementById('rvTitle').textContent=t('rvTitle');

}

// ── Apply ?a= / ?r= from URL on load ─────────────────────────────
(function initAssignmentFromUrl(){
  const params=new URLSearchParams(location.search);
  const rCode=params.get('r');
  if(rCode){
    const res=parseResultCode(rCode);
    if(res){ showTeacherResultView(res); return; }
  }
  const aCode=params.get('a');
  if(aCode){
    const info=parseAssignCode(aCode);
    if(info){
      activeAssignment=info;
      setTopic(info.topic);
      setCls(info.cls);
      switchMode('quiz');
      showAssignBanner(info);
      const btn=document.getElementById('shareResultBtn'); if(btn)btn.style.display='flex';
    }
  }
})();

<script>
/* Клавиатурная доступность: элементы с onclick (не <button>/<a>/полям форм)
   становятся фокусируемыми и активируются Enter/Space — включая те,
   что добавляются в DOM динамически (пианино, варианты викторин и т.п.). */
(function(){
  function tagEl(el){
    if(!el || !el.hasAttribute || !el.hasAttribute('onclick')) return;
    var tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL') return;
    if(el.hasAttribute('data-a11y-kb')) return;
    el.setAttribute('data-a11y-kb','1');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  }
  function scan(root){
    if(!root||!root.querySelectorAll) return;
    tagEl(root);
    root.querySelectorAll('[onclick]').forEach(tagEl);
  }
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
    var el=document.activeElement;
    if(el && el.getAttribute && el.hasAttribute('onclick') && el.getAttribute('role')==='button'){
      e.preventDefault();
      el.click();
    }
  });
  if(document.body) scan(document.body);
  else document.addEventListener('DOMContentLoaded', function(){ scan(document.body); });
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){ if(n.nodeType===1) scan(n); });
    });
  });
  if(document.body) mo.observe(document.body,{childList:true,subtree:true});
  else document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); });
})();
</script>
