const TRANS_INSTR = [

let lang=localStorage.getItem('musicapp_lang')||'ru', quizScore2={c:0,w:0}, quizCorrect2=null;

// ── Звук / вибрация / тряска на верный-неверный ответ ──
function musicappSoundOn(){return localStorage.getItem('musicapp_sound_enabled')!=='0';}
let _fbCtx=null;
function _fbAudioCtx(){
  if(!_fbCtx){try{_fbCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  return _fbCtx;
}
function playAnswerSound(ok){
  if(!musicappSoundOn())return;
  const ctx=_fbAudioCtx();
  if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume();
  const now=ctx.currentTime;
  if(ok){
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      const t=now+i*0.07;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.18,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      o.start(t);o.stop(t+0.36);
    });
  }else{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(220,now);o.frequency.exponentialRampToValueAtTime(140,now+0.18);
    o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0.16,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.22);
    o.start(now);o.stop(now+0.23);
  }
}
function vibrateAnswer(ok){
  if(!musicappSoundOn())return;
  if(!('vibrate' in navigator))return;
  try{navigator.vibrate(ok?20:[40,40,40]);}catch(e){}
}
function shakeEl(el){
  if(!el)return;
  el.classList.remove('musicapp-shake');
  void el.offsetWidth;
  el.classList.add('musicapp-shake');
  setTimeout(()=>el.classList.remove('musicapp-shake'),400);
}
function answerFeedback(ok,el){
  playAnswerSound(ok);
  vibrateAnswer(ok);

}

let quizStreak=0, quizBestStreak=parseInt(localStorage.getItem('musicapp_transposition_best_streak')||'0',10)||0;
let quizChosenVal=null;

let instrScore={c:0,w:0}, instrCorrect=null, instrChosenVal=null;

/* ─── TAB 0: NOTE TRANSPOSITION ─────────────────── */
function calcNote(){
  const noteIdx=parseInt(document.getElementById('noteFrom').value);
  const ivIdx=parseInt(document.getElementById('intervalSel').value);
  const semis=INTERVALS[ivIdx].semis;
  const resultIdx=((noteIdx+semis)%12+12)%12;
  const resultEN=NOTE_EN[resultIdx];
  const resultRU=NOTE_RU[resultIdx];
  document.getElementById('resultNote').textContent=lang==='ru'?resultRU:resultEN;
  const L=lang==='ru';
  document.getElementById('resultLabel').textContent=L?'результат':'result';
  // tip
  const srcNote=L?NOTE_RU[noteIdx]:NOTE_EN[noteIdx];
  const ivName=INTERVALS[ivIdx][lang];
  document.getElementById('noteTip').textContent=
    (L?`${srcNote} + ${ivName} = ${resultRU} (${resultEN})`
      :`${NOTE_EN[noteIdx]} + ${ivName} = ${resultEN}`);
}

/* ─── TAB 1: SCALE TRANSPOSITION ────────────────── */
function calcScale(){
  const fi=parseInt(document.getElementById('keyFrom').value);
  const ti=parseInt(document.getElementById('keyTo').value);
  const fk=KEYS[fi], tk=KEYS[ti];

  const sfEl=document.getElementById('scaleFrom');
  const stEl=document.getElementById('scaleTo');
  sfEl.innerHTML=fk.notes.map((n,i)=>
    `<span class="sc${i===0?' root':''}">${n}</span>`).join('');
  stEl.innerHTML=tk.notes.map((n,i)=>
    `<span class="sc${i===0?' root':' hi'}">${n}</span>`).join('');

  // tip: semitone diff — показываем как более короткое направление (вверх или вниз)
  const diff=((tk.root-fk.root)%12+12)%12;
  const L=lang==='ru';
  if(diff===0){
    document.getElementById('scaleTip').textContent=L?'Тональности совпадают':'Same key';
    return;
  }
  const down=diff>6; // если ближе вниз — покажем как спуск
  const semis=down?diff-12:diff;
  const iv=INTERVALS.find(x=>x.semis===semis);
  const ivName=iv?iv[lang]:`${down?12-diff:diff} ${L?'пт':'st'}`;
  document.getElementById('scaleTip').textContent=down
    ?(L?`Транспозиция на ${ivName}`:`Transposed down by ${ivName.replace(/ down$/,'')}`)
    :(L?`Транспозиция на ${ivName} вверх`:`Transposed up by ${ivName}`);
}

/* ─── TAB 2: MELODY TRANSPOSITION ───────────────── */
function noteName(idx){ return lang==='ru'?NOTE_RU[idx]:NOTE_EN[idx]; }
function transposeMelody(mel,semis){ return mel.map(n=>((n+semis)%12+12)%12); }
function melodiesEqual(a,b){ return a.length===b.length && a.every((v,i)=>v===b[i]); }

let curMel=null; // {mel, iv, dir, options} — параметры вопроса, не зависят от языка

function nextMelody(){
  melAnswered=false;
  melChosenIdx=null;
  const mel=MELODIES[Math.floor(Math.random()*MELODIES.length)];
  const magnitudes=INTERVALS.filter(iv=>iv.semis>0&&iv.semis<=12); // величина интервала, направление — отдельно
  const iv=magnitudes[Math.floor(Math.random()*magnitudes.length)];
  const dir=Math.random()<0.5?1:-1; // 1 = вверх, -1 = вниз
  const correct=transposeMelody(mel,iv.semis*dir);

  const options=[correct];
  let guard=0;
  while(options.length<4&&guard<40){
    guard++;
    let variant;
    const kind=Math.floor(Math.random()*4);
    if(kind===0){
      // неверная величина интервала, то же направление
      const wrongIv=magnitudes[Math.floor(Math.random()*magnitudes.length)];
      variant=transposeMelody(mel,wrongIv.semis*dir);
    }else if(kind===1){
      variant=correct.map((n,i)=>i%2===0?n:((n+1)%12));
    }else if(kind===2){
      variant=[...correct].reverse();
    }else{
      // верная величина, но неверное направление — проверяет внимание к вверх/вниз
      variant=transposeMelody(mel,iv.semis*-dir);
    }
    if(!options.some(o=>melodiesEqual(o,variant)))options.push(variant);
  }
  options.sort(()=>Math.random()-.5);
  melCorrectIdx=options.findIndex(o=>melodiesEqual(o,correct));
  curMel={mel,iv,dir,options};
  renderMelody();
}

// Перерисовывает текущий вопрос на активном языке — новых чисел не генерирует
function renderMelody(){
  if(!curMel)return;
  const L=lang==='ru';
  const {mel,iv,dir,options}=curMel;
  document.getElementById('melQ').textContent=L
    ?`Транспонируйте мелодию ${dir>0?'вверх':'вниз'} на ${iv.ru}`
    :`Transpose the melody ${dir>0?'up':'down'} by ${iv.en}`;
  document.getElementById('melOrig').innerHTML=mel.map(n=>`<span class="mel-note">${noteName(n)}</span>`).join('');

  document.getElementById('melChoices').innerHTML=options.map((opt,i)=>{
    let cls='mel-choice';
    if(melAnswered&&i===melCorrectIdx)cls+=' correct';
    else if(melAnswered&&i===melChosenIdx)cls+=' wrong';
    return `<div class="${cls}" data-idx="${i}" onclick="answerMelody(this)">${opt.map(n=>`<span class="mel-note">${noteName(n)}</span>`).join('')}</div>`;
  }).join('');
  document.getElementById('melTip').textContent=L
    ?'Нажмите на вариант мелодии, который получится после транспонирования'
    :'Click the melody option that results from the transposition';
  document.getElementById('melNext').classList.toggle('show',melAnswered);
}

function answerMelody(el){
  if(melAnswered)return;
  melAnswered=true;
  melChosenIdx=parseInt(el.dataset.idx);
  const melOk=melChosenIdx===melCorrectIdx;
  if(melOk)melScore.c++;else melScore.w++;
  answerFeedback(melOk,el);
  document.getElementById('mqsc').textContent=melScore.c;
  document.getElementById('mqsw').textContent=melScore.w;
  renderMelody();
}

/* ─── TAB 3: TRANSPOSING INSTRUMENTS ────────────── */
let curInstr=null; // {instr, noteIdx, toSounding, choiceOrder}

function nextInstrument(){
  instrChosenVal=null;
  const instr=TRANS_INSTR[Math.floor(Math.random()*TRANS_INSTR.length)];
  const noteIdx=Math.floor(Math.random()*12);
  const toSounding=Math.random()<0.5;
  const resultIdx=toSounding
    ?((noteIdx+instr.semis)%12+12)%12
    :((noteIdx-instr.semis)%12+12)%12;
  instrCorrect=resultIdx;
  const wrong=[...Array(12).keys()].filter(x=>x!==resultIdx).sort(()=>Math.random()-.5).slice(0,3);
  const choiceOrder=[resultIdx,...wrong].sort(()=>Math.random()-.5);
  curInstr={instr,noteIdx,toSounding,choiceOrder};
  renderInstrument();
}

function renderInstrument(){
  if(!curInstr)return;
  const L=lang==='ru';
  const {instr,noteIdx,toSounding,choiceOrder}=curInstr;
  const instrName=L?instr.ru:instr.en;
  let questionText;
  if(toSounding){
    questionText=L
      ?`${instrName}: написана нота ${NOTE_RU[noteIdx]} (${NOTE_EN[noteIdx]}). Какая нота звучит реально?`
      :`${instrName}: the written note is ${NOTE_EN[noteIdx]}. What pitch actually sounds?`;
  }else{
    questionText=L
      ?`${instrName}: реально звучит нота ${NOTE_RU[noteIdx]} (${NOTE_EN[noteIdx]}). Что нужно написать в партии?`
      :`${instrName}: the sounding pitch is ${NOTE_EN[noteIdx]}. What should be written in the part?`;
  }
  document.getElementById('instrQ').textContent=questionText;
  document.getElementById('instrTip').textContent=L
    ?'Транспонирующие инструменты звучат не так, как написано в нотах'
    :'Transposing instruments sound different from what is written';

  const answered=instrChosenVal!==null;
  document.getElementById('instrChoices').innerHTML=choiceOrder.map(ci=>{
    const label=L?`${NOTE_RU[ci]} (${NOTE_EN[ci]})`:NOTE_EN[ci];
    let cls='qc';
    if(answered&&ci===instrCorrect)cls+=' correct';
    else if(answered&&ci===instrChosenVal)cls+=' wrong';
    return `<button class="${cls}" data-val="${ci}"${answered?' disabled':''} onclick="answerInstrument(this)">${label}</button>`;
  }).join('');
  document.getElementById('instrNext').classList.toggle('show',answered);
}

function answerInstrument(btn){
  if(instrChosenVal!==null)return;
  instrChosenVal=parseInt(btn.dataset.val);
  const instrOk=instrChosenVal===instrCorrect;
  if(instrOk){instrScore.c++;}else{instrScore.w++;}
  answerFeedback(instrOk,btn);
  document.getElementById('iqsc').textContent=instrScore.c;
  document.getElementById('iqsw').textContent=instrScore.w;
  renderInstrument();
}

/* ─── TAB 4: QUIZ (mixed, with streak) ──────────── */
let curQuiz=null; // {kind, noteIdx, iv, resultIdx, choiceVals}

function nextQuiz2(){
  quizChosenVal=null;
  const kind=Math.random()<0.6?'note':'interval';
  if(kind==='note'){
    const noteIdx=Math.floor(Math.random()*12);
    const usable=INTERVALS.filter(iv=>Math.abs(iv.semis)<=12);
    const iv=usable[Math.floor(Math.random()*usable.length)];
    const resultIdx=((noteIdx+iv.semis)%12+12)%12;
    const wrong=[...Array(12).keys()].filter(x=>x!==resultIdx).sort(()=>Math.random()-.5).slice(0,3);
    const choiceVals=[resultIdx,...wrong].sort(()=>Math.random()-.5);
    curQuiz={kind,noteIdx,iv,resultIdx,choiceVals};
    quizCorrect2={type:'note',val:resultIdx};
  }else{
    const noteIdx=Math.floor(Math.random()*12);
    const upOnly=INTERVALS.filter(iv=>iv.semis>0&&iv.semis<12);
    const iv=upOnly[Math.floor(Math.random()*upOnly.length)];
    const resultIdx=(noteIdx+iv.semis)%12;
    const wrongIvs=upOnly.filter(x=>x.semis!==iv.semis).sort(()=>Math.random()-.5).slice(0,3);
    const choiceVals=[iv,...wrongIvs].sort(()=>Math.random()-.5);
    curQuiz={kind,noteIdx,iv,resultIdx,choiceVals};
    quizCorrect2={type:'interval',val:iv.semis};
  }
  renderQuiz2();
}

function renderQuiz2(){
  if(!curQuiz)return;
  const L=lang==='ru';
  const {kind,noteIdx,iv,resultIdx,choiceVals}=curQuiz;
  const answered=quizChosenVal!==null;
  if(kind==='note'){
    const srcNote=L?NOTE_RU[noteIdx]:NOTE_EN[noteIdx];
    const ivName=iv[lang];
    document.getElementById('quizQ2').textContent=
      L?`Нота ${srcNote} (${NOTE_EN[noteIdx]}) + ${ivName} = ?`
       :`Note ${NOTE_EN[noteIdx]} + ${ivName} = ?`;
    document.getElementById('quizChoices2').innerHTML=choiceVals.map(ci=>{
      const label=L?`${NOTE_RU[ci]} (${NOTE_EN[ci]})`:NOTE_EN[ci];
      let cls='qc';
      if(answered&&ci===quizCorrect2.val)cls+=' correct';
      else if(answered&&ci===quizChosenVal)cls+=' wrong';
      return `<button class="${cls}" data-val="${ci}"${answered?' disabled':''} onclick="answerQuiz2(this)">${label}</button>`;
    }).join('');
  }else{
    const srcNote=L?NOTE_RU[noteIdx]:NOTE_EN[noteIdx];
    const dstNote=L?NOTE_RU[resultIdx]:NOTE_EN[resultIdx];
    document.getElementById('quizQ2').textContent=
      L?`${srcNote} (${NOTE_EN[noteIdx]}) → ${dstNote} (${NOTE_EN[resultIdx]}). Какой это интервал?`
       :`${NOTE_EN[noteIdx]} → ${NOTE_EN[resultIdx]}. What interval is this?`;
    document.getElementById('quizChoices2').innerHTML=choiceVals.map(ci=>{
      let cls='qc';
      if(answered&&ci.semis===quizCorrect2.val)cls+=' correct';
      else if(answered&&ci.semis===quizChosenVal)cls+=' wrong';
      return `<button class="${cls}" data-val="${ci.semis}"${answered?' disabled':''} onclick="answerQuiz2(this)">${ci[lang]}</button>`;
    }).join('');
  }
  document.getElementById('quizNext2').classList.toggle('show',answered);
}

function answerQuiz2(btn){
  if(quizChosenVal!==null)return;
  quizChosenVal=parseInt(btn.dataset.val);
  const correct=quizChosenVal===quizCorrect2.val;
  answerFeedback(correct,btn);
  if(correct){
    quizScore2.c++;
    quizStreak++;
    if(quizStreak>quizBestStreak){
      quizBestStreak=quizStreak;
      localStorage.setItem('musicapp_transposition_best_streak',String(quizBestStreak));
    }
  }else{
    quizScore2.w++;
    quizStreak=0;
  }
  document.getElementById('qsc').textContent=quizScore2.c;
  document.getElementById('qsw').textContent=quizScore2.w;
  document.getElementById('qstreak').textContent=quizStreak;
  document.getElementById('qbest').textContent=quizBestStreak;
  renderQuiz2();
  if(correct)setTimeout(nextQuiz2,1400);
}

function showTab(n){

</script><script>
/* Клавиатурная доступность: элементы с onclick (не <button>/<a>/полям форм)
   становятся фокусируемыми и активируются Enter/Space — включая те,
   что добавляются в DOM динамически (пианино, варианты викторин и т.п.). */
(function(){
  function tagEl(el){
    if(!el || !el.hasAttribute || !el.hasAttribute('onclick')) return;
    var tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL') return;
    if(el.hasAttribute('data-a11y-kb')) return;
    el.setAttribute('data-a11y-kb','1');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  }
  function scan(root){
    if(!root||!root.querySelectorAll) return;
    tagEl(root);
    root.querySelectorAll('[onclick]').forEach(tagEl);
  }
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
    var el=document.activeElement;
    if(el && el.getAttribute && el.hasAttribute('onclick') && el.getAttribute('role')==='button'){
      e.preventDefault();
      el.click();
    }
  });
  if(document.body) scan(document.body);
  else document.addEventListener('DOMContentLoaded', function(){ scan(document.body); });
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){ if(n.nodeType===1) scan(n); });
    });
  });
  if(document.body) mo.observe(document.body,{childList:true,subtree:true});
  else document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); });
})();
</script>
