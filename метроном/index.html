<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Метроном</title>

<script>(function(){var t=localStorage.getItem('musicapp_theme');var dark=t==='dark';document.documentElement.setAttribute('data-theme',dark?'dark':'light');})()</script>
<style>
:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#94a3b8;--border:#e2e8f0;
  --sl100:#f1f5f9;--sl200:#e2e8f0;--blue:#2563eb;--blue2:#1d4ed8;
  --shadow:0 1px 4px rgba(0,0,0,.07);--accent:#2563eb;}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#64748b;
  --border:#334155;--sl100:#334155;--sl200:#475569;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s;min-height:100vh;}
.wrap{max-width:500px;margin:0 auto;padding:16px 14px 40px;}
.hdr{display:flex;justify-content:space-between;align-items:center;
  padding:11px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:18px;margin-bottom:18px;box-shadow:var(--shadow);}
.hdr-back{display:flex;align-items:center;gap:8px;text-decoration:none;
  color:var(--text);font-weight:900;font-size:16px;}
.hdr-back svg{opacity:.55;}
.hdr-btns{display:flex;gap:6px;}
.hbtn{padding:7px 11px;background:var(--sl100);border:none;border-radius:10px;
  font-size:10px;font-weight:800;text-transform:uppercase;cursor:pointer;
  color:var(--text);display:flex;align-items:center;gap:4px;}
.hbtn:hover{background:var(--sl200);}

/* BPM display */
.bpm-card{background:var(--card);border:1px solid var(--border);border-radius:22px;
  padding:28px 20px 24px;box-shadow:var(--shadow);margin-bottom:14px;text-align:center;}
.bpm-label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;
  color:var(--muted);margin-bottom:6px;}
.bpm-display{font-size:72px;font-weight:900;line-height:1;color:var(--blue);
  font-variant-numeric:tabular-nums;transition:transform .08s;}
.bpm-display.pulse{transform:scale(1.06);}
.bpm-name{font-size:13px;font-weight:700;color:var(--muted);margin-top:4px;min-height:20px;}

/* Beat dots */
.beat-row{display:flex;justify-content:center;gap:10px;margin:18px 0 4px;}
.beat-dot{width:16px;height:16px;border-radius:50%;background:var(--sl200);
  transition:background .05s,transform .05s;}
.beat-dot.active{background:var(--blue);transform:scale(1.3);}
.beat-dot.accent{background:#ef4444;transform:scale(1.4);}

/* Pendulum */
.pendulum-wrap{height:90px;display:flex;align-items:flex-start;justify-content:center;
  margin:8px 0 0;overflow:visible;}
.pendulum-arm{width:3px;height:70px;background:var(--blue);border-radius:2px;
  transform-origin:top center;transition:transform 0s;}
.pendulum-bob{width:18px;height:18px;border-radius:50%;background:var(--blue);
  margin:-2px auto 0;box-shadow:0 2px 6px rgba(37,99,235,.4);}

/* Slider */
.slider-wrap{padding:0 4px;margin-bottom:18px;}
input[type=range]{width:100%;height:6px;-webkit-appearance:none;appearance:none;
  background:var(--sl200);border-radius:3px;outline:none;cursor:pointer;}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;
  border-radius:50%;background:var(--blue);cursor:pointer;
  box-shadow:0 1px 4px rgba(37,99,235,.4);}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:none;
  border-radius:50%;background:var(--blue);cursor:pointer;}

/* BPM controls */
.bpm-controls{display:grid;grid-template-columns:1fr auto auto auto 1fr;
  align-items:center;gap:8px;margin-bottom:18px;}
.bpm-adj{padding:10px 18px;background:var(--sl100);border:none;border-radius:12px;
  font-size:18px;font-weight:800;cursor:pointer;color:var(--text);transition:background .15s;}
.bpm-adj:hover{background:var(--sl200);}
.bpm-adj:active{transform:scale(.94);}
.bpm-adj.big{font-size:14px;padding:10px 14px;}

/* Time signature */
.sig-card{background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;}
.sig-label{font-size:10px;font-weight:900;text-transform:uppercase;letter-spacing:.8px;
  color:var(--muted);margin-bottom:10px;}
.sig-row{display:flex;gap:8px;flex-wrap:wrap;}
.sig-btn{flex:1;min-width:60px;padding:9px 6px;border:1.5px solid var(--border);
  border-radius:12px;background:var(--sl100);font-size:14px;font-weight:800;
  cursor:pointer;color:var(--text);text-align:center;transition:all .15s;}
.sig-btn:hover{border-color:var(--blue);}
.sig-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* Sound style */
.sound-card{background:var(--card);border:1px solid var(--border);border-radius:18px;
  padding:16px 18px;box-shadow:var(--shadow);margin-bottom:14px;}
.sound-row{display:flex;gap:8px;}
.sound-btn{flex:1;padding:9px 6px;border:1.5px solid var(--border);border-radius:12px;
  background:var(--sl100);font-size:12px;font-weight:800;cursor:pointer;
  color:var(--text);text-align:center;transition:all .15s;}
.sound-btn:hover{border-color:var(--blue);}
.sound-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}

/* Main button */
.play-btn{width:100%;padding:16px;border:none;border-radius:16px;font-size:17px;
  font-weight:900;cursor:pointer;transition:all .15s;display:flex;align-items:center;
  justify-content:center;gap:10px;margin-bottom:12px;}
.play-btn.start{background:var(--blue);color:#fff;}
.play-btn.stop{background:#ef4444;color:#fff;}
.play-btn:hover{opacity:.9;}
.play-btn:active{transform:scale(.98);}

/* Tap tempo */
.tap-btn{width:100%;padding:13px;border:1.5px dashed var(--border);border-radius:14px;
  background:var(--sl100);font-size:13px;font-weight:800;cursor:pointer;
  color:var(--muted);transition:all .15s;}
.tap-btn:hover{border-color:var(--blue);color:var(--blue);}
.tap-btn:active{background:var(--sl200);transform:scale(.98);}
</style>
</head>
<body>
<div class="wrap">
<a href="../index.html" id="backHomeLink" style="display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;text-decoration:none;opacity:.65;padding:5px 11px;border:1px solid rgba(128,128,128,.25);border-radius:10px;margin-bottom:8px;color:inherit;">← Главная</a>

<div class="hdr">
  <div class="hdr-back">
    <span id="hdrTitle">Метроном</span>
  </div>
  <div class="hdr-btns">
    <button class="hbtn" id="themeBtn">
      <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" id="themeIco">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
      <span id="themeText">Тёмная</span>
    </button>
    <button class="hbtn" id="langBtn"><span id="langText">RU</span></button>
  </div>
</div>

<!-- BPM Card -->
<div class="bpm-card">
  <div class="bpm-label" id="lblBpm">УДАРЫ В МИНУТУ</div>
  <div class="bpm-display" id="bpmDisplay">120</div>
  <div class="bpm-name" id="tempoName">Moderato</div>
  <div class="beat-row" id="beatRow"></div>
  <div class="pendulum-wrap">
    <div>
      <div class="pendulum-arm" id="pendulumArm"></div>
      <div class="pendulum-bob"></div>
    </div>
  </div>
</div>

<!-- Slider -->
<div class="slider-wrap">
  <input type="range" id="bpmSlider" min="30" max="240" value="120">
</div>

<!-- BPM Controls -->
<div class="bpm-controls">
  <button class="bpm-adj big" id="btnM10" onclick="changeBpm(-10)">−10</button>
  <button class="bpm-adj" id="btnM1" onclick="changeBpm(-1)">−</button>
  <div></div>
  <button class="bpm-adj" id="btnP1" onclick="changeBpm(1)">+</button>
  <button class="bpm-adj big" id="btnP10" onclick="changeBpm(10)">+10</button>
</div>

<!-- Time Signature -->
<div class="sig-card">
  <div class="sig-label" id="lblSig">РАЗМЕР</div>
  <div class="sig-row" id="sigRow">
    <button class="sig-btn" data-beats="2" data-div="4" onclick="setSig(this)">2/4</button>
    <button class="sig-btn active" data-beats="3" data-div="4" onclick="setSig(this)">3/4</button>
    <button class="sig-btn" data-beats="4" data-div="4" onclick="setSig(this)">4/4</button>
    <button class="sig-btn" data-beats="6" data-div="8" onclick="setSig(this)">6/8</button>
  </div>
</div>

<!-- Sound Style -->
<div class="sound-card">
  <div class="sig-label" id="lblSound">ЗВУК</div>
  <div class="sound-row">
    <button class="sound-btn active" data-sound="click" onclick="setSound(this)" id="sndClick">Клик</button>
    <button class="sound-btn" data-sound="wood" onclick="setSound(this)" id="sndWood">Дерево</button>
    <button class="sound-btn" data-sound="beep" onclick="setSound(this)" id="sndBeep">Бип</button>
  </div>
</div>

<!-- Play button -->
<button class="play-btn start" id="playBtn" onclick="toggleMetronome()">
  <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" id="playIco">
    <polygon points="5,3 19,12 5,21"/>
  </svg>
  <span id="playLabel">Старт</span>
</button>

<!-- Tap tempo -->
<button class="tap-btn" id="tapBtn" onclick="tapTempo()">
  👆 <span id="tapLabel">Нажимайте в ритм</span>
</button>

</div>

<script>
let lang=localStorage.getItem('musicapp_lang')||'ru';
const TL={
  ru:{title:'Метроном',dark:'Тёмная',light:'Светлая',
    lblBpm:'УДАРЫ В МИНУТУ',lblSig:'РАЗМЕР',lblSound:'ЗВУК',
    start:'Старт',stop:'Стоп',tap:'Нажимайте в ритм',
    sndClick:'Клик',sndWood:'Дерево',sndBeep:'Бип'},
  en:{title:'Metronome',dark:'Dark',light:'Light',
    lblBpm:'BEATS PER MINUTE',lblSig:'TIME SIGNATURE',lblSound:'SOUND',
    start:'Start',stop:'Stop',tap:'Tap to the beat',
    sndClick:'Click',sndWood:'Wood',sndBeep:'Beep'},
};
function t(k){return (TL[lang]||TL.ru)[k]||k;}

const TEMPO_NAMES={
  ru:[
    [20,39,'Larghissimo'],[40,59,'Largo'],[60,65,'Larghetto'],
    [66,75,'Adagio'],[76,107,'Andante'],[108,119,'Moderato'],
    [120,155,'Allegro'],[156,175,'Vivace'],[176,199,'Presto'],[200,240,'Prestissimo']
  ],
  en:[
    [20,39,'Larghissimo'],[40,59,'Largo'],[60,65,'Larghetto'],
    [66,75,'Adagio'],[76,107,'Andante'],[108,119,'Moderato'],
    [120,155,'Allegro'],[156,175,'Vivace'],[176,199,'Presto'],[200,240,'Prestissimo']
  ]
};
function getTempoName(bpm){
  const list=TEMPO_NAMES[lang]||TEMPO_NAMES.ru;
  for(const [lo,hi,name] of list)if(bpm>=lo&&bpm<=hi)return name;
  return '';
}

let bpm=120,beats=3,beatDiv=4,soundType='click';
let isPlaying=false,currentBeat=0;
let schedulerTimer=null,nextBeatTime=0;
let audioCtx=null;

// Tap tempo
let tapTimes=[];
function tapTempo(){
  const now=Date.now();
  tapTimes=tapTimes.filter(t=>now-t<3000);
  tapTimes.push(now);
  if(tapTimes.length>=2){
    const diffs=[];
    for(let i=1;i<tapTimes.length;i++)diffs.push(tapTimes[i]-tapTimes[i-1]);
    const avg=diffs.reduce((a,b)=>a+b)/diffs.length;
    setBpm(Math.round(60000/avg));
  }
}

function changeBpm(delta){setBpm(bpm+delta);}
function setBpm(v){
  bpm=Math.max(30,Math.min(240,v));
  document.getElementById('bpmDisplay').textContent=bpm;
  document.getElementById('bpmSlider').value=bpm;
  document.getElementById('tempoName').textContent=getTempoName(bpm);
  if(isPlaying){stopMetronome();startMetronome();}
}

document.getElementById('bpmSlider').addEventListener('input',function(){setBpm(+this.value);});

function setSig(btn){
  document.querySelectorAll('.sig-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  beats=+btn.dataset.beats;
  beatDiv=+btn.dataset.div;
  currentBeat=0;
  renderBeatDots();
  if(isPlaying){stopMetronome();startMetronome();}
}

function setSound(btn){
  document.querySelectorAll('.sound-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  soundType=btn.dataset.sound;
}

function renderBeatDots(){
  const row=document.getElementById('beatRow');
  row.innerHTML='';
  for(let i=0;i<beats;i++){
    const d=document.createElement('div');
    d.className='beat-dot';
    d.id='dot'+i;
    row.appendChild(d);
  }
}

function initAudio(){
  if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();
  if(audioCtx.state==='suspended')audioCtx.resume();
}

function playClick(time,isAccent){
  const g=audioCtx.createGain();
  g.connect(audioCtx.destination);
  if(soundType==='beep'){
    const o=audioCtx.createOscillator();
    o.connect(g);
    o.frequency.value=isAccent?1200:900;
    g.gain.setValueAtTime(isAccent?.45:.3,time);
    g.gain.exponentialRampToValueAtTime(0.001,time+0.08);
    o.start(time);o.stop(time+0.08);
  } else if(soundType==='wood'){
    // Wood block: noise burst filtered
    const bufLen=audioCtx.sampleRate*0.05;
    const buf=audioCtx.createBuffer(1,bufLen,audioCtx.sampleRate);
    const data=buf.getChannelData(0);
    for(let i=0;i<bufLen;i++)data[i]=(Math.random()*2-1)*(1-i/bufLen);
    const src=audioCtx.createBufferSource();
    src.buffer=buf;
    const filt=audioCtx.createBiquadFilter();
    filt.type='bandpass';
    filt.frequency.value=isAccent?1100:800;
    filt.Q.value=2;
    src.connect(filt);filt.connect(g);
    g.gain.setValueAtTime(isAccent?.7:.5,time);
    g.gain.exponentialRampToValueAtTime(0.001,time+0.05);
    src.start(time);src.stop(time+0.05);
  } else {
    // Click: short sine
    const o=audioCtx.createOscillator();
    o.connect(g);
    o.frequency.value=isAccent?1600:1000;
    g.gain.setValueAtTime(isAccent?.5:.35,time);
    g.gain.exponentialRampToValueAtTime(0.001,time+0.04);
    o.start(time);o.stop(time+0.04);
  }
}

const LOOKAHEAD=100; // ms
const SCHEDULE_AHEAD=0.1; // sec

function scheduler(){
  while(nextBeatTime<audioCtx.currentTime+SCHEDULE_AHEAD){
    const isAccent=currentBeat===0;
    playClick(nextBeatTime,isAccent);
    scheduleBeatUI(currentBeat,nextBeatTime);
    nextBeatTime+=(60/bpm)*(4/beatDiv);
    currentBeat=(currentBeat+1)%beats;
  }
  schedulerTimer=setTimeout(scheduler,LOOKAHEAD);
}

function scheduleBeatUI(beat,time){
  const delay=(time-audioCtx.currentTime)*1000;
  setTimeout(()=>{
    // dots
    document.querySelectorAll('.beat-dot').forEach((d,i)=>{
      d.classList.remove('active','accent');
      if(i===beat)d.classList.add(beat===0?'accent':'active');
    });
    // BPM pulse
    const disp=document.getElementById('bpmDisplay');
    disp.classList.add('pulse');
    setTimeout(()=>disp.classList.remove('pulse'),80);
    // Pendulum
    animatePendulum(beat);
  },Math.max(0,delay));
}

let pendulumDir=1;
function animatePendulum(beat){
  const arm=document.getElementById('pendulumArm');
  const angle=35*pendulumDir;
  arm.style.transition=`transform ${(60/bpm)*0.9*(4/beatDiv)}s ease-in-out`;
  arm.style.transform=`rotate(${angle}deg)`;
  pendulumDir*=-1;
}

function startMetronome(){
  initAudio();
  isPlaying=true;
  currentBeat=0;
  nextBeatTime=audioCtx.currentTime+0.05;
  scheduler();
  const btn=document.getElementById('playBtn');
  btn.className='play-btn stop';
  document.getElementById('playIco').innerHTML='<rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/>';
  document.getElementById('playLabel').textContent=t('stop');
}

function stopMetronome(){
  isPlaying=false;
  clearTimeout(schedulerTimer);
  const btn=document.getElementById('playBtn');
  btn.className='play-btn start';
  document.getElementById('playIco').innerHTML='<polygon points="5,3 19,12 5,21"/>';
  document.getElementById('playLabel').textContent=t('start');
  document.querySelectorAll('.beat-dot').forEach(d=>d.classList.remove('active','accent'));
  const arm=document.getElementById('pendulumArm');
  arm.style.transition='transform .6s ease-in-out';
  arm.style.transform='rotate(0deg)';
  pendulumDir=1;
}

function toggleMetronome(){
  if(isPlaying)stopMetronome();else startMetronome();
}

function applyLang(){
  document.getElementById('backHomeLink').textContent=lang==='ru'?'← Главная':'← Home';
  document.getElementById('hdrTitle').textContent=t('title');
  document.getElementById('lblBpm').textContent=t('lblBpm');
  document.getElementById('lblSig').textContent=t('lblSig');
  document.getElementById('lblSound').textContent=t('lblSound');
  document.getElementById('playLabel').textContent=isPlaying?t('stop'):t('start');
  document.getElementById('tapLabel').textContent=t('tap');
  document.getElementById('sndClick').textContent=t('sndClick');
  document.getElementById('sndWood').textContent=t('sndWood');
  document.getElementById('sndBeep').textContent=t('sndBeep');
  document.getElementById('langText').textContent=lang==='ru'?'RU':'EN';
  document.getElementById('tempoName').textContent=getTempoName(bpm);
  const dk=document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('themeText').textContent=dk?t('light'):t('dark');
}

document.getElementById('langBtn').addEventListener('click',()=>{
  lang=lang==='ru'?'en':'ru';localStorage.setItem('musicapp_lang',lang);applyLang();
});
document.getElementById('themeBtn').addEventListener('click',()=>{
  const dk=document.documentElement.getAttribute('data-theme')==='dark';
  document.documentElement.setAttribute('data-theme',dk?'light':'dark');
  localStorage.setItem('musicapp_theme',dk?'light':'dark');
  document.getElementById('themeText').textContent=dk?t('dark'):t('light');
  document.getElementById('themeIco').innerHTML=dk
    ?'<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>'
    :'<circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>';
});

// Init
renderBeatDots();
applyLang();
</script>
</body>
</html>
