<style>
/* Отключаем системный жест pull-to-refresh (стрелка/спиннер при потягивании вниз) — приложение уже показывает свой интерфейс, обновление страницы через этот жест не нужно и мешает свайпам внутри модулей. */
html,body{overscroll-behavior-y:contain;}

:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#94a3b8;--border:#e2e8f0;
  --sl100:#f1f5f9;--sl200:#e2e8f0;--blue:#2563eb;--blue2:#1d4ed8;
  --green:#16a34a;--red:#dc2626;--shadow:0 1px 4px rgba(0,0,0,.07);}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#64748b;
  --border:#334155;--sl100:#334155;--sl200:#475569;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s;}
.wrap{max-width:960px;margin:0 auto;padding:12px 14px;}
.hdr{display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.hdr-title{font-weight:900;font-size:15px;}
.hdr-sub{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}
.hdr-btns{display:flex;gap:6px;}
.hbtn{padding:6px 11px;background:var(--sl100);border:none;border-radius:10px;
  font-size:10px;font-weight:800;text-transform:uppercase;cursor:pointer;
  color:var(--text);display:flex;align-items:center;gap:5px;}
.hbtn:hover{background:var(--sl200);}
.main{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:start;}
@media(max-width:640px){.main{grid-template-columns:1fr;}}
.circle-wrap{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:16px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;}
.circle-wrap svg{max-width:360px;width:100%;}
.sector{cursor:pointer;transition:opacity .15s;}
.sector:hover{opacity:.85;}
.sector.active{filter:brightness(1.15);}
.side{display:flex;flex-direction:column;gap:12px;}
.info-card{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:18px;box-shadow:var(--shadow);min-height:260px;}
.info-empty{display:flex;align-items:center;justify-content:center;
  height:100%;color:var(--muted);font-size:13px;font-weight:600;text-align:center;}
.info-key-name{font-size:22px;font-weight:900;margin-bottom:4px;}
.info-signs{font-size:13px;color:var(--muted);font-weight:600;margin-bottom:14px;}
.info-row{display:flex;justify-content:space-between;align-items:center;
  padding:8px 0;border-bottom:1px solid var(--border);font-size:12px;}
.info-row:last-child{border-bottom:none;}
.info-lbl{color:var(--muted);font-weight:700;}
.info-val{font-weight:800;text-align:right;}
.notes-grid{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0;}
.note-chip{padding:4px 9px;background:var(--sl100);border-radius:8px;
  font-size:11px;font-weight:800;}
.note-chip.root{background:var(--blue);color:#fff;}
.mode-row{display:flex;gap:6px;margin-bottom:12px;}
.mode-btn{padding:6px 14px;background:var(--sl100);border:none;border-radius:10px;
  font-size:11px;font-weight:800;cursor:pointer;color:var(--text);}
.mode-btn.active{background:var(--blue);color:#fff;}
.quiz-panel{background:var(--card);border:1px solid var(--border);border-radius:20px;
  padding:18px;box-shadow:var(--shadow);}
.quiz-q{font-size:15px;font-weight:800;margin-bottom:14px;line-height:1.4;}
.quiz-choices{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-bottom:12px;}
.qc{padding:10px;border:2px solid var(--border);border-radius:12px;
  background:var(--card);font-size:12px;font-weight:700;cursor:pointer;
  text-align:center;transition:all .15s;color:var(--text);}
.qc:hover:not(:disabled){border-color:var(--blue);}
.qc.correct{background:#dcfce7;border-color:var(--green);color:#166534;}
.qc.wrong{background:#fee2e2;border-color:var(--red);color:#991b1b;}
[data-theme="dark"] .qc.correct{background:#166534;color:#bbf7d0;}
[data-theme="dark"] .qc.wrong{background:#7f1d1d;color:#fecaca;}
.quiz-score{display:flex;gap:20px;justify-content:center;margin-bottom:14px;}
.qs{text-align:center;}
.qs-v{font-size:24px;font-weight:900;}
.qs-v.g{color:var(--green);}
.qs-v.r{color:var(--red);}
.qs-l{font-size:9px;font-weight:900;text-transform:uppercase;color:var(--muted);}
.level-tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
.lvl-btn{padding:6px 14px;border:2px solid var(--border);border-radius:20px;
  background:var(--card);font-size:11px;font-weight:800;cursor:pointer;color:var(--text);transition:all .15s;}
.lvl-btn.active{background:var(--blue);color:#fff;border-color:var(--blue);}
.quiz-hint-box{background:var(--sl100);border:1px solid var(--border);border-radius:10px;
  padding:9px 13px;font-size:13px;font-weight:700;color:var(--text);margin-bottom:10px;display:none;}
.quiz-hint-box.show{display:block;}
.quiz-actions{display:flex;gap:7px;margin-top:10px;}
.quiz-hint-btn{flex:1;padding:9px;background:var(--sl100);border:1px solid var(--border);
  border-radius:12px;font-size:12px;font-weight:800;cursor:pointer;color:var(--text);transition:all .15s;}
.quiz-hint-btn:hover:not(:disabled){border-color:var(--blue);}
.quiz-hint-btn:disabled{opacity:.45;cursor:default;}
.quiz-next{flex:1;padding:9px;background:var(--blue);border:none;border-radius:12px;
  color:#fff;font-size:12px;font-weight:900;cursor:pointer;}
.quiz-next:hover{background:var(--blue2);}
.legend{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;}
.leg{display:flex;align-items:center;gap:5px;font-size:10px;font-weight:700;color:var(--muted);}
.leg-dot{width:10px;height:10px;border-radius:50%;}
@media(max-width:600px){
  .hdr{flex-wrap:wrap;gap:8px;padding:10px 12px;}
  .hdr-btns{gap:4px;}
  .hbtn{padding:7px 9px;font-size:9px;}
  .wrap{padding:10px;}
  .mode-row{flex-wrap:wrap;}
  .info-card{min-height:auto;}
}
@media(max-width:400px){
  .circle-wrap svg{max-width:100%;}
  .quiz-choices{grid-template-columns:1fr;}
  .hdr-title{font-size:13px;}
}

/* ── TEACHER/STUDENT ASSIGNMENT SHARING ───────────────── */
.assign-banner{background:rgba(37,99,235,.08);border:1.5px solid var(--blue);border-radius:14px;
  padding:10px 14px;margin-bottom:12px;display:none;align-items:center;justify-content:space-between;gap:10px;font-size:12px;font-weight:700;color:var(--text);}
.assign-banner.show{display:flex;}
.assign-banner button{background:none;border:none;color:var(--blue);font-weight:900;font-size:11px;cursor:pointer;text-transform:uppercase;flex-shrink:0;}
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:999;padding:16px;}
.modal-ov.show{display:flex;}
.modal-bx{background:var(--card);border-radius:20px;padding:22px;max-width:380px;width:100%;max-height:88vh;overflow-y:auto;}
.modal-bx h3{font-size:14px;font-weight:900;margin-bottom:14px;}
.modal-row{margin-bottom:12px;}
.modal-row label{font-size:10px;font-weight:900;text-transform:uppercase;color:var(--muted);display:block;margin-bottom:5px;}
.modal-row select{width:100%;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:12px;font-weight:700;}
.modal-link-box{display:flex;gap:6px;margin-bottom:12px;}
.modal-link-box input{flex:1;min-width:0;padding:9px;border-radius:10px;border:1.5px solid var(--border);background:var(--bg);color:var(--text);font-size:11px;}
.modal-link-box button{padding:9px 12px;border-radius:10px;border:none;background:var(--blue);color:#fff;font-weight:900;font-size:10px;cursor:pointer;white-space:nowrap;}
.modal-qr-wrap{display:flex;justify-content:center;margin-bottom:14px;}
.modal-qr-wrap canvas{border-radius:10px;background:#fff;padding:8px;max-width:100%;}
.modal-close{width:100%;padding:11px;border-radius:10px;border:1.5px solid var(--border);background:none;color:var(--text);font-weight:800;font-size:11px;cursor:pointer;text-transform:uppercase;}
.modal-gen-btn{width:100%;justify-content:center;margin-bottom:14px;background:var(--blue) !important;color:#fff !important;}
.result-view{background:var(--card);border:2px solid var(--blue);border-radius:20px;padding:28px 20px;text-align:center;margin-bottom:16px;}
.result-view .rv-title{font-size:11px;font-weight:900;text-transform:uppercase;color:var(--blue);margin-bottom:10px;letter-spacing:.4px;}
.result-view .rv-score{font-size:42px;font-weight:900;margin-bottom:6px;}
.result-view .rv-sub{font-size:12px;color:var(--muted);}

@keyframes musicappShake{
  10%,90%{transform:translateX(-1px);}
  20%,80%{transform:translateX(2px);}
  30%,50%,70%{transform:translateX(-4px);}
  40%,60%{transform:translateX(4px);}
}
.musicapp-shake{animation:musicappShake .4s;}

@keyframes musicappStreakIn{from{transform:translate(-50%,20px);opacity:0;}to{transform:translate(-50%,0);opacity:1;}}
@keyframes musicappStreakOut{from{opacity:1;}to{opacity:0;}}
.musicapp-streak-toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);
  background:#111827;color:#fff;padding:10px 18px;border-radius:14px;
  font-size:13px;font-weight:800;box-shadow:0 8px 24px rgba(0,0,0,.25);
  z-index:9999;animation:musicappStreakIn .25s ease-out;pointer-events:none;white-space:nowrap;}
[data-theme="dark"] .musicapp-streak-toast{background:#f1f5f9;color:#0f172a;}

.rv-actions{display:flex;gap:8px;justify-content:center;margin-top:14px;flex-wrap:wrap;}
@media print{
  body *{visibility:hidden;}
  .result-view, .result-view *{visibility:visible;}
  .result-view{position:absolute;top:0;left:0;width:100%;box-shadow:none;border:2px solid #000;}
  .result-view .rv-actions,.result-view button{display:none!important;}
}
</style>
</head>

function musicappSoundOn(){return localStorage.getItem('musicapp_sound_enabled')!=='0';}
let _fbCtx=null;
function _fbAudioCtx(){
  if(!_fbCtx){try{_fbCtx=new (window.AudioContext||window.webkitAudioContext)();}catch(e){}}
  return _fbCtx;
}
function playAnswerSound(ok){
  if(!musicappSoundOn())return;
  const ctx=_fbAudioCtx();
  if(!ctx)return;
  if(ctx.state==='suspended')ctx.resume();
  const now=ctx.currentTime;
  if(ok){
    [523.25,659.25,783.99].forEach((f,i)=>{
      const o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine';o.frequency.value=f;
      o.connect(g);g.connect(ctx.destination);
      const t=now+i*0.07;
      g.gain.setValueAtTime(0,t);
      g.gain.linearRampToValueAtTime(0.18,t+0.02);
      g.gain.exponentialRampToValueAtTime(0.001,t+0.35);
      o.start(t);o.stop(t+0.36);
    });
  }else{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.setValueAtTime(220,now);o.frequency.exponentialRampToValueAtTime(140,now+0.18);
    o.connect(g);g.connect(ctx.destination);
    g.gain.setValueAtTime(0.16,now);
    g.gain.exponentialRampToValueAtTime(0.001,now+0.22);
    o.start(now);o.stop(now+0.23);
  }
}
function vibrateAnswer(ok){
  if(!musicappSoundOn())return;
  if(!('vibrate' in navigator))return;
  try{navigator.vibrate(ok?20:[40,40,40]);}catch(e){}
}
function shakeEl(el){
  if(!el)return;
  el.classList.remove('musicapp-shake');
  void el.offsetWidth;
  el.classList.add('musicapp-shake');
  setTimeout(()=>el.classList.remove('musicapp-shake'),400);
}

let _fbStreak=0;
const STREAK_PHRASES={
  5:{ru:['Отлично! 👍','Уверенно идёшь!','Хорошая серия!'],en:['Nice! 👍','Great streak!','Well done!']},
  10:{ru:['Ты в ударе! 🔥','Не останавливайся!','Красота!'],en:['You are on fire! 🔥','Keep it going!','Nice work!']},
  15:{ru:['Невероятная точность! ⭐','Так держать!'],en:['Incredible accuracy! ⭐','Keep this up!']},
  20:{ru:['Ты профи! 🏆','Фантастика! 🏆','Железная серия! 🏆'],en:['You are a pro! 🏆','Fantastic! 🏆','Iron streak! 🏆']},
};
function streakTier(n){
  if(n>=20&&n%10===0)return 20;
  if(n===15)return 15;
  if(n===10)return 10;
  if(n===5)return 5;
  return null;
}
function showStreakToast(text){
  const old=document.querySelector('.musicapp-streak-toast');
  if(old)old.remove();
  const el=document.createElement('div');
  el.className='musicapp-streak-toast';
  el.textContent=text;
  document.body.appendChild(el);
  setTimeout(()=>{
    el.style.animation='musicappStreakOut .3s ease-in forwards';
    setTimeout(()=>el.remove(),300);
  },1800);
}
function maybeShowStreak(){
  const tier=streakTier(_fbStreak);
  if(tier===null)return;
  const L=(typeof lang!=='undefined'&&lang==='en')?'en':'ru';
  const arr=STREAK_PHRASES[tier][L];
  const phrase=arr[Math.floor(Math.random()*arr.length)];
  showStreakToast(`${phrase} (${_fbStreak})`);
}
function answerFeedback(ok,el){
  playAnswerSound(ok);

  else{_fbStreak++;maybeShowStreak();}

/* ─── SVG CIRCLE ─────────────────────────────── */
function arcPath(cx,cy,r1,r2,aDeg1,aDeg2){
  const a1=aDeg1*Math.PI/180, a2=aDeg2*Math.PI/180;
  const x1=cx+r1*Math.cos(a1),y1=cy+r1*Math.sin(a1);
  const x2=cx+r1*Math.cos(a2),y2=cy+r1*Math.sin(a2);
  const x3=cx+r2*Math.cos(a2),y3=cy+r2*Math.sin(a2);
  const x4=cx+r2*Math.cos(a1),y4=cy+r2*Math.sin(a1);
  return `M${x1},${y1}A${r1},${r1},0,0,1,${x2},${y2}L${x3},${y3}A${r2},${r2},0,0,0,${x4},${y4}Z`;
}

function drawCircle(){
  const svg=document.getElementById('circleSvg');
  const cx=220,cy=220;
  const R1=180,R2=130,R3=125,R4=85;
  const GAP=1.5; // gap between sectors in degrees
  let html='';

  KEYS.forEach((k,i)=>{
    const a1=-90+i*30+GAP/2, a2=-90+(i+1)*30-GAP/2;
    const am=(a1+a2)/2;
    // outer sector (major)
    html+=`<path class="sector" data-idx="${i}" data-type="maj" d="${arcPath(cx,cy,R1,R2,a1,a2)}"
      fill="${k.color}" fill-opacity="0.85" stroke="var(--bg)" stroke-width="2"
      onclick="selectKey(${i},'maj')"/>`;
    // inner sector (minor)
    html+=`<path class="sector" data-idx="${i}" data-type="min" d="${arcPath(cx,cy,R3-2,R4,a1,a2)}"
      fill="${k.color}" fill-opacity="0.55" stroke="var(--bg)" stroke-width="2"
      onclick="selectKey(${i},'min')"/>`;
    // major label
    const amr=am*Math.PI/180;
    const lrMaj=(R1+R2)/2, lrMin=(R3-2+R4)/2;
    const lxM=cx+lrMaj*Math.cos(amr), lyM=cy+lrMaj*Math.sin(amr);
    const lxm=cx+lrMin*Math.cos(amr), lym=cy+lrMin*Math.sin(amr);
    html+=`<text x="${lxM}" y="${lyM}" text-anchor="middle" dominant-baseline="central"
      font-size="13" font-weight="800" fill="#fff" pointer-events="none">${k.maj.short}</text>`;
    html+=`<text x="${lxm}" y="${lym}" text-anchor="middle" dominant-baseline="central"
      font-size="10" font-weight="700" fill="#fff" pointer-events="none">${k.min.short}</text>`;
  });

  // center circle
  html+=`<circle cx="${cx}" cy="${cy}" r="80" fill="var(--card)" stroke="var(--border)" stroke-width="2"/>`;
  html+=`<text id="centerText1" x="${cx}" y="${cy-10}" text-anchor="middle" font-size="18"
    font-weight="900" fill="var(--text)">🔑</text>`;
  html+=`<text id="centerText2" x="${cx}" y="${cy+14}" text-anchor="middle" font-size="11"
    font-weight="700" fill="var(--muted)" id="ctrHint"></text>`;
  svg.innerHTML=html;
  updateCenterHint();
}

function updateCenterHint(){
  const el=document.getElementById('centerText2');
  if(el)el.textContent=selected?'':(lang==='ru'?'нажми':'click');
}

function selectKey(idx,type){
  selected={idx,type};
  // remove old active
  document.querySelectorAll('.sector.active').forEach(s=>s.classList.remove('active'));
  const el=document.querySelector(`.sector[data-idx="${idx}"][data-type="${type}"]`);
  if(el)el.classList.add('active');
  showInfo(idx,type);
  updateCenterHint();
}

function showInfo(idx,type){
  const k=KEYS[idx];
  const L=lang_data[lang];
  const isMaj=type==='maj';
  const keyObj=isMaj?k.maj:k.min;
  document.getElementById('infoEmpty').style.display='none';
  document.getElementById('infoContent').style.display='block';
  document.getElementById('infoName').textContent=keyObj[lang];
  // signs text
  let signsText;
  if(k.signs===0) signsText=L.signs0;
  else{
    const key=k.type==='sharp'?`sharp${k.signs}`:`flat${k.signs}`;
    signsText=L[key];
  }
  document.getElementById('infoSigns').textContent=signsText;
  // notes
  const notesEl=document.getElementById('infoNotes');
  notesEl.innerHTML=k.notes.map((n,i)=>
    `<span class="note-chip${i===0?' root':''}">${n}</span>`
  ).join('');
  // relations
  if(isMaj){
    document.getElementById('infoParallel').textContent=k.min[lang];
    document.getElementById('infoDominant').textContent=KEYS[(idx+1)%12].maj[lang];
    document.getElementById('infoSubdom').textContent=KEYS[(idx+11)%12].maj[lang];
    document.getElementById('lParallel').textContent=L.parallel;
    document.getElementById('lParMaj').parentElement.style.display='none';
  } else {
    document.getElementById('infoParallel').textContent=k.maj[lang];
    document.getElementById('infoDominant').textContent=KEYS[(idx+1)%12].min[lang];
    document.getElementById('infoSubdom').textContent=KEYS[(idx+11)%12].min[lang];
    document.getElementById('lParallel').textContent=L.parMaj;
    document.getElementById('lParMaj').parentElement.style.display='none';
  }
}

let quizType=null;

function setLevel(n){
  quizLevel=n;
  document.querySelectorAll('.lvl-btn').forEach(b=>b.classList.toggle('active',+b.dataset.lvl===n));
  quizScore={c:0,w:0};
  document.getElementById('qC').textContent=0;
  document.getElementById('qW').textContent=0;
  nextQuiz();
}

function nextQuiz(){
  const L=lang_data[lang];
  const lvl=QUIZ_LEVELS[quizLevel];
  quizAnswered=false;
  document.getElementById('quizHintBox').classList.remove('show');
  document.getElementById('quizHintBtn').disabled=false;

  // filter keys by level
  const validIdxs=KEYS.map((k,i)=>i).filter(i=>KEYS[i].signs<=lvl.maxSigns);
  const idx=validIdxs[Math.floor(Math.random()*validIdxs.length)];
  const isMaj=lvl.majOnly?true:Math.random()>.5;
  quizCorrect={idx,isMaj};
  const k=KEYS[idx];
  const keyName=isMaj?k.maj[lang]:k.min[lang];

  quizType=lvl.types[Math.floor(Math.random()*lvl.types.length)];

  let qText='',correctAns='',wrongPool=[];

  if(quizType==='signs'){
    qText=`${L.q_signs} ${keyName}?`;
    correctAns=signsLabel(k,lang);
    wrongPool=KEYS.filter((_,i)=>i!==idx).map(x=>signsLabel(x,lang));
  } else if(quizType==='name'){
    qText=k.signs===0?`${L.q_name_no}?`:`${L.q_name} ${signsLabelInstr(k,lang)}?`;
    correctAns=keyName;
    wrongPool=KEYS.filter((_,i)=>i!==idx&&KEYS[i].signs<=lvl.maxSigns).map(x=>isMaj?x.maj[lang]:x.min[lang]);
  } else if(quizType==='rel'){
    qText=`${L.q_rel} ${keyName}?`;
    correctAns=isMaj?k.min[lang]:k.maj[lang];
    wrongPool=KEYS.filter((_,i)=>i!==idx).map(x=>isMaj?x.min[lang]:x.maj[lang]);
  } else {
    qText=`${L.q_dom} ${keyName}?`;
    const domIdx=(idx+1)%12;
    correctAns=isMaj?KEYS[domIdx].maj[lang]:KEYS[domIdx].min[lang];
    wrongPool=KEYS.map(x=>isMaj?x.maj[lang]:x.min[lang]).filter(x=>x!==correctAns);
  }

  document.getElementById('quizQ').textContent=qText;
  const wrongs=[...new Set(wrongPool)].sort(()=>Math.random()-.5).slice(0,3);
  const choices=[correctAns,...wrongs].sort(()=>Math.random()-.5);
  document.getElementById('quizChoices').innerHTML=choices.map(c=>
    `<button class="qc" onclick="answerQuiz(this,'${esc(c)}','${esc(correctAns)}')">${c}</button>`
  ).join('');
}

function esc(s){return s.replace(/'/g,"\\'")}

function signsLabel(k,lg){
  const L=lang_data[lg];
  if(k.signs===0)return L.signs0;
  return L[k.type==='sharp'?`sharp${k.signs}`:`flat${k.signs}`];
}
function signsLabelInstr(k,lg){
  if(lg!=='ru')return signsLabel(k,lg);
  const L=lang_data[lg];
  if(k.signs===0)return L.signs0;
  return L[k.type==='sharp'?`sharp${k.signs}i`:`flat${k.signs}i`]||signsLabel(k,lg);
}

function showHint(){
  if(!quizCorrect)return;
  const L=lang_data[lang];
  const k=KEYS[quizCorrect.idx];
  const isMaj=quizCorrect.isMaj;
  let ans='';
  if(quizType==='signs') ans=signsLabel(k,lang);
  else if(quizType==='name') ans=isMaj?k.maj[lang]:k.min[lang];
  else if(quizType==='rel') ans=isMaj?k.min[lang]:k.maj[lang];
  else { const di=(quizCorrect.idx+1)%12; ans=isMaj?KEYS[di].maj[lang]:KEYS[di].min[lang]; }
  const box=document.getElementById('quizHintBox');
  box.textContent=L.hintLabel+' '+ans;
  box.classList.add('show');
  document.getElementById('quizHintBtn').disabled=true;
}

function answerQuiz(btn,chosen,correct){
  if(quizAnswered)return;
  quizAnswered=true;
  document.querySelectorAll('.qc').forEach(b=>b.disabled=true);
  document.querySelectorAll('.qc').forEach(b=>{
    if(b.textContent===correct)b.classList.add('correct');
    else if(b===btn&&chosen!==correct)b.classList.add('wrong');
  });
  document.getElementById('quizHintBtn').disabled=true;
  const quizOk=chosen===correct;
  if(quizOk){quizScore.c++;}else{quizScore.w++;}
  answerFeedback(quizOk,btn);
  document.getElementById('qC').textContent=quizScore.c;
  document.getElementById('qW').textContent=quizScore.w;
  if(chosen===correct)setTimeout(nextQuiz,1400);
}

function setMode(m){
  mode=m;
  document.getElementById('modeExplore').classList.toggle('active',m==='explore');
  document.getElementById('modeQuiz').classList.toggle('active',m==='quiz');
  document.getElementById('quizPanel').style.display=m==='quiz'?'block':'none';
  if(m==='quiz'){quizScore={c:0,w:0};document.getElementById('qC').textContent=0;
    document.getElementById('qW').textContent=0;nextQuiz();}
}

function applyLang(){

/* ================================================================

(function(){
var QRMode={MODE_8BIT_BYTE:4};
var QRErrorCorrectLevel={L:1,M:0,Q:3,H:2};
var EXP_TABLE=new Array(256),LOG_TABLE=new Array(256);
for(var i=0;i<8;i++)EXP_TABLE[i]=1<<i;
for(var i=8;i<256;i++)EXP_TABLE[i]=EXP_TABLE[i-4]^EXP_TABLE[i-5]^EXP_TABLE[i-6]^EXP_TABLE[i-8];
for(var i=0;i<255;i++)LOG_TABLE[EXP_TABLE[i]]=i;
function glog(n){if(n<1)throw new Error("glog");return LOG_TABLE[n];}
function gexp(n){while(n<0)n+=255;while(n>=256)n-=255;return EXP_TABLE[n];}
function QRPolynomial(num,shift){
  var offset=0;while(offset<num.length&&num[offset]===0)offset++;
  this.num=new Array(num.length-offset+shift);
  for(var i=0;i<num.length-offset;i++)this.num[i]=num[i+offset];
  for(var i=0;i<shift;i++)this.num[num.length-offset+i]=0;
}
QRPolynomial.prototype.get=function(i){return this.num[i];};
QRPolynomial.prototype.getLength=function(){return this.num.length;};
QRPolynomial.prototype.multiply=function(e){
  var num=new Array(this.getLength()+e.getLength()-1);
  for(var i=0;i<num.length;i++)num[i]=0;
  for(var i=0;i<this.getLength();i++)for(var j=0;j<e.getLength();j++)num[i+j]^=gexp(glog(this.get(i))+glog(e.get(j)));

};
QRPolynomial.prototype.mod=function(e){
  if(this.getLength()-e.getLength()<0)return this;
  var ratio=glog(this.get(0))-glog(e.get(0));
  var num=new Array(this.getLength());
  for(var i=0;i<this.getLength();i++)num[i]=this.get(i);
  for(var i=0;i<e.getLength();i++)num[i]^=gexp(glog(e.get(i))+ratio);

function getErrorCorrectPolynomial(len){var a=new QRPolynomial([1],0);for(var i=0;i<len;i++)a=a.multiply(new QRPolynomial([1,gexp(i)],0));return a;}
var RS_BLOCK_TABLE={
  1:{L:[[1,26,19]],M:[[1,26,16]],Q:[[1,26,13]],H:[[1,26,9]]},
  2:{L:[[1,44,34]],M:[[1,44,28]],Q:[[1,44,22]],H:[[1,44,16]]},
  3:{L:[[1,70,55]],M:[[1,70,44]],Q:[[2,35,17]],H:[[2,35,13]]},
  4:{L:[[1,100,80]],M:[[2,50,32]],Q:[[2,50,24]],H:[[4,25,9]]},
  5:{L:[[1,134,108]],M:[[2,67,43]],Q:[[2,33,15],[2,34,16]],H:[[2,33,11],[2,34,12]]},
  6:{L:[[2,86,68]],M:[[4,43,27]],Q:[[4,43,19]],H:[[4,43,15]]},
  7:{L:[[2,98,78]],M:[[4,49,31]],Q:[[2,32,14],[4,33,15]],H:[[4,39,13],[1,40,14]]},
  8:{L:[[2,121,97]],M:[[2,60,38],[2,61,39]],Q:[[4,40,18],[2,41,19]],H:[[4,40,14],[2,41,15]]},
  9:{L:[[2,146,116]],M:[[3,58,36],[2,59,37]],Q:[[4,36,16],[4,37,17]],H:[[4,36,12],[4,37,13]]},
  10:{L:[[2,86,68],[2,87,69]],M:[[4,69,43],[1,70,44]],Q:[[6,43,19],[2,44,20]],H:[[6,43,15],[2,44,16]]}
};
function getRSBlocks(typeNumber,ecName){
  var rows=RS_BLOCK_TABLE[typeNumber][ecName],list=[];
  for(var r=0;r<rows.length;r++){var row=rows[r];for(var i=0;i<row[0];i++)list.push({totalCount:row[1],dataCount:row[2]});}
  return list;
}
var PATTERN_POSITION_TABLE={1:[],2:[6,18],3:[6,22],4:[6,26],5:[6,30],6:[6,34],7:[6,22,38],8:[6,24,42],9:[6,26,46],10:[6,28,50]};
var G15=(1<<10)|(1<<8)|(1<<5)|(1<<4)|(1<<2)|(1<<1)|(1<<0);
var G15_MASK=(1<<14)|(1<<12)|(1<<10)|(1<<4)|(1<<1);
function getBCHDigit(data){var d=0;while(data!==0){d++;data>>>=1;}return d;}
function getBCHTypeInfo(data){
  var d=data<<10;
  while(getBCHDigit(d)-getBCHDigit(G15)>=0)d^=(G15<<(getBCHDigit(d)-getBCHDigit(G15)));
  return((data<<10)|d)^G15_MASK;

function totalDataBits(typeNumber,ecName){var b=getRSBlocks(typeNumber,ecName),t=0;for(var i=0;i<b.length;i++)t+=b[i].dataCount;return t*8;}
function QRBitBuffer(){this.buffer=[];this.length=0;}
QRBitBuffer.prototype.put=function(num,length){for(var i=0;i<length;i++)this.putBit(((num>>>(length-i-1))&1)===1);};
QRBitBuffer.prototype.putBit=function(bit){
  var bufIndex=Math.floor(this.length/8);
  if(this.buffer.length<=bufIndex)this.buffer.push(0);
  if(bit)this.buffer[bufIndex]|=(0x80>>>(this.length%8));
  this.length++;
};
function stringToUtf8Bytes(str){
  var bytes=[];
  for(var i=0;i<str.length;i++){
    var c=str.codePointAt(i);
    if(c>0xFFFF)i++;
    if(c<0x80)bytes.push(c);
    else if(c<0x800){bytes.push(0xC0|(c>>6),0x80|(c&0x3F));}
    else if(c<0x10000){bytes.push(0xE0|(c>>12),0x80|((c>>6)&0x3F),0x80|(c&0x3F));}
    else{bytes.push(0xF0|(c>>18),0x80|((c>>12)&0x3F),0x80|((c>>6)&0x3F),0x80|(c&0x3F));}
  }
  return bytes;
}
function createData(typeNumber,ecName,dataBytes){
  var buffer=new QRBitBuffer();
  buffer.put(QRMode.MODE_8BIT_BYTE,4);
  var lenBits=(typeNumber<=9)?8:16;
  buffer.put(dataBytes.length,lenBits);
  for(var i=0;i<dataBytes.length;i++)buffer.put(dataBytes[i],8);
  var rsBlocks=getRSBlocks(typeNumber,ecName);
  var totalDataCount=0;for(var i=0;i<rsBlocks.length;i++)totalDataCount+=rsBlocks[i].dataCount;
  if(buffer.length+4<=totalDataCount*8)buffer.put(0,4);
  while(buffer.length%8!==0)buffer.putBit(false);
  var PAD0=0xEC,PAD1=0x11;
  while(true){
    if(buffer.length>=totalDataCount*8)break;
    buffer.put(PAD0,8);
    if(buffer.length>=totalDataCount*8)break;
    buffer.put(PAD1,8);
  }
  return createBytes(buffer,rsBlocks);
}
function createBytes(buffer,rsBlocks){
  var offset=0,maxDcCount=0,maxEcCount=0;
  var dcdata=new Array(rsBlocks.length),ecdata=new Array(rsBlocks.length);
  for(var r=0;r<rsBlocks.length;r++){
    var dcCount=rsBlocks[r].dataCount,ecCount=rsBlocks[r].totalCount-dcCount;
    maxDcCount=Math.max(maxDcCount,dcCount);maxEcCount=Math.max(maxEcCount,ecCount);
    dcdata[r]=new Array(dcCount);
    for(var i=0;i<dcdata[r].length;i++)dcdata[r][i]=0xff&buffer.buffer[i+offset];
    offset+=dcCount;
    var rsPoly=getErrorCorrectPolynomial(ecCount);
    var rawPoly=new QRPolynomial(dcdata[r],rsPoly.getLength()-1);
    var modPoly=rawPoly.mod(rsPoly);
    ecdata[r]=new Array(rsPoly.getLength()-1);
    for(var i=0;i<ecdata[r].length;i++){var mi=i+modPoly.getLength()-ecdata[r].length;ecdata[r][i]=(mi>=0)?modPoly.get(mi):0;}
  }
  var totalCodeCount=0;for(var i=0;i<rsBlocks.length;i++)totalCodeCount+=rsBlocks[i].totalCount;
  var data=new Array(totalCodeCount),index=0;
  for(var i=0;i<maxDcCount;i++)for(var r=0;r<rsBlocks.length;r++)if(i<dcdata[r].length)data[index++]=dcdata[r][i];
  for(var i=0;i<maxEcCount;i++)for(var r=0;r<rsBlocks.length;r++)if(i<ecdata[r].length)data[index++]=ecdata[r][i];
  return data;
}
function QRCodeModel(typeNumber,ecName){this.typeNumber=typeNumber;this.ecLevelName=ecName;this.modules=null;this.moduleCount=0;this.dataCache=null;}
QRCodeModel.prototype.isDark=function(row,col){return this.modules[row][col];};
QRCodeModel.prototype.setupPositionProbePattern=function(row,col){
  for(var r=-1;r<=7;r++){
    if(row+r<=-1||this.moduleCount<=row+r)continue;
    for(var c=-1;c<=7;c++){
      if(col+c<=-1||this.moduleCount<=col+c)continue;
      if((0<=r&&r<=6&&(c===0||c===6))||(0<=c&&c<=6&&(r===0||r===6))||(2<=r&&r<=4&&2<=c&&c<=4))this.modules[row+r][col+c]=true;
      else this.modules[row+r][col+c]=false;
    }
  }
};
QRCodeModel.prototype.getBestMaskPattern=function(){
  var minLostPoint=0,pattern=0;
  for(var i=0;i<8;i++){
    this.makeImpl(true,i);
    var lp=getLostPoint(this);
    if(i===0||minLostPoint>lp){minLostPoint=lp;pattern=i;}
  }
  return pattern;
};
QRCodeModel.prototype.setupTimingPattern=function(){
  for(var r=8;r<this.moduleCount-8;r++){if(this.modules[r][6]!=null)continue;this.modules[r][6]=(r%2===0);}
  for(var c=8;c<this.moduleCount-8;c++){if(this.modules[6][c]!=null)continue;this.modules[6][c]=(c%2===0);}
};
QRCodeModel.prototype.setupPositionAdjustPattern=function(){
  var pos=PATTERN_POSITION_TABLE[this.typeNumber]||[];
  for(var i=0;i<pos.length;i++)for(var j=0;j<pos.length;j++){
    var row=pos[i],col=pos[j];
    if(this.modules[row][col]!=null)continue;
    for(var r=-2;r<=2;r++)for(var c=-2;c<=2;c++){
      if(r===-2||r===2||c===-2||c===2||(r===0&&c===0))this.modules[row+r][col+c]=true;
      else this.modules[row+r][col+c]=false;
    }
  }
};
QRCodeModel.prototype.setupTypeNumber=function(test){
  if(this.typeNumber<7)return;
  var G=(1<<12)|(1<<11)|(1<<10)|(1<<9)|(1<<8)|(1<<5)|(1<<2)|(1<<0);
  function digit(x){var n=0;while(x!==0){n++;x>>>=1;}return n;}
  function bch(data){var d=data<<12;while(digit(d)-digit(G)>=0)d^=(G<<(digit(d)-digit(G)));return(data<<12)|d;}
  var bits=bch(this.typeNumber);
  for(var i=0;i<18;i++){var mod=(!test&&((bits>>i)&1)===1);this.modules[Math.floor(i/3)][i%3+this.moduleCount-8-3]=mod;}
  for(var i=0;i<18;i++){var mod=(!test&&((bits>>i)&1)===1);this.modules[i%3+this.moduleCount-8-3][Math.floor(i/3)]=mod;}
};
QRCodeModel.prototype.setupTypeInfo=function(test,maskPattern){
  var data=(QRErrorCorrectLevel[this.ecLevelName]<<3)|maskPattern;
  var bits=getBCHTypeInfo(data);
  for(var i=0;i<15;i++){
    var mod=(!test&&((bits>>i)&1)===1);
    if(i<6)this.modules[i][8]=mod;else if(i<8)this.modules[i+1][8]=mod;else this.modules[this.moduleCount-15+i][8]=mod;
  }
  for(var i=0;i<15;i++){
    var mod=(!test&&((bits>>i)&1)===1);
    if(i<8)this.modules[8][this.moduleCount-i-1]=mod;else if(i<9)this.modules[8][15-i-1+1]=mod;else this.modules[8][15-i-1]=mod;
  }

};
function maskFunc(p,i,j){
  switch(p){
    case 0:return(i+j)%2===0; case 1:return i%2===0; case 2:return j%3===0; case 3:return(i+j)%3===0;
    case 4:return(Math.floor(i/2)+Math.floor(j/3))%2===0; case 5:return(i*j)%2+(i*j)%3===0;
    case 6:return((i*j)%2+(i*j)%3)%2===0; case 7:return((i*j)%3+(i+j)%2)%2===0;
  }

QRCodeModel.prototype.mapData=function(data,maskPattern){
  var inc=-1,row=this.moduleCount-1,bitIndex=7,byteIndex=0;
  for(var col=this.moduleCount-1;col>0;col-=2){
    if(col===6)col--;

      for(var c=0;c<2;c++){
        if(this.modules[row][col-c]==null){
          var dark=false;
          if(byteIndex<data.length)dark=(((data[byteIndex]>>>bitIndex)&1)===1);

          if(mask)dark=!dark;

QRCodeModel.prototype.makeImpl=function(test,maskPattern){

  this.setupPositionProbePattern(this.moduleCount-7,0);
  this.setupPositionProbePattern(0,this.moduleCount-7);
  this.setupPositionAdjustPattern();
  this.setupTimingPattern();
  this.setupTypeInfo(test,maskPattern);
  this.setupTypeNumber(test);

};
QRCodeModel.prototype.make=function(dataBytes){this.dataBytes=dataBytes;var mp=this.getBestMaskPattern();this.makeImpl(false,mp);};
function getLostPoint(qr){
  var n=qr.moduleCount,lp=0;
  for(var row=0;row<n;row++)for(var col=0;col<n;col++){
    var sameCount=0,dark=qr.isDark(row,col);
    for(var r=-1;r<=1;r++){
      if(row+r<0||n<=row+r)continue;
      for(var c=-1;c<=1;c++){
        if(col+c<0||n<=col+c)continue; if(r===0&&c===0)continue;
        if(dark===qr.isDark(row+r,col+c))sameCount++;
      }
    }
    if(sameCount>5)lp+=(3+sameCount-5);
  }
  for(var row=0;row<n-1;row++)for(var col=0;col<n-1;col++){
    var cnt=0;
    if(qr.isDark(row,col))cnt++; if(qr.isDark(row+1,col))cnt++; if(qr.isDark(row,col+1))cnt++; if(qr.isDark(row+1,col+1))cnt++;
    if(cnt===0||cnt===4)lp+=3;
  }
  for(var row=0;row<n;row++)for(var col=0;col<n-6;col++){
    if(qr.isDark(row,col)&&!qr.isDark(row,col+1)&&qr.isDark(row,col+2)&&qr.isDark(row,col+3)&&qr.isDark(row,col+4)&&!qr.isDark(row,col+5)&&qr.isDark(row,col+6))lp+=40;
  }
  for(var col=0;col<n;col++)for(var row=0;row<n-6;row++){
    if(qr.isDark(row,col)&&!qr.isDark(row+1,col)&&qr.isDark(row+2,col)&&qr.isDark(row+3,col)&&qr.isDark(row+4,col)&&!qr.isDark(row+5,col)&&qr.isDark(row+6,col))lp+=40;
  }
  var darkCount=0;
  for(var col=0;col<n;col++)for(var row=0;row<n;row++)if(qr.isDark(row,col))darkCount++;
  lp+=Math.abs(100*darkCount/n/n-50)/5*10;
  return lp;
}
function generateQRMatrix(text,ecName){
  ecName=ecName||'M';
  var bytes=stringToUtf8Bytes(text);
  for(var tn=1;tn<=10;tn++){
    var lenBits=(tn<=9)?8:16;
    var capacityBits=totalDataBits(tn,ecName);
    var neededBits=4+lenBits+bytes.length*8;
    if(neededBits<=capacityBits){
      var model=new QRCodeModel(tn,ecName);
      model.make(bytes);
      return{moduleCount:model.moduleCount,modules:model.modules,version:tn};
    }
  }
  throw new Error("QR: data too long");
}
window.renderQR=function(text,canvas){
  var res=generateQRMatrix(text,'M');
  var n=res.moduleCount,quiet=3,scale=Math.max(3,Math.floor(240/(n+quiet*2)));
  var size=(n+quiet*2)*scale;
  canvas.width=size;canvas.height=size;
  var ctx=canvas.getContext('2d');
  ctx.fillStyle='#fff';ctx.fillRect(0,0,size,size);
  ctx.fillStyle='#000';
  for(var r=0;r<n;r++)for(var c=0;c<n;c++)if(res.modules[r][c])ctx.fillRect((c+quiet)*scale,(r+quiet)*scale,scale,scale);
};

const GRADE_LIST=['1-2','3-4','5+'];

function buildResultLink(g,c,w){

  const ts=now.getFullYear()+'-'+String(now.getMonth()+1).padStart(2,'0')+'-'+String(now.getDate()).padStart(2,'0')+' '+String(now.getHours()).padStart(2,'0')+':'+String(now.getMinutes()).padStart(2,'0');
  return location.origin+location.pathname+'?r='+encodeURIComponent('R1|'+g+'|'+c+'|'+w+'|'+ts);
}
function parseAssignCode(code){
  const p=code.split('|');
  if(p[0]!=='A1'||p.length<2||GRADE_LIST.indexOf(p[1])===-1)return null;
  return {grade:p[1]};
}
function parseResultCode(code){
  const p=code.split('|');
  if(p[0]!=='R1'||p.length<5)return null;
  return {grade:p[1],correct:Number(p[2])||0,wrong:Number(p[3])||0,ts:p.slice(4).join('|')};
}

  renderQRSafe(link, document.getElementById('amQrCanvas'), document.getElementById('amQrError'));

}
// ── История заданий и результатов (локально, на этом устройстве) ──────
const HISTORY_MODULE='keys';
function logAssignment(e){ try{ const l=JSON.parse(localStorage.getItem('musicapp_assignment_history')||'[]'); l.unshift(Object.assign({module:HISTORY_MODULE,ts:Date.now()},e)); localStorage.setItem('musicapp_assignment_history',JSON.stringify(l.slice(0,100))); }catch(err){} }
function logResult(e){ try{ const l=JSON.parse(localStorage.getItem('musicapp_result_history')||'[]'); l.unshift(Object.assign({module:HISTORY_MODULE,ts:Date.now()},e)); localStorage.setItem('musicapp_result_history',JSON.stringify(l.slice(0,100))); }catch(err){} }
function toggleAssignHistory(){
  const el=document.getElementById('amHistoryList'); if(!el)return;
  if(el.style.display!=='none'){ el.style.display='none'; return; }
  el.style.display='block'; renderAssignHistory();
}
function renderAssignHistory(){
  const el=document.getElementById('amHistoryList'); if(!el)return;
  let assigns=[],results=[];
  try{ assigns=JSON.parse(localStorage.getItem('musicapp_assignment_history')||'[]').filter(x=>x.module===HISTORY_MODULE); }catch(e){}
  try{ results=JSON.parse(localStorage.getItem('musicapp_result_history')||'[]').filter(x=>x.module===HISTORY_MODULE); }catch(e){}
  const fmt=ts=>new Date(ts).toLocaleString(lang==='ru'?'ru-RU':'en-US',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'});
  if(!assigns.length && !results.length){ el.innerHTML='<i>'+(lang==='ru'?'Пока пусто':'Nothing yet')+'</i>'; return; }
  let html='';
  if(results.length){
    html+='<b>'+(lang==='ru'?'Результаты учеников':'Student results')+':</b><br>'+
      results.slice(0,10).map(r=>fmt(r.ts)+' — '+r.grade+': '+r.correct+'/'+(r.correct+(r.wrong||0))).join('<br>')+'<br><br>';
  }
  if(assigns.length){
    html+='<b>'+(lang==='ru'?'Созданные задания':'Created assignments')+':</b><br>'+
      assigns.slice(0,10).map(a=>fmt(a.ts)+' — '+a.grade).join('<br>');
  }
  el.innerHTML=html;
}

// ── Экспорт результата для учителя: картинка (canvas→PNG) или печать/PDF ──
function rvRoundRect(ctx,x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function exportResultImage(){
  const title=document.getElementById('rvTitle').textContent;
  const score=document.getElementById('rvScore').textContent;
  const sub=document.getElementById('rvSub').textContent;
  const dark=document.documentElement.getAttribute('data-theme')==='dark';
  const W=640,H=360;
  const cv=document.createElement('canvas');cv.width=W;cv.height=H;
  const ctx=cv.getContext('2d');
  ctx.fillStyle=dark?'#0f172a':'#f8fafc';
  ctx.fillRect(0,0,W,H);
  const pad=24;
  ctx.fillStyle=dark?'#1e293b':'#ffffff';
  rvRoundRect(ctx,pad,pad,W-pad*2,H-pad*2,24);ctx.fill();
  ctx.strokeStyle='#2563eb';ctx.lineWidth=3;
  rvRoundRect(ctx,pad,pad,W-pad*2,H-pad*2,24);ctx.stroke();
  ctx.textAlign='center';
  ctx.fillStyle='#2563eb';
  ctx.font='900 13px sans-serif';
  ctx.fillText('МУЗГРАМОТА',W/2,pad+34);
  ctx.fillStyle=dark?'#f1f5f9':'#0f172a';
  ctx.font='800 16px sans-serif';
  ctx.fillText(title,W/2,pad+64);
  ctx.fillStyle='#2563eb';
  ctx.font='900 64px sans-serif';
  ctx.fillText(score,W/2,H/2+20);
  ctx.fillStyle=dark?'#94a3b8':'#64748b';
  ctx.font='600 14px sans-serif';
  ctx.fillText(sub,W/2,H-pad-40);
  ctx.font='500 11px sans-serif';
  ctx.fillText(new Date().toLocaleDateString(lang==='ru'?'ru-RU':'en-US'),W/2,H-pad-16);
  cv.toBlob(blob=>{
    const url=URL.createObjectURL(blob);
    const a=document.createElement('a');
    a.href=url;a.download='rezultat-'+Date.now()+'.png';
    document.body.appendChild(a);a.click();document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),1000);
  });
}

// ── Apply ?a= / ?r= from URL on load ─────────────────────────────
(function initAssignmentFromUrl(){
  const params=new URLSearchParams(location.search);
  const rCode=params.get('r');
  if(rCode){
    const res=parseResultCode(rCode);
    if(res){ showTeacherResultView(res); return; }
  }
  const aCode=params.get('a');
  if(aCode){
    const info=parseAssignCode(aCode);
    if(info){
      activeAssignment=info;
      setMode('quiz');
      setLevel(GRADE_LIST.indexOf(info.grade));
      showAssignBanner(info);
      const btn=document.getElementById('shareResultBtn'); if(btn)btn.style.display='flex';
    }
  } else {
    // Нет активного задания — подставляем уровень из профиля ученика (главная страница), если он задан.
    // В этом модуле только 3 уровня, поэтому классы 5-6 и 7-8 из общего профиля попадают в один уровень "5+".
    try{
      const profileGrade=localStorage.getItem('musicapp_profile_grade');
      const map={'1-2':0,'3-4':1,'5-6':2,'7-8':2};
      if(profileGrade && (profileGrade in map)) setLevel(map[profileGrade]);
    }catch(e){}
  }
})();
</script>
<script>
/* Клавиатурная доступность: элементы с onclick (не <button>/<a>/полям форм)
   становятся фокусируемыми и активируются Enter/Space — включая те,
   что добавляются в DOM динамически (пианино, варианты викторин и т.п.). */
(function(){
  function tagEl(el){
    if(!el || !el.hasAttribute || !el.hasAttribute('onclick')) return;
    var tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL') return;
    if(el.hasAttribute('data-a11y-kb')) return;
    el.setAttribute('data-a11y-kb','1');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  }
  function scan(root){
    if(!root||!root.querySelectorAll) return;
    tagEl(root);
    root.querySelectorAll('[onclick]').forEach(tagEl);
  }
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
    var el=document.activeElement;
    if(el && el.getAttribute && el.hasAttribute('onclick') && el.getAttribute('role')==='button'){
      e.preventDefault();
      el.click();
    }
  });
  if(document.body) scan(document.body);
  else document.addEventListener('DOMContentLoaded', function(){ scan(document.body); });
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){ if(n.nodeType===1) scan(n); });
    });
  });
  if(document.body) mo.observe(document.body,{childList:true,subtree:true});
  else document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); });
})();
</script>
