        const DURATIONS = [
            { id: 'whole', label: '𝅝', restLabel: '𝄻', val: 4 },
            { id: 'half', label: '𝅗𝅥', restLabel: '𝄼', val: 2 },
            { id: 'quarter', label: '𝅘𝅥', restLabel: '𝄽', val: 1 },
            { id: 'eighth', label: '𝅘𝅥𝅮', restLabel: '𝄾', val: 0.5 }
        ];

        let lang = localStorage.getItem('musicapp_lang')||'ru';
        let isDark = localStorage.getItem('musicapp_theme')==='dark';
        let activeTab = 'theory';
        let instrMode = 'piano';
        let clefMode = 'auto'; // 'auto' | 'bass' | 'tenor' | 'treble' — для виолончели и контрабаса
        let selectedNote = { note: 'C', octave: 4 };
        let showHint = false;
        let showKeyLabels = true;
        let isTestMode = false;
        let testLevel = 0; // 0=начальный(C4-B4), 1=средний(C3-B4), 2=продвинутый(C3-B5)
        let testNote = null;
        let audioCtx = null;
        let micEnabled = false;
        let micStream = null;
        let micAnalyser = null;
        let micSource = null;
        let micAnimId = null;
        let micLastDetected = null;
        let micMatchCooldown = false;
        let activeNodes = [];
        let rhythmSig = '4/4';
        let targetRhythm = [];
        let userRhythm = [];
        let isListening = false;
        let showRhythmTarget = false;
        let composerNotes = [];
        let composerSelectedNote = null;
        let composerPlayingIdx = -1;
        let compDuration = 'quarter';
        let isRendering = false;
        let stopPlayback = false;

        function getStaffColors() {
            return isDark
                ? { note: '#e2e8f0', staffLine: '#475569', clef: '#e2e8f0' }
                : { note: '#020617', staffLine: '#cbd5e1', clef: '#020617' };
        }

        function getFrequency(note, octave) {
            if (note === 'PAUSE' || !note) return 0;
            const semitoneMap = { 'C': 0, 'C#': 1, 'D': 2, 'D#': 3, 'E': 4, 'F': 5, 'F#': 6, 'G': 7, 'G#': 8, 'A': 9, 'A#': 10, 'B': 11 };
            const n = semitoneMap[note] + (octave + 1) * 12;
            return 440 * Math.pow(2, (n - 69) / 12);
        }

        function playFrequency(note, octave, duration = 0.8) {
            if (note === 'PAUSE' || !note) return;
            if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            if (audioCtx.state === 'suspended') audioCtx.resume();
            const freq = getFrequency(note, octave);
            const now = audioCtx.currentTime;
            const created = [];

            // Один осциллятор с заданной амплитудой и временем затухания
            function addOsc(f, amp, decay, detune = 0) {
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = f;
                if (detune) osc.detune.value = detune;
                g.gain.setValueAtTime(0, now);
                g.gain.linearRampToValueAtTime(amp, now + 0.006);
                g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + decay + 0.05);
                created.push({ osc, gain: g });
            }

            // Короткий шумовой всплеск для атаки щипка
            function addNoise(filterFreq, Q, filterType, amp, decay) {
                const ns = Math.ceil(audioCtx.sampleRate * Math.min(decay + 0.01, 0.15));
                const buf = audioCtx.createBuffer(1, ns, audioCtx.sampleRate);
                const d = buf.getChannelData(0);
                for (let i = 0; i < ns; i++) d[i] = Math.random() * 2 - 1;
                const src = audioCtx.createBufferSource();
                src.buffer = buf;
                const flt = audioCtx.createBiquadFilter();
                flt.type = filterType; flt.frequency.value = filterFreq; flt.Q.value = Q;
                const g = audioCtx.createGain();
                g.gain.setValueAtTime(amp, now);
                g.gain.exponentialRampToValueAtTime(0.0001, now + decay);
                src.connect(flt); flt.connect(g); g.connect(audioCtx.destination);
                src.start(now);
                created.push({ osc: src, gain: g });
            }

            if (instrMode === 'guitar') {
                // Гитара: тёплый тембр, умеренные гармоники, средний спад
                const d = Math.max(duration, 0.9);
                addNoise(freq * 4, 1.5, 'lowpass',  0.20, 0.040);
                addOsc(freq,   0.45, d);
                addOsc(freq*2, 0.18, d * 0.60);
                addOsc(freq*3, 0.08, d * 0.40);
                addOsc(freq*4, 0.04, d * 0.25);

            } else if (instrMode === 'balalaika') {
                // Балалайка: яркий, металлический, короткий
                const d = Math.max(duration, 0.65);
                addNoise(freq * 5, 3.0, 'bandpass', 0.25, 0.022);
                addOsc(freq,   0.30, d);
                addOsc(freq*2, 0.22, d * 0.80);
                addOsc(freq*3, 0.16, d * 0.60);
                addOsc(freq*4, 0.10, d * 0.45);
                addOsc(freq*5, 0.06, d * 0.30);
                addOsc(freq*6, 0.03, d * 0.18);

            } else if (instrMode === 'domra') {
                // Домра: ярче гитары, мягче балалайки (мандолинный тембр)
                const d = Math.max(duration, 0.75);
                addNoise(freq * 3, 2.5, 'bandpass', 0.18, 0.030);
                addOsc(freq,   0.38, d);
                addOsc(freq*2, 0.20, d * 0.70);
                addOsc(freq*3, 0.13, d * 0.50);
                addOsc(freq*4, 0.07, d * 0.33);
                addOsc(freq*5, 0.03, d * 0.20);

            } else if (instrMode === 'ukulele') {
                // Укулеле: короткий звонкий нейлоновый щипок
                const d = Math.max(duration, 0.55);
                addNoise(freq * 5, 2.2, 'bandpass', 0.20, 0.020);
                addOsc(freq,   0.32, d);
                addOsc(freq*2, 0.16, d * 0.65);
                addOsc(freq*3, 0.09, d * 0.42);
                addOsc(freq*4, 0.04, d * 0.28);

            } else if (['violin', 'viola', 'cello', 'contrabass'].includes(instrMode)) {
                // Смычковые: протяжный тон смычка, медленная атака, лёгкое вибрато
                const d = Math.max(duration, 1.1);
                const osc = audioCtx.createOscillator();
                osc.type = 'sawtooth';
                osc.frequency.value = freq;

                const vibrato = audioCtx.createOscillator();
                vibrato.frequency.value = 5.5;
                const vibratoGain = audioCtx.createGain();
                vibratoGain.gain.value = freq * 0.006;
                vibrato.connect(vibratoGain);
                vibratoGain.connect(osc.frequency);

                const filt = audioCtx.createBiquadFilter();
                filt.type = 'lowpass';
                filt.frequency.value = freq * 4.5;

                const g = audioCtx.createGain();
                g.gain.setValueAtTime(0, now);
                g.gain.linearRampToValueAtTime(0.28, now + 0.09);
                g.gain.setValueAtTime(0.28, now + Math.max(d - 0.15, 0.09));
                g.gain.exponentialRampToValueAtTime(0.0001, now + d);

                osc.connect(filt); filt.connect(g); g.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + d + 0.05);
                vibrato.start(now); vibrato.stop(now + d + 0.05);
                created.push({ osc, gain: g });
                created.push({ osc: vibrato, gain: vibratoGain });

            } else {
                // Пианино: классический треугольный осциллятор
                const osc = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                osc.type = 'triangle';
                osc.frequency.value = freq;
                g.gain.setValueAtTime(0, now);
                g.gain.linearRampToValueAtTime(0.4, now + 0.05);
                g.gain.exponentialRampToValueAtTime(0.0001, now + Math.max(duration, 0.8));
                osc.connect(g); g.connect(audioCtx.destination);
                osc.start(now); osc.stop(now + Math.max(duration, 0.8) + 0.05);
                created.push({ osc, gain: g });
            }

            activeNodes.push(...created);
            const cleanup = Math.max(duration + 1.5, 2.5);
            setTimeout(() => {
                created.forEach(n => { activeNodes = activeNodes.filter(x => x !== n); });
            }, cleanup * 1000);
        }

        function stopAllSounds() {
            stopPlayback = true;
            activeNodes.forEach(node => {
                try { node.osc.stop(); node.osc.disconnect(); node.gain.disconnect(); } catch(e) {}
            });
            activeNodes = [];
            isListening = false;
        }

        async function playSequence(sequence) {
            if (sequence.length === 0) return;
            if (isListening) { stopAllSounds(); updateUI(); return; }
            isListening = true;
            stopPlayback = false;
            updateUI();
            for (let idx = 0; idx < sequence.length; idx++) {
                if (stopPlayback) break;
                const item = sequence[idx];
                if (activeTab === 'composer') {
                    composerPlayingIdx = idx;
                    updateComposerStaff();
                }
                const isPause = item.isPause || item.note === 'PAUSE';
                if (!isPause) playFrequency(item.note || 'A', item.octave || 4, (item.duration || item.val) * 0.4);
                await new Promise(r => setTimeout(r, (item.duration || item.val) * 500));
            }
            if (!stopPlayback) isListening = false;
            composerPlayingIdx = -1;
            if (activeTab === 'composer') updateComposerStaff();
            updateUI();
        }

        // Инструменты с единственным ключом (без авто-переключения по октаве, как у пианино)
        const CLEF_ONLY = { guitar: 'treble', domra: 'treble', balalaika: 'treble', violin: 'treble', ukulele: 'treble', viola: 'alto' };

        // Таблицы позиций нот (relativeY) для каждого ключа. Линии стана всегда на 0,10,20,30,40.
        const TREBLE_MAP = {
            2: { 'C': 120, 'D': 115, 'E': 110, 'F': 105, 'G': 100, 'A': 95, 'B': 90 },
            3: { 'C': 85, 'D': 80, 'E': 75, 'F': 70, 'G': 65, 'A': 60, 'B': 55 },
            4: { 'C': 50, 'D': 45, 'E': 40, 'F': 35, 'G': 30, 'A': 25, 'B': 20 },
            5: { 'C': 15, 'D': 10, 'E': 5, 'F': 0, 'G': -5, 'A': -10, 'B': -15 },
            6: { 'C': -20, 'D': -25, 'E': -30, 'F': -35, 'G': -40, 'A': -45, 'B': -50 }
        };
        const BASS_MAP = {
            2: { 'C': 60, 'D': 55, 'E': 50, 'F': 45, 'G': 40, 'A': 35, 'B': 30 },
            3: { 'C': 25, 'D': 20, 'E': 15, 'F': 10, 'G': 5, 'A': 0, 'B': -5 },
            4: { 'C': -10, 'D': -15, 'E': -20, 'F': -25, 'G': -30, 'A': -35, 'B': -40 },
            5: { 'C': -45, 'D': -50, 'E': -55, 'F': -60, 'G': -65, 'A': -70, 'B': -75 }
        };
        // До (C4) — на средней линии альтового ключа
        const ALTO_MAP = {
            2: { 'C': 90, 'D': 85, 'E': 80, 'F': 75, 'G': 70, 'A': 65, 'B': 60 },
            3: { 'C': 55, 'D': 50, 'E': 45, 'F': 40, 'G': 35, 'A': 30, 'B': 25 },
            4: { 'C': 20, 'D': 15, 'E': 10, 'F': 5, 'G': 0, 'A': -5, 'B': -10 },
            5: { 'C': -15, 'D': -20, 'E': -25, 'F': -30, 'G': -35, 'A': -40, 'B': -45 },
            6: { 'C': -50, 'D': -55, 'E': -60, 'F': -65, 'G': -70, 'A': -75, 'B': -80 }
        };
        // Теноровый ключ — та же C-скрипка, что и альтовый, но на одну линию выше (До на 4-й линии снизу)
        const TENOR_MAP = {};
        Object.keys(ALTO_MAP).forEach(oct => {
            TENOR_MAP[oct] = {};
            Object.keys(ALTO_MAP[oct]).forEach(n => { TENOR_MAP[oct][n] = ALTO_MAP[oct][n] - 10; });
        });
        const NOTE_MAPS = { treble: TREBLE_MAP, bass: BASS_MAP, alto: ALTO_MAP, tenor: TENOR_MAP };

        const CLEF_SYMBOLS = {
            treble: { symbol: '𝄞', size: 58, x: 30, y: 38 },
            bass:   { symbol: '𝄢', size: 52, x: 30, y: 38 },
            alto:   { symbol: '𝄡', size: 46, x: 28, y: 40 },
            tenor:  { symbol: '𝄡', size: 46, x: 28, y: 30 }
        };

        // Универсальный расчёт добавочных линий: staff line'ы всегда на 0,10,20,30,40
        function computeLedgers(relativeY) {
            const ledgers = [];
            for (let l = 50; relativeY >= l; l += 10) ledgers.push(l);
            for (let l = -10; relativeY <= l; l -= 10) ledgers.push(l);
            return ledgers;
        }

        function drawStaff(svgId, note, octave, isComposer = false, composerNotesList = []) {
            const svg = document.getElementById(svgId);
            // singleClef: 'treble' | 'alto' | 'tenor' | 'bass' — только один стан; null — дуальный режим (пианино и т.п.), как в composer
            let singleClef = isComposer ? null : (CLEF_ONLY[instrMode] || null);
            if (!isComposer && (instrMode === 'cello' || instrMode === 'contrabass') && clefMode !== 'auto') {
                singleClef = clefMode;
            }
            const staffWidth = isComposer ? Math.max(300, 120 + composerNotesList.length * 70) : 300;
            // Treble staff starts at y=120, bass at y=220 — gives 120px headroom for high notes
            svg.setAttribute('viewBox', `0 0 ${staffWidth} 300`);
            // Use min-width only when staff is large enough to scroll; otherwise let it scale like Theory
            svg.style.minWidth = (isComposer && staffWidth > 300) ? staffWidth + 'px' : '0';
            svg.style.width = '100%';
            svg.style.maxWidth = (isComposer && staffWidth > 300) ? 'none' : '100%';

            const colors = getStaffColors();
            let html = '';

            function staffLines() {
                let h = '';
                for (let i = 0; i < 5; i++) {
                    h += `<line x1="20" y1="${i * 10}" x2="${staffWidth - 20}" y2="${i * 10}" stroke="${colors.staffLine}" stroke-width="1.5"/>`;
                }
                return h;
            }

            if (singleClef && CLEF_SYMBOLS[singleClef]) {
                const c = CLEF_SYMBOLS[singleClef];
                html += '<g transform="translate(0, 120)">';
                html += staffLines();
                html += `<text x="${c.x}" y="${c.y}" font-size="${c.size}" fill="${colors.clef}" font-family="serif">${c.symbol}</text>`;
                html += '</g>';
            } else {
                html += '<g transform="translate(0, 120)">';
                html += staffLines();
                html += `<text x="30" y="38" font-size="58" fill="${colors.clef}" font-family="serif">𝄞</text>`;
                html += '</g>';

                html += '<g transform="translate(0, 220)">';
                html += staffLines();
                html += `<text x="30" y="38" font-size="52" fill="${colors.clef}" font-family="serif">𝄢</text>`;
                html += '</g>';
                html += `<path d="M 25 120 Q 10 175 25 260" fill="none" stroke="${colors.staffLine}" stroke-width="2"/>`;
            }

            function renderNote(noteObj, xOffset) {
                const { note: noteName, octave: noteOct, type } = noteObj;
                const color = colors.note;
                const clefUsed = singleClef || (noteOct < 4 ? 'bass' : 'treble');
                const isBass = clefUsed === 'bass';
                const staffY = (isBass && singleClef !== 'bass') ? 220 : 120;

                if (noteObj.isPause) {
                    const pauseY = staffY + 20;
                    if (type === 'whole') return `<rect x="${xOffset - 8}" y="${pauseY - 10}" width="16" height="6" fill="${color}"/>`;
                    if (type === 'half') return `<rect x="${xOffset - 8}" y="${pauseY - 6}" width="16" height="6" fill="${color}"/>`;
                    if (type === 'quarter') return `<text x="${xOffset - 10}" y="${pauseY + 15}" font-size="45" fill="${color}" font-family="serif">𝄽</text>`;
                    if (type === 'eighth') return `<text x="${xOffset - 10}" y="${pauseY + 15}" font-size="45" fill="${color}" font-family="serif">𝄾</text>`;
                    return '';
                }

                const cleanN = noteName.replace('#', '');
                const map = NOTE_MAPS[clefUsed];
                const relativeY = (map[noteOct] && map[noteOct][cleanN] !== undefined) ? map[noteOct][cleanN] : 30;
                const ledgerLines = computeLedgers(relativeY);

                const absY = staffY + relativeY;
                const stemUp = isBass ? (relativeY > 15) : (relativeY > 20);
                const isWhole = type === 'whole';
                const isHalf = type === 'half';
                const isEighth = type === 'eighth';

                let noteHtml = '<g>';
                ledgerLines.forEach(l => {
                    noteHtml += `<line x1="${xOffset - 18}" y1="${staffY + l}" x2="${xOffset + 18}" y2="${staffY + l}" stroke="${color}" stroke-width="1.5"/>`;
                });
                if (noteName.includes('#')) {
                    noteHtml += `<text x="${xOffset - 30}" y="${absY + 7}" font-size="28" font-weight="bold" fill="${color}">♯</text>`;
                }
                noteHtml += `<g transform="translate(${xOffset}, ${absY})">`;
                noteHtml += `<ellipse rx="9" ry="6.5" fill="${isWhole || isHalf ? 'none' : color}" stroke="${color}" stroke-width="${isWhole || isHalf ? '2' : '0'}" transform="rotate(-20)"/>`;
                if (!isWhole) {
                    noteHtml += `<line x1="${stemUp ? 8.5 : -8.5}" y1="0" x2="${stemUp ? 8.5 : -8.5}" y2="${stemUp ? -35 : 35}" stroke="${color}" stroke-width="2"/>`;
                    if (isEighth) {
                        noteHtml += `<path d="${stemUp ? 'M 8.5 -35 Q 20 -25 20 -10' : 'M -8.5 35 Q 5 25 5 10'}" fill="none" stroke="${color}" stroke-width="2"/>`;
                    }
                }
                noteHtml += '</g></g>';
                return noteHtml;
            }

            if (isComposer) {
                // Yellow highlight for currently playing note
                if (composerPlayingIdx >= 0 && composerPlayingIdx < composerNotesList.length) {
                    const hx = 120 + composerPlayingIdx * 70;
                    html += `<rect x="${hx - 18}" y="105" width="52" height="200" fill="rgba(250,200,0,0.22)" rx="7"/>`;
                }
                composerNotesList.forEach((noteObj, idx) => {
                    html += renderNote(noteObj, 120 + idx * 70);
                });
            } else {
                html += renderNote({ note, octave, type: 'quarter', isPause: false }, 180);
            }

            svg.innerHTML = html;
        }

        function createPiano(containerId, noteToHighlight) {
            const container = document.getElementById(containerId);
            const whiteNotes = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            const blackPos = { 'C#': 1, 'D#': 2, 'F#': 4, 'G#': 5, 'A#': 6 };
            const octaves = [2, 3, 4, 5, 6];
            const whiteWidth = window.innerWidth < 768 ? 48 : 60;
            const hl = noteToHighlight || null;

            let html = '';
            octaves.forEach(oct => {
                html += `<div style="display: flex; position: relative; width: ${whiteWidth * 7}px;">`;
                whiteNotes.forEach(n => {
                    const isSelected = hl && hl.note === n && hl.octave === oct;
                    html += `<button class="white-key ${isSelected ? 'selected' : ''}" data-note="${n}" data-octave="${oct}" style="width: ${whiteWidth}px;">`;
                    if (showKeyLabels) html += `<span class="key-label">${TRANSLATIONS[lang].notes[n]}</span>`;
                    if (n === 'C') {
                        const octNames = {1:'Ко', 2:'Бол', 3:'Мал', 4:'1', 5:'2', 6:'3', 7:'4'};
                        html += `<span class="octave-label">${octNames[oct] ?? oct}</span>`;
                    }
                    html += '</button>';
                });
                Object.entries(blackPos).forEach(([n, pos]) => {
                    const isSelected = hl && hl.note === n && hl.octave === oct;
                    html += `<button class="black-key ${isSelected ? 'selected' : ''}" data-note="${n}" data-octave="${oct}" style="left: ${(pos - 1) * whiteWidth + (whiteWidth * 0.7)}px; width: ${whiteWidth * 0.6}px;">`;
                    if (showKeyLabels) html += `<span class="key-label">${TRANSLATIONS[lang].notes[n]}</span>`;
                    html += '</button>';
                });
                html += '</div>';
            });
            container.innerHTML = html;

            container.querySelectorAll('button').forEach(btn => {
                let tStartX, tStartY;
                btn.addEventListener('touchstart', (e) => {
                    tStartX = e.touches[0].clientX;
                    tStartY = e.touches[0].clientY;
                }, { passive: true });
                btn.addEventListener('touchend', (e) => {
                    const dx = Math.abs(e.changedTouches[0].clientX - tStartX);
                    const dy = Math.abs(e.changedTouches[0].clientY - tStartY);
                    if (dx < 12 && dy < 12) {
                        e.preventDefault(); // блокируем синтетический mousedown
                        const note = btn.dataset.note;
                        const octave = parseInt(btn.dataset.octave);
                        handleNoteClick(note, octave);
                    }
                });
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    const note = btn.dataset.note;
                    const octave = parseInt(btn.dataset.octave);
                    handleNoteClick(note, octave);
                });
            });
        }

        const FRETBOARD_CONFIG = {
            guitar:     { strings: [{ note: 'E', octave: 5 }, { note: 'B', octave: 4 }, { note: 'G', octave: 4 }, { note: 'D', octave: 4 }, { note: 'A', octave: 3 }, { note: 'E', octave: 3 }], frets: 19, markers: [3,5,7,9,12,15,17,19] },
            balalaika:  { strings: [{ note: 'A', octave: 4 }, { note: 'E', octave: 4 }, { note: 'E', octave: 4 }], frets: 24, markers: [3,5,7,9,12,15,17,19,21] },
            domra:      { strings: [{ note: 'D', octave: 5 }, { note: 'A', octave: 4 }, { note: 'E', octave: 4 }], frets: 14, markers: [3,5,7,9,12] },
            ukulele:    { strings: [{ note: 'G', octave: 4 }, { note: 'C', octave: 4 }, { note: 'E', octave: 4 }, { note: 'A', octave: 4 }], frets: 15, markers: [3,5,7,9,12,15] },
            violin:     { strings: [{ note: 'E', octave: 5 }, { note: 'A', octave: 4 }, { note: 'D', octave: 4 }, { note: 'G', octave: 3 }], frets: 15, markers: [3,5,7,9,12,15] },
            viola:      { strings: [{ note: 'A', octave: 4 }, { note: 'D', octave: 4 }, { note: 'G', octave: 3 }, { note: 'C', octave: 3 }], frets: 19, markers: [3,5,7,9,12,15,17,19] },
            cello:      { strings: [{ note: 'A', octave: 3 }, { note: 'D', octave: 3 }, { note: 'G', octave: 2 }, { note: 'C', octave: 2 }], frets: 12, markers: [3,5,7,9,12] },
            contrabass: { strings: [{ note: 'G', octave: 3 }, { note: 'D', octave: 3 }, { note: 'A', octave: 2 }, { note: 'E', octave: 2 }], frets: 16, markers: [3,5,7,9,12,15] }
        };

        function createFretboard() {
            const container = document.getElementById('fretboard');
            const cfg = FRETBOARD_CONFIG[instrMode] || FRETBOARD_CONFIG.guitar;
            const strings = cfg.strings;
            const fretsCount = cfg.frets;
            const fretWidth = 70;

            container.style.width = (fretsCount + 1) * fretWidth + 100 + 'px';
            container.style.height = strings.length * 40 + 60 + 'px';

            let html = '';
            // Верхний порожек (nut)
            html += `<div class="nut" style="left: ${60}px;"><span class="fret-number">0</span></div>`;
            for (let i = 1; i <= fretsCount; i++) {
                html += `<div class="fret" style="left: ${i * fretWidth + 60}px;"><span class="fret-number">${i}</span></div>`;
            }

            // Метки на ладах
            const markerFrets = cfg.markers;
            const totalStrH = strings.length * 40;
            const centerY  = totalStrH / 2 + 30;
            const thirdY   = totalStrH / 3 + 30;
            const twoThirdY = totalStrH * 2 / 3 + 30;
            markerFrets.forEach(f => {
                if (f <= fretsCount) {
                    const x = (f - 0.5) * fretWidth + 60;
                    if (f === 12) {
                        html += `<div class="fret-marker" style="left:${x}px;top:${thirdY}px;"></div>`;
                        html += `<div class="fret-marker" style="left:${x}px;top:${twoThirdY}px;"></div>`;
                    } else {
                        html += `<div class="fret-marker" style="left:${x}px;top:${centerY}px;"></div>`;
                    }
                }
            });

            function getNoteAtFret(openNote, openOctave, fret) {
                const startIndex = NOTES.indexOf(openNote);
                const noteIndex = (startIndex + fret) % 12;
                const octaveShift = Math.floor((startIndex + fret) / 12);
                return { note: NOTES[noteIndex], octave: openOctave + octaveShift };
            }

            strings.forEach((string, sIdx) => {
                html += `<div class="string" style="top: ${sIdx * 40 + 30}px;"></div>`;
                for (let fIdx = 0; fIdx <= fretsCount; fIdx++) {
                    const { note, octave } = getNoteAtFret(string.note, string.octave, fIdx);
                    const fretHL = (isTestMode && testNote && showHint) ? testNote : selectedNote;
                    const isActive = fretHL.note === note && fretHL.octave === octave;
                    html += `<button class="fret-dot ${isActive ? 'selected' : ''}" data-note="${note}" data-octave="${octave}" style="left: ${fIdx * fretWidth + 25}px; top: ${sIdx * 40 + 30}px;">`;
                    if (showKeyLabels) html += `<span class="fret-dot-label">${TRANSLATIONS[lang].notes[note]}</span>`;
                    html += '</button>';
                }
            });

            container.innerHTML = html;

            container.querySelectorAll('.fret-dot').forEach(btn => {
                let tFretX, tFretY;
                btn.addEventListener('touchstart', (e) => {
                    tFretX = e.touches[0].clientX;
                    tFretY = e.touches[0].clientY;
                }, {passive: true});
                btn.addEventListener('touchend', (e) => {
                    const dx = Math.abs(e.changedTouches[0].clientX - tFretX);
                    const dy = Math.abs(e.changedTouches[0].clientY - tFretY);
                    if (dx < 12 && dy < 12) {
                        e.preventDefault();
                        handleNoteClick(btn.dataset.note, parseInt(btn.dataset.octave));
                    }
                });
                btn.addEventListener('mousedown', (e) => {
                    e.preventDefault();
                    handleNoteClick(btn.dataset.note, parseInt(btn.dataset.octave));
                });
            });
        }

        function handleNoteClick(note, octave) {
            playFrequency(note, octave);
            selectedNote = { note, octave };

            if (activeTab === 'composer') {
                composerSelectedNote = { note, octave };
                const d = DURATIONS.find(dur => dur.id === compDuration);
                composerNotes.push({ note, octave, duration: d.val, type: d.id, label: d.label, isPause: false });
                updateComposerStaff();
            }

            if (activeTab === 'theory' && isTestMode && testNote) {
                if (note === testNote.note && octave === testNote.octave) {
                    showFeedback(TRANSLATIONS[lang].correct, true);
                    setTimeout(() => generateNewTestNote(), 800);
                } else {
                    showFeedback(TRANSLATIONS[lang].wrong, false);
                }
            }

            updateUI();
        }

        function showFeedback(text, isCorrect) {
            const modal = document.getElementById('feedbackModal');
            const feedbackText = document.getElementById('feedbackText');
            feedbackText.textContent = text;
            feedbackText.className = 'feedback-text ' + (isCorrect ? 'correct' : 'wrong');
            modal.classList.remove('hidden');
            setTimeout(() => modal.classList.add('hidden'), isCorrect ? 800 : 1000);
        }

        function noteToMidi(note, octave) {
            return (octave + 1) * 12 + NOTES.indexOf(note);
        }

        // Нижняя открытая струна для инструментов, использующих гриф без ладов + укулеле
        const STRING_TEST_RANGE = {
            violin:     { note: 'G', octave: 3 },
            viola:      { note: 'C', octave: 3 },
            ukulele:    { note: 'C', octave: 4 },
        };
        // Явный "потолок" для продвинутого уровня, когда формула +24 п/т не подходит
        // (верхняя нота альта — ми 3-й октавы, реальный практический предел)
        const ADVANCED_CAP_OVERRIDE = {
            viola: { note: 'E', octave: 6 },
        };

        function getInstrTestRange() {
            if (instrMode === 'balalaika' || instrMode === 'domra') {
                // Lowest open string: E4; cap per level
                const maxMidis = [noteToMidi('B', 4), noteToMidi('E', 5), noteToMidi('B', 5)];
                return { minMidi: noteToMidi('E', 4), maxMidi: maxMidis[testLevel] };
            } else if (instrMode === 'guitar') {
                // Lowest open string: E3; cap per level
                const maxMidis = [noteToMidi('B', 3), noteToMidi('B', 4), noteToMidi('B', 5)];
                return { minMidi: noteToMidi('E', 3), maxMidi: maxMidis[testLevel] };
            } else if (instrMode === 'contrabass') {
                // Реальный диапазон контрабаса — около 4 октав, E1-h1 звучания = E2-B5 написано
                // (контрабас звучит на октаву ниже написанного)
                const ranges = [
                    { minMidi: noteToMidi('E', 2), maxMidi: noteToMidi('B', 2) },  // начальный
                    { minMidi: noteToMidi('E', 2), maxMidi: noteToMidi('E', 4) },  // средний
                    { minMidi: noteToMidi('E', 2), maxMidi: noteToMidi('B', 4) },  // продвинутый — до си 1-й октавы (конец грифа)
                ];
                return ranges[testLevel];
            } else if (instrMode === 'cello') {
                // Реальный практический диапазон виолончели — до большой октавы до ля первой (C2-A4)
                const ranges = [
                    { minMidi: noteToMidi('C', 2), maxMidi: noteToMidi('G', 2) },  // начальный
                    { minMidi: noteToMidi('C', 2), maxMidi: noteToMidi('C', 4) },  // средний
                    { minMidi: noteToMidi('C', 2), maxMidi: noteToMidi('A', 4) },  // продвинутый (весь диапазон)
                ];
                return ranges[testLevel];
            } else if (STRING_TEST_RANGE[instrMode]) {
                // Смычковые и укулеле: диапазон от нижней открытой струны, +7/+12 п/т по уровню
                const { note, octave } = STRING_TEST_RANGE[instrMode];
                const minMidi = noteToMidi(note, octave);
                const override = ADVANCED_CAP_OVERRIDE[instrMode];
                const advancedMax = override ? noteToMidi(override.note, override.octave) : minMidi + 24;
                const maxMidis = [minMidi + 7, minMidi + 12, advancedMax];
                return { minMidi, maxMidi: maxMidis[testLevel] };
            } else {
                // Piano: диапазон по уровню
                const ranges = [
                    { minMidi: noteToMidi('C', 4), maxMidi: noteToMidi('B', 4) }, // начальный: 1-я октава
                    { minMidi: noteToMidi('C', 3), maxMidi: noteToMidi('B', 4) }, // средний: малая + 1-я
                    { minMidi: noteToMidi('C', 3), maxMidi: noteToMidi('B', 5) }, // продвинутый: + 2-я
                ];
                return ranges[testLevel];
            }
        }

        function generateNewTestNote() {
            const { minMidi, maxMidi } = getInstrTestRange();
            const natural = NOTES.filter(n => !n.includes('#'));
            const candidates = [];
            for (let oct = 2; oct <= 6; oct++) {
                for (const note of natural) {
                    const midi = noteToMidi(note, oct);
                    if (midi >= minMidi && midi <= maxMidi) candidates.push({ note, octave: oct });
                }
            }
            testNote = candidates[Math.floor(Math.random() * candidates.length)];
            showHint = false;
            updateUI();
        }

        // ── MICROPHONE PITCH DETECTION ──────────────────────────────────
        function freqToNoteOctave(freq) {
            if (!freq || freq < 50 || freq > 5000) return null;
            const noteNames = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
            const semitones = Math.round(12 * Math.log2(freq / 440)) + 69;
            const octave = Math.floor(semitones / 12) - 1;
            const noteIdx = ((semitones % 12) + 12) % 12;
            return { note: noteNames[noteIdx], octave };
        }

        // YIN pitch detection — significantly more robust against octave errors
        // than naive autocorrelation (which mistakes strong overtones for the fundamental)
        function autocorrelate(buffer, sampleRate) {
            const SIZE = buffer.length;
            const half = SIZE >> 1;

            // Silence check
            let rms = 0;
            for (let i = 0; i < SIZE; i++) rms += buffer[i] * buffer[i];
            if (Math.sqrt(rms / SIZE) < 0.015) return -1;

            // Step 1: difference function  d[tau] = Σ (x[j] - x[j+tau])²
            const d = new Float32Array(half);
            for (let tau = 1; tau < half; tau++) {
                for (let j = 0; j < half; j++) {
                    const x = buffer[j] - buffer[j + tau];
                    d[tau] += x * x;
                }
            }

            // Step 2: cumulative mean normalized difference function
            const cmnd = new Float32Array(half);
            cmnd[0] = 1;
            let runSum = 0;
            for (let tau = 1; tau < half; tau++) {
                runSum += d[tau];
                cmnd[tau] = (runSum > 0) ? d[tau] * tau / runSum : 0;
            }

            // Step 3: find the first tau where cmnd dips below threshold, then find its local minimum
            // Threshold 0.15 is the standard YIN value — low threshold → fewer octave errors
            const THRESHOLD = 0.15;
            let tau = 2;
            while (tau < half - 1) {
                if (cmnd[tau] < THRESHOLD) {
                    while (tau + 1 < half - 1 && cmnd[tau + 1] < cmnd[tau]) tau++;
                    break;
                }
                tau++;
            }
            if (tau >= half - 1) return -1; // no clear pitch found

            // Step 4: parabolic interpolation for sub-sample precision
            if (tau > 0 && tau < half - 1) {
                const s0 = cmnd[tau - 1], s1 = cmnd[tau], s2 = cmnd[tau + 1];
                const denom = 2 * s1 - s0 - s2;
                if (denom > 0) tau = tau + 0.5 * (s2 - s0) / denom;
            }

            return sampleRate / tau;
        }

        function micTick() {
            if (!micAnalyser || !micEnabled) return;
            const buf = new Float32Array(micAnalyser.fftSize);
            micAnalyser.getFloatTimeDomainData(buf);

            // Volume bar
            let rms = 0;
            for (let i = 0; i < buf.length; i++) rms += buf[i] * buf[i];
            rms = Math.sqrt(rms / buf.length);
            const vol = Math.min(100, rms * 400);
            const bar = document.getElementById('micBar');
            if (bar) {
                bar.style.width = vol + '%';
                bar.className = 'mic-bar' + (vol > 75 ? ' loud' : '');
            }

            const freq = autocorrelate(buf, micAnalyser.context.sampleRate);
            const detected = document.getElementById('micDetected');

            if (freq > 0) {
                const result = freqToNoteOctave(freq);
                if (result) {
                    const t = TRANSLATIONS[lang];
                    const noteName = t.notes[result.note] || result.note;
                    const octaveName = t.octaves[result.octave] || result.octave;
                    if (detected) {
                        detected.textContent = noteName + ' · ' + octaveName;
                    }

                    // Check against test note
                    if (isTestMode && testNote && !micMatchCooldown) {
                        const noteMatch = result.note === testNote.note;
                        const octaveMatch = result.octave === testNote.octave;
                        if (detected) detected.className = 'mic-detected ' + (noteMatch && octaveMatch ? 'match' : 'nomatch');

                        if (noteMatch && octaveMatch) {
                            micMatchCooldown = true;
                            showFeedback(TRANSLATIONS[lang].correct, true);
                            setTimeout(() => {
                                generateNewTestNote();
                                micMatchCooldown = false;
                            }, 1000);
                        }
                    }
                    micLastDetected = result;
                }
            } else {
                if (detected && !micMatchCooldown) {
                    detected.textContent = TRANSLATIONS[lang].micListening;
                    detected.className = 'mic-detected';
                }
            }

            micAnimId = requestAnimationFrame(micTick);
        }

        async function startMic() {
            try {
                micStream = await navigator.mediaDevices.getUserMedia({ audio: true, video: false });
                if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                if (audioCtx.state === 'suspended') audioCtx.resume();
                micSource = audioCtx.createMediaStreamSource(micStream);
                micAnalyser = audioCtx.createAnalyser();
                micAnalyser.fftSize = 2048;
                micSource.connect(micAnalyser);
                micEnabled = true;
                micAnimId = requestAnimationFrame(micTick);
                const btn = document.getElementById('micToggleBtn');
                if (btn) { btn.className = 'mic-toggle active'; }
                document.getElementById('micToggleText').textContent = TRANSLATIONS[lang].micOn;
            } catch (e) {
                micEnabled = false;
                const btn = document.getElementById('micToggleBtn');
                if (btn) btn.className = 'mic-toggle error';
                document.getElementById('micToggleText').textContent = TRANSLATIONS[lang].micError;
            }
        }

        function stopMic() {
            micEnabled = false;
            micMatchCooldown = false;
            if (micAnimId) { cancelAnimationFrame(micAnimId); micAnimId = null; }
            if (micSource) { micSource.disconnect(); micSource = null; }
            if (micStream) { micStream.getTracks().forEach(t => t.stop()); micStream = null; }
            micAnalyser = null;
            const btn = document.getElementById('micToggleBtn');
            if (btn) btn.className = 'mic-toggle';
            const txt = document.getElementById('micToggleText');
            if (txt) txt.textContent = TRANSLATIONS[lang].micOff;
            const bar = document.getElementById('micBar');
            if (bar) bar.style.width = '0%';
            const det = document.getElementById('micDetected');
            if (det) { det.textContent = '—'; det.className = 'mic-detected'; }
        }

            if (micEnabled) stopMic();

        function generateNewRhythm() {
            const beats = parseInt(rhythmSig.split('/')[0]);
            let current = 0;
            let newTarget = [];
            while (current < beats) {
                const possible = DURATIONS.filter(d => d.val <= (beats - current));
                const chosen = possible[Math.floor(Math.random() * possible.length)];
                newTarget.push(chosen);
                current += chosen.val;
            }
            targetRhythm = newTarget;
            userRhythm = [];
            showRhythmTarget = false;
            updateRhythmUI();
        }

        function createWavBlob(notes, sampleRate = 44100) {
            const tempo = 120;
            const secondsPerBeat = 60 / tempo;

            // Build full sample array
            const allSamples = [];
            for (const noteObj of notes) {
                const durationSec = (noteObj.duration || noteObj.val) * secondsPerBeat;
                const numSamples = Math.floor(durationSec * sampleRate);
                if (!noteObj.isPause && noteObj.note !== 'PAUSE') {
                    const freq = getFrequency(noteObj.note, noteObj.octave);
                    for (let i = 0; i < numSamples; i++) {
                        const t = i / sampleRate;
                        const envelope = Math.exp(-t * 3);
                        allSamples.push(Math.sin(2 * Math.PI * freq * t) * 0.5 * envelope);
                    }
                } else {
                    for (let i = 0; i < numSamples; i++) allSamples.push(0);
                }
            }

            // Encode as WAV (PCM 16-bit mono)
            const numSamples = allSamples.length;
            const buffer = new ArrayBuffer(44 + numSamples * 2);
            const view = new DataView(buffer);
            const writeStr = (off, s) => { for (let i = 0; i < s.length; i++) view.setUint8(off + i, s.charCodeAt(i)); };
            writeStr(0, 'RIFF');
            view.setUint32(4, 36 + numSamples * 2, true);
            writeStr(8, 'WAVE');
            writeStr(12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);   // PCM
            view.setUint16(22, 1, true);   // mono
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, sampleRate * 2, true);
            view.setUint16(32, 2, true);
            view.setUint16(34, 16, true);
            writeStr(36, 'data');
            view.setUint32(40, numSamples * 2, true);
            for (let i = 0; i < numSamples; i++) {
                view.setInt16(44 + i * 2, Math.max(-32768, Math.min(32767, Math.round(allSamples[i] * 32767))), true);
            }
            return new Blob([buffer], { type: 'audio/wav' });
        }

            if (composerNotes.length === 0 || isRendering) return;
            isRendering = true;
            updateComposerActions();
            try {
                const blob = createWavBlob(composerNotes);
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = 'composition.wav';
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);
            } catch (e) {
                console.error(e);
            } finally {
                isRendering = false;
                updateComposerActions();
            }
        }

        const style = document.createElement('style');
