        // ══════════════════════════════════════════════════════════
        //  ПОСТРОЕНИЕ MODULE
        // ══════════════════════════════════════════════════════════

        // ── Data ─────────────────────────────────────────────────
        const INTERVAL_SEMITONES = {
            'Прима': 0, 'Малая секунда': 1, 'Большая секунда': 2,
            'Малая терция': 3, 'Большая терция': 4, 'Чистая кварта': 5,
            'Тритон': 6, 'Чистая квинта': 7, 'Малая секста': 8,
            'Большая секста': 9, 'Малая септима': 10, 'Большая септима': 11, 'Октава': 12
        };
        const INTERVAL_EN = {
            'Прима': 'Prime', 'Малая секунда': 'Minor 2nd', 'Большая секунда': 'Major 2nd',
            'Малая терция': 'Minor 3rd', 'Большая терция': 'Major 3rd', 'Чистая кварта': 'Perfect 4th',
            'Тритон': 'Tritone', 'Чистая квинта': 'Perfect 5th', 'Малая секста': 'Minor 6th',
            'Большая секста': 'Major 6th', 'Малая септима': 'Minor 7th', 'Большая септима': 'Major 7th', 'Октава': 'Octave'
        };
        const INTERVALS_BY_CLASS = {
            '1-2': ['Большая секунда', 'Малая терция', 'Большая терция', 'Чистая кварта'],
            '3-4': ['Малая секунда', 'Большая секунда', 'Малая терция', 'Большая терция', 'Чистая кварта', 'Чистая квинта', 'Большая секста'],
            '5-6': ['Малая секунда', 'Большая секунда', 'Малая терция', 'Большая терция', 'Чистая кварта', 'Тритон', 'Чистая квинта', 'Малая секста', 'Большая секста', 'Малая септима'],
            '7-8': Object.keys(INTERVAL_SEMITONES)
        };

        const CHORD_INTERVALS = {
            'Мажорное трезвучие': [0, 4, 7],
            'Минорное трезвучие': [0, 3, 7],
            'Уменьшенное трезвучие': [0, 3, 6],
            'Увеличенное трезвучие': [0, 4, 8]
        };
        const CHORD_EN = {
            'Мажорное трезвучие': 'Major triad', 'Минорное трезвучие': 'Minor triad',
            'Уменьшенное трезвучие': 'Diminished triad', 'Увеличенное трезвучие': 'Augmented triad'
        };
        const CHORDS_BY_CLASS = {
            '1-2': ['Мажорное трезвучие'],
            '3-4': ['Мажорное трезвучие', 'Минорное трезвучие'],
            '5-6': ['Мажорное трезвучие', 'Минорное трезвучие', 'Уменьшенное трезвучие'],
            '7-8': Object.keys(CHORD_INTERVALS)
        };

        const SCALE_PATTERNS = {
            'Мажор': [2, 2, 1, 2, 2, 2, 1],
            'Натуральный минор': [2, 1, 2, 2, 1, 2, 2],
            'Гармонический минор': [2, 1, 2, 2, 1, 3, 1],
            'Мелодический минор ↑': [2, 1, 2, 2, 2, 2, 1]
        };
        const SCALE_EN = { 'Мажор': 'Major', 'Натуральный минор': 'Natural minor', 'Гармонический минор': 'Harmonic minor', 'Мелодический минор ↑': 'Melodic minor ↑' };
        const SCALES_BY_CLASS = {
            '1-2': { patterns: ['Мажор'], tonics: ['C', 'G', 'F'] },
            '3-4': { patterns: ['Мажор', 'Натуральный минор'], tonics: ['C', 'G', 'D', 'F', 'A', 'E'] },
            '5-6': { patterns: ['Мажор', 'Натуральный минор', 'Гармонический минор'], tonics: ['C', 'G', 'D', 'A', 'E', 'F', 'A#', 'D#'] },
            '7-8': { patterns: Object.keys(SCALE_PATTERNS), tonics: ['C', 'G', 'D', 'A', 'E', 'B', 'F#', 'C#', 'F', 'A#', 'D#', 'G#'] }
        };

        const FLAT_NAMES_RU = { 'A#': 'Си♭', 'D#': 'Ми♭', 'G#': 'Ля♭', 'C#': 'Ре♭', 'F#': 'Соль♭', 'B': 'Доь', 'E': 'Фаь' };
        const FLAT_NAMES_EN = { 'A#': 'Bb', 'D#': 'Eb', 'G#': 'Ab', 'C#': 'Db', 'F#': 'Gb', 'B': 'Cb', 'E': 'Fb' };
        function getScaleFlatNotes(tonic, pat) {
            const min = pat.includes('минор') || pat.toLowerCase().includes('minor');
            const maj = { 'F':['A#'],'A#':['A#','D#'],'D#':['A#','D#','G#'],'G#':['A#','D#','G#','C#'],'C#':['A#','D#','G#','C#','F#'] };
            const mni = { 'D':['A#'],'G':['A#','D#'],'C':['A#','D#','G#'],'F':['A#','D#','G#','C#'],'A#':['A#','D#','G#','C#','F#'],
                          'D#':['A#','D#','G#','C#','F#','B'],           // Ми♭ минор: 6 бемолей, доб. Доь
                          'G#':['A#','D#','G#','C#','F#','B','E'] };     // Ля♭ минор: 7 бемолей, доб. Доь+Фаь
            return (min ? mni : maj)[tonic] || [];
        }
        function displayScaleNote(note, fn) {
            if (fn && fn.includes(note)) return lang === 'ru' ? (FLAT_NAMES_RU[note] || note) : (FLAT_NAMES_EN[note] || note);
            return TRANSLATIONS[lang].notesLong[note] || note;
        }

        // Returns list of note-names (e.g. 'A#') that should display as flats in a chord context.
        // Uses diatonic degree expectation: triad 3rd = root+2 letter steps, 5th = root+4 letter steps.
        function getChordFlatNotes(rootNote, intervals) {
            const LETTERS = ['C','D','E','F','G','A','B'];
            const SEMITONE_TO_STEP = {3: 2, 4: 2, 6: 4, 7: 4, 8: 4};
            const rootLetterIdx = LETTERS.indexOf(rootNote);
            const rootNoteIdx = NOTES.indexOf(rootNote);
            const flatNotes = [];
            intervals.forEach(semitones => {
                if (semitones === 0) return;
                const step = SEMITONE_TO_STEP[semitones];
                if (step === undefined) return;
                const expectedLetter = LETTERS[(rootLetterIdx + step) % 7];
                const actualNote = NOTES[((rootNoteIdx + semitones) % 12 + 12) % 12];
                if (actualNote.includes('#') && actualNote[0] !== expectedLetter) {
                    flatNotes.push(actualNote);
                }
            });
            return flatNotes;
        }

        const KEY_SIGNATURES = [
            { key: 'До мажор', signs: 0, signType: 'none', keyEn: 'C major' },
            { key: 'Соль мажор', signs: 1, signType: 'sharp', keyEn: 'G major' },
            { key: 'Ре мажор', signs: 2, signType: 'sharp', keyEn: 'D major' },
            { key: 'Ля мажор', signs: 3, signType: 'sharp', keyEn: 'A major' },
            { key: 'Ми мажор', signs: 4, signType: 'sharp', keyEn: 'E major' },
            { key: 'Си мажор', signs: 5, signType: 'sharp', keyEn: 'B major' },
            { key: 'Фа-диез мажор', signs: 6, signType: 'sharp', keyEn: 'F# major' },
            { key: 'Фа мажор', signs: 1, signType: 'flat', keyEn: 'F major' },
            { key: 'Си-бемоль мажор', signs: 2, signType: 'flat', keyEn: 'Bb major' },
            { key: 'Ми-бемоль мажор', signs: 3, signType: 'flat', keyEn: 'Eb major' },
            { key: 'Ля-бемоль мажор', signs: 4, signType: 'flat', keyEn: 'Ab major' },
            { key: 'Ля минор', signs: 0, signType: 'none', keyEn: 'A minor' },
            { key: 'Ми минор', signs: 1, signType: 'sharp', keyEn: 'E minor' },
            { key: 'Си минор', signs: 2, signType: 'sharp', keyEn: 'B minor' },
            { key: 'Фа-диез минор', signs: 3, signType: 'sharp', keyEn: 'F# minor' },
            { key: 'До-диез минор', signs: 4, signType: 'sharp', keyEn: 'C# minor' },
            { key: 'Ре минор', signs: 1, signType: 'flat', keyEn: 'D minor' },
            { key: 'Соль минор', signs: 2, signType: 'flat', keyEn: 'G minor' },
            { key: 'До минор', signs: 3, signType: 'flat', keyEn: 'C minor' },
            { key: 'Фа минор', signs: 4, signType: 'flat', keyEn: 'F minor' }
        ];
        const KEYS_BY_CLASS = {
            '1-2': ['До мажор', 'Соль мажор', 'Фа мажор', 'Ля минор'],
            '3-4': ['До мажор', 'Соль мажор', 'Ре мажор', 'Фа мажор', 'Си-бемоль мажор', 'Ля минор', 'Ми минор', 'Ре минор', 'Соль минор'],
            '5-6': ['До мажор', 'Соль мажор', 'Ре мажор', 'Ля мажор', 'Фа мажор', 'Си-бемоль мажор', 'Ми-бемоль мажор', 'Ля минор', 'Ми минор', 'Си минор', 'Ре минор', 'Соль минор', 'До минор'],
            '7-8': KEY_SIGNATURES.map(k => k.key)
        };

        // ── State ────────────────────────────────────────────────
        let postrType = 'intervals';
        let postrClass = '1-2';
        let postrCurrentEx = null;
        let postrUserAnswer = []; // array of {note, octave} for piano exercises; string for keys
        let postrChecked = false;
        let postrHintShown = false;

        // ── Helpers ──────────────────────────────────────────────
        function addSemitones(note, octave, semitones) {
            const idx = NOTES.indexOf(note);
            const abs = octave * 12 + idx + semitones;
            return { note: NOTES[((abs % 12) + 12) % 12], octave: Math.floor(abs / 12) };
        }

        function buildScaleNotes(tonic, octave, patternName) {
            const pattern = SCALE_PATTERNS[patternName];
            const result = [{ note: tonic, octave }];
            let cur = { note: tonic, octave };
            for (const step of pattern) {
                cur = addSemitones(cur.note, cur.octave, step);
                result.push({ note: cur.note, octave: cur.octave });
            }
            return result;
        }

        function noteLabel(note, octave) {
            const t = TRANSLATIONS[lang];
            return (t.notesLong[note] || note) + ' ' + (t.octavesLong[octave] || octave);
        }

        function intervalLabel(name) {
            return lang === 'en' ? (INTERVAL_EN[name] || name) : name;
        }
        function chordLabel(name) {
            return lang === 'en' ? (CHORD_EN[name] || name) : name;
        }
        function scaleLabel(name) {
            return lang === 'en' ? (SCALE_EN[name] || name) : name;
        }
        function keyLabel(ks) {
            return lang === 'en' ? ks.keyEn : ks.key;
        }

        function randFrom(arr) {
            return arr[Math.floor(Math.random() * arr.length)];
        }

        function pickRootNote() {
            const natural = NOTES.filter(n => !n.includes('#'));
            return { note: randFrom(natural), octave: 4 };
        }

        // ── Exercise generators ──────────────────────────────────
        function generateIntervalEx() {
            const intervalList = INTERVALS_BY_CLASS[postrClass];
            const intervalName = randFrom(intervalList);
            const { note, octave } = pickRootNote();
            const semitones = INTERVAL_SEMITONES[intervalName];
            // Прима — direction doesn't matter; otherwise random up/down
            const direction = semitones === 0 ? 'up' : (Math.random() < 0.5 ? 'up' : 'down');
            const target = addSemitones(note, octave, direction === 'down' ? -semitones : semitones);
            return { kind: 'interval', rootNote: note, rootOctave: octave, intervalName, target, semitones, direction };
        }

        function generateChordEx() {
            const chordList = CHORDS_BY_CLASS[postrClass];
            const chordName = randFrom(chordList);
            const { note, octave } = pickRootNote();
            const intervals = CHORD_INTERVALS[chordName];
            const targets = intervals.map(s => addSemitones(note, octave, s));
            return { kind: 'chord', rootNote: note, rootOctave: octave, chordName, targets, intervals };
        }

        function generateScaleEx() {
            const { patterns, tonics } = SCALES_BY_CLASS[postrClass];
            const patternName = randFrom(patterns);
            const tonicNote = randFrom(tonics);
            const scaleNotes = buildScaleNotes(tonicNote, 4, patternName);
            return { kind: 'scale', tonicNote, patternName, scaleNotes };
        }

        function generateKeysEx() {
            const keyList = KEYS_BY_CLASS[postrClass];
            const keyName = randFrom(keyList);
            const ks = KEY_SIGNATURES.find(k => k.key === keyName);
            // Generate 4 multiple-choice options
            const pool = KEY_SIGNATURES.filter(k => keyList.includes(k.key) && k.key !== keyName);
            const shuffled = pool.sort(() => Math.random() - 0.5).slice(0, 3);
            const options = [...shuffled, ks].sort(() => Math.random() - 0.5);
            return { kind: 'keys', ks, options };
        }

        function generateExercise() {
            postrChecked = false;
            postrHintShown = false;
            postrUserAnswer = [];
            if (postrType === 'intervals') postrCurrentEx = generateIntervalEx();
            else if (postrType === 'chords') postrCurrentEx = generateChordEx();
            else if (postrType === 'scales') postrCurrentEx = generateScaleEx();
            else postrCurrentEx = generateKeysEx();
            // Pre-fill root/tonic so it counts toward the answer
            if (postrCurrentEx.kind === 'chord') {
                postrUserAnswer = [{ note: postrCurrentEx.rootNote, octave: postrCurrentEx.rootOctave }];
            } else if (postrCurrentEx.kind === 'scale') {
                postrUserAnswer = [{ note: postrCurrentEx.tonicNote, octave: 4 }];
            } else if (postrCurrentEx.kind === 'keys') {
                postrUserAnswer = '';
            }
            renderPostrExercise();
        }

        // ── Mini piano renderer ──────────────────────────────────
        // givenNotes: [{note, octave}], selectedNotes: [{note, octave}], correctNotes: [{note, octave}]|null
        function buildMiniPiano(givenNotes, selectedNotes, correctNotes, octaveRange, flatNotes = []) {
            const whites = ['C', 'D', 'E', 'F', 'G', 'A', 'B'];
            const blackOffsets = { 'C#': 1, 'D#': 2, 'F#': 4, 'G#': 5, 'A#': 6 };
            const ww = 36; // white key width
            const bw = 22; // black key width

            function keyLbl(n) {
                if (flatNotes.includes(n)) return lang === 'ru' ? (FLAT_NAMES_RU[n] || n) : (FLAT_NAMES_EN[n] || n);
                return TRANSLATIONS[lang].notes[n] || n;
            }

            function classFor(note, octave, type) {
                const isGiven = givenNotes.some(n => n.note === note && n.octave === octave);
                if (isGiven) return type + ' given';
                if (correctNotes) {
                    const isCorrect = correctNotes.some(n => n.note === note && n.octave === octave);
                    const isSelected = selectedNotes.some(n => n.note === note && n.octave === octave);
                    if (isSelected && isCorrect) return type + ' correct-hl';
                    if (isSelected && !isCorrect) return type + ' wrong-hl';
                    if (!isSelected && isCorrect) return type + ' correct-hl'; // show missed
                    return type;
                }
                const isSelected = selectedNotes.some(n => n.note === note && n.octave === octave);
                return type + (isSelected ? ' selected' : '');
            }

            let html = '<div class="postr-piano-wrap"><div class="postr-piano">';
            for (const oct of octaveRange) {
                html += `<div class="postr-octave" style="width:${ww*7}px;">`;
                // White keys
                whites.forEach(n => {
                    const cls = classFor(n, oct, 'postr-white');
                    const cb = (!postrChecked) ? `onclick="postrPianoClick('${n}',${oct})"` : '';
                    html += `<div class="${cls}" ${cb}>${keyLbl(n)}</div>`;
                });
                // Black keys
                Object.entries(blackOffsets).forEach(([n, pos]) => {
                    const left = (pos - 1) * ww + (ww * 0.7);
                    const cls = classFor(n, oct, 'postr-black');
                    const cb = (!postrChecked) ? `onclick="postrPianoClick('${n}',${oct})"` : '';
                    html += `<div class="${cls}" style="left:${left}px;top:0;" ${cb}>${keyLbl(n)}</div>`;
                });
                html += '</div>';
            }
            html += '</div></div>';
            return html;
        }

        // ── Piano click handler ──────────────────────────────────
        function postrPianoClick(note, octave) {
            if (postrChecked) return;
            const ex = postrCurrentEx;
            if (ex.kind === 'interval') {
                postrUserAnswer = [{ note, octave }];
            }
            else if (ex.kind === 'chord') {
                // Root is pre-filled and locked
                if (note === ex.rootNote && octave === ex.rootOctave) { playFrequency(note, octave, 0.5); return; }
                const idx = postrUserAnswer.findIndex(n => n.note === note && n.octave === octave);
                if (idx >= 0) postrUserAnswer.splice(idx, 1);
                else if (postrUserAnswer.length < ex.targets.length) postrUserAnswer.push({ note, octave });
            }
            else if (ex.kind === 'scale') {
                // Tonic is pre-filled and locked
                if (note === ex.tonicNote && octave === 4) { playFrequency(note, octave, 0.5); return; }
                const idx = postrUserAnswer.findIndex(n => n.note === note && n.octave === octave);
                if (idx >= 0) postrUserAnswer.splice(idx, 1);
                else if (postrUserAnswer.length < ex.scaleNotes.length) postrUserAnswer.push({ note, octave });
            }
            playFrequency(note, octave, 0.5);
            renderPostrExercise();
        }

        // ── Check logic ──────────────────────────────────────────
        function postrCheckAnswer() {
            if (postrChecked) return;
            const ex = postrCurrentEx;
            let correct = false;

            if (ex.kind === 'interval') {
                correct = postrUserAnswer.length === 1 &&
                    postrUserAnswer[0].note === ex.target.note &&
                    postrUserAnswer[0].octave === ex.target.octave;
            } else if (ex.kind === 'chord') {
                correct = postrUserAnswer.length === ex.targets.length &&
                    ex.targets.every(tc => postrUserAnswer.some(a => a.note === tc.note && a.octave === tc.octave));
            } else if (ex.kind === 'scale') {
                // Order-independent: all correct notes must be selected
                correct = postrUserAnswer.length === ex.scaleNotes.length &&
                    ex.scaleNotes.every(tc => postrUserAnswer.some(a => a.note === tc.note && a.octave === tc.octave));
            } else if (ex.kind === 'keys') {
                const _sk = KEY_SIGNATURES.find(k => k.key === postrUserAnswer);
                correct = _sk && _sk.signs === ex.ks.signs && _sk.signType === ex.ks.signType;
            }

            postrChecked = true;
            renderPostrExercise(correct);
            if (correct) {
                setTimeout(() => generateExercise(), 1000);
            } else {
                // Wrong — reset after 1.5s so student tries same exercise again
                setTimeout(() => {
                    postrChecked = false;
                    if (ex.kind === 'chord') postrUserAnswer = [{ note: ex.rootNote, octave: ex.rootOctave }];
                    else if (ex.kind === 'scale') postrUserAnswer = [{ note: ex.tonicNote, octave: 4 }];
                    else if (ex.kind === 'keys') postrUserAnswer = '';
                    else postrUserAnswer = [];
                    renderPostrExercise();
                }, 1500);
            }
        }

        // ── Key sig option click ─────────────────────────────────
        function postrSelectOption(keyName) {
            if (postrChecked) return;
            postrUserAnswer = keyName;
            renderPostrExercise();
        }

        // ── Key signature SVG ────────────────────────────────────
        function buildKeySignatureSVG(signs, signType) {
            const sp    = 10;
            const sTop  = 44;
            const clefW = 50;
            const signW = 16;
            const w     = clefW + Math.max(signs, 0) * signW + 10;
            const h     = sTop + sp * 4 + 22;
            const sc    = isDark ? '#94a3b8' : '#64748b';
            const nc    = isDark ? '#e2e8f0' : '#1e293b';

            let svg = `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" overflow="visible" style="display:inline-block;vertical-align:middle">`;

            for (let i = 0; i < 5; i++) {
                svg += `<line x1="4" y1="${sTop+i*sp}" x2="${w-4}" y2="${sTop+i*sp}" stroke="${sc}" stroke-width="1.5"/>`;
            }

            // Treble clef: baseline 2 px above bottom staff line (matches main composer staff)
            const clefY = sTop + sp * 4 - 2;
            svg += '<text x="5" y="' + clefY + '" font-size="58" fill="' + nc + '" font-family="serif">𝄞</text>';

            if (signs > 0 && signType !== 'none') {
                // Standard treble-clef positions (offset × sp from sTop)
                // Sharps: F     C      G       D     A      E     B
                const sharpOff = [0.0, 1.5, -0.5,  1.0,  2.5,  0.5,  2.0];
                // Flats:  B     E      A      D     G      C     F
                const flatOff  = [2.0, 0.5,  2.5,  1.0,  3.0,  1.5,  3.5];
                const offsets  = signType === 'sharp' ? sharpOff : flatOff;

                for (let i = 0; i < signs; i++) {
                    const cx = clefW + i * signW;
                    const cy = sTop + offsets[i] * sp;

                    if (signType === 'sharp') {
                        // Two vertical lines
                        svg += `<line x1="${cx+2}"  y1="${cy-7}"  x2="${cx+2}"  y2="${cy+7}"  stroke="${nc}" stroke-width="1.5"/>`;
                        svg += `<line x1="${cx+8}"  y1="${cy-9}"  x2="${cx+8}"  y2="${cy+5}"  stroke="${nc}" stroke-width="1.5"/>`;
                        // Two slightly tilted horizontal bars
                        svg += `<line x1="${cx-1}"  y1="${cy-2}"  x2="${cx+11}" y2="${cy-4}"  stroke="${nc}" stroke-width="2.2"/>`;
                        svg += `<line x1="${cx-1}"  y1="${cy+3}"  x2="${cx+11}" y2="${cy+1}"  stroke="${nc}" stroke-width="2.2"/>`;
                    } else {
                        // Flat: vertical stem + teardrop belly (note center at cy)
                        svg += `<line x1="${cx}" y1="${cy-12}" x2="${cx}" y2="${cy+5}" stroke="${nc}" stroke-width="1.5"/>`;
                        svg += `<path d="M${cx},${cy-4} C${cx+12},${cy-5} ${cx+12},${cy+5} ${cx},${cy+5} Z" fill="none" stroke="${nc}" stroke-width="1.5"/>`;
                    }
                }
            }

            svg += '</svg>';
            return svg;
        }

        // ── Main render ──────────────────────────────────────────
        function renderPostrExercise(checkResult) {
            const area = document.getElementById('postrExerciseArea');
            if (!area || !postrCurrentEx) return;
            const t = TRANSLATIONS[lang];
            const ex = postrCurrentEx;
            let html = '';

            // ── Task card ──
            html += '<div class="postr-task-card">';
            if (ex.kind === 'interval') {
                const dirArrow = ex.direction === 'down' ? '↓' : '↑';
                const dirText = ex.direction === 'down' ? (lang === 'ru' ? 'вниз' : 'down') : (lang === 'ru' ? 'вверх' : 'up');
                html += `<div class="postr-task-label">${t.buildInterval}:</div>`;
                html += `<div class="postr-task-main">${noteLabel(ex.rootNote, ex.rootOctave)}</div>`;
                html += `<div class="postr-task-sub">${intervalLabel(ex.intervalName)}</div>`;
                html += `<div class="postr-task-dir">${dirArrow} ${dirText}</div>`;
            } else if (ex.kind === 'chord') {
                html += `<div class="postr-task-label">${t.buildChord}:</div>`;
                html += `<div class="postr-task-main">${noteLabel(ex.rootNote, ex.rootOctave)}</div>`;
                html += `<div class="postr-task-sub">${chordLabel(ex.chordName)}</div>`;
            } else if (ex.kind === 'scale') {
                html += `<div class="postr-task-label">${t.buildScale}:</div>`;
                { const _fn=getScaleFlatNotes(ex.tonicNote,ex.patternName),_od=TRANSLATIONS[lang].octavesLong[4]||"";
                  html += `<div class="postr-task-main">${displayScaleNote(ex.tonicNote,_fn)} ${_od}</div>`; }
                html += `<div class="postr-task-sub">${scaleLabel(ex.patternName)}</div>`;
                if (ex.patternName === 'Мелодический минор ↑') {
                    html += `<div style="font-size:12px;color:var(--color-text-muted);margin-top:4px">↓ ${lang==='ru'?'Нисходящий ход — натуральный минор':'Descending — natural minor'}</div>`;
                }
            } else if (ex.kind === 'keys') {
                html += `<div class="postr-task-label">${t.identifyKey}</div>`;
                html += `<div style="display:flex;justify-content:center;margin:10px 0 4px">`;
                html += buildKeySignatureSVG(ex.ks.signs, ex.ks.signType);
                html += '</div>';
            }
            html += '</div>';

            // ── Hint box ──
            if (postrHintShown && !postrChecked) {
                html += '<div class="postr-hint-box show">';
                html += `<b>${t.hintAnswer}</b> `;
                if (ex.kind === 'interval') {
                    html += noteLabel(ex.target.note, ex.target.octave);
                } else if (ex.kind === 'chord') {
                    { const _cfn = getChordFlatNotes(ex.rootNote, ex.intervals);
                      html += ex.targets.map(n => displayScaleNote(n.note, _cfn) + ' ' + (TRANSLATIONS[lang].octavesLong[n.octave] || n.octave)).join(', '); }
                } else if (ex.kind === 'scale') {
                    { const _fn=getScaleFlatNotes(ex.tonicNote,ex.patternName);
                      html += ex.scaleNotes.map(n=>displayScaleNote(n.note,_fn)).join(' – '); }
                } else if (ex.kind === 'keys') {
                    html += keyLabel(ex.ks);
                }
                html += '</div>';
            }

            // ── Result box ──
            if (postrChecked) {
                const ok = checkResult !== undefined ? checkResult :
                    (() => {
                        if (ex.kind === 'interval') return postrUserAnswer.length === 1 && postrUserAnswer[0].note === ex.target.note && postrUserAnswer[0].octave === ex.target.octave;
                        if (ex.kind === 'chord') return postrUserAnswer.length === ex.targets.length && ex.targets.every(tc => postrUserAnswer.some(a => a.note === tc.note && a.octave === tc.octave));
                        if (ex.kind === 'scale') return postrUserAnswer.length === ex.scaleNotes.length && ex.scaleNotes.every(tc => postrUserAnswer.some(a => a.note === tc.note && a.octave === tc.octave));
                        if (ex.kind === 'keys') { const _sk=KEY_SIGNATURES.find(k=>k.key===postrUserAnswer); return _sk && _sk.signs===ex.ks.signs && _sk.signType===ex.ks.signType; }
                        return false;
                    })();
                html += `<div class="postr-result-box show ${ok ? 'success' : 'error'}">${ok ? t.correct : t.wrong}</div>`;
            }

            // ── Answer area ──
            if (ex.kind !== 'keys') {
                // Piano-based answer
                const givenNotes = ex.kind === 'interval' || ex.kind === 'chord' ? [{ note: ex.rootNote, octave: ex.rootOctave }]
                    : ex.kind === 'scale' ? [{ note: ex.tonicNote, octave: 4 }] : [];
                const correctNotes = postrChecked
                    ? (ex.kind === 'interval' ? [ex.target] : ex.kind === 'chord' ? ex.targets : ex.scaleNotes)
                    : (postrHintShown ? (ex.kind === 'interval' ? [ex.target] : ex.kind === 'chord' ? ex.targets : ex.scaleNotes) : null);

                // Show answer chips
                const _scaleFn = ex.kind === 'scale' ? getScaleFlatNotes(ex.tonicNote, ex.patternName)
                               : ex.kind === 'chord' ? getChordFlatNotes(ex.rootNote, ex.intervals)
                               : [];
                html += '<div class="postr-answer-display">';
                if (postrUserAnswer.length === 0) {
                    html += `<span class="postr-answer-placeholder">${t.selectNote}</span>`;
                } else {
                    postrUserAnswer.forEach(a => {
                        let cls = 'postr-answer-chip';
                        if (postrChecked) {
                            const isCorr = (ex.kind === 'interval' ? [ex.target] : ex.kind === 'chord' ? ex.targets : ex.scaleNotes)
                                .some(c => c.note === a.note && c.octave === a.octave);
                            cls += isCorr ? ' correct' : ' wrong';
                        }
                        const noteName = (ex.kind === 'scale' || ex.kind === 'chord') ? displayScaleNote(a.note, _scaleFn) : (t.notesLong[a.note] || a.note);
                        html += `<div class="${cls}">${noteName}</div>`;
                    });
                }
                html += '</div>';

                // Piano — for downward intervals the target can fall in octave 3
                const octaveRange = ex.kind === 'scale' ? [4, 5]
                    : (ex.kind === 'interval' && ex.direction === 'down') ? [3, 4] : [4, 5];
                html += buildMiniPiano(givenNotes, postrUserAnswer, postrChecked || postrHintShown ? correctNotes : null, octaveRange, _scaleFn);

            } else {
                // Key signatures: multiple choice
                html += '<div class="postr-keysig-options">';
                ex.options.forEach(opt => {
                    let cls = 'postr-keysig-opt';
                    const optKey = opt.key;
                    const isSelected = postrUserAnswer === optKey;
                    if (postrChecked) {
                        if (opt.signs === ex.ks.signs && opt.signType === ex.ks.signType) cls += ' correct';
                        else if (isSelected) cls += ' wrong';
                    } else if (isSelected) {
                        cls += ' selected';
                    }
                    const cb = (!postrChecked) ? `onclick="postrSelectOption('${optKey.replace(/'/g, "\\'")}')"` : '';
                    html += `<button class="${cls}" ${cb}>${keyLabel(opt)}</button>`;
                });
                html += '</div>';
            }

            // ── Actions ──
            html += '<div class="postr-actions">';
            if (!postrChecked) {
                html += `<button class="action-btn secondary" onclick="postrShowHint()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/>
                    </svg>
                    ${t.hint}
                </button>`;
                const canCheck = ex.kind === 'keys'  ? (typeof postrUserAnswer === 'string' && postrUserAnswer !== '')
                    : ex.kind === 'chord' ? (postrUserAnswer.length === ex.targets.length)
                    : ex.kind === 'scale' ? (postrUserAnswer.length === ex.scaleNotes.length)
                    : (postrUserAnswer.length > 0);
                html += `<button class="action-btn primary" onclick="postrCheckAnswer()" ${canCheck ? '' : 'disabled'}>
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/>
                    </svg>
                    ${t.check}
                </button>`;
            }
            html += `<button class="action-btn dark" onclick="generateExercise()">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                    <path d="M1 4v6h6"/><path d="M23 20v-6h-6"/>
                    <path d="M20.49 9A9 9 0 005.64 5.64L1 10m22 4l-4.64 4.36A9 9 0 013.51 15"/>
                </svg>
                ${t.newEx}
            </button>`;
            if (!postrChecked && (ex.kind==='interval'?postrUserAnswer.length>0:ex.kind==='keys'?(postrUserAnswer!==''):postrUserAnswer.length>1)) {
                html += `<button class="action-btn secondary" onclick="postrUndo()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M3 7v6h6"/><path d="M21 17a9 9 0 00-9-9 9 9 0 00-6 2.3L3 13"/>
                    </svg>
                    ${t.undo}
                </button>`;
            }
            const hasClearable = ex.kind === 'chord' ? postrUserAnswer.length > 1
                : ex.kind === 'scale' ? postrUserAnswer.length > 1
                : ex.kind === 'keys' ? (typeof postrUserAnswer === 'string' && postrUserAnswer !== '')
                : postrUserAnswer.length > 0;
            if (!postrChecked && hasClearable) {
                html += `<button class="action-btn danger" onclick="postrClearAnswer()">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
                        <circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/>
                    </svg>
                    ${t.clear}
                </button>`;
            }
            html += '</div>';

            // Preserve piano scroll position across re-renders
            const _existingWrap = area.querySelector('.postr-piano-wrap');
            const _savedScroll = _existingWrap ? _existingWrap.scrollLeft : 0;

            area.innerHTML = html;

            if (_savedScroll > 0) {
                const _newWrap = area.querySelector('.postr-piano-wrap');
                if (_newWrap) {
                    _newWrap.scrollLeft = _savedScroll;
                    // Re-apply after browser layout to override any auto-scroll
                    requestAnimationFrame(() => { _newWrap.scrollLeft = _savedScroll; });
                    setTimeout(() => { _newWrap.scrollLeft = _savedScroll; }, 50);
                }
            }
        }

        function postrUndo() {
            if (!postrCurrentEx || postrChecked) return;
            const ex = postrCurrentEx;
            if (ex.kind==='chord' && postrUserAnswer.length>1) postrUserAnswer.pop();
            else if (ex.kind==='scale' && postrUserAnswer.length>1) postrUserAnswer.pop();
            else if (ex.kind==='interval') postrUserAnswer=[];
            else if (ex.kind==='keys') postrUserAnswer='';
            renderPostrExercise();
        }

        function postrShowHint() {
            postrHintShown = true;
            renderPostrExercise();
        }

        function postrClearAnswer() {
            const ex = postrCurrentEx;
            if (ex.kind === 'chord') postrUserAnswer = [{ note: ex.rootNote, octave: ex.rootOctave }];
            else if (ex.kind === 'scale') postrUserAnswer = [{ note: ex.tonicNote, octave: 4 }];
            else if (ex.kind === 'keys') postrUserAnswer = '';
            else postrUserAnswer = [];
            renderPostrExercise();
        }

        // ── Theory reference panel ───────────────────────────────
        let postrTheoryOpen = false;

        function togglePostrTheory() {
            postrTheoryOpen = !postrTheoryOpen;
            const btn = document.getElementById('postrTheoryToggle');
            const panel = document.getElementById('postrTheoryPanel');
            const arrow = document.getElementById('postrTheoryArrow');
            if (btn) btn.classList.toggle('open', postrTheoryOpen);
            if (arrow) arrow.textContent = postrTheoryOpen ? '▲' : '▼';
            if (panel) {
                panel.classList.toggle('hidden', !postrTheoryOpen);
                if (postrTheoryOpen) renderPostrTheoryContent();
            }
        }

        function renderPostrTheoryContent() {
            const panel = document.getElementById('postrTheoryPanel');
            if (!panel || !postrTheoryOpen) return;
            const ru = lang === 'ru';
            // shared larger table style
            const tblStyle = 'width:100%;border-collapse:collapse;font-size:14px';
            const thStyle = 'text-align:left;color:var(--color-text-muted);font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;padding:4px 8px 10px;border-bottom:1px solid var(--color-border)';
            const tdStyle = 'padding:9px 8px;border-bottom:1px solid var(--color-border);color:var(--color-text-primary);vertical-align:middle';
            const tdLast = 'padding:9px 8px;color:var(--color-text-primary);vertical-align:middle';
            // semitones → readable "X тонов + 1 пт" (shared across all sections)
            const semiDesc = (s, isRu) => {
                const tones = Math.floor(s / 2), halves = s % 2;
                if (s === 0) return '0';
                const tw = isRu ? (tones>=5?'тонов':tones>=2?'тона':'тон') : `tone${tones>1?'s':''}`;
                if (halves === 0) return `${tones} ${tw}`;
                if (tones === 0) return isRu ? '1 полутон' : '1 semitone';
                return isRu ? `${tones} ${tw} + 1 пт` : `${tones} ${tw} + 1 st`;
            };
            let h = '';

            if (postrType === 'intervals') {
                h += `<table style="${tblStyle}"><tr>
                    <th style="${thStyle}">${ru?'Название':'Name'}</th>
                    <th style="${thStyle}">${ru?'Полутонов':'Semitones'}</th>
                    <th style="${thStyle}">${ru?'Состав':'Tones'}</th>
                    <th style="${thStyle}">${ru?'Краткое':'Abbr.'}</th>
                </tr>`;
                [
                    ['Прима','Prime',0,'ч.1','P1'],
                    ['Малая секунда','Minor 2nd',1,'м.2','m2'],
                    ['Большая секунда','Major 2nd',2,'Б.2','M2'],
                    ['Малая терция','Minor 3rd',3,'м.3','m3'],
                    ['Большая терция','Major 3rd',4,'Б.3','M3'],
                    ['Чистая кварта','Perfect 4th',5,'ч.4','P4'],
                    ['Тритон','Tritone',6,'тт','TT'],
                    ['Чистая квинта','Perfect 5th',7,'ч.5','P5'],
                    ['Малая секста','Minor 6th',8,'м.6','m6'],
                    ['Большая секста','Major 6th',9,'Б.6','M6'],
                    ['Малая септима','Minor 7th',10,'м.7','m7'],
                    ['Большая септима','Major 7th',11,'Б.7','M7'],
                    ['Октава','Octave',12,'ч.8','P8'],
                ].forEach(([nr,ne,s,ar,ae],i,arr)=>{
                    const last = i===arr.length-1;
                    h+=`<tr>
                        <td style="${last?tdLast:tdStyle}">${ru?nr:ne}</td>
                        <td style="${last?tdLast:tdStyle}"><span class="postr-theory-badge" style="font-size:13px;padding:3px 10px">${s}</span></td>
                        <td style="${last?tdLast:tdStyle};color:var(--color-text-muted);font-size:12px">${semiDesc(s,ru)}</td>
                        <td style="${last?tdLast:tdStyle};color:var(--color-text-muted)">${ru?ar:ae}</td>
                    </tr>`;
                });
                h+='</table>';
                h+=`<div class="postr-theory-tip">💡 ${ru?'Считайте полутоны от данной ноты вверх. При построении вниз — вниз от данной ноты.':'Count semitones from the given note upward. When building downward — count downward.'}</div>`;

            } else if (postrType === 'chords') {
                // строение: each interval as [nameRu, nameEn, semitones]
                const chordFmt = (ivs, isRu) => ivs.map(([nr,ne,s])=>`${isRu?nr:ne} (${semiDesc(s,isRu)})`).join(' + ');
                h += `<table style="${tblStyle}"><tr>
                    <th style="${thStyle}">${ru?'Аккорд':'Chord'}</th>
                    <th style="${thStyle}">${ru?'Строение':'Structure'}</th>
                    <th style="${thStyle}">${ru?'Пример от До':'Example from C'}</th>
                </tr>`;
                [
                    ['Мажорное трезвучие','Major triad',[['Б.3','M3',4],['м.3','m3',3]],'До – Ми – Соль','C – E – G'],
                    ['Минорное трезвучие','Minor triad',[['м.3','m3',3],['Б.3','M3',4]],'До – Ми♭ – Соль','C – E♭ – G'],
                    ['Уменьшенное трезвучие','Diminished triad',[['м.3','m3',3],['м.3','m3',3]],'До – Ми♭ – Соль♭','C – E♭ – G♭'],
                    ['Увеличенное трезвучие','Augmented triad',[['Б.3','M3',4],['Б.3','M3',4]],'До – Ми – Соль#','C – E – G#'],
                ].forEach(([nr,ne,ivs,er,ee],i,arr)=>{
                    const last = i===arr.length-1;
                    h+=`<tr>
                        <td style="${last?tdLast:tdStyle};font-weight:500">${ru?nr:ne}</td>
                        <td style="${last?tdLast:tdStyle};color:var(--color-text-muted);font-size:13px">${chordFmt(ivs,ru)}</td>
                        <td style="${last?tdLast:tdStyle};color:var(--color-text-muted);font-size:13px">${ru?er:ee}</td>
                    </tr>`;
                });
                h+='</table>';
                h+=`<div class="postr-theory-tip">💡 ${ru?'Основной тон (До) уже стоит — добавьте остальные ноты аккорда. Б.3 = большая терция (2 тона), м.3 = малая терция (1 тон + 1 пт).':'Root note (C) is given — add the rest. M3 = major third (2 tones), m3 = minor third (1 tone + 1 semitone).'}</div>`;

            } else if (postrType === 'scales') {
                // Т/п notation — standard Russian music school
                const fmtF = (steps, isRu) => steps.map(s => s===2?(isRu?'Т':'W') : s===1?(isRu?'п':'H'):(isRu?'ув':'A')).join('–');
                h += `<table style="${tblStyle}"><tr>
                    <th style="${thStyle}">${ru?'Гамма':'Scale'}</th>
                    <th style="${thStyle}">${ru?'Формула (Т = тон, п = пт)':'Formula (W = whole, H = half)'}</th>
                    <th style="${thStyle}">${ru?'Пример от До / Ля':'From C / A'}</th>
                </tr>`;
                // Regular scales
                [
                    ['Мажор','Major',[2,2,1,2,2,2,1],'До Ре Ми Фа Соль Ля Си','C D E F G A B'],
                    ['Натуральный минор','Natural minor',[2,1,2,2,1,2,2],'Ля Си До Ре Ми Фа Соль','A B C D E F G'],
                    ['Гармонический минор','Harmonic minor',[2,1,2,2,1,3,1],'Ля Си До Ре Ми Фа Соль#','A B C D E F G#'],
                ].forEach(([nr,ne,steps,er,ee])=>{
                    h+=`<tr>
                        <td style="${tdStyle};font-weight:500">${ru?nr:ne}</td>
                        <td style="${tdStyle}"><span class="postr-theory-badge" style="font-size:13px;padding:3px 10px;letter-spacing:1px">${fmtF(steps,ru)}</span></td>
                        <td style="${tdStyle};color:var(--color-text-muted);font-size:12px">${ru?er:ee}</td>
                    </tr>`;
                });
                // Melodic minor — two-way scale (справочник only, not in practice)
                const melUp   = [2,1,2,2,2,2,1];
                const melDown = [2,1,2,2,1,2,2]; // natural minor
                h+=`<tr>
                    <td style="${tdLast};font-weight:500">${ru?'Мелодический минор':'Melodic minor'}</td>
                    <td style="${tdLast}">
                        <div style="margin-bottom:4px"><span style="font-size:11px;color:var(--color-text-muted);margin-right:4px">↑</span><span class="postr-theory-badge" style="font-size:12px;padding:2px 8px;letter-spacing:1px">${fmtF(melUp,ru)}</span></div>
                        <div><span style="font-size:11px;color:var(--color-text-muted);margin-right:4px">↓</span><span class="postr-theory-badge" style="font-size:12px;padding:2px 8px;letter-spacing:1px">${fmtF(melDown,ru)}</span></div>
                    </td>
                    <td style="${tdLast};color:var(--color-text-muted);font-size:12px">
                        <div style="margin-bottom:2px">↑ ${ru?'Ля Си До Ре Ми Фа# Соль# Ля':'A B C D E F# G# A'}</div>
                        <div>↓ ${ru?'Ля Соль Фа Ми Ре До Си Ля':'A G F E D C B A'}</div>
                    </td>
                </tr>`;
                h+='</table>';
                h+=`<div class="postr-theory-tip">💡 ${ru?'Т = целый тон (2 пт), п = полутон (1 пт), ув = ув. секунда (3 пт). Мелодический минор: при движении вверх VI и VII ступени повышаются, при движении вниз — возвращаются к натуральному минору.':'W = whole tone, H = half tone, A = augmented 2nd. Melodic minor: ascending raises 6th &amp; 7th degrees; descending reverts to natural minor.'}</div>`;

            } else if (postrType === 'keys') {
                const signCell = (n, type) => {
                    if (n === 0) return `<td style="${tdStyle};font-size:16px;white-space:nowrap">—</td>`;
                    const sym = type === 'sharp' ? '♯' : '♭';
                    return `<td style="${tdStyle};white-space:nowrap"><span class="postr-theory-badge" style="font-size:13px;padding:2px 8px;margin-right:6px">${n}</span><span style="font-size:17px;letter-spacing:1px;color:var(--color-text-muted)">${sym.repeat(n)}</span></td>`;
                };
                const sharpKeys = [
                    ['До мажор','C major','Ля минор','A minor',0,'sharp'],
                    ['Соль мажор','G major','Ми минор','E minor',1,'sharp'],
                    ['Ре мажор','D major','Си минор','B minor',2,'sharp'],
                    ['Ля мажор','A major','Фа# минор','F# minor',3,'sharp'],
                    ['Ми мажор','E major','До# минор','C# minor',4,'sharp'],
                    ['Си мажор','B major',null,null,5,'sharp'],
                    ['Фа# мажор','F# major',null,null,6,'sharp'],
                ];
                const flatKeys = [
                    ['Фа мажор','F major','Ре минор','D minor',1,'flat'],
                    ['Си♭ мажор','B♭ major','Соль минор','G minor',2,'flat'],
                    ['Ми♭ мажор','E♭ major','До минор','C minor',3,'flat'],
                    ['Ля♭ мажор','A♭ major','Фа минор','F minor',4,'flat'],
                ];
                h += `<div class="postr-theory-section-title">${ru?'Диезные тональности':'Sharp keys'}</div>`;
                h += `<table style="${tblStyle}"><tr>
                    <th style="${thStyle}">${ru?'Мажор':'Major'}</th>
                    <th style="${thStyle}">${ru?'Параллельный минор':'Relative minor'}</th>
                    <th style="${thStyle}">${ru?'Знаков':'Signs'}</th>
                </tr>`;
                sharpKeys.forEach(([majR,majE,minR,minE,n,type],i,arr)=>{
                    const last=i===arr.length-1;
                    const td=last?tdLast:tdStyle;
                    h+=`<tr>
                        <td style="${td};font-weight:500">${ru?majR:majE}</td>
                        <td style="${td};color:var(--color-text-muted)">${minR?(ru?minR:minE):'—'}</td>
                        ${signCell(n,type).replace(tdStyle,td)}
                    </tr>`;
                });
                h += '</table>';
                h += `<div class="postr-theory-section-title" style="margin-top:14px">${ru?'Бемольные тональности':'Flat keys'}</div>`;
                h += `<table style="${tblStyle}"><tr>
                    <th style="${thStyle}">${ru?'Мажор':'Major'}</th>
                    <th style="${thStyle}">${ru?'Параллельный минор':'Relative minor'}</th>
                    <th style="${thStyle}">${ru?'Знаков':'Signs'}</th>
                </tr>`;
                flatKeys.forEach(([majR,majE,minR,minE,n,type],i,arr)=>{
                    const last=i===arr.length-1;
                    const td=last?tdLast:tdStyle;
                    h+=`<tr>
                        <td style="${td};font-weight:500">${ru?majR:majE}</td>
                        <td style="${td};color:var(--color-text-muted)">${ru?minR:minE}</td>
                        ${signCell(n,type).replace(tdStyle,td)}
                    </tr>`;
                });
                h += '</table>';
                h+=`<div class="postr-theory-tip">💡 ${ru?'Порядок диезов: Фа–До–Соль–Ре–Ля–Ми–Си. Порядок бемолей: Си–Ми–Ля–Ре–Соль–До–Фа.':'Sharp order: F–C–G–D–A–E–B. Flat order: B–E–A–D–G–C–F.'}</div>`;
            }

            panel.innerHTML = h;
        }

        function initPostrTab() {
            document.querySelectorAll('.postr-sub-tab').forEach(btn => {
                btn.addEventListener('click', () => {
                    postrType = btn.dataset.postr;
                    document.querySelectorAll('.postr-sub-tab').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    generateExercise();
                    if (postrTheoryOpen) renderPostrTheoryContent();
                });
            });
            document.querySelectorAll('.postr-class-btn').forEach(btn => {
                btn.addEventListener('click', () => {
                    postrClass = btn.dataset.class;
                    document.querySelectorAll('.postr-class-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    generateExercise();
                });
            });
            generateExercise();
        }
    </script><script>
/* Клавиатурная доступность: элементы с onclick (не <button>/<a>/полям форм)
   становятся фокусируемыми и активируются Enter/Space — включая те,
   что добавляются в DOM динамически (пианино, варианты викторин и т.п.). */
(function(){
  function tagEl(el){
    if(!el || !el.hasAttribute || !el.hasAttribute('onclick')) return;
    var tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL') return;
    if(el.hasAttribute('data-a11y-kb')) return;
    el.setAttribute('data-a11y-kb','1');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  }
  function scan(root){
    if(!root||!root.querySelectorAll) return;
    tagEl(root);
    root.querySelectorAll('[onclick]').forEach(tagEl);
  }
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
    var el=document.activeElement;
    if(el && el.getAttribute && el.hasAttribute('onclick') && el.getAttribute('role')==='button'){
      e.preventDefault();
      el.click();
    }
  });
  if(document.body) scan(document.body);
  else document.addEventListener('DOMContentLoaded', function(){ scan(document.body); });
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){ if(n.nodeType===1) scan(n); });
    });
  });
  if(document.body) mo.observe(document.body,{childList:true,subtree:true});
  else document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); });
})();
</script>
