<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Инструменты оркестра</title>
<meta name="theme-color" content="#1c3a8e">
<script>(function(){var t=localStorage.getItem('musicapp_theme');var dark=t?t==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches;document.documentElement.setAttribute('data-theme',dark?'dark':'light');})()</script>
<style>
/* Отключаем системный жест pull-to-refresh (стрелка/спиннер при потягивании вниз) — приложение уже показывает свой интерфейс, обновление страницы через этот жест не нужно и мешает свайпам внутри модулей. */
html,body{overscroll-behavior-y:contain;}

:root{--bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#94a3b8;--border:#e2e8f0;
  --sl100:#f1f5f9;--sl200:#e2e8f0;--blue:#2563eb;--shadow:0 1px 4px rgba(0,0,0,.07);}
[data-theme="dark"]{--bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#64748b;
  --border:#334155;--sl100:#334155;--sl200:#475569;}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);min-height:100vh;}
.wrap{max-width:900px;margin:0 auto;padding:12px 12px 60px;}
.hdr{display:flex;align-items:center;gap:10px;padding:10px 14px;
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  margin-bottom:14px;box-shadow:var(--shadow);}
.back{font-size:22px;text-decoration:none;color:var(--text);padding:2px 4px;}
.hdr-info{flex:1;}
.hdr-title{font-weight:900;font-size:16px;}
.hdr-sub{font-size:10px;color:var(--muted);font-weight:600;}
.search-box{position:relative;margin-bottom:12px;}
.search-box input{width:100%;padding:10px 34px 10px 14px;border-radius:12px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:13px;box-shadow:var(--shadow);}
.search-box input:focus{outline:none;border-color:var(--blue);}
.search-box .search-clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);
  background:none;border:none;color:var(--muted);cursor:pointer;font-size:16px;padding:4px;display:none;}
.search-box .search-clear.show{display:block;}
.hbtn{padding:7px 12px;background:var(--sl100);border:none;border-radius:9px;
  font-size:10px;font-weight:800;cursor:pointer;color:var(--text);transition:background .15s;}
.hbtn:hover{background:var(--sl200);}
/* Tabs */
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:2px;}
.tabs::-webkit-scrollbar{height:3px;}
.tabs::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px;}
.tab-btn{white-space:nowrap;padding:8px 16px;border-radius:12px;border:1.5px solid var(--border);
  background:var(--card);font-size:12px;font-weight:800;cursor:pointer;
  color:var(--muted);transition:all .15s;flex-shrink:0;}
.tab-btn.active{background:#1c3a8e;border-color:#1c3a8e;color:#fff;}
.tab-panel{display:none;}
.tab-panel.active{display:block;}
/* Orchestra description */
.orch-desc{font-size:11px;color:var(--muted);line-height:1.5;margin-bottom:10px;
  padding:0 2px;}
/* Listen card */
.listen-card{background:var(--card);border:1px solid var(--border);border-radius:12px;
  padding:10px 14px;margin-bottom:14px;display:flex;align-items:center;
  flex-wrap:wrap;gap:8px;box-shadow:var(--shadow);}
.listen-label{font-size:11px;font-weight:900;color:var(--text);flex:1;min-width:120px;}
.listen-btns{display:flex;gap:5px;flex-wrap:wrap;}
/* Group header */
.group-hdr{font-size:10px;font-weight:900;text-transform:uppercase;
  letter-spacing:.7px;color:var(--muted);margin:18px 0 8px;padding-left:2px;}
/* Instrument grid */
.instr-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:8px;}
/* Instrument card */
.icard{background:var(--card);border:1px solid var(--border);border-radius:14px;
  padding:12px;display:flex;flex-direction:column;gap:5px;box-shadow:var(--shadow);}
.icard-top{display:flex;align-items:flex-start;gap:8px;}
.icard-emoji{font-size:26px;line-height:1;margin-top:1px;flex-shrink:0;}
.icard-emoji svg{display:block;}
.icard-right{flex:1;}
.icard-name{font-weight:900;font-size:13px;line-height:1.2;}
.icard-name-en{font-size:9px;color:var(--muted);font-weight:600;margin-top:1px;}
.icard-range{display:inline-block;font-size:9px;color:var(--blue);font-weight:800;
  background:var(--sl100);padding:1px 6px;border-radius:5px;margin-top:3px;}
.icard-desc{font-size:10px;color:var(--muted);line-height:1.45;}
/* Music buttons */
.music-btns{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin-top:2px;}
.ym-link{display:inline-flex;align-items:center;gap:3px;padding:3px 8px;
  border-radius:7px;font-size:9px;font-weight:800;text-decoration:none;
  background:#fc3f1d;color:#fff;transition:opacity .15s;}
.ym-link:hover{opacity:.82;}
.vk-link-sm{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;
  border-radius:7px;font-size:9px;font-weight:800;text-decoration:none;
  background:transparent;border:1.5px solid #0077ff;color:#0077ff;transition:all .15s;}
.vk-link-sm:hover{background:#0077ff;color:#fff;}
.mr-link-sm{display:inline-flex;align-items:center;gap:3px;padding:2px 7px;
  border-radius:7px;font-size:9px;font-weight:800;text-decoration:none;
  background:transparent;border:1.5px solid #ff6600;color:#ff6600;transition:all .15s;}
.mr-link-sm:hover{background:#ff6600;color:#fff;}
/* Favorites */
.icard-top{position:relative;}
.fav-star{margin-left:auto;background:none;border:none;cursor:pointer;font-size:19px;
  line-height:1;color:var(--muted);padding:2px 2px;flex-shrink:0;align-self:flex-start;
  transition:transform .12s,color .12s;}
.fav-star:hover{transform:scale(1.15);}
.fav-star.active{color:#f59e0b;}
.hbtn.fav-toggle.active{background:#f59e0b;color:#fff;}
@media(max-width:480px){
  .instr-grid{grid-template-columns:1fr 1fr;}
  .hdr-title{font-size:14px;}
}
</style>
</head>

var favInstruments = [];
var favOnly = false;
var searchQuery = '';
function setSearch(v){
  searchQuery = v;
  var btn=document.getElementById('searchClearBtn');
  if(btn)btn.classList.toggle('show', !!v);
  renderAll();
}
function clearSearch(){
  searchQuery = '';
  var inp=document.getElementById('instrSearch');
  if(inp)inp.value='';
  var btn=document.getElementById('searchClearBtn');
  if(btn)btn.classList.remove('show');
  renderAll();
}
function loadFavInstruments(){
  try{
    var raw = JSON.parse(localStorage.getItem('musicapp_orch_favorites') || '[]');
    favInstruments = Array.isArray(raw) ? raw : [];
  }catch(e){ favInstruments = []; }
}
function saveFavInstruments(){
  localStorage.setItem('musicapp_orch_favorites', JSON.stringify(favInstruments));
}
function isFavInstrument(key){ return favInstruments.indexOf(key) !== -1; }
function favIndexSet(module,type,id,data){
  try{
    var idx=JSON.parse(localStorage.getItem('musicapp_fav_index')||'{}');
    idx[module+':'+type+':'+id]=Object.assign({module:module,type:type,id:id,ts:Date.now()},data);
    localStorage.setItem('musicapp_fav_index',JSON.stringify(idx));
  }catch(e){}
}
function favIndexRemove(module,type,id){
  try{
    var idx=JSON.parse(localStorage.getItem('musicapp_fav_index')||'{}');
    delete idx[module+':'+type+':'+id];
    localStorage.setItem('musicapp_fav_index',JSON.stringify(idx));
  }catch(e){}
}
function toggleFavInstrument(key,inst,orch){
  var i = favInstruments.indexOf(key);
  if(i === -1){
    favInstruments.push(key);
    if(inst&&orch)favIndexSet('orchestra','instrument',key,{labelRu:inst.ru,labelEn:inst.en,subRu:orch.ru,subEn:orch.en,icon:inst.emoji||'🎻',link:'инструменты оркестра/index.html#orch-'+orch.id});
  }else{
    favInstruments.splice(i, 1);
    favIndexRemove('orchestra','instrument',key);
  }
  saveFavInstruments();
  renderAll();
}
function toggleFavOnly(){
  favOnly = !favOnly;
  updateFavToggleBtn();
  renderAll();
}
function updateFavToggleBtn(){
  var btn = document.getElementById('favToggleBtn');
  if(!btn) return;
  btn.classList.toggle('active', favOnly);
  btn.textContent = favOnly ? T[lang].favOn : T[lang].favOff;
}

/* ─── Theme & Lang ─── */
function updateThemeBtn(){
  var dark=document.documentElement.getAttribute('data-theme')==='dark';
  document.getElementById('themeBtn').textContent=dark?T[lang].light:T[lang].dark;
}
function toggleTheme(){
  var d=document.documentElement;
  var dark=d.getAttribute('data-theme')==='dark';
  d.setAttribute('data-theme',dark?'light':'dark');
  localStorage.setItem('musicapp_theme',dark?'light':'dark');
  updateThemeBtn();
}
function toggleLang(){
  lang=lang==='ru'?'en':'ru';
  localStorage.setItem('musicapp_lang',lang);
  applyLang();
}
function applyLang(){
  var t=T[lang];
  document.getElementById('ttl').textContent=t.title;
  document.getElementById('sub').textContent=t.sub;
  document.getElementById('langBtn').textContent=lang==='ru'?'RU':'EN';
  document.documentElement.lang=lang==='ru'?'ru':'en';
  var is=document.getElementById('instrSearch');if(is)is.placeholder=t.searchPlaceholder;
  updateThemeBtn();
  renderAll();
}
updateThemeBtn();

/* ─── Tabs ─── */
var activeTab='symphony';
function setTab(id){
  activeTab=id;
  document.querySelectorAll('.tab-btn').forEach(function(b){
    b.classList.toggle('active',b.dataset.id===id);
  });
  document.querySelectorAll('.tab-panel').forEach(function(p){
    p.classList.toggle('active',p.dataset.id===id);
  });
}

/* ─── Render ─── */
function renderAll(){
  var tabsRow=document.getElementById('tabsRow');
  var panels=document.getElementById('panels');
  tabsRow.innerHTML='';
  panels.innerHTML='';
  var t=T[lang];

  ORCHESTRAS.forEach(function(orch){
    // Tab button
    var btn=document.createElement('button');
    btn.className='tab-btn'+(orch.id===activeTab?' active':'');
    btn.dataset.id=orch.id;
    btn.innerHTML=orch.icon+' '+(lang==='ru'?orch.ru:orch.en);
    btn.onclick=function(){setTab(orch.id);};
    tabsRow.appendChild(btn);

    // Panel
    var panel=document.createElement('div');
    panel.className='tab-panel'+(orch.id===activeTab?' active':'');
    panel.dataset.id=orch.id;

    // Description
    var desc=document.createElement('div');
    desc.className='orch-desc';
    desc.textContent=lang==='ru'?orch.descRu:orch.descEn;
    panel.appendChild(desc);

    // Listen card
    var vkFull='https://vk.com/audio?q='+encodeURIComponent(orch.vkFull);
    var mrFull='https://my.mail.ru/music/search/'+encodeURIComponent(orch.mrFull);
    var ymFull='https://music.yandex.ru/search?text='+encodeURIComponent(orch.ymFull);

    var listenCard=document.createElement('div');
    listenCard.className='listen-card';
    listenCard.innerHTML=
      '<div class="listen-label">'+t.listenLabel+'</div>'+
      '<div class="listen-btns">'+
        '<a href="'+vkFull+'" target="_blank" rel="noopener" class="vk-link-sm">'+t.vkBtn+'</a>'+
        '<a href="'+mrFull+'" target="_blank" rel="noopener" class="mr-link-sm">'+t.mrBtn+'</a>'+
        '<a href="'+ymFull+'" target="_blank" rel="noopener" class="ym-link">'+t.ymBtn+'</a>'+
      '</div>';
    panel.appendChild(listenCard);

    // Groups
    var orchHasVisible=false;
    orch.groups.forEach(function(grp){
      var q=searchQuery.trim().toLowerCase();
      var items = grp.items.filter(function(inst){
        if(favOnly && !isFavInstrument(orch.id+'::'+inst.en)) return false;
        if(q && inst.ru.toLowerCase().indexOf(q)===-1 && inst.en.toLowerCase().indexOf(q)===-1) return false;
        return true;
      });
      if(!items.length) return;
      orchHasVisible=true;

      var gh=document.createElement('div');
      gh.className='group-hdr';
      gh.textContent=lang==='ru'?grp.ru:grp.en;
      panel.appendChild(gh);

      var grid=document.createElement('div');
      grid.className='instr-grid';

      items.forEach(function(inst){
        var card=document.createElement('div');
        card.className='icard';

        var vkUrl='https://vk.com/audio?q='+encodeURIComponent(inst.vkQ);
        var mrUrl='https://my.mail.ru/music/search/'+encodeURIComponent(inst.en);
        var ymUrl='https://music.yandex.ru/search?text='+encodeURIComponent(inst.ymQ);
        var rangeHtml=inst.range?'<div class="icard-range">'+inst.range+'</div>':'';
        var favKey=orch.id+'::'+inst.en;
        var isFav=isFavInstrument(favKey);

        card.innerHTML=
          '<div class="icard-top">'+
            '<div class="icard-emoji">'+inst.emoji+'</div>'+
            '<div class="icard-right">'+
              '<div class="icard-name">'+(lang==='ru'?inst.ru:inst.en)+'</div>'+
              '<div class="icard-name-en">'+(lang==='ru'?inst.en:inst.ru)+'</div>'+
              rangeHtml+
            '</div>'+
            '<button class="fav-star'+(isFav?' active':'')+'" data-fav-key="'+favKey.replace(/"/g,'&quot;')+'" title="'+(lang==='ru'?'В избранное':'Add to favorites')+'">'+(isFav?'★':'☆')+'</button>'+
          '</div>'+
          '<div class="icard-desc">'+(lang==='ru'?inst.descRu:inst.descEn)+'</div>'+
          '<div class="music-btns">'+
            '<a href="'+vkUrl+'" target="_blank" rel="noopener" class="vk-link-sm">'+t.vkBtn+'</a>'+
            '<a href="'+mrUrl+'" target="_blank" rel="noopener" class="mr-link-sm">'+t.mrBtn+'</a>'+
            '<a href="'+ymUrl+'" target="_blank" rel="noopener" class="ym-link">'+t.ymBtn+'</a>'+
          '</div>';

        var starBtn=card.querySelector('.fav-star');
        starBtn.addEventListener('click',function(){ toggleFavInstrument(favKey,inst,orch); });

        grid.appendChild(card);
      });

      panel.appendChild(grid);
    });

    if((favOnly||searchQuery.trim()) && !orchHasVisible){
      var empty=document.createElement('div');
      empty.style.cssText='text-align:center;padding:30px 0;color:var(--muted);font-size:12px;font-weight:700;';
      empty.textContent=searchQuery.trim() ? t.searchEmpty : t.favEmpty;
      panel.appendChild(empty);
    }

    panels.appendChild(panel);
  });
  updateFavToggleBtn();
}

/* ─── Init ─── */
if(lang!=='ru'){
  document.getElementById('ttl').textContent=T[lang].title;
  document.getElementById('sub').textContent=T[lang].sub;
  document.getElementById('langBtn').textContent='EN';
}
document.getElementById('instrSearch').placeholder=T[lang].searchPlaceholder;
(function(){
  var m=location.hash.match(/^#orch-(.+)$/);
  if(m)activeTab=decodeURIComponent(m[1]);
})();
renderAll();
</script>
<script>
/* Клавиатурная доступность: элементы с onclick (не <button>/<a>/полям форм)
   становятся фокусируемыми и активируются Enter/Space — включая те,
   что добавляются в DOM динамически (пианино, варианты викторин и т.п.). */
(function(){
  function tagEl(el){
    if(!el || !el.hasAttribute || !el.hasAttribute('onclick')) return;
    var tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL') return;
    if(el.hasAttribute('data-a11y-kb')) return;
    el.setAttribute('data-a11y-kb','1');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  }
  function scan(root){
    if(!root||!root.querySelectorAll) return;
    tagEl(root);
    root.querySelectorAll('[onclick]').forEach(tagEl);
  }
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
    var el=document.activeElement;
    if(el && el.getAttribute && el.hasAttribute('onclick') && el.getAttribute('role')==='button'){
      e.preventDefault();
      el.click();
    }
  });
  if(document.body) scan(document.body);
  else document.addEventListener('DOMContentLoaded', function(){ scan(document.body); });
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){ if(n.nodeType===1) scan(n); });
    });
  });
  if(document.body) mo.observe(document.body,{childList:true,subtree:true});
  else document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); });
})();
</script>

</body>
</html>
