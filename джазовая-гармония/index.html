<style>
:root{
  --bg:#f8fafc;--card:#fff;--text:#0f172a;--muted:#94a3b8;--border:#e2e8f0;
  --sl100:#f1f5f9;--sl200:#e2e8f0;--blue:#2563eb;--blue2:#1d4ed8;
  --shadow:0 1px 4px rgba(0,0,0,.07);
}
[data-theme="dark"]{
  --bg:#0f172a;--card:#1e293b;--text:#f1f5f9;--muted:#64748b;
  --border:#334155;--sl100:#334155;--sl200:#475569;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  background:var(--bg);color:var(--text);transition:background .3s,color .3s;}
.wrap{max-width:960px;margin:0 auto;padding:12px 14px;}

/* HEADER */
.hdr{display:flex;justify-content:space-between;align-items:center;
  padding:10px 16px;background:var(--card);border:1px solid var(--border);
  border-radius:16px;margin-bottom:12px;box-shadow:var(--shadow);}
.hdr-title{font-weight:900;font-size:15px;}
.hdr-sub{font-size:10px;font-weight:700;color:var(--muted);text-transform:uppercase;}
.hdr-btns{display:flex;gap:6px;}
.hbtn{padding:6px 11px;background:var(--sl100);border:none;border-radius:10px;
  font-size:10px;font-weight:800;text-transform:uppercase;cursor:pointer;
  color:var(--text);display:flex;align-items:center;gap:5px;}
.hbtn:hover{background:var(--sl200);}

/* INTRO BANNER */
.intro{background:linear-gradient(135deg,#1e1b4b 0%,#312e81 50%,#1e3a5f 100%);
  border-radius:18px;padding:22px 20px;margin-bottom:12px;color:#fff;}
.intro-title{font-size:20px;font-weight:900;margin-bottom:6px;}
.intro-sub{font-size:12px;opacity:.75;line-height:1.6;max-width:560px;}

/* MAIN TABS */
.main-tabs{display:flex;gap:5px;background:var(--card);border:1px solid var(--border);
  border-radius:14px;padding:4px;margin-bottom:14px;box-shadow:var(--shadow);}
.main-tab{flex:1;padding:10px;border:none;border-radius:10px;font-size:11px;
  font-weight:800;text-transform:uppercase;cursor:pointer;background:none;
  color:var(--muted);transition:all .15s;font-family:inherit;}
.main-tab.active{background:var(--blue);color:#fff;}

/* STYLE CARDS GRID */
.cards{columns:2;column-gap:12px;}
@media(max-width:560px){.cards{columns:1;}}

.scard{break-inside:avoid;background:var(--card);border:1px solid var(--border);
  border-radius:18px;padding:0;margin-bottom:12px;box-shadow:var(--shadow);
  overflow:hidden;}
.scard-header{padding:16px 16px 14px;cursor:pointer;transition:background .15s;}
.scard-header:hover{background:var(--sl100);}
.scard-top{display:flex;align-items:center;gap:10px;margin-bottom:10px;}
.scard-emoji{font-size:28px;line-height:1;flex-shrink:0;}
.scard-name{font-size:15px;font-weight:900;line-height:1.2;}
.scard-origin{font-size:10px;color:var(--muted);font-weight:600;margin-top:2px;}
.era-badge{display:inline-block;padding:2px 8px;border-radius:10px;font-size:9px;
  font-weight:900;text-transform:uppercase;letter-spacing:.5px;margin-bottom:9px;}
.scard-bio{font-size:12px;line-height:1.65;color:var(--muted);margin-bottom:12px;}
.features{display:flex;flex-wrap:wrap;gap:5px;margin-bottom:12px;}
.feature-tag{padding:3px 9px;border-radius:10px;font-size:10px;font-weight:700;
  background:var(--sl100);color:var(--text);}
.scard-actions{display:flex;gap:8px;align-items:center;}
.btn-listen{display:flex;align-items:center;gap:5px;padding:7px 13px;
  border:none;border-radius:10px;font-size:11px;font-weight:800;
  cursor:pointer;transition:all .15s;color:#fff;}
.btn-listen:active{transform:scale(.97);}
.btn-listen.playing{opacity:.85;}
.btn-more{padding:7px 12px;border:1.5px solid var(--border);border-radius:10px;
  font-size:11px;font-weight:800;cursor:pointer;background:none;
  color:var(--text);transition:all .15s;}
.btn-more:hover{border-color:var(--blue);color:var(--blue);}
.scard-body{display:none;border-top:1px solid var(--border);padding:14px 16px;}
.scard-body.open{display:block;}
.body-section-title{font-size:9px;font-weight:900;text-transform:uppercase;
  color:var(--muted);letter-spacing:.6px;margin-bottom:8px;margin-top:12px;}
.body-section-title:first-child{margin-top:0;}
.performers{display:flex;flex-wrap:wrap;gap:7px;margin-bottom:4px;}
.performer-chip{display:flex;align-items:center;gap:6px;padding:5px 10px;
  background:var(--sl100);border-radius:10px;}
.performer-ini{width:24px;height:24px;border-radius:50%;display:flex;
  align-items:center;justify-content:center;font-size:8px;font-weight:900;
  color:#fff;flex-shrink:0;}
.performer-name{font-size:11px;font-weight:700;}
.work-item{padding:8px 10px;background:var(--sl100);border-radius:10px;margin-bottom:6px;}
.work-name{font-size:12px;font-weight:800;}
.work-meta{font-size:10px;color:var(--muted);margin-top:2px;}
.work-desc{font-size:11px;color:var(--muted);margin-top:4px;line-height:1.5;}
.work-links{display:flex;align-items:center;gap:10px;margin-top:7px;flex-wrap:wrap;}
.ym-link{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;
  border-radius:8px;font-size:10px;font-weight:800;text-decoration:none;
  background:#fc3f1d;color:#fff;transition:opacity .15s;}
.ym-link:hover{opacity:.82;}
.yt-link-sm{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:8px;font-size:10px;font-weight:800;text-decoration:none;
  background:transparent;border:1.5px solid #ff0000;color:#ff0000;
  transition:all .15s;}
.yt-link-sm:hover{background:#ff0000;color:#fff;}
.vk-link-sm{display:inline-flex;align-items:center;gap:5px;padding:3px 9px;
  border-radius:8px;font-size:10px;font-weight:800;text-decoration:none;
  background:transparent;border:1.5px solid #0077ff;color:#0077ff;
  transition:all .15s;}
.vk-link-sm:hover{background:#0077ff;color:#fff;}

/* MODAL */
.modal-ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);
  z-index:1000;padding:14px;align-items:flex-end;justify-content:center;
  backdrop-filter:blur(3px);}
@media(min-height:600px){.modal-ov{align-items:center;}}
.modal-ov.show{display:flex;}
.modal-card{background:var(--card);border-radius:22px 22px 16px 16px;
  max-width:500px;width:100%;max-height:84vh;overflow-y:auto;
  padding:20px 18px 24px;position:relative;border:1px solid var(--border);
  box-shadow:0 24px 60px rgba(0,0,0,.35);
  animation:mIn .22s cubic-bezier(.2,.8,.3,1);}
@media(min-height:600px){.modal-card{border-radius:22px;}}
@keyframes mIn{from{transform:translateY(30px) scale(.97);opacity:0}to{transform:none;opacity:1}}
.modal-close{position:absolute;top:14px;right:14px;width:30px;height:30px;
  border-radius:50%;border:none;background:var(--sl100);cursor:pointer;
  font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--muted);}
.modal-close:hover{background:var(--sl200);}
.modal-emoji{font-size:32px;margin-bottom:8px;}
.modal-title{font-size:20px;font-weight:900;margin-bottom:4px;}
.modal-period{font-size:11px;color:var(--muted);font-weight:600;margin-bottom:14px;}
.modal-story-title{font-size:9px;font-weight:900;text-transform:uppercase;
  color:var(--muted);letter-spacing:.6px;margin-bottom:8px;margin-top:16px;}
.modal-story{font-size:13px;line-height:1.75;color:var(--text);}
.modal-story p{margin-bottom:10px;}
.modal-story p:last-child{margin-bottom:0;}

/* ── EXERCISES ──────────────────────────────────────── */
.ex-tabs-row{display:flex;gap:5px;flex-wrap:wrap;margin-bottom:14px;}
.ex-tab{padding:6px 13px;border-radius:20px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:11px;font-weight:700;
  cursor:pointer;transition:all .15s;font-family:inherit;}
.ex-tab.active{background:var(--blue);color:#fff;border-color:var(--blue);}

.ex-card{background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:20px;margin-bottom:12px;}
.ex-task-label{font-size:10px;font-weight:900;text-transform:uppercase;
  color:var(--muted);letter-spacing:.5px;margin-bottom:8px;}
.ex-task-main{font-size:22px;font-weight:900;margin-bottom:4px;}
.ex-task-sub{font-size:14px;color:var(--blue);font-weight:700;margin-bottom:14px;}
.ex-desc{font-size:12px;color:var(--muted);line-height:1.6;margin-bottom:16px;}

/* Result boxes */
.result-box{padding:10px 16px;border-radius:8px;font-size:14px;font-weight:700;
  text-align:center;margin-bottom:14px;display:none;}
.result-box.show{display:block;}
.result-box.ok{background:rgba(22,163,74,.12);color:#16a34a;border:1px solid rgba(22,163,74,.28);}
.result-box.err{background:rgba(220,38,38,.1);color:#dc2626;border:1px solid rgba(220,38,38,.22);}

/* Answer chips */
.answer-chips{display:flex;flex-wrap:wrap;gap:6px;min-height:34px;
  margin-bottom:12px;align-items:center;}
.answer-chip{padding:5px 12px;border-radius:16px;background:var(--blue);
  color:#fff;font-size:13px;font-weight:700;}
.answer-chip.correct{background:#16a34a;}
.answer-chip.wrong{background:#dc2626;}
.answer-placeholder{color:var(--muted);font-size:13px;font-style:italic;}

/* Option buttons */
.opt-grid{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;}
.opt-btn{padding:10px 16px;border-radius:10px;border:1px solid var(--border);
  background:var(--card);color:var(--text);font-size:13px;font-weight:700;
  cursor:pointer;transition:all .15s;font-family:inherit;}
.opt-btn:hover{border-color:var(--blue);}
.opt-btn.selected{background:var(--blue);color:#fff;border-color:var(--blue);}
.opt-btn.correct{background:#16a34a;color:#fff;border-color:#15803d;}
.opt-btn.wrong{background:#dc2626;color:#fff;border-color:#b91c1c;}
.opt-btn:disabled{opacity:.45;cursor:default;}

/* Exercise action buttons */
.ex-actions{display:flex;gap:8px;flex-wrap:wrap;}
.ex-btn{padding:9px 18px;border-radius:10px;border:none;font-size:12px;
  font-weight:800;cursor:pointer;transition:all .15s;font-family:inherit;}
.ex-btn:active{transform:scale(.97);}
.ex-btn.primary{background:var(--blue);color:#fff;}
.ex-btn.primary:disabled{opacity:.45;cursor:default;transform:none;}
.ex-btn.secondary{background:var(--card);color:var(--text);border:1px solid var(--border);}
.ex-btn.danger{background:#dc2626;color:#fff;}
.ex-btn.dark{background:#1e293b;color:#fff;}
[data-theme="dark"] .ex-btn.dark{background:#334155;}

/* Mini piano */
.mini-piano-wrap{overflow-x:auto;margin:14px 0;-webkit-overflow-scrolling:touch;
  touch-action:pan-x pan-y;}
.mini-piano-inner{display:inline-flex;position:relative;height:110px;}
.mini-oct{display:flex;position:relative;}
.mini-w{height:110px;background:#fff;border:1px solid #cbd5e1;border-top:none;
  border-radius:0 0 7px 7px;cursor:pointer;display:flex;align-items:flex-end;
  justify-content:center;padding-bottom:6px;font-size:9px;font-weight:700;
  color:#94a3b8;transition:background .1s;position:relative;z-index:1;
  user-select:none;-webkit-user-select:none;}
.mini-w:hover{background:#dbeafe;}
.mini-w.selected{background:#60a5fa;color:#fff;}
.mini-w.given{background:#eab308;color:#000;}
.mini-w.correct-hl{background:#16a34a;color:#fff;}
.mini-w.wrong-hl{background:#dc2626;color:#fff;}
.mini-b{background:#1e293b;border:2px solid #000;border-top:none;
  border-radius:0 0 5px 5px;box-shadow:0 3px 5px rgba(0,0,0,.45);
  cursor:pointer;position:absolute;z-index:2;display:flex;align-items:flex-end;
  justify-content:center;padding-bottom:4px;font-size:8px;font-weight:700;
  color:rgba(255,255,255,.5);transition:background .1s;
  user-select:none;-webkit-user-select:none;}
.mini-b:hover{background:#1e3a8a;}
.mini-b.selected{background:#1d4ed8;}
.mini-b.given{background:#ca8a04;}
.mini-b.correct-hl{background:#16a34a;}
.mini-b.wrong-hl{background:#dc2626;}

/* Chain slots */
.chain-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
.chain-slot{flex:1;min-width:80px;padding:12px 8px;border-radius:12px;
  border:2px solid var(--border);background:var(--card);text-align:center;}
.chain-slot .slot-deg{font-size:10px;color:var(--muted);font-weight:700;
  text-transform:uppercase;margin-bottom:3px;}
.chain-slot .slot-root{font-size:16px;font-weight:900;}
.chain-slot .slot-type{font-size:11px;color:var(--muted);margin-top:2px;}
.chain-slot.missing .slot-type{color:var(--blue);font-style:italic;}
.chain-slot.correct-slot{border-color:#16a34a;background:rgba(22,163,74,.08);}
.chain-slot.wrong-slot{border-color:#dc2626;background:rgba(220,38,38,.07);}
.chain-arrow{font-size:18px;color:var(--muted);flex-shrink:0;}

/* Notation ordering */
.chord-pool{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px;}
.chord-token{padding:10px 16px;border-radius:10px;border:2px solid var(--border);
  background:var(--card);font-size:14px;font-weight:800;cursor:pointer;
  transition:all .15s;font-family:inherit;}
.chord-token:hover{border-color:var(--blue);}
.chord-token.used{opacity:.3;cursor:default;}
.chord-token.correct-t{border-color:#16a34a;background:rgba(22,163,74,.1);}
.chord-token.wrong-t{border-color:#dc2626;background:rgba(220,38,38,.08);}
.sequence-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:16px;min-height:44px;align-items:center;}
.seq-chip{padding:7px 14px;background:var(--blue);color:#fff;border-radius:10px;
  font-size:13px;font-weight:800;cursor:pointer;transition:background .1s;}
.seq-chip:hover{background:var(--blue2);}
.seq-empty{font-size:12px;color:var(--muted);font-style:italic;}

/* Quiz */
.quiz-score-row{text-align:right;font-size:11px;font-weight:700;
  color:var(--muted);margin-bottom:12px;}
.quiz-q{font-size:15px;font-weight:700;line-height:1.5;margin-bottom:16px;}
.quiz-finish{text-align:center;padding:24px;}
.quiz-finish-score{font-size:36px;font-weight:900;color:var(--blue);}
.quiz-finish-label{font-size:14px;color:var(--muted);margin-top:8px;}

/* Listen button for exercises */
.btn-play-ex{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;
  border:none;border-radius:10px;font-size:12px;font-weight:800;
  cursor:pointer;color:#fff;margin-bottom:14px;transition:all .15s;}
.btn-play-ex:active{transform:scale(.97);}

/* Hint */
.hint-box{background:rgba(234,179,8,.1);border:1px solid rgba(234,179,8,.32);
  border-radius:10px;padding:10px 14px;font-size:12px;line-height:1.65;
  margin-bottom:14px;color:var(--text);}
.hint-box b{color:#b45309;}
[data-theme="dark"] .hint-box b{color:#fbbf24;}
[data-theme="dark"] .hint-box{background:rgba(234,179,8,.07);}
.ex-btn.hint-btn{background:rgba(234,179,8,.12);color:#b45309;border:1px solid rgba(234,179,8,.35);}
.ex-btn.hint-btn:hover{background:rgba(234,179,8,.22);}
[data-theme="dark"] .ex-btn.hint-btn{color:#fbbf24;}
.opt-btn.eliminated{opacity:.25;text-decoration:line-through;cursor:default;pointer-events:none;}

@media(max-width:600px){
  .hdr{flex-wrap:wrap;gap:8px;}
  .intro{padding:16px;}
  .intro-title{font-size:17px;}
}
</style>
</head>

<!-- MAIN TABS -->

<script>
/* ─── STYLE DATA ──────────────────────────────────── */
const STYLES = [
  {
    id:'blues',emoji:'🎸',color:'#1e40af',
    name:{ru:'Блюз',en:'Blues'},
    period:{ru:'1890-е — наши дни',en:'1890s – present'},
    origin:{ru:'США, дельта Миссисипи',en:'USA, Mississippi Delta'},
    bio:{ru:'Возник в конце XIX века среди афроамериканцев американского Юга. Первый американский музыкальный стиль, завоевавший весь мир. Стал фундаментом джаза, рока и соула.',en:'Emerged in the late 19th century among African Americans of the South. The first American music style to conquer the world — foundation of jazz, rock, and soul.'},
    features:{ru:['12-тактовая форма','Доминантовые септаккорды','Блюзовые ноты (b3, b5, b7)','Колл-энд-респонс','Шаффл-ритм'],en:['12-bar form','Dominant 7th chords','Blue notes (b3, b5, b7)','Call and response','Shuffle rhythm']},
    history:{ru:'Блюз вырос из афроамериканского музыкального фольклора — рабочих песен (work songs), которые пели в полях, и религиозных спиричуэлов. После отмены рабства в 1865 году освобождённые афроамериканцы начали смешивать эти традиции с европейской гармонией.\n\nК 1890-м годам в дельте Миссисипи сложился особый стиль — «дельта-блюз». Гитарист и певец, зачастую один, пел о боли, любви и дороге. Характерная черта — 12-тактовая форма на трёх доминантовых аккордах (I7–IV7–V7) и «блюзовые ноты» — уплощённые третья и седьмая ступени.\n\nРобер Джонсон, Чарли Паттон и Санхаус стали легендами раннего блюза. В 1920-х блюз попал на пластинки. В 1940–50-е годы «переехал» в города (прежде всего в Чикаго) и стал электрическим. Мади Уотерс, Хаулин Вулф и Би Би Кинг превратили его в городской электрический блюз.',en:'Blues grew from African American folk music — work songs sung in the fields and religious spirituals. After emancipation in 1865, freed people began blending these traditions with European harmony.\n\nBy the 1890s, a distinct style had formed in the Mississippi Delta. A guitarist-singer, often alone, sang of pain, love, and the road. The hallmark is a 12-bar form on three dominant chords (I7–IV7–V7) and "blue notes" — flattened thirds and sevenths.\n\nRobert Johnson, Charlie Patton, and Son House became legends of early blues. In the 1920s blues reached records. By the 1940s–50s it moved to cities, especially Chicago, and went electric.'},
    performers:[{name:'Роберт Джонсон',ini:'РД',color:'#1e40af'},{name:'Мади Уотерс',ini:'МУ',color:'#1e3a8a'},{name:'Би Би Кинг',ini:'ББК',color:'#2563eb'},{name:'Хаулин Вулф',ini:'ХВ',color:'#1d4ed8'}],
    works:[{name:{ru:'Sweet Home Chicago',en:'Sweet Home Chicago'},year:'1936',who:'Robert Johnson',desc:{ru:'Ставший гимном чикагского блюза.',en:'The anthem of Chicago blues.'}},{name:{ru:'The Thrill Is Gone',en:'The Thrill Is Gone'},year:'1969',who:'B.B. King',desc:{ru:'Величайшая блюзовая баллада.',en:'The greatest blues ballad.'}},{name:{ru:'Hoochie Coochie Man',en:'Hoochie Coochie Man'},year:'1954',who:'Muddy Waters',desc:{ru:'Электрический чикагский блюз в лучшем виде.',en:'Chicago electric blues at its finest.'}}]

  {
    id:'ragtime',emoji:'🎹',color:'#b45309',
    name:{ru:'Рэгтайм',en:'Ragtime'},
    period:{ru:'1890-е — 1920-е',en:'1890s – 1920s'},
    origin:{ru:'США, Миссури',en:'USA, Missouri'},
    bio:{ru:'Первый записанный американский популярный стиль. Синкопированная мелодия правой руки над маршевым «ум-па» басом. Скотт Джоплин возвёл рэгтайм в ранг искусства.',en:'The first written American popular style. Syncopated right-hand melody over a steady marching bass. Scott Joplin elevated ragtime to an art form.'},
    features:{ru:['Синкопированная мелодия','Маршевый бас (ум-па)','Размер 2/4','Форма AABB (без импровизации)','Европейская структура'],en:['Syncopated melody','Marching bass (oom-pah)','2/4 time','AABB form (no improvisation)','European structure']},
    history:{ru:'Рэгтайм сложился в 1890-х годах в барах и танцевальных залах Миссури. Название происходит от «ragged time» — «рваный ритм».\n\nСкотт Джоплин (1868–1917) — «Король рэгтайма» — написал «Кленовый лист» (Maple Leaf Rag, 1899), ставший первым инструментальным хитом в истории. Его «Артист эстрады» (The Entertainer, 1902) сегодня узнаёт весь мир.\n\nС 1917 года рэгтайм начал вытесняться джазом. Но в 1973 году фильм «Афёра» с музыкой Джоплина вернул рэгтайм к жизни.',en:'Ragtime formed in the 1890s in the bars and dance halls of Missouri. The name comes from "ragged time" — syncopated rhythm.\n\nScott Joplin (1868–1917) — the "King of Ragtime" — wrote "Maple Leaf Rag" (1899), the first instrumental hit in history. His "The Entertainer" (1902) is recognised worldwide today.\n\nAfter 1917 ragtime was gradually displaced by jazz. But in 1973 the film "The Sting" revived ragtime for a new generation.'},
    performers:[{name:'Скотт Джоплин',ini:'СД',color:'#b45309'},{name:'Джеймс Скотт',ini:'ДС',color:'#92400e'},{name:'Джозеф Лэмб',ini:'ДЛ',color:'#d97706'}],
    works:[{name:{ru:'Maple Leaf Rag',en:'Maple Leaf Rag'},year:'1899',who:'Scott Joplin',desc:{ru:'Первый инструментальный хит в истории.',en:'The first instrumental hit in history.'}},{name:{ru:'The Entertainer',en:'The Entertainer'},year:'1902',who:'Scott Joplin',desc:{ru:'Самый узнаваемый рэгтайм в мире.',en:'The most recognisable ragtime piece in the world.'}},{name:{ru:'Elite Syncopations',en:'Elite Syncopations'},year:'1902',who:'Scott Joplin',desc:{ru:'Праздничный, энергичный рэгтайм.',en:'A festive, energetic rag.'}}]

  {

    name:{ru:'Свинг / Биг-бэнд',en:'Swing / Big Band'},
    period:{ru:'1930-е — 1940-е',en:'1930s – 1940s'},
    origin:{ru:'США, Нью-Йорк',en:'USA, New York'},
    bio:{ru:'Первый джазовый стиль, ставший массовой популярной музыкой. Большие оркестры (12–25 музыкантов) играли для танцев. Эра радио сделала Эллингтона и Гудмана звёздами.',en:'The first jazz style to become mainstream popular music. Large orchestras (12–25 players) played for dancing. The radio era made Ellington and Goodman stars of national renown.'},
    features:{ru:['Биг-бэнд (медь + деревянные + ритм-секция)','Свинговые восьмые (длинная-короткая)','Аранжировки с сольными вставками','Колл-энд-респонс между секциями','Средне-быстрый темп'],en:['Big band (brass + woodwinds + rhythm section)','Swing 8ths (long–short)','Written arrangements with solo sections','Call-and-response between sections','Medium-fast tempo']},
    history:{ru:'Свинг вырос из ранних джазовых оркестров 1920-х. К 1935 году он стал главной танцевальной музыкой Америки.\n\nДюк Эллингтон был самым изощрённым — его оркестр играл сложные многочастные пьесы. Бенни Гудман — «Король свинга» — пробил дорогу джазу в Carnegie Hall в 1938 году. Каунт Бейси держал самый острый ритм.\n\nПосле Второй мировой биг-бэнды стали слишком дорогими. Свинг уступил место бибопу.',en:'Swing grew from early jazz orchestras of the 1920s. By 1935 it had become America\'s main dance music.\n\nDuke Ellington was the most sophisticated — his orchestra played complex multi-movement pieces. Benny Goodman brought jazz to Carnegie Hall in 1938. Count Basie held the sharpest rhythm.\n\nAfter World War II, big bands became too expensive. Swing gave way to bebop.'},
    performers:[{name:'Дюк Эллингтон',ini:'ДЭ',color:'#0e7490'},{name:'Бенни Гудман',ini:'БГ',color:'#0891b2'},{name:'Гленн Миллер',ini:'ГМ',color:'#06b6d4'},{name:'Каунт Бейси',ini:'КБ',color:'#155e75'}],
    works:[{name:{ru:'Take the A Train',en:'Take the A Train'},year:'1941',who:'Duke Ellington',desc:{ru:'Гимн Эллингтона и его оркестра.',en:'Ellington\'s signature tune.'}},{name:{ru:'Sing, Sing, Sing',en:'Sing, Sing, Sing'},year:'1936',who:'Benny Goodman',desc:{ru:'Легендарный хит Гудмана.',en:'Goodman\'s legendary hit.'}},{name:{ru:'In the Mood',en:'In the Mood'},year:'1939',who:'Glenn Miller',desc:{ru:'Самая узнаваемая мелодия эпохи свинга.',en:'The most recognisable melody of the swing era.'}}]

  {
    id:'bebop',emoji:'🎷',color:'#7c3aed',
    name:{ru:'Бибоп',en:'Bebop'},
    period:{ru:'1940-е — 1950-е',en:'1940s – 1950s'},
    origin:{ru:'США, Нью-Йорк (Гарлем)',en:'USA, New York (Harlem)'},
    bio:{ru:'Революционный стиль, возникший как реакция против коммерческого свинга. Быстрый, гармонически сложный, создан для слушания, а не танцев. Чарли Паркер и Диззи Гиллеспи — его отцы.',en:'A revolutionary style born as a reaction against commercial swing. Fast, harmonically complex, designed for listening — not dancing. Charlie Parker and Dizzy Gillespie are its founding fathers.'},
    features:{ru:['Очень быстрые темпы','Сложные замены аккордов (тритоновая замена)','Альтерированные аккорды','Хроматические линии','Малые составы (квартет/квинтет)'],en:['Very fast tempos','Complex chord substitutions (tritone sub)','Altered chords','Chromatic lines','Small groups (quartet/quintet)']},
    history:{ru:'Бибоп зародился в Гарлеме начала 1940-х — в клубах Minton\'s Playhouse и Monroe\'s Uptown House, где молодые музыканты собирались после официальных гигов.\n\nЧарли Паркер (Птица) и Диззи Гиллеспи играли на невероятных скоростях, насыщая гармонию хроматическими заменами. Телониус Монк добавил угловатость и парадоксальность.\n\nБибоп превратил джаз из танцевальной в концертную музыку.',en:'Bebop was born in Harlem in the early 1940s — in clubs like Minton\'s Playhouse, where young musicians gathered after their regular gigs.\n\nCharlie Parker (Bird) and Dizzy Gillespie played at incredible speeds, saturating the harmony with chromatic substitutions. Thelonious Monk added angularity and paradox.\n\nBebop transformed jazz from dance music into concert music.'},
    performers:[{name:'Чарли Паркер',ini:'ЧП',color:'#7c3aed'},{name:'Диззи Гиллеспи',ini:'ДГ',color:'#6d28d9'},{name:'Телониус Монк',ini:'ТМ',color:'#8b5cf6'},{name:'Бад Пауэлл',ini:'БП',color:'#5b21b6'}],
    works:[{name:{ru:'Anthropology',en:'Anthropology'},year:'1945',who:'Parker / Gillespie',desc:{ru:'Квинтэссенция бибопа.',en:'The quintessence of bebop.'}},{name:{ru:"'Round Midnight",en:"'Round Midnight"},year:'1944',who:'Thelonious Monk',desc:{ru:'Самый исполняемый стандарт Монка.',en:'Monk\'s most performed standard.'}},{name:{ru:'Ko-Ko',en:'Ko-Ko'},year:'1945',who:'Charlie Parker',desc:{ru:'Рекордная скорость и хроматика.',en:'Record speed and chromatic intensity.'}}]

    origin:{ru:'Бразилия, Рио-де-Жанейро',en:'Brazil, Rio de Janeiro'},
    bio:{ru:'Родилась в квартирах и кафе Рио в конце 1950-х. Жоао Жилберту, Жобим и Виниciус де Мораес соединили гармонию кул-джаза с ритмом самбы и мягким вокальным стилем.',en:'Born in the apartments and cafes of Rio in the late 1950s. João Gilberto, Jobim and Vinícius de Moraes blended cool jazz harmony with samba rhythms and a soft, intimate vocal style.'},
    features:{ru:['Ритм самбы на гитаре (антиципации)','Джазовые гармонии (maj7, 9, 11)','Мягкий интимный вокал','Умеренный темп','Гитара + голос или малый состав'],en:['Samba guitar rhythm (anticipations)','Jazz harmonies (maj7, 9, 11)','Soft intimate vocals','Moderate tempo','Guitar + voice or small ensemble']},
    history:{ru:'Босса-нова — «новая волна» — появилась в 1958 году в богемных кварталах Рио. Молодые бразильцы слушали американский кул-джаз и любили самбу, но хотели чего-то нового.\n\nЖоао Жилберту изобрёл характерный гитарный ритм с антиципациями. Жобим был гармоническим гением: его аккорды с большими септимами создали особый мечтательный звук.\n\nВ 1962 году вышла «Девушка из Ипанемы» — одна из самых записываемых песен в истории.',en:'Bossa nova — "new wave" — emerged in 1958 in the bohemian neighbourhoods of Rio. Young Brazilians were listening to American cool jazz while loving samba, but wanting something new.\n\nJoão Gilberto invented the bossa nova guitar rhythm with anticipations. Jobim was the harmonic genius: his chords with major sevenths created a dreamy, distinctive sound.\n\nIn 1962 "The Girl from Ipanema" appeared — one of the most recorded songs in history.'},
    performers:[{name:'Жоао Жилберту',ini:'ЖЖ',color:'#059669'},{name:'Антонио К. Жобим',ini:'АЖ',color:'#047857'},{name:'Аструд Жилберту',ini:'АГ',color:'#10b981'},{name:'Стэн Гетц',ini:'СГ',color:'#065f46'}],
    works:[{name:{ru:'The Girl from Ipanema',en:'The Girl from Ipanema'},year:'1962',who:'Jobim / Moraes',desc:{ru:'Одна из самых записываемых песен в истории.',en:'One of the most recorded songs in history.'}},{name:{ru:'Corcovado',en:'Corcovado'},year:'1960',who:'Antônio Carlos Jobim',desc:{ru:'Образец гармонического изящества.',en:'A model of harmonic elegance.'}},{name:{ru:'Desafinado',en:'Desafinado'},year:'1959',who:'Jobim / Gilberto',desc:{ru:'«Фальшивый» — об «неправильных» нотах, создающих красоту.',en:'"Out of Tune" — about "wrong" notes that create beauty.'}}]

  {
    id:'modal',emoji:'🌙',color:'#9333ea',
    name:{ru:'Модальный джаз',en:'Modal Jazz'},
    period:{ru:'1958 — 1970-е',en:'1958 – 1970s'},
    origin:{ru:'США, Нью-Йорк',en:'USA, New York'},
    bio:{ru:'Создан Майлсом Дэвисом на альбоме «Kind of Blue» (1959) — самом продаваемом джазовом альбоме всех времён. Вместо быстрой смены аккордов — статичные лады как основа для импровизации.',en:'Pioneered by Miles Davis on "Kind of Blue" (1959) — the bestselling jazz album of all time. Instead of rapid chord changes, static modes serve as the basis for improvisation.'},
    features:{ru:['Статичные лады (дорийский, фригийский…)','Медленная смена гармоний','Медитативная атмосфера','Лирическая импровизация','Открытый ритм'],en:['Static modes (Dorian, Phrygian…)','Slow harmonic movement','Meditative atmosphere','Lyrical improvisation','Open rhythm']},
    history:{ru:'К концу 1950-х бибоп достиг предела гармонической сложности. Майлс Дэвис прочитал «Лидийскую хроматическую концепцию» Джорджа Рассела и понял: вместо смены аккордов можно оставаться на одном ладу.\n\nАльбом «Kind of Blue» (1959), записанный почти без репетиций, стал откровением. Дэвис принёс музыкантам лишь короткие наброски ладов перед записью.\n\nДжон Колтрейн развил модальный подход — его «A Love Supreme» (1964) стала духовным манифестом эпохи.',en:'By the late 1950s bebop had pushed harmonic complexity to its limits. Miles Davis read George Russell\'s "Lydian Chromatic Concept" and understood: instead of changing chords, stay on one mode.\n\nThe album "Kind of Blue" (1959), recorded with almost no rehearsal, was a revelation. Davis brought musicians only short modal sketches just before the session.\n\nJohn Coltrane developed the modal approach — his "A Love Supreme" (1964) became the spiritual manifesto of an era.'},
    performers:[{name:'Майлс Дэвис',ini:'МД',color:'#9333ea'},{name:'Джон Колтрейн',ini:'ДК',color:'#7e22ce'},{name:'Билл Эванс',ini:'БЭ',color:'#a855f7'},{name:'Херби Хэнкок',ini:'ХХ',color:'#6b21a8'}],
    works:[{name:{ru:'So What',en:'So What'},year:'1959',who:'Miles Davis',desc:{ru:'Открывает «Kind of Blue». 16 тактов на ре дорийском, 8 — на ми-бемоль дорийском.',en:'Opens "Kind of Blue." 16 bars on D Dorian, 8 on E-flat Dorian.'}},{name:{ru:'My Favorite Things',en:'My Favorite Things'},year:'1960',who:'John Coltrane',desc:{ru:'Колтрейн превращает вальс в бесконечную модальную медитацию.',en:'Coltrane transforms a Broadway waltz into an endless modal meditation.'}},{name:{ru:'Maiden Voyage',en:'Maiden Voyage'},year:'1965',who:'Herbie Hancock',desc:{ru:'Образец модального звука — открытые аккорды, плавающий ритм.',en:'A model of the modal sound — open chords, floating rhythm.'}}]

  {
    id:'fusion',emoji:'⚡',color:'#dc2626',
    name:{ru:'Фьюжн',en:'Fusion'},
    period:{ru:'1970-е — наши дни',en:'1970s – present'},
    origin:{ru:'США',en:'USA'},
    bio:{ru:'В конце 1960-х джазовые музыканты начали вводить рок-ритмы, электрические инструменты и фанк-грувы. Альбом Майлса Дэвиса «Bitches Brew» (1970) запустил эпоху фьюжна.',en:'In the late 1960s jazz musicians began incorporating rock rhythms, electric instruments, and funk grooves. Miles Davis\'s "Bitches Brew" (1970) launched the fusion era.'},
    features:{ru:['Электрические инструменты','Рок/фанк-ритмы','Сложные размеры','Электронные эффекты','Высокая энергия','Сложная джазовая гармония'],en:['Electric instruments','Rock / funk rhythms','Complex time signatures','Electronic effects','High energy','Sophisticated jazz harmony']},
    history:{ru:'Фьюжн возник на стыке двух культурных сил: в 1960-х джаз терял молодую аудиторию рок-н-роллу, а рокеры интересовались джазовой гармонией.\n\nМайлс Дэвис первым решился на синтез. На «Bitches Brew» (1970) он соединил электрические клавишные и рок-ритмы с джазовой импровизацией. Эффект был взрывным.\n\nWeather Report, Chick Corea и Return to Forever стали главными ансамблями фьюжна. Гитарист Джон Маклафлин добавил индийские влияния.',en:'Fusion emerged at the intersection of two cultural forces: in the 1960s jazz was losing young audiences to rock, while rockers discovered jazz harmony.\n\nMiles Davis attempted the synthesis on "Bitches Brew" (1970), combining electric keyboards and rock rhythms with jazz improvisation. The effect was explosive.\n\nWeather Report, Chick Corea, and Return to Forever became the main fusion ensembles.'},

    works:[{name:{ru:'Bitches Brew',en:'Bitches Brew'},year:'1970',who:'Miles Davis',desc:{ru:'Альбом, запустивший эпоху фьюжна.',en:'The album that launched the fusion era.'}},{name:{ru:'Birdland',en:'Birdland'},year:'1977',who:'Weather Report',desc:{ru:'Главный хит Weather Report.',en:'Weather Report\'s biggest hit.'}},{name:{ru:'Spain',en:'Spain'},year:'1972',who:'Chick Corea',desc:{ru:'Латинский фьюжн — горячий ритм, джазовая гармония.',en:'Latin fusion — hot rhythm, jazz harmony.'}}]

function initAudio(){if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)();if(audioCtx.state==='suspended')audioCtx.resume();}
function stopAll(){activeOscs.forEach(o=>{try{o.stop();}catch(e){}});activeOscs=[];}
function playTone(freq,t0,dur,vol=0.18,type='triangle'){
  const osc=audioCtx.createOscillator(),g=audioCtx.createGain();
  osc.type=type;osc.frequency.value=freq;
  g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(vol,t0+0.015);g.gain.exponentialRampToValueAtTime(0.001,t0+dur);
  osc.connect(g);g.connect(audioCtx.destination);osc.start(t0);osc.stop(t0+dur+0.05);activeOscs.push(osc);
}
function playBass(f,t0,dur){playTone(f,t0,dur,0.22,'sine');}
function playMel(f,t0,dur,v=0.14){playTone(f,t0,dur,v,'triangle');}
function playChord(freqs,t0,dur,v=0.12){freqs.forEach(f=>playTone(f,t0,dur,v/freqs.length*2));}

function playStyle(styleId,btn){
  initAudio();
  if(playingStyle===styleId){stopAll();playingStyle=null;updatePlayBtn(btn,false);return;}
  stopAll();
  if(playingStyle){const old=document.querySelector('.btn-listen.playing');if(old)updatePlayBtn(old,false);}
  playingStyle=styleId;updatePlayBtn(btn,true);
  PATTERNS[styleId](audioCtx.currentTime);
  setTimeout(()=>{if(playingStyle===styleId){stopAll();playingStyle=null;updatePlayBtn(btn,false);}},11000);
}

function updatePlayBtn(btn,playing){
  if(!btn)return;
  btn.classList.toggle('playing',playing);
  const l=localStorage.getItem('musicapp_lang')||'ru';
  btn.innerHTML=playing
    ?`<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg> ${l==='ru'?'Стоп':'Stop'}`
    :`<svg width="11" height="11" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg> ${l==='ru'?'Послушать':'Listen'}`;
}

const EX_NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

// Note frequency (equal temperament, A4=440)
function noteFreq(note,octave){
  const semis={C:0,'C#':1,Db:1,D:2,'D#':3,Eb:3,E:4,F:5,'F#':6,Gb:6,G:7,'G#':8,Ab:8,A:9,'A#':10,Bb:10,B:11};
  const s=semis[note]||0;
  return 261.63*Math.pow(2,(s+(octave-4)*12)/12);
}

function playExChord(rootNote,intervals,rootOctave=4){
  initAudio();
  const rootIdx=EX_NOTES.indexOf(rootNote);
  const t0=audioCtx.currentTime;
  intervals.forEach(semi=>{
    const abs=rootIdx+semi;
    const oct=rootOctave+Math.floor(abs/12);
    const n=EX_NOTES[((abs%12)+12)%12];
    playTone(noteFreq(n,oct),t0,2.5,0.14,'triangle');
  });
}

function playExNote(note,octave){initAudio();playTone(noteFreq(note,octave),audioCtx.currentTime,0.6,0.18,'triangle');}

/* ─── MINI PIANO ─────────────────────────────────────── */
const WHITES=['C','D','E','F','G','A','B'];
const BLACKS={'C#':1,'D#':2,'F#':4,'G#':5,'A#':6};
const WW=34,BW=21,BH=66;

function buildMiniPiano(givenNotes,selNotes,correctNotes,octaves,clickFn){
  let html=`<div class="mini-piano-wrap"><div class="mini-piano-inner">`;
  for(const oct of octaves){
    const octW=WW*7;
    html+=`<div class="mini-oct" style="width:${octW}px;position:relative;">`;
    WHITES.forEach(n=>{
      const isGiven=givenNotes.some(g=>g.note===n&&g.octave===oct);
      const isSel=selNotes.some(s=>s.note===n&&s.octave===oct);
      const isCorr=correctNotes&&correctNotes.some(c=>c.note===n&&c.octave===oct);
      let cls='mini-w';
      if(isGiven)cls+=' given';
      else if(correctNotes){if(isSel&&isCorr)cls+=' correct-hl';else if(isSel)cls+=' wrong-hl';else if(isCorr)cls+=' correct-hl';}
      else if(isSel)cls+=' selected';
      const cb=(!correctNotes&&!isGiven&&clickFn)?`onclick="${clickFn}('${n}',${oct})"`:'';
      html+=`<div class="${cls}" style="width:${WW}px;" ${cb}>${n}</div>`;
    });
    Object.entries(BLACKS).forEach(([n,pos])=>{
      const left=(pos-1)*WW+WW*0.68;
      const isGiven=givenNotes.some(g=>g.note===n&&g.octave===oct);
      const isSel=selNotes.some(s=>s.note===n&&s.octave===oct);
      const isCorr=correctNotes&&correctNotes.some(c=>c.note===n&&c.octave===oct);
      let cls='mini-b';
      if(isGiven)cls+=' given';
      else if(correctNotes){if(isSel&&isCorr)cls+=' correct-hl';else if(isSel)cls+=' wrong-hl';else if(isCorr)cls+=' correct-hl';}
      else if(isSel)cls+=' selected';
      const cb=(!correctNotes&&!isGiven&&clickFn)?`onclick="${clickFn}('${n}',${oct})"`:'';
      html+=`<div class="${cls}" style="left:${left}px;top:0;position:absolute;width:${BW}px;height:${BH}px;" ${cb}></div>`;
    });
    html+='</div>';
  }
  html+='</div></div>';
  return html;
}

function getChordNotes(rootNote,intervals,rootOctave=4){
  const rootIdx=EX_NOTES.indexOf(rootNote);
  return intervals.map(semi=>{
    const abs=rootIdx+semi;
    return{note:EX_NOTES[((abs%12)+12)%12],octave:rootOctave+Math.floor(abs/12)};
  });
}

/* ─── EX 1: BUILD CHORD ──────────────────────────────── */
let buildEx=null,buildSel=[],buildChecked=false;

function genBuild(){
  const chord=JAZZ_CHORDS[Math.floor(Math.random()*JAZZ_CHORDS.length)];
  const maxInterval=chord.intervals[chord.intervals.length-1];
  const maxRoot=maxInterval>=14?10:12;
  const rootIdx=Math.floor(Math.random()*maxRoot);
  const rootNote=EX_NOTES[rootIdx];
  const correct=getChordNotes(rootNote,chord.intervals,4);
  buildEx={chord,rootNote,rootOctave:4,correct};
  buildSel=[];buildChecked=false;buildHint=false;
  renderBuild();
}

function buildPianoClick(note,oct){
  if(buildChecked)return;
  if(note===buildEx.rootNote&&oct===buildEx.rootOctave){playExNote(note,oct);return;}
  const idx=buildSel.findIndex(s=>s.note===note&&s.octave===oct);
  const needed=buildEx.chord.intervals.length-1;
  if(idx>=0)buildSel.splice(idx,1);
  else if(buildSel.length<needed)buildSel.push({note,octave:oct});
  playExNote(note,oct);
  renderBuild();
}

function checkBuild(){
  if(buildChecked)return;
  buildChecked=true;
  const target=buildEx.correct.slice(1);
  const ok=target.every(c=>buildSel.some(s=>s.note===c.note&&s.octave===c.octave))&&buildSel.length===target.length;
  renderBuild();
  if(ok)setTimeout(genBuild,1300);
  else setTimeout(()=>{buildChecked=false;buildSel=[];renderBuild();},1600);
}

function renderBuild(){
  const area=document.getElementById('exContent');
  if(!area)return;
  if(!buildEx){genBuild();return;}
  const ex=buildEx;
  const target=ex.correct.slice(1);
  const isOk=buildChecked&&target.every(c=>buildSel.some(s=>s.note===c.note&&s.octave===c.octave))&&buildSel.length===target.length;
  const maxOct=Math.max(...ex.correct.map(c=>c.octave));
  const octaves=[];for(let o=4;o<=Math.max(maxOct,5);o++)octaves.push(o);
  const given=[{note:ex.rootNote,octave:ex.rootOctave}];
  const correctNotes=buildChecked?target:null;

  let html=`<div class="ex-card">
    <div class="ex-task-label">${t('buildChord')}</div>
    <div class="ex-task-main">${ex.rootNote}</div>
    <div class="ex-task-sub">${ex.chord.label} — ${ex.chord.desc[lang]||ex.chord.desc.ru}</div>
    <div class="ex-desc">${lang==='ru'?`Корень (жёлтый): <b>${ex.rootNote}4</b>. Нажмите ${target.length} клавиш${target.length===1?'у':target.length<5?'и':''} пианино.`:`Root (yellow): <b>${ex.rootNote}4</b>. Click ${target.length} piano key${target.length!==1?'s':''}.`}</div>`;

  if(buildChecked)html+=`<div class="result-box show ${isOk?'ok':'err'}">${isOk?t('correct'):t('wrong')}</div>`;

  if(buildHint){
    const parts=ex.chord.intervals.slice(1).map(v=>{
      const tones=v/2;
      const ts=tones===Math.floor(tones)?tones+'т':Math.floor(tones)+'½т';
      return `+${v}пт (${ts})`;
    }).join(',  ');
    html+=`<div class="hint-box">💡 ${lang==='ru'?'От первоначальной ноты':'From starting note'}: <b>${parts}</b></div>`;
  }

  html+='<div class="answer-chips">';
  if(buildSel.length===0)html+=`<span class="answer-placeholder">${t('selectNotes')}</span>`;
  else buildSel.forEach(s=>{let cls='answer-chip';if(buildChecked)cls+=target.some(c=>c.note===s.note&&c.octave===s.octave)?' correct':' wrong';html+=`<span class="${cls}">${s.note}${s.octave}</span>`;});
  html+='</div>';

  html+=buildMiniPiano(given,buildSel,correctNotes,octaves,'buildPianoClick');

  html+='<div class="ex-actions">';
  html+=`<button class="ex-btn primary" onclick="checkBuild()" ${!buildChecked&&buildSel.length===target.length?'':'disabled'}>${t('check')}</button>`;
  html+=`<button class="ex-btn dark" onclick="genBuild()">${t('newEx')}</button>`;
  html+=`<button class="ex-btn secondary" onclick="playExChord('${ex.rootNote}',${JSON.stringify(ex.chord.intervals)},4)">▶</button>`;
  if(!buildChecked&&buildSel.length>0)html+=`<button class="ex-btn danger" onclick="buildSel=[];renderBuild()">${t('clear')}</button>`;
  if(!buildChecked&&!buildHint)html+=`<button class="ex-btn hint-btn" onclick="buildHint=true;renderBuild()">${t('hint')}</button>`;
  html+='</div></div>';

  const wrap=area.querySelector('.mini-piano-wrap');
  const sv=wrap?wrap.scrollLeft:0;
  area.innerHTML=html;
  if(sv>0){const nw=area.querySelector('.mini-piano-wrap');if(nw)nw.scrollLeft=sv;}
}

/* ─── EX 2: CHAINS ───────────────────────────────────── */
let chainsEx=null,chainsAnswer='',chainsChecked=false;

function genChains(){
  const prog=PROG_DATA[Math.floor(Math.random()*PROG_DATA.length)];
  const tonic=EX_NOTES[Math.floor(Math.random()*12)];
  const missingIdx=1+Math.floor(Math.random()*(prog.steps.length-1));
  const steps=prog.steps.map((s,i)=>{
    const abs=EX_NOTES.indexOf(tonic)+s.offset;
    const root=EX_NOTES[((abs%12)+12)%12];
    return{...s,root,hidden:i===missingIdx};
  });
  // Build options: correct + 3 distractors
  const correctType=prog.steps[missingIdx].type;
  const distractors=JAZZ_CHORDS.filter(c=>c.id!==correctType).sort(()=>Math.random()-.5).slice(0,3).map(c=>c.label);
  const correctLabel=JAZZ_CHORDS.find(c=>c.id===correctType)?.label||correctType;
  const opts=[correctLabel,...distractors].sort(()=>Math.random()-.5);
  chainsEx={prog,tonic,steps,missingIdx,correctLabel,opts};
  chainsAnswer='';chainsChecked=false;chainsHint=false;
  renderChains();
}

function chainsPickOpt(label){
  if(chainsChecked)return;
  chainsAnswer=label;
  renderChains();
}

function checkChains(){
  if(chainsChecked||!chainsAnswer)return;
  chainsChecked=true;
  const ok=chainsAnswer===chainsEx.correctLabel;
  renderChains();
  if(ok)setTimeout(genChains,1300);
  else setTimeout(()=>{chainsChecked=false;chainsAnswer='';renderChains();},1600);
}

function renderChains(){
  const area=document.getElementById('exContent');
  if(!area)return;
  if(!chainsEx){genChains();return;}
  const ex=chainsEx;
  const isOk=chainsChecked&&chainsAnswer===ex.correctLabel;

  let html=`<div class="ex-card">
    <div class="ex-task-label">${t('chainsTask')}</div>
    <div class="ex-task-main">${ex.prog.name[lang]||ex.prog.name.ru}</div>
    <div class="ex-desc" style="margin-bottom:16px">${lang==='ru'?'Тоника':'Tonic'}: <b>${ex.tonic}</b></div>`;

  if(chainsChecked)html+=`<div class="result-box show ${isOk?'ok':'err'}">${isOk?t('correct'):t('wrong')}</div>`;

  if(chainsHint){
    const c=JAZZ_CHORDS.find(x=>x.label===ex.correctLabel||x.id===ex.correctLabel);
    html+=`<div class="hint-box">💡 ${lang==='ru'?'Это':'This is a'} <b>${c?.desc[lang]||c?.desc.ru||ex.correctLabel}</b></div>`;
  }

  // Chord slots
  html+='<div class="chain-row">';
  ex.steps.forEach((s,i)=>{
    let slotCls='chain-slot';
    if(s.hidden)slotCls+=chainsChecked?(isOk?' correct-slot':' wrong-slot'):' missing';
    if(i>0)html+='<div class="chain-arrow">→</div>';
    html+=`<div class="${slotCls}"><div class="slot-deg">${s.deg}</div><div class="slot-root">${s.root}</div><div class="slot-type">${s.hidden?(chainsAnswer||'?'):chordLabel(s.type)}</div></div>`;
  });
  html+='</div>';

  if(!chainsChecked){
    html+=`<div class="ex-task-label" style="margin-bottom:8px">${t('missingType')}</div>`;
    html+='<div class="opt-grid">';
    ex.opts.forEach(o=>{
      let cls='opt-btn';
      if(chainsAnswer===o)cls+=' selected';
      html+=`<button class="${cls}" onclick="chainsPickOpt('${o}')">${o}</button>`;
    });
    html+='</div>';
  }

  html+='<div class="ex-actions">';
  html+=`<button class="ex-btn primary" onclick="checkChains()" ${chainsAnswer&&!chainsChecked?'':'disabled'}>${t('check')}</button>`;
  html+=`<button class="ex-btn dark" onclick="genChains()">${t('newEx')}</button>`;
  if(!chainsChecked&&!chainsHint)html+=`<button class="ex-btn hint-btn" onclick="chainsHint=true;renderChains()">${t('hint')}</button>`;
  html+='</div></div>';
  area.innerHTML=html;
}

function renderEar(){

    earElimIdx=wrongs[Math.floor(Math.random()*wrongs.length)];
  }
  earHint=true;
  renderEar();
}

    <div class="ex-task-label">${t('styleTask')}</div>
    <div class="ex-task-main">?</div>
    <div class="ex-desc">${lang==='ru'?'Послушайте паттерн и определите джазовый стиль.':'Listen to the pattern and identify the jazz style.'}</div>`;

  if(styleIdChecked)html+=`<div class="result-box show ${isOk?'ok':'err'}">${isOk?t('correct'):t('wrong')}</div>`;

  if(styleIdHint&&styleIdHintFeature)html+=`<div class="hint-box">💡 ${lang==='ru'?'Характерная черта':'Characteristic'}: <b>${styleIdHintFeature}</b></div>`;

  html+=`<button class="btn-play-ex" style="background:#312e81" onclick="playPatternEx('${ex.style.id}')">▶ ${t('playPattern')}</button>`;

  html+='<div class="opt-grid">';
  ex.opts.forEach(o=>{
    let cls='opt-btn';
    if(styleIdChecked){if(o.id===ex.style.id)cls+=' correct';else if(o.id===styleIdAnswer)cls+=' wrong';}
    else if(styleIdAnswer===o.id)cls+=' selected';
    html+=`<button class="${cls}" onclick="styleIdPickOpt('${o.id}')" ${styleIdChecked?'disabled':''}>${o.emoji} ${o.name[lang]||o.name.ru}</button>`;
  });
  html+='</div>';

  html+='<div class="ex-actions">';
  html+=`<button class="ex-btn primary" onclick="checkStyleId()" ${styleIdAnswer&&!styleIdChecked?'':'disabled'}>${t('check')}</button>`;
  html+=`<button class="ex-btn dark" onclick="genStyleId()">${t('newEx')}</button>`;
  if(!styleIdChecked&&!styleIdHint)html+=`<button class="ex-btn hint-btn" onclick="showStyleIdHint()">${t('hint')}</button>`;
  html+='</div></div>';
  area.innerHTML=html;
}

function showStyleIdHint(){
  if(!styleIdHintFeature){
    const feats=styleIdEx.style.features[lang]||styleIdEx.style.features.ru;
    styleIdHintFeature=feats[Math.floor(Math.random()*feats.length)];
  }
  styleIdHint=true;
  renderStyleId();
}

/* ─── EX 5: NOTATION / ORDERING ──────────────────────── */
let notationEx=null,notationSeq=[],notationChecked=false;

function genNotation(){
  const prog=PROG_DATA[Math.floor(Math.random()*PROG_DATA.length)];
  const tonic=EX_NOTES[Math.floor(Math.random()*12)];
  const chords=prog.steps.map(s=>{
    const abs=EX_NOTES.indexOf(tonic)+s.offset;
    const root=EX_NOTES[((abs%12)+12)%12];
    const label=root+(JAZZ_CHORDS.find(c=>c.id===s.type)?.label||s.type);
    return{root,type:s.type,label,deg:s.deg};
  });
  const shuffled=[...chords].sort(()=>Math.random()-.5);
  notationEx={prog,tonic,chords,shuffled};
  notationSeq=[];notationChecked=false;notationHint=false;
  renderNotation();
}

function notationPick(label){
  if(notationChecked)return;
  if(notationSeq.includes(label))return;
  notationSeq.push(label);
  renderNotation();
}

function notationRemoveLast(){
  if(notationChecked||notationSeq.length===0)return;
  notationSeq.pop();
  renderNotation();
}

function checkNotation(){
  if(notationChecked)return;
  const correct=notationEx.chords.map(c=>c.label);
  notationChecked=true;
  const isOk=notationSeq.every((l,i)=>l===correct[i]);
  renderNotation();
  if(isOk)setTimeout(genNotation,1300);
  else setTimeout(()=>{notationChecked=false;notationSeq=[];renderNotation();},1600);
}

function renderNotation(){
  const area=document.getElementById('exContent');
  if(!area)return;
  if(!notationEx){genNotation();return;}
  const ex=notationEx;
  const correct=ex.chords.map(c=>c.label);
  const isOk=notationChecked&&notationSeq.every((l,i)=>l===correct[i]);

  let html=`<div class="ex-card">
    <div class="ex-task-label">${t('notationTask')}</div>
    <div class="ex-task-main">${ex.prog.name[lang]||ex.prog.name.ru}</div>
    <div class="ex-desc">${lang==='ru'?`Тоника: <b>${ex.tonic}</b>. Нажмите аккорды в правильном порядке.`:`Tonic: <b>${ex.tonic}</b>. Click chords in the correct order.`}</div>`;

  if(notationChecked)html+=`<div class="result-box show ${isOk?'ok':'err'}">${isOk?t('correct'):t('wrong')}</div>`;

  if(notationHint)html+=`<div class="hint-box">💡 ${t('hintFirst')}: <b>${correct[0]}</b></div>`;

  // Sequence display
  html+='<div class="sequence-row">';
  if(notationSeq.length===0)html+=`<span class="seq-empty">${lang==='ru'?'Выберите аккорды по порядку…':'Select chords in order…'}</span>`;
  else notationSeq.forEach((l,i)=>{
    let cls='seq-chip';
    if(notationChecked){cls=l===correct[i]?'seq-chip':'seq-chip';cls+=l===correct[i]?' correct':'  wrong';}
    html+=`<div class="${cls}" onclick="notationRemoveLast()">${l}</div>`;
  });
  html+='</div>';

  // Chord pool
  html+='<div class="chord-pool">';
  ex.shuffled.forEach(c=>{
    const used=notationSeq.includes(c.label);
    let cls='chord-token'+(used?' used':'');
    if(notationChecked){if(correct.includes(c.label)&&notationSeq.includes(c.label))cls='chord-token correct-t';else if(notationSeq.includes(c.label))cls='chord-token wrong-t';}
    html+=`<button class="${cls}" onclick="${used?'':'notationPick(\''+c.label+'\')'}" ${used?'disabled':''}>${c.label}</button>`;
  });
  html+='</div>';

  html+='<div class="ex-actions">';
  html+=`<button class="ex-btn primary" onclick="checkNotation()" ${notationSeq.length===correct.length&&!notationChecked?'':'disabled'}>${t('check')}</button>`;
  html+=`<button class="ex-btn dark" onclick="genNotation()">${t('newEx')}</button>`;
  if(!notationChecked&&notationSeq.length>0)html+=`<button class="ex-btn secondary" onclick="notationRemoveLast()">← Удалить</button>`;
  if(!notationChecked&&!notationHint)html+=`<button class="ex-btn hint-btn" onclick="notationHint=true;renderNotation()">${t('hint')}</button>`;
  html+='</div></div>';
  area.innerHTML=html;
}

/* ─── EX 6: QUIZ ─────────────────────────────────────── */
let quizOrder=[],quizIdx=0,quizScore=0,quizTotal=0;
let quizShuffled=null,quizAnswered=false,quizChosen=null;

function initQuiz(){
  quizOrder=QUIZ_DATA.map((_,i)=>i).sort(()=>Math.random()-.5);
  quizIdx=0;quizScore=0;quizTotal=0;
  quizShuffled=null;quizAnswered=false;quizChosen=null;
  loadQuizQ();
}

function loadQuizQ(){
  if(quizIdx>=quizOrder.length){renderQuizFinish();return;}
  const q=QUIZ_DATA[quizOrder[quizIdx]];
  const opts=[...q.opts];
  const correct=opts[q.ans];
  opts.sort(()=>Math.random()-.5);
  quizShuffled={q,opts,ans:opts.indexOf(correct)};
  quizAnswered=false;quizChosen=null;
  renderQuiz();
}

function quizPick(idx){
  if(quizAnswered)return;
  quizChosen=idx;
  quizAnswered=true;
  quizTotal++;
  if(idx===quizShuffled.ans)quizScore++;
  renderQuiz();
  setTimeout(()=>{quizIdx++;loadQuizQ();},1400);
}

function renderQuiz(){
  const area=document.getElementById('exContent');
  if(!area)return;
  if(!quizShuffled){initQuiz();return;}
  const {q,opts,ans}=quizShuffled;

  let html=`<div class="ex-card">
    <div class="quiz-score-row">${t('score')}: ${quizScore}/${quizTotal} · ${t('quizQ')} ${quizIdx+1}/${quizOrder.length}</div>
    <div class="quiz-q">${q.q[lang]||q.q.ru}</div>`;
  if(quizElimIdx!==null)html+=`<div class="hint-box" style="margin-bottom:10px">💡 ${t('hintElim')}</div>`;
  html+='<div class="opt-grid">';
  opts.forEach((o,i)=>{
    let cls='opt-btn';
    const isElim=quizElimIdx===i;
    if(isElim)cls+=' eliminated';
    else if(quizAnswered){if(i===ans)cls+=' correct';else if(i===quizChosen)cls+=' wrong';}
    html+=`<button class="${cls}" onclick="quizPick(${i})" ${quizAnswered||isElim?'disabled':''}>${o}</button>`;
  });
  html+=`</div>`;
  if(!quizAnswered)html+=`<div class="ex-actions" style="margin-top:10px">${quizElimIdx===null?`<button class="ex-btn hint-btn" onclick="showQuizHint()">${t('hint')}</button>`:''}</div>`;
  html+='</div>';
  area.innerHTML=html;
}

function showQuizHint(){
  if(quizElimIdx===null){
    const {ans,opts}=quizShuffled;
    const wrongs=opts.map((_,i)=>i).filter(i=>i!==ans);
    quizElimIdx=wrongs[Math.floor(Math.random()*wrongs.length)];
  }
  renderQuiz();
}

function renderQuizFinish(){
  const area=document.getElementById('exContent');
  if(!area)return;
  const pct=quizTotal>0?Math.round(quizScore/quizTotal*100):0;
  area.innerHTML=`<div class="ex-card quiz-finish">
    <div class="quiz-finish-score">${quizScore}/${quizTotal}</div>
    <div class="quiz-finish-label">${t('quizFinish')} ${quizScore} ${t('quizOf')} ${quizTotal} (${pct}%)</div>
    <div style="margin-top:20px"><button class="ex-btn primary" onclick="initQuiz()">${t('quizRestart')}</button></div>
  </div>`;
}
