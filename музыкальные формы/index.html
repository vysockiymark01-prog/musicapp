<script>

const FORMS=[
  {id:'period',emoji:'📏',color:'#2563eb',group:'small',
   name:{ru:'Период',en:'Period'},
   scheme:'a + a¹',
   shortDef:{ru:'Наименьшая законченная музыкальная мысль — обычно 8–16 тактов из двух предложений.',en:'The smallest self-contained musical idea — usually 8–16 bars made of two phrases.'},
   fullText:{ru:'Период — это самая маленькая форма, способная выразить законченную музыкальную мысль. Обычно он состоит из двух предложений по 4–8 тактов каждое и завершается каденцией.\n\nЕсли второе предложение почти повторяет первое, но с другой, более устойчивой каденцией — это период повторного строения (a + a¹). Если оба предложения построены на разном материале — период неповторного строения (a + b).\n\nПериод редко звучит как самостоятельное произведение — чаще он открывает пьесу как экспозиция главной темы, а дальше форма развивается дальше.',
     en:'The period is the smallest form capable of expressing a complete musical thought. It usually consists of two phrases of 4–8 bars each, ending with a cadence.\n\nIf the second phrase closely repeats the first but ends with a more conclusive cadence, this is a period of repeated construction (a + a¹). If both phrases use different material, it is a period of non-repeated construction (a + b).\n\nA period rarely stands as a complete piece on its own — more often it opens a work by presenting the main theme, after which the form continues to develop.'},
   features:{ru:['8–16 тактов','Два предложения','Завершается каденцией','Повторного или неповторного строения'],en:['8–16 bars','Two phrases','Ends with a cadence','Repeated or non-repeated construction']},
   works:[
     {name:{ru:'Прелюдия до мажор (ХТК I)',en:'Prelude in C major (WTC I)'},composer:'И. С. Бах',desc:{ru:'Вся пьеса вырастает из фактуры одного периода, многократно повторяемого.',en:'The whole piece grows from the texture of a single period, repeated throughout.'}},
     {name:{ru:'«Болезнь куклы»',en:'"The Doll\'s Illness"'},composer:'П. И. Чайковский',desc:{ru:'Пьеса из «Детского альбома» открывается ясным периодом повторного строения.',en:'This piece from the Children\'s Album opens with a clear period of repeated construction.'}}
   ]},
  {id:'simple2',emoji:'2️⃣',color:'#0891b2',group:'small',
   name:{ru:'Простая двухчастная форма',en:'Simple Two-Part Form'},
   scheme:'A B',
   shortDef:{ru:'Два раздела: тема и её развитие или лёгкий контраст, без возврата к началу.',en:'Two sections: a theme and its development or a light contrast, with no return to the opening.'},
   fullText:{ru:'Простая двухчастная форма состоит из двух разделов, каждый размером примерно с период. Первый раздел (A) излагает тему, второй (B) либо развивает и завершает мысль, либо приносит лёгкий контраст, оставаясь в русле того же образа.\n\nЭта форма не заявляет о серьёзном конфликте — она компактна и естественна, поэтому особенно часто встречается в танцевальной и песенной музыке XVII–XVIII веков, а также в пьесах для детей.',
     en:'The simple two-part form consists of two sections, each roughly the size of a period. The first section (A) presents the theme; the second (B) either develops and completes the idea or offers a light contrast while staying within the same mood.\n\nThis form makes no claim to serious conflict — it is compact and natural, which is why it appears so often in dance and song music of the 17th–18th centuries, as well as in pieces for children.'},
   features:{ru:['Два раздела (A B)','Без репризы первой темы','Компактный объём','Танцевальные и песенные жанры'],en:['Two sections (A B)','No return of the first theme','Compact scale','Common in dance and song genres']},
   works:[
     {name:{ru:'«Во поле берёза стояла» (рус. нар. песня)',en:'"In the Field a Birch Tree Stood" (Russian folk song)'},composer:'Народная',desc:{ru:'Куплетная структура — ясный пример простой двухчастной формы.',en:'Its verse structure is a clear example of the simple two-part form.'}}
   ]},
  {id:'simple3',emoji:'3️⃣',color:'#059669',group:'small',
   name:{ru:'Простая трёхчастная форма',en:'Simple Three-Part Form'},
   scheme:'A B A',
   shortDef:{ru:'Тема — контрастная середина — возвращение темы. Самая частая форма небольших пьес.',en:'A theme — a contrasting middle section — the return of the theme. The most common form for short pieces.'},
   fullText:{ru:'Простая трёхчастная форма — пожалуй, самая узнаваемая структура в музыке для детей и небольших инструментальных пьес. Первый раздел (A) излагает тему, средний раздел (B) приносит контраст — по настроению, тональности или фактуре, — а третий раздел возвращает начальную тему.\n\nЕсли реприза звучит точно так же, как первый раздел, её называют точной (da capo). Если тема возвращается изменённой — динамически, фактурно или с небольшими деталями — говорят о варьированной репризе (A¹).',
     en:'The simple three-part form is probably the most recognisable structure in music for children and short instrumental pieces. The first section (A) presents the theme, the middle section (B) brings contrast — in mood, key, or texture — and the third section brings the opening theme back.\n\nIf the reprise sounds exactly like the first section, it is called an exact reprise (da capo). If the theme returns changed — in dynamics, texture, or small details — it is called a varied reprise (A¹).'},
   features:{ru:['Три раздела (A B A)','Контрастная середина','Реприза — точная или варьированная','Основа пьес для детей'],en:['Three sections (A B A)','Contrasting middle section','Exact or varied reprise','Common basis for children\'s pieces']},
   works:[
     {name:{ru:'«Неаполитанская песенка»',en:'"Neapolitan Song"'},composer:'П. И. Чайковский',desc:{ru:'Пьеса из «Детского альбома» — учебный пример простой трёхчастной формы.',en:'A piece from the Children\'s Album — a textbook example of the simple three-part form.'}},
     {name:{ru:'«Утро» (сюита «Пер Гюнт»)',en:'"Morning Mood" (from Peer Gynt Suite)'},composer:'Э. Григ',desc:{ru:'Контрастная середина сменяет спокойную главную тему, которая возвращается в репризе.',en:'A contrasting middle section interrupts the calm main theme, which then returns in the reprise.'}}
   ]},
  {id:'complex3',emoji:'🧱',color:'#d97706',group:'large',
   name:{ru:'Сложная трёхчастная форма',en:'Complex Three-Part Form'},
   scheme:'[A] — Трио — [A]',
   shortDef:{ru:'Каждая из трёх частей — уже сама законченная форма, обычно с контрастным трио в середине.',en:'Each of the three sections is itself a complete form, usually with a contrasting trio in the middle.'},
   fullText:{ru:'В сложной трёхчастной форме каждый из трёх крупных разделов — сам по себе простая форма (период или простая 2-/3-хчастная), а не отдельная фраза, как в простой трёхчастной форме. Средний раздел по традиции называют трио — от старинных танцев, где среднюю часть менуэта исполняли силами трёх инструментов.\n\nТрио почти всегда контрастно первому разделу: другая тональность, фактура или характер. После трио первый раздел возвращается — часто без изменений (da capo).\n\nЭта форма — стандарт для менуэтов и скерцо с трио внутри симфоний, сонат и сюит.',
     en:'In the complex three-part form, each of the three large sections is itself a simple form (a period, or a simple two- or three-part form), rather than a single phrase as in the simple three-part form. The middle section is traditionally called a trio, after old dances where the middle part of a minuet was played by just three instruments.\n\nThe trio is almost always contrasting to the first section — in key, texture, or character. After the trio, the first section returns, often unchanged (da capo).\n\nThis form is the standard shape for minuets and scherzos with a trio, found inside symphonies, sonatas, and suites.'},
   features:{ru:['Каждая часть — сама форма','Средний раздел — трио','Контраст трио к крайним частям','Менуэты и скерцо'],en:['Each section is itself a form','Middle section is a trio','Trio contrasts with outer sections','Found in minuets and scherzos']},
   works:[
     {name:{ru:'Менуэт (Симфония № 40 соль минор, III ч.)',en:'Menuetto (Symphony No. 40 in G minor, mvt. III)'},composer:'В. А. Моцарт',desc:{ru:'Классический пример менуэта с контрастным трио посередине.',en:'A textbook example of a minuet with a contrasting trio in the middle.'}}
   ]},
  {id:'variation',emoji:'🎭',color:'#7c3aed',group:'large',
   name:{ru:'Вариации',en:'Theme and Variations'},
   scheme:'A A¹ A² A³ …',
   shortDef:{ru:'Тема излагается, а затем повторяется несколько раз с изменениями, сохраняя узнаваемую основу.',en:'A theme is presented, then repeated several times with changes, while remaining recognisable.'},
   fullText:{ru:'В вариационной форме сначала звучит тема — обычно простая и запоминающаяся, — а затем следует ряд вариаций, в каждой из которых что-то меняется: мелодический рисунок, лад, темп, фактура сопровождения, регистр.\n\nВ строгих (классических) вариациях сохраняются форма и гармонический план темы — меняется лишь оформление. В свободных (романтических и более поздних) вариациях автор может менять форму, тональность и даже жанр, отталкиваясь от темы лишь как от отправной точки.',
     en:'In the variation form, a theme is presented first — usually simple and memorable — followed by a series of variations, each changing something: the melodic outline, the mode, the tempo, the accompaniment texture, or the register.\n\nIn strict (classical) variations, the form and harmonic plan of the theme are preserved, and only the surface details change. In free (Romantic and later) variations, the composer may change the form, key, or even genre, using the theme only as a starting point.'},
   features:{ru:['Тема + ряд вариаций','Строгие или свободные','Сохраняется узнаваемость темы','Каждая вариация меняет один или больше параметров'],en:['Theme plus a series of variations','Strict or free','The theme stays recognisable','Each variation changes one or more parameters']},
   works:[
     {name:{ru:'12 вариаций на тему «Ah vous dirai-je, maman»',en:'12 Variations on "Ah vous dirai-je, maman"'},composer:'В. А. Моцарт',desc:{ru:'Знакомая всем мелодия («Сияй, сияй, звезда») в 12 классических вариациях.',en:'A tune known worldwide ("Twinkle, Twinkle, Little Star") set in 12 classical variations.'}},

   shortDef:{ru:'Рефрен (A) чередуется с разными эпизодами (B, C…). Название означает «круг».',en:'A refrain (A) alternates with different episodes (B, C…). The name means "circle."'},
   fullText:{ru:'Рондо строится на чередовании неизменного рефрена (A) и эпизодов между его повторами (B, C, D…), каждый из которых приносит новый материал. Название происходит от французского rondeau — «круг», «хоровод»: рефрен словно снова и снова возвращает слушателя на одно и то же место.\n\nЧисло эпизодов не фиксировано — их может быть два, три и больше. Благодаря постоянному возвращению главной темы рондо звучит цельно и энергично, поэтому его часто выбирают для финалов сонат, симфоний и концертов.',
     en:'Rondo form is built on the alternation of an unchanging refrain (A) and episodes between its repetitions (B, C, D…), each bringing new material. The name comes from the French rondeau — "circle," "round dance": the refrain keeps bringing the listener back to the same place.\n\nThe number of episodes is not fixed — there may be two, three, or more. Because the main theme keeps returning, rondo form feels cohesive and energetic, which is why it is often chosen for the finales of sonatas, symphonies, and concertos.'},
   features:{ru:['Рефрен (A) многократно возвращается','Контрастные эпизоды между повторами','Часто финал сонаты/симфонии','Название от франц. «круг»'],en:['The refrain (A) returns repeatedly','Contrasting episodes between repetitions','Often used as a sonata/symphony finale','Name derived from the French for "circle"']},

let lang=localStorage.getItem('musicapp_lang')||'ru';
let expandedId=null;
let searchQuery='';
let filterGroup='all';

function matchesSearch(f,q){
  if(!q)return true;
  q=q.toLowerCase();
  const hay=[f.name.ru,f.name.en,f.scheme,f.shortDef.ru,f.shortDef.en,
    ...(f.features.ru||[]),...(f.features.en||[])].join(' ').toLowerCase();
  return hay.indexOf(q)!==-1;
}

function renderCards(){
  const el=document.getElementById('cardsGrid');
  const empty=document.getElementById('emptyState');
  let list=FORMS.filter(f=>(filterGroup==='all'||f.group===filterGroup)&&matchesSearch(f,searchQuery));
  document.getElementById('countLbl').textContent=list.length+' '+(lang==='ru'?'форм':'forms');
  if(!list.length){
    el.innerHTML='';
    empty.style.display='block';
    return;
  }
  empty.style.display='none';
  el.innerHTML=list.map(f=>{
    const col=f.color,isExp=expandedId===f.id;
    const groupLabel=f.group==='small'?(lang==='ru'?'Малая форма':'Small form'):(lang==='ru'?'Крупная форма':'Large form');
    const features=(f.features[lang]||f.features.ru).map(x=>`<span class="feature-tag">${x}</span>`).join('');
    const works=(f.works||[]).map(w=>`<div class="work-item"><div class="work-name">${w.name[lang]||w.name.ru}</div><div class="work-meta">${w.composer}</div><div class="work-desc">${w.desc[lang]||w.desc.ru}</div></div>`).join('');
    const story=(f.fullText[lang]||f.fullText.ru).split('\n').filter(Boolean).map(p=>`<p>${p}</p>`).join('');
    return `<div class="scard" id="sc-${f.id}">
      <div class="scard-header" onclick="toggleExpand('${f.id}')">
        <div class="scard-top"><div class="scard-emoji">${f.emoji}</div><div><div class="scard-name">${f.name[lang]||f.name.ru}</div><span class="scheme-badge">${f.scheme}</span></div></div>
        <span class="group-badge" style="background:${col}22;color:${col}">${groupLabel}</span>
        <div class="scard-desc">${f.shortDef[lang]||f.shortDef.ru}</div>
        <div class="features">${features}</div>
        <div class="scard-actions">
          <button class="btn-more" onclick="event.stopPropagation();toggleExpand('${f.id}')">${isExp?(lang==='ru'?'Свернуть ▲':'Collapse ▲'):(lang==='ru'?'Подробнее ▼':'Details ▼')}</button>
        </div>
      </div>
      <div class="scard-body${isExp?' open':''}">
        <div class="body-section-title">${lang==='ru'?'Строение':'Structure'}</div>
        <div class="full-text">${story}</div>
        <div class="body-section-title">${lang==='ru'?'Примеры произведений':'Example works'}</div>
        ${works}
      </div>
    </div>`;
  }).join('');
}

function toggleExpand(id){
  expandedId=expandedId===id?null:id;
  renderCards();
}

document.getElementById('searchInp').addEventListener('input',function(){
  searchQuery=this.value;
  renderCards();
});
document.querySelectorAll('.filter-row .chip').forEach(btn=>{
  btn.addEventListener('click',()=>{
    filterGroup=btn.dataset.val;
    document.querySelectorAll('.filter-row .chip').forEach(b=>b.classList.toggle('active',b===btn));
    renderCards();
  });
});

  document.getElementById('grpLarge').textContent=lang==='ru'?'Крупные формы':'Large forms';
  document.getElementById('emptyTxt').textContent=lang==='ru'?'Ничего не найдено':'Nothing found';
  document.getElementById('backHomeLink').textContent=lang==='ru'?'← Главная':'← Home';
  renderCards();

renderCards();

<script>
/* Клавиатурная доступность: элементы с onclick (не <button>/<a>/полям форм)
   становятся фокусируемыми и активируются Enter/Space — включая те,
   что добавляются в DOM динамически. */
(function(){
  function tagEl(el){
    if(!el || !el.hasAttribute || !el.hasAttribute('onclick')) return;
    var tag=el.tagName;
    if(tag==='BUTTON'||tag==='A'||tag==='INPUT'||tag==='SELECT'||tag==='TEXTAREA'||tag==='LABEL') return;
    if(el.hasAttribute('data-a11y-kb')) return;
    el.setAttribute('data-a11y-kb','1');
    if(!el.hasAttribute('tabindex')) el.setAttribute('tabindex','0');
    if(!el.hasAttribute('role')) el.setAttribute('role','button');
  }
  function scan(root){
    if(!root||!root.querySelectorAll) return;
    tagEl(root);
    root.querySelectorAll('[onclick]').forEach(tagEl);
  }
  document.addEventListener('keydown', function(e){
    if(e.key!=='Enter' && e.key!==' ' && e.key!=='Spacebar') return;
    var el=document.activeElement;
    if(el && el.getAttribute && el.hasAttribute('onclick') && el.getAttribute('role')==='button'){
      e.preventDefault();
      el.click();
    }
  });
  if(document.body) scan(document.body);
  else document.addEventListener('DOMContentLoaded', function(){ scan(document.body); });
  var mo=new MutationObserver(function(muts){
    muts.forEach(function(m){
      m.addedNodes.forEach(function(n){ if(n.nodeType===1) scan(n); });
    });
  });
  if(document.body) mo.observe(document.body,{childList:true,subtree:true});
  else document.addEventListener('DOMContentLoaded', function(){ mo.observe(document.body,{childList:true,subtree:true}); });
})();
</script>
